orShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"item","texto":"Gluttonous Greaves","passos":[[{"nome":"Gluttonous Greaves","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223008.png"}]],"motivo":"( Mercury Treads aren't that useful here anyways)"},{"tipo":"item","texto":"Liandry's","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"}]],"motivo":"( Additional amp damage^ )"},{"tipo":"item","texto":"Kaenic Rookern / Force Of Nature","passos":[[{"nome":"Kaenic Rookern","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222504.png"},{"nome":"Force Of Nature","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224401.png"}]],"motivo":"( Kaenic Rookern vs. Burst Mordekaiser, and Force Of Nature into Liandry's Mordekaiser )"},{"tipo":"item","texto":"Spirit Visage / Bloodletter's Curse","passos":[[{"nome":"Spirit Visage","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223065.png"},{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( Spirit Visage vs. Burst Mordekaiser, and Bloodletter's Curse into Force Of Nature Mordekaiser )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Obliterate)","8 / 7 / 6 / 5 / 4"],["W (Indestructible)","12 / 11 / 10 / 9 / 8"],["E (Death's Grasp)","16 / 14 / 12 / 10 / 8"],["Ult (Realm of Death)","140 / 120 / 100"]]},{"tipo":"p","texto":"Early Game - Try to get priority of the lane without getting hit by Mordekaiser's Q, you can do this by tethering in and out of his Q range and baiting it. - Level 2, level up your W, and keep trying to bait out his abilities. If he uses Q now, walk up aggressively so that you can land yours and potentially snag a shield bash procc. - Level 3, keep playing cautious and try to only use your abilities to whiff punish his abilities."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Walk in and out of his Q range in order to bait it out, if you can get it out, THEN you can walk up to trade with him."]},{"tipo":"p","texto":"This matchup is a game of patience, so make sure you play towards it."},{"tipo":"lista","itens":["Mordekaiser self-roots himself during his Q and E animations, so if you can catch him using his skillshot first, dodge it, and then send out your ability: It's almost entirely guaranteed.","DO NOT use your W early, make sure to save it until it gets high, so that you can make use of Last Stand and Revitalize.","DO NOT use your burst damage into his shield unless you want your all-in combo to be almost entirely negated."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Mordekaiser's ultimate can completely negate yours by overtaking your domain, so try and wait for him to use it first before sending yours out."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If Mordekaiser is under 10% HP, it's worth it to use your ultimate first, followed with an ignite, since your ultimate will deal enough damage to get him underneath the threshold for ignite to kill,"]},{"tipo":"p","texto":"And most Mordekaiser players don't have the instinct to W realize that their ultimate does effective damage to W in time."}]}]},{"nome":"Morgana","planilha":"Morgana","id":"Morgana","titulo":"a Caída","dificuldade":{"early":4,"mid":3,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Unsealed Spellbook","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/UnsealedSpellbook/UnsealedSpellbook.png"},{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"/ Cash Back (Personal preference)","icone":null},{"nome":"Triple Tonic","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/PerfectTiming/AlchemistCabinet.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury Treads","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( Extra Tenacity )"},{"tipo":"item","texto":"Rylai's Crystal Scepter","passos":[[{"nome":"Rylai's Crystal Scepter","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"nota","texto":"[ I'm testing something out in this specific matchup ]"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Root)","10"],["W (Damage puddle)","12 (Cooldown lowers per damage instance)"],["E (Spell shield)","26 / 23.5 / 21 / 18.5 / 16"],["Ult","120 / 110 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up early priority, you're outranged and walking up for CS while her W is up is just asking for poke.","At level 2 and onwards, try to bait out her Q root by spacing back and forth behind minions and: if you can, try fishing for any potential E opportunities once said root is down to bait out her E black shield."]},{"tipo":"p","texto":"Otherwise: Just wait for level 6 to all-in her."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Morgana due to her range advantage and her E black shield, I mean: I guess you could theoretically try to get an E angle after she uses her Q root and her E black shield,  but most of the time: they aren't going to just waste those key abilities for literally 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, swap one of your summoners for cleanse, and then just run at the Morgana until she uses her root onto you,"]},{"tipo":"p","texto":"When she does that: use your cleanse, use your E, (If she black shields your E, go for a Q and break down her shield to ult her), and then just kill her in an all-in. It's really just that simple."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt and mercury treads powerspike since you can just eat the root, utilize the tenacity from your itemization and runes, and then go for the exact same game-plan of breaking down her black shield to ult her afterwards with a rocketbelt -> R."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Morgana has the ability to deny your ultimate with her black shield, so try to break it down before using said ultimate."]},{"tipo":"p","texto":"If you're in a teamfight, and can't find the opportunity to break down her black shield, try to be unpredictable with your ultimate so that she can't deny it."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["As previously mentioned: her Q root cannot go through minions, so try and go in and out of cover from minions to try and bait it out for a potential all-in opportunity."]},{"tipo":"p","texto":"She should be relatively weak in the all-in."},{"tipo":"lista","itens":["When Morgana uses her ultimate, you can try to use your movement from your setup to momentarily back away from the second part of her ult which stuns you, and then go back in to commit towards an all-in."]}]}]},{"nome":"Naafiri","planilha":"Naafiri","id":"Naafiri","titulo":"Fera das Cem Mordidas","dificuldade":{"early":4,"mid":3,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main poke tool)","9 / 8.5 / 8 / 7.5 / 7"],["W (Untargetability)","26 / 24 / 22 / 20 / 18"],["E (Dash)","11 / 10 / 9 / 8 / 7"],["Ult","110 / 95 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["This is unfortunately a matchup that you have to just lose until you've gotten your first item powerspike; Dusk & Dawn."]},{"tipo":"p","texto":"Level 1, give up priority, and keep preserving your HP Level 2, so that you're healthy enough to secure a crash when the wave is forced to rebound back towards her."},{"tipo":"p","texto":"Keep repeating this process of passiveness and reluctantly forced aggressiveness until you've gotten Dusk & Dawn."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Naafiri is a really tough matchup since not only does her Q outrange everything your kit, but she can also dodge any of your abilities with her W and her E.","Don't trade into her before you get Dusk & Dawn, it's genuinely that unplayable.","Once you do have Dusk & Dawn, you can just ult her and auto her to death until she's used her W invulnerability, from there: use your E and try to bait out her E dash,"]},{"tipo":"p","texto":"When both her W invulnerability and E dash are down, only then can you use your Q against her."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Do not get hit by her Q twice in a row. If you do, your HP will get absolutely shredded.","Her W is SO annoying for denying every single one of your abilities, but at least it doesn't cancel your ultimate, so that's nice."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can somehow get the Naafiri to use her W and E early, try to land your ult against her because not only does she not have her invulnerability tool now, but now she has no way of regaining her dogs within your ultimate."]}]}]},{"nome":"Nasus","planilha":"Nasus","id":"Nasus","titulo":"o Curador das Areias","dificuldade":{"early":2,"mid":4,"late":5,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( To reduce his healing )"},{"tipo":"item","texto":"Liandry's","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"}]],"motivo":"( Even more damage^)"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main damage tool / stacking tool)","7.5 / 6.5 / 5.5 / 4.5 / 3.5"],["W (AS + MS slow)","15 / 14 / 13 / 12 / 11"],["E (Damaging puddle)","12"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"p","texto":"Get priority, slow push the second and third waves, and then just let the wave rebound back to you so that you can just freeze the lane."},{"tipo":"p","texto":"Then: whenever he walks up, harass him."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["If the Nasus goes up to Q, you Q him, if he goes up to auto attack, you W and then shield bash AA him.","If the Nasus tries farming with his E, try to close the distance so you can fight him while his E is down.","Post level 6: If he ever thinks he's confident enough to fight you, wait for him to press E and then ult him immediately afterwards."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If Nasus joins a teamfight with a sufficient amount of stacks and he starts charging towards your carries, you should use your ultimate on top of him BEFORE he presses W on one of your allies."]},{"tipo":"p","texto":"You don't have to kill him, you just need to get him off of your teammates and subsequently deny his wither on your carries."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can, and you should, ult away his E to make it so that you don't suffer from an armor reduction.","If you can, try ulting Nasus when he's also ulted as you can yoink more stats this way.","Post 20 minutes, you should start trying to make plays around the map after shoving out the side lane and try to win teamfights before Nasus can scale because theoretically, at this point, if you've zoned him off of enough stacks, he should be useless for the next 15 minutes."]}]}]},{"nome":"Nautilus","planilha":"Nautilus","id":"Nautilus","titulo":"o Titã das Profundezas","dificuldade":{"early":1,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred their magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Hook)","14 / 13 / 12 / 11 / 10"],["W (Shield)","12"],["E (Main damage tool)","7 / 6.5 / 6 / 5.5 / 5"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["There's never really a time when you're going to be losing against a Nautilus top, you out-range him and you out-damage him at every point of the game.","Get priority for the first wave and if he ever walks up, Q him on the head.","Level 2, rank up your W, and keep playing for the slow push,","Level 3 and wave 3, you should try to crash the wave so that you can get a recall off to play for the rebound back to your turret.","From there, just keep the wave on your side of the lane, and punish him whenever he walks up for CS."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["When you see Nautilus go for a hook onto you, buffer it with your Q, and try to pull him closer when he uses his root onto you."]},{"tipo":"p","texto":"This is because if he gets distance onto you, he can theoretically deal additional damage with his E, by kiting you out for another instance of his E shockwave."},{"tipo":"lista","itens":["But: from there, he really shouldn't have anything else to defend himself with since his trades are very ability centric."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Nautilus has really good gank setup tools, so just be hyper-aware of where the enemy jungler is at all times before commiting to anything particularly risky."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Because Nautilus ultimate is a projectile, you can effectively negate it by using your ultimate right before it reaches you."]},{"tipo":"p","texto":"Even if you mistime this, you're still going to get an ability buffer, so it doesn't really matter too much ;It's just something extra you can do."}]}]},{"nome":"Neeko","planilha":"Neeko","id":"Neeko","titulo":"a Camaleoa Curiosa","dificuldade":{"early":3,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her root duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main poke tool)","9 / 8.5 / 8 / 7.5 / 7"],["W (Clone)","16 / 15 / 14 / 13 / 12"],["E (Root)","12 / 11.5 / 11 / 10.5 / 10"],["Ult","120 / 105 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["You can't really interact with Neeko in the early game in general, so: sit back, give up lane priority, wait for the wave to get to your side of the lane, and play for the rebound back to her turret,"]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke she's dishing out onto you, just recall and run back to lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Neeko due to her range advantage, I mean: I guess you could theoretically try to get an E angle after she uses her E root, but most of the time: they aren't going to just waste the ability for 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, and then just run at the Neeko until she uses her root on you,"]},{"tipo":"p","texto":"When she does that: use your E, ult her, and then just kill her in an all-in. It's really just that simple."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt and mercury treads powerspike since you can just eat the root, utilize the tenacity from your itemization and runes, and then just rockebelt","> ult him -> kill her again."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Neeko can send out a fake clone and potentially trick you into ulting the wrong clone, to avoid this: either ult before she gets the opportunity to use her W clone ability, or ult while she's in the middle of any of her other animations (Q,E,R)","In teamfights, Neeko is exceptionally scary due to her ability to hit a 5 man root on your team, to prevent this: just ult the Neeko if she's","If you're under 40% HP, recall and run back to lane since you're most likely going to get dived by the enemy jungler while the wave is near your turret."]},{"tipo":"p","texto":"It's literally their only win condition against you in this lane, so just be wary of that."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you ever manage to close the distance onto the Neeko without her using her root onto you, you can buffer your E or your Q into her root to effectively negate it's duration since both your Q and your E self-root you anyways."]}]}]},{"nome":"Nidalee","planilha":"Nidalee","id":"Nidalee","titulo":"a Caçadora Bestial","dificuldade":{"early":4,"mid":1,"late":1,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rylai's Crystal Scepter","passos":[[{"nome":"Rylai's Crystal Scepter","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"item","texto":"Boots Of Swiftness","passos":[[{"nome":"Boots Of Swiftness","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223009.png"}]],"motivo":"( So you can keep up with him )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( So you can actually deal damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["- Human form",""],["Q (Poke tool)","6"],["W (Trap)","13 / 12 / 11 / 10 / 9"],["E (AS boost + heal)",""],["Ult","3"],["Q (Empowered AA / Execute)","6"],["W (Dash)","6 (Lowered by 3 / 2.5 / 2 / 1.5 seconds if she gets a takedown)"],["E (Swipe;)","6"]]},{"tipo":"p","texto":"- Cougar form"}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Whatever you do: don't die before level 6."]},{"tipo":"p","texto":"Let the wave push to you, play for the rebound back, crash said wave, and rinse and repeat until you've reached your level 6 powerspike."},{"tipo":"p","texto":"Once you've reached your level 6 powerspike, you can actually threaten an all-in with ghost, but: it's still pretty hard to kill her consistently until you've gotten your Rylai's + Approach velocity powerspike."},{"tipo":"p","texto":"So just try to be patient, this is the hardest point of the game for you in this particular matchup."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Stand behind minions and force the Nidalee to poke you down with her auto attacks which are 525 range as opposed to your Q which is 625 range.","When Nidalee auto attacks you, trade with a Q."]},{"tipo":"p","texto":"If you have your Rylai's + Approach Velocity powerspike, she should be slowed for long enough for you to close the distance with the movement speed gained from approach velocity."},{"tipo":"p","texto":"From here, try to use your E after she uses her Cougar W dash so that she can't avoid it, and then just run her down."},{"tipo":"p","texto":"If she's about to get back to her turret range, just ult her and force her to fight on even terrain."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["DO NOT get hit by Nidalee's Q spears, stand behind minions or: if she's zoning you out out of the wave, concede pressure and just wait for the wave to slowly push towards you."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Post level 6, you CAN try to threaten an all-in with ghost + your ultimate at full hp, but this is relatively inconsistent since she is still extremely slippery."]},{"tipo":"p","texto":"It is possible though, but you need to get an EXTREMELY good ult angle with limited space and no walls for her to hop behind."},{"tipo":"lista","itens":["If you ult a Nidalee after she uses her heal, you will be able to YOINK more attack speed because her heal grants her bonus attack speed."]},{"tipo":"p","texto":"( You probably won't really be using this fact that often, but it's still nice to know )"}]}]},{"nome":"Nocturne","planilha":"Nocturne","id":"Nocturne","titulo":"o Eterno Pesadelo","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (AD boost / poke tool)","8"],["W (Spellshield)","20 / 18 / 16 / 14 / 12"],["E (Fear)","15 / 14 / 13 / 12 / 11"],["Ult","160 / 130 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up priority early on, let the wave push into you, and just preserve your HP so that you can effectively rebound the wave and get your first three levels."]},{"tipo":"p","texto":"From there, you should generally try to keep the wave on your side of the lane so that you can keep playing for short trades against him."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Similarly to someone like Fiora, you should generally try to only go for extremely short trades with your Q and your W shield bash procc's until he's in lethal range.","Once he is in lethal range (~30% HP), go for an auto attack, and then ignite + Q him, this should scare him enough to use his spell shield, and once he does that, use your E grab and finish him off."]},{"tipo":"p","texto":"If he doesn't his spell shield, he's dead anyways."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Nocturne has the ability to deny your ultimate with his spellshield, so MAKE SURE he uses it first before using your ultimate on him."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["When you're about to ult Nocturne, try to have him stand inside of his Q and make him use his spell shield so that you can YOINK the most amount of stats you possibly can (AD and attack speed)."]}]}]},{"nome":"Olaf","planilha":"Olaf","id":"Olaf","titulo":"o Berserker","dificuldade":{"early":5,"mid":4,"late":4,"overall":5},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Bramble Vest","passos":[[{"nome":"Bramble Vest","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"}]],"motivo":"( Anti-healing )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Extra Damage )"},{"tipo":"item","texto":"Zhonya's Hourglass","passos":[[{"nome":"Zhonya's Hourglass","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223157.png"}]],"motivo":"( To stall out his ultimate )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Damage / Poke tool)","9 (Cooldown resets if he picks up the Axe)"],["W (AS Boost + Shield)","16 / 15 / 14 / 13 / 12"],["E (Empowered AA)","11 / 10 / 9 / 8 / 7 (Lowered by 1 second per hit)"],["Ult","100 / 90 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["For the first wave, play back, play safe, and keep poking him down as the wave slowly pushes into you."]},{"tipo":"p","texto":"Then: play for the rebound and try standing inside your minion wave so if he all-ins, he has to take the blunt force of said minion wave."},{"tipo":"p","texto":"From there, keep playing patient, and let the wave bounce back and forth unless he's in lethal range."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Ideally only play towards poking him out with Q's, until he's around 25% hp or less.","If he's 25% hp or less; in lethal range, you can use your ignite and try to one-shot the Olaf with an all-in combo of Ignite + Q + Shield bash + AA to death with conqueror.","If you're both level 6 and he overextends to your side of the lane, ult him instantly for an all-in."]},{"tipo":"p","texto":"The worse case scenario is that he ults early to deny your ultimate which doesn't really result in anything much since you can just easily walk away and back off."},{"tipo":"p","texto":"The best case scenario is that he doesn't ult early, and you can secure a cheesy little kill near your turret."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"p","texto":"Even though, as of MSI 2024, he cannot escape your ultimate, HE CAN make it so that he doesn't go inside of it in the first place by using his ultimate WAY before the fight starts."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If the Olaf's ultimate is down, try using your ult as he uses his Q onto you to deny his Q cooldown reset.","In the mid game, if you're both even, do not challenge the Olaf in the side lane. Just keep catching waves and play towards outvaluing him in teamfights.","In teamfights, try to grab Olaf's attention and force him to use his ultimate early."]},{"tipo":"p","texto":"If you are surrounded by his team, try to use your ultimate during his auto attack wind-up animation and ult literally anybody else except for the Olaf who's currently unstoppable."},{"tipo":"p","texto":"If you are surrounded by your team, either: flash away from the Olaf or use Zhonya's if you have it."},{"tipo":"p","texto":"The goal here is to try and nullify his ultimate as soon as physically possible."},{"tipo":"lista","itens":["Also: make sure to buy anti-heal in the mid-game and politely ask your teammates to buy anti shielding if their champions can allow for it."]},{"tipo":"p","texto":"If not: you may have to buy it yourself ( In which case: you should report your team )"}]}]},{"nome":"Ornn","planilha":"Ornn","id":"Ornn","titulo":"O Fogo sob a Montanha","dificuldade":{"early":3,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred their magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","9 / 8.5 / 8 / 7.5 / 7"],["W (Fire breath / Unstoppability)","12 / 11.5 / 11 / 10.5 / 10"],["E (Dash / Knockup)","14 / 13.5 / 13 / 12.5 / 12"],["Ult","140 / 120 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["If he ever exhausts his W poorly, you can 100% win a short trade, and if you manage to cancel his E with your own E (which is really rare), then you should be able to run him down and kill him."]},{"tipo":"p","texto":"But, against a good Ornn, you're probably not going to end up getting this opportunity since they're just going to exclusively play for short trades and you don't have enough sticking power without your ultimate to really threaten them."},{"tipo":"p","texto":"Luckily, this does mean you're going to be able to control the wave, so try and keep the wave by your side so that you can find further opportunities to punish his weak all-in power before level 6."},{"tipo":"p","texto":"Just keep dodging his Q's by moving back and forth, space out his W's by moving front and back, keep track of the enemy jungler, and you should be relatively healthy for the level 6 mind games."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to stand right outside of his W range while you're poking him with your Q's, and if he W's early, back off temporarily to dodge the brittle procc, and then walk up to him and commit to a longer trade.","Try to hold your ultimate until he's either in the middle of his E charge animation or until he's used up his W."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Ornn has the ability to cancel your ultimate with his W, so don't use your ultimate if he has his W up unless you're trying to deny his ultimate recast."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you're at high HP, and Ornn decides to ult you, try to E and subsequently walk behind him so that you can negate an additional brittle procc."]},{"tipo":"p","texto":"This will result in you getting subsequently W'd for a second brittle procc, but this now enables you to R him relatively safely since he no longer has any significant damage tools."},{"tipo":"lista","itens":["If you're at low HP, and he's ulting you and you have the ability to deny his ult recast with your own ult, feel free to ult him there, because even if he cancels your ultimate with his own W, it's still a relatively worthwhile trade, so long as you time it perfectly around his recast period."]},{"tipo":"p","texto":"If you play it perfectly, he'll only be able to get a singular brittle procc onto you, and you'll be able to commit to a harder trade because he no longer has any significantly powerful damage options."},{"tipo":"p","texto":"Though, this does make it so that you waste exhaust your ultimate which is why I consider this option to be a last resort."}]}]},{"nome":"Pantheon","planilha":"Pantheon","id":"Pantheon","titulo":"a Lança Indestrutível","dificuldade":{"early":4,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Cut Down","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/CutDown/CutDown.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Spear thrust)","6.6 / 6.15 / 5.7 / 5.25 / 4.8 | (Spear throw): 11 / 10.25 / 9.5 / 8.75 / 8"],["W (Stun)","13 / 12 / 11 / 10 / 9"],["E (Damage block)","22 / 21 / 20 / 19 / 18"],["Ult","180 / 165 / 150"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"p","texto":"You REALLY have to respect Pantheon's early game ( levels 1-5 ), just sit back, let the wave push into you, dodge as many Q's as humanely possible and use your W against his burst."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Only walk forwards while his Q is down, otherwise: walk in and out of his Q range, and side to side, to try and bait it out.","If he ever jumps on top of you with W, then you can just buffer your E into it, and pull him backwards for a moderately long trade until right before his rotations come back up again.","Once you reach level 6, if he ever does the same thing to you, pull him backwards, but instead of backing off, you can use your ultimate against him and win the long trade."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Pantheon has the ability to negate your burst damage by using his E (Aegis Assault),"]},{"tipo":"p","texto":"If he's close enough, you can try to Q at his current position and then flash behind him so that the damage comes from your new location instead of your old one, therefore: making it deal damage against him."},{"tipo":"p","texto":"Also: DO NOT use your shield bash auto attack while he's in the middle of his E animation unless you're already behind him."},{"tipo":"lista","itens":["He can use his ultimate to get out if he channels it right before your ultimate ends."]},{"tipo":"p","texto":"So try and use your E during the start of the fight, and then save your E as your ultimate is ending to ensure he doesn't cheese you by escaping with his ultimate."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ideally try to time your skillshots with his auto attack animations, his Q, or his W since the scariest part about Pantheon players tend to be their extremely good movement."]},{"tipo":"p","texto":"This shouldn't matter nearly as much once you've gotten Dusk & Dawn though"}]}]},{"nome":"Poppy","planilha":"Poppy","id":"Poppy","titulo":"a Guardiã do Martelo","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rylai's","passos":[[{"nome":"Rylai's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"item","texto":"Plated Steelcaps / Boots Of Swiftness","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"},{"nome":"Boots Of Swiftness","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223009.png"}]],"motivo":"( Anti Burst / Movement Speed )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( So you can actually deal damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (AOE Slam)","8 / 7 / 6 / 5 / 4"],["W (MS Boost)","20 / 18 / 16 / 14 / 12"],["E (Targeted Dash / Stun)","14 / 13 / 12 / 11 / 10"],["Ult","140 / 120 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Get priority, shove the wave, play for the bounce back, rebound the wave, recall, get your items, and just rinse and repeat until you've reached your level 6 powerspike."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["All of your abilities outrange Poppy's abilities by large margin, so just play towards poking her down.","However: it's INCREDIBLY hard to land your E onto a good Poppy player since she can easily avoid it with her E dash or her W movement speed."]},{"tipo":"p","texto":"This issue can be resolved once you get your ultimate, since Mordekaiser's ult slows down enemies by 75% during its cast time."},{"tipo":"p","texto":"Meaning: If you can effectively combo your E -> R while Poppy's in the middle of one of her animations, then you've secured yourself an all-in."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["She CAN use her ultimate to knock you away during your ultimate or right after your ultimate expires. If you can, try mixing up your movement or using flash to dodge said ultimate.","Also: STAY AWAY FROM WALLS if you can help it, since Poppy can stun you into them if you're lined up for it."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try buffering your abilities into Poppy's E dash if she charges into you.","Additionally: try zoning the Poppy out of her passive buckler shield when it bounces onto the floor with Q's, but since they spawn near walls, only walk on top of them if you have nothing better to do and Poppy isn't actively looking to fight you."]}]}]},{"nome":"Qiyana","planilha":"Qiyana","id":"Qiyana","titulo":"a Imperatriz dos Elementos","dificuldade":{"early":2,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Deathfire Touch","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/DeathfireTouch/DEATHFIRE_TOUCH_KEYSTONE.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Scorch","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Scorch/Scorch.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Cosmic Drive","passos":[[{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( So you can maintain distance after she dashes )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Blade throw)","7"],["W (Dash)","7"],["E (Targeted dash)","11 / 10 / 9 / 8 / 7"],["Ult","120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, you can easily secure priority due to the fact that she hasn't gotten all of her spells yet.","Level 2, rank up your W to block any incoming damage, and walk forwards so that you can utilize shield bash procc's.","Level 3, and wave 3, crash the wave, and recall to buy some items and play for the rebound back to your turret."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["When Qiyana uses her empowered Q for whatever reason, you should try to walk up and try commiting towards a longer trade, if she decides to fight you for whatever reason, then just exhaust her and run her down."]},{"tipo":"p","texto":"All of her damage comes from short burst trades rather than sustained battles, so you should be able to win assuming you're at a high amount of HP to survive said initial burst."},{"tipo":"lista","itens":["The same principle also applies if she were to dash aggressively on top of you; Q into her dash, shield her Q projectile throw, and then run her down with exhaust and just: win.","Her Q, unfortunately, outranges your Q, with the trade-off being that it's a lot more predictable. When she has it up, try to wiggle around to dodge it, and then abuse it's early cooldown by walking up and using your own Q."]},{"tipo":"p","texto":"Now: usually, with a regular setup like Conqueror, this matchup would be extremely painful due to how much more consistent her poke is, but with Deathfire Touch, you have more leeway to miss more Q's and still win assuming you space outside of her Q range semi-competently."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Beware of her terrain Q since it deals additional damage when you are lower than 50% HP,"]},{"tipo":"p","texto":"If you can, try to use your shield while you're above that threshold, so that you can avoid taking more damage."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can manage to use your ultimate before Qiyana's used her current element, you can YOINK more stats that way since she gains attack speed while holding an element."]}]}]},{"nome":"Quinn","planilha":"Quinn","id":"Quinn","titulo":"as Asas de Demacia","dificuldade":{"early":3,"mid":1,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Anti kite + reduces her damage )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Nearsight)","11 / 10.5 / 10 / 9.5 / 9"],["W (Vision)","50 / 45 / 40 / 35 / 30"],["E (Main peel tool)","12 / 11 / 10 / 9 / 8"],["Ult","3"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Your main goal in this lane is to just wait until you get your plated steelcaps powerspike to E -> R -> run her down for a free solokill,"]},{"tipo":"p","texto":"Until then, just play safe with your Second Wind + Doran's Shield sustain."},{"tipo":"p","texto":";Let the wave push into you, play for the rebound, recall, and just rinse and repeat until you've gotten your ult and your plated steelcaps powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6: if she goes for an auto attack against you, Q her during said animation since her range is 525, while your Q is at a range of 625.","If you can, try fishing your E during either her E dash animation or during her auto attack animation."]},{"tipo":"p","texto":"If you land it, Q her, and then procc your passive and run her down until she gets too far."},{"tipo":"lista","itens":["Post level 6: It's the same exact game-plan with timing your abilities during her animation lock-out periods, but this time: you can extend the trade with your ultimate and just be able to secure a solokill in an all-in."]},{"tipo":"p","texto":"This matchup gets even easier once you have your rocketbelt since you have a bigger leeway to get into range for your E -> R -> kill her on cooldown."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6: If you are able to hit the turret because the Quinn isn't there, it is VERY likely that she probably started roaming, in which case you should DEFINITELY ping your teammates A LOT because there might be a potential quinn roam against them."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Once you're level 6: try to perma shove the wave as much as possible to lower her roam timers.","Additionally: always try to play towards topside objectives since you should generally be able to outvalue her in dedicated all-in fights."]}]}]},{"nome":"Rammus","planilha":"Rammus","id":"Rammus","titulo":"o Tatu Blindado","dificuldade":{"early":1,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred their magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Powerball)","12 / 10.5 / 9 / 7.5 / 6"],["W (Resistance boost)","7"],["E (Taunt)","12"],["Ult","120 / 105 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Remember to walk up with the wave level 1 so you can deny his level 1 proxy,","Your goal in this lane is to try and make it as poractive as possible; deny his proxies as much as you can WITHOUT sacrificing your own waves."]},{"tipo":"p","texto":"This is even easier against Rammus than against a Singed because Rammus has almost ZERO kill pressure against you with his base-kit, and he can't exactly force shove the wave the same way Singed can with his poison trail; he has to use his W and get the minions to hit him."},{"tipo":"lista","itens":["Some Rammus players are extremely stubborn though, and might sack a wave in favor of getting a proxy off."]},{"tipo":"p","texto":"If they do this, try to look for a proxy yourself, as deep as theirs, clear the wave, and then recall after them so that you can re-match the mismatched tempo and continously force fights against him."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Now, trading into Rammus is extremely easy since all you need to do is just keep continously spamming your abilities into him until he's dead."]},{"tipo":"p","texto":"That's it; it's that simple."},{"tipo":"lista","itens":["If you want to be extra proactive, you can also buffer your abilities into his Q knockup, E taunt and ult knockup, but to be honest: it isn't really necessary."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Rammus does have an unstoppability in his kit via his ultimate, but most Rammus players aren't good enough to actually cancel your ultimate with it."]},{"tipo":"p","texto":"It is something to be aware of though, and if you can, try to save your ultimate until after he's used his."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Post level 6, wait for him to use get his resistances from his Aftershock -> W, and then ult him so that you can YOINK an absolutely ABSURD amount of stats."]}]}]},{"nome":"Rek'Sai","planilha":"Rek'sai","id":"RekSai","titulo":"a Escavadora do Vazio","dificuldade":{"early":2,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["- Unburrowed form",""],["Q (Empowered AA's)","4 / 3.5 / 3 / 2.5 / 2"],["W (Burrow)","4"],["E (True damage bite)","6"],["Ult","120 / 100 / 80"],["Q (Poke tool)","10"],["W (Unburrow)","1"],["E (Tunnel)","18 / 17 / 16 / 15 / 14"],["Ult","120 / 100 / 80"]]},{"tipo":"p","texto":"- Burrowed form"}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Throughout the first couple of waves, you generally just want to sit back and Q Rek'sai from afar, especially because her early damage can be suprisingly high in short melee burst trades.","Just play safe, preserve your HP, and then get the wave pushed in to secure a recall, and then start investing into your items to properly duel her."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["When Rek'sai is in her unburrowed form, you generally want to stand right outside of her melee range and poke her down with your Q,","When Rek'sai is in her burrowed form, try to stand behind minions, but not too close, to avoid tanking damage from her ranged burrowed Q.","When Rek'sai dashes onto you with her burrowed E, try to buffer your Q into the initial knockup, and prolong the trade for as long as possible so that she doesn't just sustain through it with her passive.","Post level 6, this matchup gets really easy since you can basically just instantly ult her and secure an all-in."]},{"tipo":"p","texto":"Though, it's much easier to get a solo kill if you wait for her to create a new tunnel first before ulting."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Rek'sai can setup ganks really easily, so just be wary of where the enemy jungler is before commiting to anything risky."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Be sure to stomp out any tunnels in the lane so that she doesn't have an easy escape tool to get away from you when you want to commit towards an all-in against her when she's lethal (~30% HP).","If you want to secure a kill onto her, but she hasn't created a new tunnel yet with her burrowed dash, ideally try to position your ultimate in a wide open area with no walls to dash behind."]}]}]},{"nome":"Renekton","planilha":"Renekton","id":"Renekton","titulo":"o Carniceiro das Areias","dificuldade":{"early":3,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Bramble Vest","passos":[[{"nome":"Bramble Vest","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"}]],"motivo":"( Look at their runes, Bramble if Conqueror, and Warden's if PTA Renekton )"},{"tipo":"item","texto":"Dusk & Dawn / Riftmaker","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"},{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Squishy team vs. tanky team )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his burst damage^ )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn / Flex","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"},{"nome":"Flex","icone":null}]],"motivo":"( Just build whatever )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (AOE cleave)","7"],["W (Empowered AA / Stun)","16 / 14 / 12 / 10 / 8"],["E (Dash)","16 / 14.5 / 13 / 11.5 / 10"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["In terms of wave states, fight for priority level 1 if the Renekton doesn't pressure you off the wave."]},{"tipo":"p","texto":"If you get priority, level up W level 2, and walk excessively forward to pressure him off the wave, he shouldn't have enough rage to contest you and you'll be able to get some really good short trades into him."},{"tipo":"p","texto":"If you don't get priority for the wave, still level up W level 2 and look to fight him, he's either going to level up his W, in which case you can hold your W until he's used his, or he's going to dash away with his E, in which case: you can snag one last shield bash procc before he fully retreats."},{"tipo":"p","texto":"In either scenario, try to farm up to 800 gold so that your next recall gets you a bramble vest."},{"tipo":"p","texto":"If you get too low, and need to recall early, that's fine too. Just don't die."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Generally, in this matchup, you should try to extend trades for as long as possible since he tends to be favored in shorter trades due to his burst oriented nature.","In essence: if you are both high hp, you're at the advantage, and if you're both at low hp: Renekton's in the advantage.","Before level 6, your main goal is to try and save your E until after he's used his E dash, otherwise: just spam Q on top of him if he's already in-range of you."]},{"tipo":"p","texto":"If you're running shield bash (which you should), you can try to snag a little shield bash procc if he's under the 50 rage threshold for an empowered ability while he's not level 6."},{"tipo":"lista","itens":["Post level 6, you can try forcing a fight with your ultimate either after he's used his dash or if he's near your turret since both instances will help guarantee a longer fight."]},{"tipo":"p","texto":"From here: whatever you do, DO NOT use your W while he still has his empowered W up unless you think you can one-shot him with a shield bash boosted auto attack."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["His empowered W can completely shatter your W, therefore you should save your W until AFTER he's used his.","Additionally: Renekton, post level 6, also has the ability to grant himself an immediate 20 fury bonus."]},{"tipo":"p","texto":"Be wary of this since if you walk up to do a cheesy little shield bash auto attack, and he has 30 fury, he's going to ult and then immediately break down your only defensive tool in your kit."},{"tipo":"p","texto":"Be patient."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["DO NOT fight the Renekton if you're both starting the fight at low HP, since Renekton will most likely burst you down with hist short-trade oriented playstyle.","If you need to procc your shield bash damage but the Renekton has 50% rage for an empowered W, you should immediately recast your shield instead of keeping it so that you can have some value from your W as opposed to no value."]}]}]},{"nome":"Rengar","planilha":"Rengar","id":"Rengar","titulo":"o Acossador da Alcateia","dificuldade":{"early":3,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his burst damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Maximum Burst^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA)","6 / 5.5 / 5 / 4.5 / 4"],["W (Grey health heal)","16 / 14.5 / 13 / 11.5 / 10"],["E (Slow / Root)","10"],["Ult (Invisibility / Large MS boost)","100 / 90 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, give up priority, and play for the rebound back to his turret; he does a lot of burst damage level 1 and most Rengar top players run fleet footwork which makes commiting towards an all-in against him relatively difficult.","Level 2, I'd advise leveling up your W, and still letting him push the wave onto you.","Level 3; wave three, is when the wave starts bouncing back towards him."]},{"tipo":"p","texto":"MAKE SURE your HP is high during this period because now: you're almost guaranteed to get into a fight with him when the wave rebounds back."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Stack up your W shield on the wave, and as the wave pushes out, wait for him to use his jump.","If he jumps at you and/or a predictable location, fire your skillshot towards where he's going since he's forced to fully commit with his jump.","Ideally: you want to try and use your E in a way where it will grab him away from the bushes so that he doesn't have free access to easy fleet footwork stacks."]},{"tipo":"p","texto":"If you can manage to do that, you should be able to win an all-in considering that he's more burst oriented with his abilities."},{"tipo":"lista","itens":["Post level 6: this matchup gets a lot easier since you can force an all-in with your ultimate when he first uses his leap onto you."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Keep track of Rengar's passive, while it's at 4 stacks, he can either: deal more damage, heal a lot of potential damage that you'd dish out onto him, or root you."]},{"tipo":"p","texto":"The only main scenario that you have counterplay in, is if he roots you, in which case you should utilize your E, Q or ult animations while you're standing still since said abilities lock you in place anyways."},{"tipo":"lista","itens":["Post level 6, if you don't see Rengar in lane, be aware of the possibility that he might be roaming onto your teammates, and ping accordingly."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Like the previous advice with using your pull to get him away from bushes, you can similarly lock him into a confined space without bushes via your ultimate if you position it correctly.","If you can wait for Rengar to use his empowered Q, which gives him extra sttack speed, use your ultimate afterwards so that you can YOINK more stats."]}]}]},{"nome":"Riven","planilha":"Riven","id":"Riven","titulo":"a Exilada","dificuldade":{"early":4,"mid":3,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Grasp Of The Undying","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/GraspOfTheUndying/GraspOfTheUndying.png"},{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Cut Down","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/CutDown/CutDown.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Triple dashes)","6 / 5.5 / 5 / 4.5 / 4"],["W (Stun)","16 / 14.5 / 13 / 11.5 / 10"],["E (Shield / Dash)","10"],["Ult","120 / 90 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, give up priority, and play for the rebound back to her turret. YOU CANNOT win in melee range against her."]},{"tipo":"p","texto":"From there, keep bouncing waves back and forth until you have enough gold for plated steelcaps and your ultimate."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, you want to try and utilize your range advantage as much as possible and stand right outside of her E dash + Q dash range."]},{"tipo":"p","texto":"If you use your E while she's either doing her Q3 animation or when her E is down, you should be able to play the fight out for a little bit until her cooldowns come back up with your shield bash auto attacks and Q poke."},{"tipo":"lista","itens":["Post level 6 and post plated steelcaps, assuming you're not heavily behind, you should be able to win an all-in if you can get her to use her Q3 dash without taking an absurd amount of damage."]},{"tipo":"p","texto":"Ideally the combo is: E -> R while she's still in the air / locked in her Q 3 animation, (the R should buffer), and then auto attack her until she's used her E."},{"tipo":"p","texto":"From
