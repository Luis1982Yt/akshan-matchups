ut of his range to bait it and you should be relatively fine."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Accept the fact that you WILL eat plenty of ablazed Brand E's (Conflagration) since it's basically impossible to dodge as a melee champion."]},{"tipo":"p","texto":"This is fine though, just power through it, and keep crashing waves -> recalling afterwards for HP."}]}]},{"nome":"Briar","planilha":"Briar","id":"Briar","titulo":"a Fome Contida","dificuldade":{"early":2,"mid":1,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Coup de Grace","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/CoupDeGrace/CoupDeGrace.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Oblivion Orb / Bramble Vest","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"},{"nome":"Bramble Vest","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"}]],"motivo":"( Anti-healing )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Stun)","13 / 12 / 11 / 10 / 9"],["W (Frenzy)","14 / 13 / 12 / 11 / 10"],["E (Knockback)","16"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, get priority, and poke her down as she isn't much of a threat without the rest of her kit."]},{"tipo":"p","texto":"The most that she can do is either level up her Q to stun you (which you can just buffer with your Q anyways) or use her E to knock you back (which doesn't really deal that much damage early game)"},{"tipo":"lista","itens":["Level 2, you want to play more-so on the backend and focus on slow pushing the third wave into her turret to secure a crash."]},{"tipo":"p","texto":"If she engages onto you with her Q -> E combo, you should try to use your W, and then use your Q into her stun, to effectively negate it."},{"tipo":"lista","itens":["Once you crash the third wave, you can either recall or play for the rebound back to your turret, and then you should try and set up a freeze so that she'll have to overextend if she wants to farm for CS."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Just sit back and poke Briar down with your Q's until she's in lethal range (30% HP)","If she starts to trade back onto you with her W, E her behind you and commit towards a longer trade since comparatively speaking: Briar is more burst oriented in comparison to someone like Warwick or Trundle.","When she's in lethal range (30% HP), use your grab, walk forwards, get behind her, and then use your ignite before she's able to get her W recast off,"]},{"tipo":"p","texto":"From here: your all-in should be able to kill her."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Don't stand near walls while her W is active, since she's going to try using her E to stun you back into said wall to end the trade."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ideally, you want to put her into a situation where she'll have to use her E push back in an unoptimal scenario (away from walls and towards her turret) if she ever wants to trade with her W against you."]},{"tipo":"p","texto":"Or when she doesn't have her W up to trade efficiently in the first place."},{"tipo":"lista","itens":["Try to buffer your Q or your ultimate during her Q hop animation to effectively negate it's stun."]}]}]},{"nome":"Camille","planilha":"Camille","id":"Camille","titulo":"a Sombra de Aço","dificuldade":{"early":2,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive","18 / 14 / 10 (based on level)"],["Q (Empowered AA)","9 / 8 / 7 / 6 / 5"],["W (Sweep)","15 / 14 / 13 / 12 / 11"],["E (Hookshot)",": 16 / 15 / 14 / 13 / 12"],["Ult","140 / 115 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Do not get killed on your first three levels, if you can manage to do that, you genuinely just out-stat check her in any long trade you manage to get against her."]}]},{"titulo":"How to trade","blocos":[{"tipo":"p","texto":"Your #1 priority in this lane is to find a long trade into the Camille by any means necessary, this can be done in a number of ways:"},{"tipo":"lista","itens":["You E her as she is walking close to procc her Q2 and then use your ultimate to make the realm more favored towards you and therefore limiting her escape options.","You buffer your E during her E dash and then use your ultimate to make the realm more favored towards you. You CAN technically E after the stun wears off from her E, but this is a lot more inconsistent than just buffering her E CC.","You freeze the lane and when the Camille walks up, you E and then ult her."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Camille is REALLY good as setting up ganks or ganking your teammates, if she's missing: PING IT to an excessive degree."]},{"tipo":"p","texto":"If she's in lane however, always be wary of the enemy jungler potentially ganking you from a bush."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you ult Camille's ultimate, then you'll be able to dismantle it.","Don't use your Q or your E while her passive shield is up, just wait for the shield to go down, and then press the buttons to kill her right after. ( This tip is ESPECIALLY important if you ever want to dive her )","Try to save your W for when her Q2 is up, your W has an annoying mechanic where it decays over time, so you want to ideally press W when she can burst you down the quickest.","If you can, try to save your ultimate after she's used her E since it will yoink some of the bonus attack speed that she gets by using her E."]}]}]},{"nome":"Cassiopeia","planilha":"Cassiopeia","id":"Cassiopeia","titulo":"o Abraço da Serpente","dificuldade":{"early":5,"mid":5,"late":1,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Negatron Cloak","passos":[[{"nome":"Negatron Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1057.png"}]],"motivo":"( To Reduce Her Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Dusk & Dawn / Force Of Nature","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"},{"nome":"Force Of Nature","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224401.png"}]],"motivo":"( Does the enemy have 3+ AP? )"},{"tipo":"item","texto":"Dusk & Dawn / Force Of Nature","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"},{"nome":"Force Of Nature","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224401.png"}]],"motivo":"( Build whatever you didn't build second as your third item )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Noxious Blast)","3.5"],["W (Ground)","24 / 22 / 20 / 18 / 16"],["E (DPS tool)",": 0.75"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up early priority and just play towards your turret for the majority of the game."]},{"tipo":"p","texto":"If the wave starts rebounding back to her, shove the wave, let the wave bounce back towards you, and use TP as a get-out-of-jail free card if you get chunked too hard to secure the shove."},{"tipo":"p","texto":"From here, just keep bouncing back waves and only play aggressive to secure a shove and subsequent crash onto her turret."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before you get Force Of Nature, you HAVE to wait for her to miss her Q (Noxious Blast), from here: you will have 3.5 seconds (less if she builds CDR), to E her as she misses her Q, and then start an all-in against her."]},{"tipo":"p","texto":"From here, land your follow-up Q, auto attack her, and then hard focus on using your passive movement speed to dodge her next Q."},{"tipo":"p","texto":"If you can manage to do that, keep responding to her missed Q's with your own Q's to make sure that you're not rooting yourself for her to get a guaranteed Q onto you."},{"tipo":"lista","itens":["Once you do get Force Of Nature: you can literally just turn off your brain and lazily all-in her whenever you get the opportunity to do so."]},{"tipo":"p","texto":"It's extremely overpowered into her, but you need to survive up to that point before being able to do so."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6: If you see her using her ultimate animation, click backwards to dodge her 2 second stun."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Always Q directly on top of Cassiopeia's model so that when she goes for her ult animation, you can flash behind her and still land said Q since Mordekaiser's Q will go directly towards where your cursor was when you pressed Q instead of it being relative towards your model."]},{"tipo":"p","texto":"(Like Aatrox Q, Gwen Q, Sett W, Bel'veth W, etc.)"}]}]},{"nome":"Cho'Gath","planilha":"Cho'gath","id":"Chogath","titulo":"o Terror do Vazio","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Cut Down","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/CutDown/CutDown.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Cosmic Drive","passos":[[{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( So you can consistently dodge his skillshots )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Knockup)","6"],["W (Silence)","11 / 10.5 / 10 / 9.5 / 9"],["E (Spikes)",": 8 / 7 / 6 / 5 / 4"],["Ult","80 / 70 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["If Cho'gath has Hail Of Blades: concede priority as his burst is crazy strong in the early game.","Try to keep the wave on your side of the map at all times to try and force him to overextend, and therefore: feel pressured to shove the wave in by using his abilities."]},{"tipo":"p","texto":"Now: dealer's choice in how you want to accomplish this; push -> rebound or give up priority into a freeze,"},{"tipo":"p","texto":"But the most important part is that you should try to make the Cho'gath walk uncomfortably too far."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["If you manage to dodge his Q, run at him, E him, and try to extend the trade. He sucks in prolonged fights due to his ability centric nature.","If you're behind, wait for him to use his E on the wave, and then dodge his Q with either good movement, ghost, or flash."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Cho'gath can silence you out of your W with his own W to combo into an ultimate, so if you're at half HP: W early to avoid dying without it."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Priorize dodging his Q over landing your own skillshots as casting your Q or R will self-root you for a second, making it easier for him to land a skillshot."]}]}]},{"nome":"Corki","planilha":"Corki","id":"Corki","titulo":"o Bombardeiro Ousado","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Anti kite + reduces his damage )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Bomb)","9 / 8.5 / 8 / 7.5 / 7"],["W (Dash)","20 / 18 / 16 / 14 / 12"],["E (Gatling Gun)",": 12"],["Ult","2"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up level 1 priority, and conserve your HP to play off the third wave.","Level 2, level up your W and just keep playing safe and sustaining through the lane.","Third wave, let it crash, and then start playing off the rebound on the fourth wave."]},{"tipo":"p","texto":"Ideally you want to try and farm up until your plated steelcaps + level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your skillshots when Corki walks up to use his Q poke or to CS minions, but don't commit towards an all-in until you've gotten your plated steelcaps + level 6 powerspikes.","Once you have gotten your plated steelcaps and level 6 powerspike, force an all-in by successfuly timing an E into an R when he goes for an auto attack."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Corki's Q gives him lingering vision if it fires it in a bush for 6 seconds, if you see him use it, do not walk into said bush."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["I guess you can ult away Corki's lingering W, but it doesn't really matter that much since it only lasts for one second anyways."]},{"tipo":"p","texto":";What you see is what you get against Corki, just dodge his skillshots and land yours."}]}]},{"nome":"Darius","planilha":"Darius","id":"Darius","titulo":"a Mão de Noxus","dificuldade":{"early":4,"mid":3,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Bramble Vest","passos":[[{"nome":"Bramble Vest","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"}]],"motivo":"( To reduce his healing )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Anti kite + reduces his damage )"},{"tipo":"item","texto":"Liandry's / Dusk & Dawn","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Tanky team vs. Squishy team )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Axe Swing)","9 / 8 / 7 / 6 / 5"],["W (Empowered AA)","5"],["E (Pull)","26 / 23.5 / 21 / 18.5 / 16"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, walk up towards your closest lane bush, and Q him on the head for a little bit of poke, assuming he tries to go for a level 1 cheese onto you.","From there, give up priority, and don't lose HP while the wave is pushing towards you, since you're going to need it to secure the rebound back towards his turret."]},{"tipo":"p","texto":"Keep cycling between these two playstyles of passiveness and aggressiveness depending on if the wave is going towards you or towards him."},{"tipo":"lista","itens":["This matchup gets a lot easier once you get all of your abilities, so just play safe until you reach that point."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["If the wave is on your side of the lane, you can try Q'ing him from max range for additional poke, this is easier to guarantee if you can time it as he's last hitting your minions."]},{"tipo":"p","texto":"If he ever misses his Q, feel free to E him and trade with him until he reaches 3 passive stacks onto you, and then: back off until his passive stacks run out."},{"tipo":"lista","itens":["However, if the wave is not on your side of the lane, you have to hold Q until you know that you are guaranteed to land it. If you miss your Q while overextended, you are dead."]},{"tipo":"p","texto":"When the wave is pushing out, walk up with the wave while having confidence, not with anxiety."},{"tipo":"lista","itens":["If Darius is in lethal range (~50% HP) and he has no passive stacks on you: E him closer towards you and hug him for as long as possible to deny him from landing his Q onto you with the outer rim."]},{"tipo":"p","texto":"Alternatively, you can also flash or ignite him while he's about to land his Q onto you to deny his healing."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Darius can E pull -> R you to deny your W, so try to time your W into his AA -> W -> Q combo."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["This matchup is often a mental game, so do not get into your own head about it and start doubting yourself, you will miss skillshots if you are nervous and Q early when you're close towards him.","Land all of your skillshots, AND SHOW NO FEAR. YOU ARE HIM.","Try ulting him right before he's going to get max stacks onto you, so that you can YOINK more AD when his passive reaches 5 stacks."]}]}]},{"nome":"Diana","planilha":"Diana","id":"Diana","titulo":"o Escárnio da Lua","dificuldade":{"early":2,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke Tool)","8 / 7.5 / 7 / 6.5 / 6"],["W (Shield)","15 / 13.5 / 12 / 10.5 / 9"],["E (Dash)","22 / 20 / 18 / 16 / 14"],["Ult","100 / 90 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Most Diana players should concede level 1 priority because of their overall weak all-in power compared to Mordekaiser, so just level priority and try to space in and out of her Q range to bait it out.","Level 2, if the Diana walks up for CS, level up your W and apply a shield bash procc against them, otherwise: just focus on slow pushing the wave.","Crash the third wave, and then go for either a reset or wait for a rebound back to your turret."]},{"tipo":"p","texto":"Ideally, you want to have a long lane so that you can punish the down-time that Diana players have after they land all of their abilities."},{"tipo":"p","texto":"Especially because Diana's dash tools are so commital."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["A good Diana player will most likely just sit back and land her Q poke against you without ever commiting towards an all-in,","However: if they are stupid enough to try and walk up for CS:"]},{"tipo":"p","texto":"Try to time your abilities when they are in the middle of an auto attack animation and then commit towards an all-in."},{"tipo":"p","texto":"You should be able to win any extended trade since Diana is so ability-reliant."},{"tipo":"lista","itens":["Post level 6, this matchup gets even easier for you since you can force the Diana to fight in an extended fight against you with your E -> R combo."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If the Diana player is right in front of your face, she has enough time to dash behind you with her E and effectively nullify one of your Q's,"]},{"tipo":"p","texto":"Though, to be honest: this doesn't really tend to matter that much."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["In teamfights, if your team is clumped up together, make sure to ult away the Diana so that her teammates don't have to suffer from a 5-man empowered Diana ultimate."]}]}]},{"nome":"Dr. Mundo","planilha":"Dr. Mundo","id":"DrMundo","titulo":"o Louco de Zaun","dificuldade":{"early":2,"mid":1,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rylai's","passos":[[{"nome":"Rylai's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"( Combos with Approach Velocity )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( Anti-healing )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive","60 - 15 (Based on level)"],["Q (Poke Tool)","4"],["W (Heart Zapper)","17 / 16.5 / 16 / 15.5 / 15"],["E (Empowered AA)","9 / 8.25 / 7.5 / 6.75 / 6"],["Ult","120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["If the Mundo is half decent, he's not going to get hit by two E's in a row (one for his passive, and the other to actually pull him), so just farm up until you get your Rylai's + Oblivion Orb."]},{"tipo":"p","texto":"Though, if he is stupid enough to get hit by two Mordekaiser E's in succession, then you should just be able to outstat check him in melee range in an extended trade."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Look for when the Mundo wants to farm a minion with his Q to CS, walk up, and force him to choose between the minion or hitting you, make sure to react to his cleaver in case he decides to throw it at you."]},{"tipo":"p","texto":"If you have Rylai's + Approach Velocity, you can Q him and land your E, and hopefully be be able to get one last auto attack to procc your passive and run him down."},{"tipo":"p","texto":"If you don't, then just settle for an E to pop his passive and wait until you get your next E to land it and then prolong whatever trade you can get from that."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["DO NOT ult him if his passive is up since it will block your ultimate."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Look to step up Dr. Mundo's passive to deny his cooldown refresh to prolong the window you have to E him for a pull and find an extended trade."]}]}]},{"nome":"Draven","planilha":"Draven","id":"Draven","titulo":"o Carrasco de Noxus","dificuldade":{"early":5,"mid":4,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Spinning Axe)","12 / 11 / 10 / 9 / 8"],["W (Bonus MS)","12 (Note: This cooldown is reset if he catches an axe)"],["E (Knockback)","16 / 15 / 14 / 13 / 12"],["Ult","100 / 90 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up level 1 priority, and conserve your HP to play off the third wave.","Level 2, level up your W and just keep playing safe and sustaining through the lane.","Third wave, let it crash, and then start playing off the rebound on the fourth wave."]},{"tipo":"p","texto":"Ideally you want to try and farm up until your plated steelcaps + level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your skillshots when Draven goes to catch his axes, but don't commit towards an all-in until you've gotten your plated steelcaps + level 6 powerspikes.","Once you have gotten your plated steelcaps and level 6 powerspike, force an all-in by successfuly timing an E into an R when he goes for an axe catch."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Do not be the first one to die to a Draven, since you don't want him cashing out on his passive.","Post level 6, don't hold onto your W for too long since Draven ult has an execute mechanic which will guarantee kill you if your HP is under the threshold of his passive stacks."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Post level 6, If you can time your all-in when Draven's axe is still mid-air, you can effectively lower his DPS by ulting away said axe."]}]}]},{"nome":"Ekko","planilha":"Ekko","id":"Ekko","titulo":"o Rapaz que Estilhaçou o Tempo","dificuldade":{"early":3,"mid":3,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Hail Of Blades","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/HailOfBlades/HailOfBlades.png"},{"nome":"Taste Of Blood","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/TasteOfBlood/GreenTerror_TasteOfBlood.png"},{"nome":"Grisly Mementos","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/GrislyMementos/GrislyMementos.png"},{"nome":"Ultimate Hunter","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/UltimateHunter/UltimateHunter.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive -> Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Hextech Gunblade","passos":[[{"nome":"Hextech Gunblade","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223146.png"}]],"motivo":"( To play off of HOB's mixed damage scaling)"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Extra Omnivamp )"},{"tipo":"item","texto":"Kaenic Rookern / Spirit's Visage","passos":[[{"nome":"Kaenic Rookern","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222504.png"},{"nome":"Spirit's Visage","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223065.png"}]],"motivo":"( Only build if Ekko is still a problem, otherwise: build variety )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Stacks)","4"],["Q (Poke tool)","9 / 8.5 / 8 / 7.5 / 7"],["W (Stun + Shield)","22 / 20 / 18 / 16 / 14"],["E (Dash)","9 / 8.5 / 8 / 7.5 / 7"],["Ult","110 / 80 / 50"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Most Ekko players should concede level 1 priority because of their overall weak all-in power compared to Mordekaiser, so just get level priority.","Level 2, if the Ekko walks up for CS, level up your W and apply a shield bash procc against them, otherwise: just focus on slow pushing the wave.","Crash the third wave, and then go for either a reset or wait for a rebound back to your turret."]},{"tipo":"p","texto":"Ideally, you want to have a long lane so that you can punish the down-time Ekko players have after they land all of their abilities."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Similarly to Sylas, it's really hard to do anything proactive since Ekko can always dodge at least one of your skillshots by using their E dash."]},{"tipo":"p","texto":"Just try poking them out with Q's over and over again until level 6."},{"tipo":"lista","itens":["Once you reach level 6, and when they are at a relatively low amount of HP, wait for them to walk up to the wave to land a Q to last hit a minion, and then land your E -> R to secure a pull and subsequent all-in with your ultimate's 75% slow.","You should always be able to win an all-in assuming you are not low enough to get bursted down by Ekko's full combo (and W execute passive)."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Use your W whenever you are above 30% HP since if you edge it until the very last second, you'll leave yourself susceptible to Ekko's W passive which makes it so that his attacks deal bonus magic damage when you are below 30% HP.","Ekko W, despite looking like it disappears after you ult him, does not lose it's effectiveness and instead decides that it wants to have the ability to:"]},{"tipo":"p","texto":"TRAVERSE REALMS! Which is really annoying because he can theoretically stun you with a completely invisible W! Isn't that FUN???? (no)"}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you see Ekko preparing his W, hit him for as long as possible until he gets his shield. Once he gets his shield, save your damage until after it falls off, and then try to burst him down."]}]}]},{"nome":"Elise","planilha":"Elise","id":"Elise","titulo":"a Aranha Rainha","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her stun duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["- Human form",""],["Q (Poke tool)","6"],["W (Spiderling)","12"],["E (Cocoon)","12 / 11.5 / 11 / 10.5 / 10"],["Ult","3"],["Q (Bite)","6"],["W (Attack Speed Steroid)","6"],["E (Rappel;)","22 / 21 / 20 / 19 / 18"],["Ult","3"]]},{"tipo":"p","texto":"- Spiderling form"}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Whatever you do: don't die before level 6,"]},{"tipo":"p","texto":"Let the wave push to you, play for the rebound back, crash said wave, and rinse and repeat until you've reached your level 6 powerspike."},{"tipo":"lista","itens":["Once you've reached your level 6 powerspike, you can (somewhat) threaten an all-in assuming you either buffer her stun, or you've managed to close the distance behind minions to block said stun."]},{"tipo":"p","texto":"So just try to be patient, this is the hardest point of the game for you in this particular matchup."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Stand behind minions to deny her stun, but not too close of the minions to avoid suffering from the splash damage of her ranged spiderlings.","When Elise goes for an auto attack or her ranged Q: Neurotoxin, trade with an E or a Q, but try to not combo each ability too close to each other to avoid having your abilities denied by her melee repel.","Once you've reached your rocketbelt powerspike, you want to try and close the distance for as long as possible and set out your ultimate as soon as she uses her stun onto you."]},{"tipo":"p","texto":"If you can properly buffer it, run her down until she's used her E repel, and then kill her once she's come down."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Be hyper aware of all of the possible locations Elise can go towards after she's used her E repel, they can be either be exactly where she is or any of her enemy target locations."]},{"tipo":"p","texto":"If you're chasing her down, try to have the option of repelling towards an enemy target be detrimental towards their escape time to secure a kill."},{"tipo":"lista","itens":["Elise is REALLY good at setting up ganks if the enemy jungler has some form of guaranteed CC, be HYPER aware of wherever the enemy jungler is at all times."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If Elise ever finds herself in an all-in against you, try to time your ultimate while she's in her melee spider form a second into the fight so that you can potentially YOINK more attack speed when she uses her attack speed steroid in her melee spider form."]}]}]},{"nome":"Evelynn","planilha":"Evelynn","id":"Evelynn","titulo":"o Abraço da Agonia","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Deathfire Touch","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/DeathfireTouch/DEATHFIRE_TOUCH_KEYSTONE.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Scorch","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Scorch/Scorch.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Cosmic Drive","passos":[[{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( So you can maintain distance after she dashes )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her charm duration )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Heal + Stealth)","4"],["Q (Dart + Spikes)","4"],["W (Charm)","15 / 14 / 13 / 12 / 11"],["E (MS boost)","8"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["In the early game, only walk up to CS when her Q dart is down, otherwise: stand behind minions and avoid getting tagged by her since she will deal a surpising amount of damage early game.","Give up early priority, and play for a wave rebound with an HP advantage + minions, assuming you spaced correctly."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["If she misses her Q dart onto you, and instead: hit a minion, try to extend a trade for as long as possible while avoiding the linear line of whichever minion she tagged.","Evelynn gets a lot of her movement speed from her E dash, so try to time your exhaust after she's used all of her Q's to force her into an extended trade with you without a significantly powerful enough escape tool.","When Evelynn uses her W charm onto you, either try to avoid getting into a trade with her so that she can't procc the mark in the first place, or hard commit onto her and buffer her charm when the time comes to get the most amount of uptime on your damage,"]},{"tipo":"p","texto":"Since now: she's either forced to procc it early to get the damage off, or wait for the charm to come back up, in which you're (ideally) going to try to mitigate it's CC anyways via an ability buffer."},{"tipo":"lista","itens":["Level 6: so long as you can start a fight against her at full HP, you should easily be able to win against her in a dedicated all-in."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6: If you are able to hit the turret because the Evelynn isn't there, it is VERY likely that she probably started roaming, in which case you should DEFINITELY ping your teammates A LOT because there might be a potential Evelynn roam against them."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Once you're level 6: try to perma shove the wave as much as possible to lower her roam timers.","Additionally: always try to play towards topside objectives since you should generally be able to outvalue her in dedicated all-in fights due to your class as a juggernaught and her class as a burstier assassin."]}]}]},{"nome":"Ezreal","planilha":"Ezreal","id":"Ezreal","titulo":"o Explorador Pródigo","dificuldade":{"early":4,"mid":3,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Anti kite + reduces his damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke)","5.5 / 5.25 / 5 / 4.75 / 4.5"],["W (Debuff)","8"],["E (Dash)","26 / 23 / 20 / 17 / 14"],["Ult","120 / 105 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Your main goal in this lane is to just wait until you get your plated steelcaps powerspike to ghost -> R run him down for a free solokill."]},{"tipo":"p","texto":"Until then, just stand behind minions and play safe with your Second Wind + Doran's Shield sustain."},{"tipo":"p","texto":";Let the wave push into you, play for the rebound, recall, and just rinse and repeat until you've gotten your ult and your plated steelcaps powerspikes."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Because of Ezreal's extremely quick dash and non-commital trade patterns, you're not exactly going to be trading with him until you've gotten your plated steelcaps powerspike,","If he's on your side of the lane, try to walk forwards, but still behind minions, and fish for Q hits,"]},{"tipo":"p","texto":"If he dashes out of your Q with his E, and then overextends forwards, wait for your Q to come back up, and then E -> Q or Q flash to procc stormraider's and run him down."},{"tipo":"p","texto":"This gets a lot easier when you're level 6 and can lock him down inside of your ultimate, and even more easier once you've gotten your rocketbelt powerspike for as a pseudo flash with rocketbelt -> Q."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Be hyper aware that a majority of Ezreal's damage comes from linear skillshots that can be easily blocked by minions.","If Ezreal lands his W onto you, try to not walk up so that you can deny him from getting an empowered auto attack onto you."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ideally try to have your ultimate in a wide and open area to deny him from jumping over a wall to escape from you."]}]}]},{"nome":"Fiddlesticks","planilha":"Fiddlesticks","id":"Fiddlesticks","titulo":"o Terror Ancestral","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Unflinching","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Unflinching/Unflinching.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive Force","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Mercury Treads","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her fear duration )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To get into range )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Fear)","15 / 14.5 / 14 / 13.5 / 13"],["W (Tether)","10 / 9.5 / 9 / 8.5 / 8"],["E (Silence)","10 / 9 / 8 / 7 / 6"],["Ult","140 / 110 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Fiddlesticks' entire lane gimick is to use his E to poke you, and his Q -> W to wear you down."]},{"tipo":"p","texto":"Now: unless you have your mercury treads, there's not much counterplay on your end to outplay him, so it's just better to sit and farm until you've reached said powerspike and then trade into him."},{"tipo":"lista","itens":["In other words: give up early priority, let the wave push into you, and just conserve your HP so that you can safely bounce waves back and forth until you've gotten said powerspike."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Once you've gotten your Mercury Treads powerspike (there's not much trading into him before that), you ideally want to try to wait until he's overextended, and then use your E to cancel his W cast so that you can start an all-in against him."]},{"tipo":"p","texto":"From there, you should just be able to simply win in a DPS battle."},{"tipo":"lista","itens":["If you can, try to use your Q or ultimate spells while his fear projectile is flying towards you, but this is a very tight timer.","Post level 6, so long as you aren't feared under his turret, you should win a dedicated all-in against him so long as you can get his ult off before he can use his entire combo onto you."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["When Fiddlesticks is level 6, DO NOT overextend to his turret unless you know for absolutely sure where his EXACT location is, because otherwise: you're probably going to get jumpscared and feared to death."]},{"tipo":"p","texto":"Essentially just pretend that any unwarded bush HAS Fiddlesticks inside of them unless proven otherwise."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Make sure to ward the bushes to ensure he doesn't procc his out of vision fear passive on his Q."]},{"tipo":"p","texto":"If he does get an initial fear in before using his Q, his Q damage is doubled."}]}]},{"nome":"Fiora","planilha":"Fiora","id":"Fiora","titulo":"a Grande Duelista","dificuldade":{"early":4,"mid":4,"late":4,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Bramble Vest","passos":[[{"nome":"Bramble Vest","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"}]],"motivo":"( Anti-healing )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Dash)","13 / 11.25 / 9.5 / 7.75 / 6"],["W (Parry)","24 / 22 / 20 / 18 / 16"],["E (AA reset + Attack speed steroid)","11 / 10 / 9 / 8 / 7"],["Ult","110 / 90 / 70"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up priority early on and just try to play for short trades with your Q or W shield bash auto attacks EXCLUSIVELY."]},{"tipo":"p","texto":"Your goal here is to get your bramble vest and actually start being able to threaten her with your poke BEFORE she gets her ravenous hydra powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["As stated before: try to go for extremely short trades with your Q and W shield bash auto attacks exclusively, but what is more important: is that you DO NOT let her get a vital for free."]},{"tipo":"p","texto":"If you are lazy with her vitals, you will die, so when you Q, make sure that you're in a position where your self root won't give her an additional vital procc if she reacts in time."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["DO NOT use your E or your R onto her away from your turret unless you know her W is down."]},{"tipo":"p","texto":"Because if it's not down: you're going to get stunned, and die a very quick and very gruesome death."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Fiora's vitals are not random and have a pattern where they cycle from spawning North East, and South West."]},{"tipo":"p","texto":"Make sure to position accordingly when she pops a vital against you."}]}]},{"nome":"Fizz","planilha":"Fizz","id":"Fizz","titulo":"o Trapaceiro das Marés","dificuldade":{"early":3,"mid":3,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Forward Dash)","8 / 7.5 / 7 / 6.5 / 6"],["W (AA reset)","7 / 6 / 5 / 4 / 3"],["E (Invulnerability)","16 / 14 / 12 / 10 / 8"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, secure priority since his only damage tool at this point is also going to be his only survivability tool against you. If he uses his E ( Playful / Trickster ), then you can use your Q directly on him, but otherwise: just focus on getting priority.","Level 2, rank up your W since it's not like you're going to land your E onto him anyways, and play towards getting any sneaky little shield bash procc's you can when he goes up to CS minions.","Level 3, crash the wave, and then go for a cheater recall or wait for the wave to bounce back towards you."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You are only allowed to use your abilities until AFTER he's used his E ( Playful / Trickster ), since if you allow him to play the reactive game: you will lose."]},{"tipo":"p","texto":"Literally just go for shield bash auto attacks until he uses his invulnerability spell, that's the only way to trade against him proactively."},{"tipo":"p","texto":"Luckily for you, your setup is not oriented towards landing skillshots; it's oriented towards bursting someone down with auto attacks via Dusk & Dawn and Press the attack."},{"tipo":"lista","itens":["Honestly: play safe and reactively until you've gotten your level 6 and dusk & dawn powerspikes respectively, in which case you can just ult him and right click him to death with zero counterplay options whenever he's on your side of the lane."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If Fizz has been missing for a while, you should have an EXTREME amount of paranoia when it comes to checking any unwarded bushes, because if he manages to get a long range ult (Chum the water) onto you, your HP is going to explode."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["When you fight the Fizz one on one, don't let him get enough distance to land even a slightly empowered ultimate onto you unless you're planning on flashing said ultimate."]}]}]},{"nome":"Galio","planilha":"Galio","id":"Galio","titulo":"o Colosso","dificuldade":{"early":3,"mid":1,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred their magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Empowered AA)","5 (But it's cooldown is lowered by 3 seconds if an ability hits)"],["Q (Tornados)","11 / 10 / 9 / 8 / 7"],["W (Taunt)","18 / 17 / 16 / 15 / 14"],["E (Dash + Knockup)","11 / 10 / 9 / 8 / 7"],["Ult","180 / 160 / 140"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["If he ever overextends with his E dash or if you manage to cancel his E dash with your own E (which is really rare), you should be able to 100% win a dedicated all-in against him due to your DPS outputs."]},{"tipo":"p","texto":"But, against a good Galio, you're probably not going to end up getting opportunity since they're just going to exclusively play for short trades on their side of the lane so that they aren't caught out being overextended."},{"tipo":"p","texto":"Luckily, this does mean you're going to be able to control the wave, so try and keep the wave by your side of the lane so that you can find further opportunities to punish his generally weak all-in power."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["When the wave is on his side of the lane, and Galio's passive is up, try to stand away from the minions to avoid getting his by his AOE ground-pound if you're close to him.","When the wave is on your side of the lane though, try to close the distance as much as possible without using your E grab so that he's either forced to use his E while overextended into the lane, or give up CS.","When you see Galio using his E dash, try to either stand in the way of his escape path while also trying to buffer one of your abilities into said dash to effectively negate it's CC.","Once you have your level 6, this matchup gets extremely easy since you can basically force any extended trade whenever you want to and win due to his burst centric nature."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Galio's W gives him a lot of damage negation, so try to not use your Q smash into it, and just wait it out via auto attacks if you can."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Don't stand inside of Galio Q tornado since not only will it deal a lot of damage, but it will also lower his passive ground-pound cooldown for as long as you are inside of it."]},{"tipo":"p","texto":"Ideally try to time your Q's and ult's respectively while said Q is down to avoid as much uptime in it as possible."}]}]},{"nome":"Gangplank","planilha":"Gangplank","id":"Gangplank","titulo":"o Terror dos Doze Mares","dificuldade":{"early":3,"mid":2,"late":4,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps Rush","passos":[[{"nome":"Plated Steelcaps Rush","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the distance )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Burst damage Item^)"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Fire Sword)","15 (But it's cooldown is reset if he explodes a barrel)"],["Q (Poke tool)","4.5"],["W (Orange)","22 / 20 / 18 / 16 / 14"],["E (Powder Keg)","17 / 16 / 15 / 14 / 13"],["Ult","160 / 140 / 120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Early onto the lane, he'll most likely just poke you out with his Q and ATTEMPT to use his barrels."]},{"tipo":"p","texto":"Take note of the amount of barrels he has, if he has only 1 barrel avaliable, you can wiggle between the outer edge of the barrel and inside the hitbox of the barrel to bait him to hit it."},{"tipo":"p","texto":"IF he has more than one barrel, you can wiggle between an invisible line between you and his 2 barrel combo to bait it out."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, keep playing the tether game where you stand right outside of his barrel ranges,","Post level 6, you can begin to play more aggressive and if you can spot that he's trying to do a 2 barrel combo onto you because he's standing on top of his barrel and has another barrel avaliable, you can just ult him straight up to slow down his combo speed,"]},{"tipo":"p","texto":"And if you're particularly lucky, he might have mistimed his 2 barrel combo in a panic and now he barely has any barrels remaining which basically makes him a free kill because his stupid oranges cannot save him from your ultimate now."},{"tipo":"lista","itens":["From there, just land your skillshots and you should be fine."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Be aware of the fact that he can barrel combo you from a bush, so if you see that he has only 1 barrel avaliable in the early game, there's a good chance he's trying to get a sneaky little barrel cheese onto you."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["As stated before, you can ult away Gangplank's barrels, and you can also ult away his ult. Do this if you can.","If you have TITANICALLY MASSIVE BALLS, you can play the barrel game and try to last hit the barrels before he can hit it, but this is very difficult if the Gangplank is competent."]}]}]},{"nome":"Garen","planilha":"Garen","id":"Garen","titulo":"o Poder de Demacia","dificuldade":{"early":2,"mid":2,"late":3,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Cut Down","icone":"https:/  and momentarily walk away from him until your cooldowns come back up."]},{"tipo":"p","texto":"If he's low, commit to the trade instead of backing off and secure a solokill."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Garen's E deals more damage to the nearest target, so either E him behind you or just walk into the wave to mitigate the damage.","Make sure to W at 50% hp instead of reactively for his R, as a good Garen player with silence you before using their ult."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If Garen goes for a proxy on you, you can proxy his proxy to re-match tempo, though: this is risky since it requires you to know where the enemy jungler is.","Try your best to not use your shield bash auto attack into his W parry mechanic since he will lower your burst damage significantly."]}]}]},{"nome":"Gnar","planilha":"Gnar","id":"Gnar","titulo":"o Yordle Pré-Histórico","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"
