/* Uma tela de seleção de campeões por guia: você, a lista de inimigos e o inimigo. Cada guia tem sua paleta; o Akshan é Sentinelas da Luz. */
:root {
  --fundo: #0c0b09;
  --painel: #15130f;
  --painel-alto: #1e1a13;
  --linha: rgba(214, 178, 98, .26);
  --linha-forte: rgba(214, 178, 98, .55);
  --acento: #d6b262;
  --acento-vivo: #f2d488;
  --destaque: #ffd96b;
  --texto: #e9e1cd;
  --texto-baixo: #a99f88;
  --tinta-botao: #17130a;
  --luz: rgba(255, 228, 150, .16);
  --sombra: 0 10px 30px rgba(0, 0, 0, .45);
  --sobre-arte: #ffe6a3;
  --destaque-arte: #ffd96b;
  --botao-1: #ffe7a1;
  --botao-2: #e2b24a;
  --brilho: rgba(255, 240, 200, .55);
  --brilho-2: rgba(255, 210, 110, .18);
  --titulo: "Cinzel", "Times New Roman", serif;
  --corpo: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --barra: 64px;
  --borda: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: dark;
}
:root[data-tema="claro"] {
  --fundo: #f6f0e1;
  --painel: #fffcf4;
  --painel-alto: #efe5cd;
  --linha: rgba(150, 112, 30, .28);
  --linha-forte: rgba(150, 112, 30, .6);
  --acento: #8a6416;
  --acento-vivo: #6f4e0c;
  --destaque: #e3b23c;
  --texto: #2a2316;
  --texto-baixo: #66593f;
  --tinta-botao: #1d1608;
  --luz: rgba(227, 178, 60, .18);
  --sombra: 0 10px 30px rgba(90, 64, 10, .14);
  color-scheme: light;
}
/* Mordekaiser: ferro e o verde do Reino da Morte. */
:root[data-guia="mordekaiser"] {
  --fundo: #0a0d0c;
  --painel: #121715;
  --painel-alto: #19201c;
  --linha: rgba(110, 214, 156, .22);
  --linha-forte: rgba(110, 214, 156, .48);
  --acento: #63c98f;
  --acento-vivo: #97ecbb;
  --destaque: #5be39a;
  --texto: #dde7e1;
  --texto-baixo: #92a39a;
  --tinta-botao: #05110a;
  --luz: rgba(80, 220, 140, .12);
  --sombra: 0 10px 30px rgba(0, 0, 0, .5);
  --sobre-arte: #c8ffdf;
  --destaque-arte: #6cf0a8;
  --botao-1: #b5f7cf;
  --botao-2: #3fbd78;
  --brilho: rgba(200, 255, 225, .5);
  --brilho-2: rgba(80, 220, 140, .18);
  color-scheme: dark;
}
:root[data-guia="mordekaiser"][data-tema="claro"] {
  --fundo: #edf2ee;
  --painel: #fbfdfb;
  --painel-alto: #dde7e0;
  --linha: rgba(25, 110, 65, .26);
  --linha-forte: rgba(25, 110, 65, .56);
  --acento: #1d7448;
  --acento-vivo: #135a37;
  --destaque: #2fa865;
  --texto: #17201b;
  --texto-baixo: #4c5d53;
  --tinta-botao: #04120a;
  --luz: rgba(47, 168, 101, .14);
  --sombra: 0 10px 30px rgba(10, 60, 30, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-color: var(--linha-forte) var(--fundo); }
body { margin: 0; color: var(--texto); font: 400 16px/1.6 var(--corpo); -webkit-font-smoothing: antialiased; background: var(--fundo); }
/* A luz vem de cima, numa camada própria atrás de tudo. */
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(1100px 520px at 50% -120px, var(--luz), transparent 70%); }
::selection { background: var(--destaque); color: var(--tinta-botao); }
input { caret-color: var(--acento); }
button { font: inherit; color: inherit; }
img { display: block; }
img.falhou { visibility: hidden; }
a { color: var(--acento-vivo); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--acento-vivo); outline-offset: 3px; }
/* Link de pular, visível só com o foco do teclado. */
.pular { position: absolute; z-index: 40; left: 16px; top: -80px; padding: 10px 16px; border-radius: 8px; background: var(--painel); border: 1px solid var(--acento-vivo); color: var(--texto); font-weight: 700; text-decoration: none; }
.pular:focus { top: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* Barra e troca de guia */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fundo); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in oklab, var(--fundo) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); }
.bar-in { height: var(--barra); max-width: 1320px; margin: 0 auto; padding: 0 var(--borda); display: flex; align-items: center; gap: 16px; }
.guias { position: relative; min-width: 0; }
.trocar { display: flex; align-items: center; gap: 12px; min-height: 48px; max-width: 100%; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; }
.trocar:hover, .trocar[aria-expanded="true"] { border-color: var(--linha-forte); background: var(--painel); }
.trocar img { width: 38px; height: 38px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--acento); }
.trocar .txt { display: grid; min-width: 0; line-height: 1.15; }
.trocar b { font: 700 20px/1.1 var(--titulo); letter-spacing: .04em; color: var(--acento-vivo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trocar .txt span { font-size: 13px; color: var(--texto-baixo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trocar svg { flex: none; color: var(--acento); transition: transform .2s; }
.trocar[aria-expanded="true"] svg { transform: rotate(180deg); }
.menu { position: absolute; z-index: 15; top: calc(100% + 8px); left: 0; width: min(340px, calc(100vw - 32px)); padding: 8px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha-forte); box-shadow: var(--sombra); }
.menu-tit { margin: 4px 10px 6px; font: 600 12px var(--corpo); letter-spacing: .14em; text-transform: uppercase; color: var(--texto-baixo); }
.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.menu li button { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left; }
.menu li button:hover, .menu li button[aria-current="true"] { background: var(--painel-alto); }
.menu li img { width: 42px; height: 42px; flex: none; border-radius: 50%; }
.menu li b { display: block; font: 700 17px/1.2 var(--titulo); color: var(--texto); }
.menu li small { display: block; font-size: 13px; color: var(--texto-baixo); }
.menu li .atual { margin-left: auto; flex: none; font-size: 12px; font-weight: 700; color: var(--acento-vivo); }
.dica { margin: 6px 10px 4px; padding-top: 8px; border-top: 1px solid var(--linha); font-size: 13px; color: var(--texto-baixo); }
.acoes { margin-left: auto; display: flex; gap: 8px; }
.tema, .som { width: 44px; height: 44px; flex: none; display: grid; place-items: center; cursor: pointer; border-radius: 50%; border: 1px solid var(--linha-forte); background: transparent; color: var(--acento-vivo); }
.tema:hover, .som:hover { background: var(--painel-alto); }
.som .mudo { display: none; }
.som[aria-pressed="false"] .ligado { display: none; }
.som[aria-pressed="false"] .mudo { display: block; }
.tema .sol { display: none; }
:root[data-tema="claro"] .tema .sol { display: block; }
:root[data-tema="claro"] .tema .lua { display: none; }

/* Palco: a lista fixa à esquerda e o matchup inteiro à direita, sem precisar rolar. */
.palco {
  max-width: 1320px; margin: 0 auto; padding: 20px var(--borda) 64px;
  display: grid; gap: 24px; grid-template-columns: 440px minmax(0, 1fr); align-items: start;
}
.detalhe { min-width: 0; display: grid; gap: 16px; }
.duelo { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { position: relative; overflow: hidden; height: 240px; border-radius: 10px; background: var(--painel); border: 1px solid var(--linha-forte); box-shadow: var(--sombra); }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
#artEle, #artVoce { position: absolute; inset: 0; }
#trocarImg { display: contents; }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(8, 8, 6, .9) 0%, rgba(8, 8, 6, .5) 34%, transparent 62%); }
.card .selo { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 3px 10px; border-radius: 4px; font: 700 12px/1.4 var(--titulo); letter-spacing: .12em; text-transform: uppercase; background: var(--destaque-arte); color: #111; }
.card.inimigo .selo { left: auto; right: 12px; background: #f6f3ea; color: #111; }
.card .quem { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 16px 14px; color: #f6f3ea; }
.card.inimigo .quem { text-align: right; }
.quem .t { margin: 4px 0 0; font-size: 14px; line-height: 1.3; color: #e4ddcf; }
.quem .n { margin: 0; font: 800 clamp(24px, 2.3vw, 32px)/1.05 var(--titulo); letter-spacing: .02em; color: var(--sobre-arte); overflow-wrap: break-word; text-wrap: balance; }
.quem .n.longo { font-size: clamp(19px, 1.8vw, 25px); letter-spacing: 0; }
.quem .guia { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: #e4ddcf; }
.quem .guia.sim { color: var(--destaque-arte); }
.quem .guia > i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
.quem .guia.sim > i { background: currentColor; }
.quem .guia .pips i { background: rgba(255, 255, 255, .25); }
.quem .guia .pips i.on { background: var(--destaque-arte); }

/* Botão de travar: o VS entre as duas artes */
.travar {
  position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 66px; height: 66px; padding: 0; border: 3px solid var(--fundo); border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; font: 800 21px/1 var(--titulo); letter-spacing: .04em; color: #111;
  background: linear-gradient(180deg, var(--botao-1), var(--botao-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 6px 18px rgba(0, 0, 0, .45);
}
.travar:hover { filter: brightness(1.08); }
.travar:active { transform: translate(-50%, -50%) scale(.95); }

/* Lista de inimigos */
.anel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barra) + 16px); min-width: 0; padding: 18px 20px 22px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
.anel h2 { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 14px; font: 700 22px/1.2 var(--titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-vivo); text-align: center; }
.anel h2 svg { flex: none; color: var(--acento); }
.busca { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 8px; background: var(--fundo); border: 1px solid var(--linha-forte); color: var(--texto-baixo); }
.busca:focus-within { border-color: var(--acento-vivo); color: var(--acento-vivo); }
.busca input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--texto); font: 16px var(--corpo); }
.busca input::placeholder { color: var(--texto-baixo); }
.busca .conta { font: 700 13px var(--corpo); color: var(--acento); font-variant-numeric: tabular-nums; white-space: nowrap; }
.filtros { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 360px; margin: 12px auto 4px; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  background: transparent; border: 1px solid var(--linha-forte); color: var(--texto); font: 600 14px var(--corpo);
}
.chip img { width: 20px; height: 20px; border-radius: 4px; }
.chip:hover { border-color: var(--acento-vivo); }
.chip[aria-pressed="true"] { background: var(--destaque); border-color: var(--destaque); color: var(--tinta-botao); }
.roda { position: relative; width: min(100%, 400px); aspect-ratio: 1; margin: 12px auto 0; border-radius: 50%; }
/* Mira da Punição (R do Akshan), como no jogo: losango que trava no alvo, círculo por dentro e setas laterais apontando para o centro. */
.mira { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.mira .aro { fill: none; stroke: var(--acento); stroke-width: 1.5px; }
.mira .aro.fino { stroke-width: 1px; opacity: .45; }
.mira .setas { fill: var(--acento-vivo); }
.alvo { position: absolute; z-index: 1; left: 50%; top: 5%; height: 58%; aspect-ratio: 1; transform: translateX(-50%); overflow: visible; pointer-events: none; filter: drop-shadow(0 0 4px rgba(255, 214, 120, .75)) drop-shadow(0 1px 3px rgba(0, 0, 0, .6)); }
.alvo .losango { fill: none; stroke: #ffe39a; stroke-width: 3.5px; }
.alvo .aro-alvo { fill: none; stroke: #fff4d6; stroke-width: 1px; opacity: .6; }
.alvo .setas-alvo { fill: #fff4d6; opacity: .85; }
.alvo.travando { animation: trava-alvo .5s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes trava-alvo { from { opacity: 0; transform: translateX(-50%) scale(1.35); } }
:root:not([data-guia="akshan"]) .alvo, :root:not([data-guia="akshan"]) .seta-mira { display: none; }
/* As setas da mira do Akshan são anterior/próximo de verdade. */
.seta-mira { position: absolute; z-index: 2; top: 50%; width: 44px; height: 44px; margin-top: -22px; display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; color: var(--acento-vivo); }
.seta-mira.esq { left: -16px; }
.seta-mira.dir { right: -16px; }
.seta-mira:hover { color: var(--destaque); }
.seta-mira svg { width: 15px; height: 24px; }
.lista {
  position: absolute; inset: 12% 12% 7%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--acento) transparent;
  -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 9px; align-content: start; padding: 12px 12px 28px;
}
.pick { position: relative; aspect-ratio: 1; padding: 0; border: 1px solid var(--linha-forte); border-radius: 6px; cursor: pointer; background: var(--painel-alto); }
.pick img { width: 100%; height: 100%; border-radius: 5px; object-fit: cover; }
.pick:has(img.falhou)::after { content: attr(data-ini); position: absolute; inset: 0; display: grid; place-items: center; font: 700 20px var(--titulo); color: var(--texto-baixo); }
.pick .ponto { position: absolute; z-index: 1; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--destaque); box-shadow: 0 0 0 2px var(--painel); }
.pick .nivel { position: absolute; z-index: 1; right: 2px; bottom: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 4px; background: rgba(5, 8, 6, .82); color: #f2f6f3; font: 700 11px/17px var(--corpo); text-align: center; }
.pick:hover { border-color: var(--acento-vivo); }
.pick.so-nota { opacity: .5; }
.pick.so-nota:hover, .pick.so-nota:focus-visible { opacity: 1; }
:root[data-tema="claro"] .pick .ponto, :root[data-tema="claro"] .legenda .ponto-leg { background: var(--acento); }
.pick[aria-current="true"] { border: 2px solid var(--destaque); box-shadow: 0 0 0 2px var(--painel), 0 0 0 4px var(--acento); }
:root[data-guia="akshan"] .pick[aria-current="true"] { box-shadow: none; }
:root[data-guia="akshan"] .pick[aria-current="true"]::before { content: ""; position: absolute; z-index: 2; inset: -6px; border: 2px solid var(--destaque); transform: rotate(45deg) scale(.78); pointer-events: none; }
.pick:focus-visible { outline-offset: 2px; }
.legenda { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--texto-baixo); }
.legenda .ponto-leg { display: inline-block; width: 8px; height: 8px; margin-right: 5px; border-radius: 50%; background: var(--destaque); vertical-align: 1px; }
.legenda kbd { padding: 1px 6px; border-radius: 4px; border: 1px solid var(--linha-forte); font: 600 12px var(--corpo); color: var(--texto); }
@media (hover: none) { .legenda .atalhos { display: none; } }
.vazio { position: absolute; inset: 30% 18%; margin: 0; display: grid; place-content: center; gap: 8px; text-align: center; font-size: 15px; color: var(--texto-baixo); }
.vazio button { min-height: 44px; border: 0; background: none; cursor: pointer; color: var(--acento-vivo); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }

/* Setup */
.setup { scroll-margin-top: calc(var(--barra) + 16px); margin: 0; padding: 16px 20px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
.setup h2 { margin: 0 0 12px; font: 700 16px var(--titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-vivo); }
.carga { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px 24px; margin: 0; }
.slot { min-width: 0; }
.slot dt, .bloco h3 { margin: 0 0 10px; font: 600 12px var(--corpo); letter-spacing: .14em; text-transform: uppercase; color: var(--texto-baixo); }
.slot dd { margin: 0; display: grid; gap: 10px; }
.opt, .peca { display: inline-flex; align-items: center; gap: 10px; min-width: 0; font-weight: 700; font-size: 16px; line-height: 1.2; color: var(--texto); }
.opt { display: flex; }
.opt img, .peca img { width: 36px; height: 36px; flex: none; border-radius: 6px; border: 1px solid var(--linha-forte); background: var(--painel-alto); }
.peca img { width: 32px; height: 32px; }
.opt.runa img, .peca.runa img { border-radius: 50%; background: #15130f; }
.opt span, .peca span { min-width: 0; overflow-wrap: anywhere; }
.soquete { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--linha-forte); background: var(--painel-alto); }
.peca .soquete { width: 32px; height: 32px; }
.soquete::before { content: ""; width: 12px; height: 2px; border-radius: 1px; background: var(--acento); opacity: .7; }
.opt .rush { font: 700 11px/1 var(--titulo); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--destaque); color: var(--tinta-botao); }
.livre { display: flex; align-items: center; min-height: 36px; font-style: italic; color: var(--texto-baixo); }
/* Setup completo: runas, itens com condições e dificuldade */
.setup-completo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); grid-template-rows: auto 1fr; gap: 20px 32px; align-items: start; }
.setup-completo .build { grid-column: 2; grid-row: 1 / span 2; }
.bloco { min-width: 0; }
.linha-runa + .linha-runa { margin-top: 12px; }
.linha-runa .rot { display: block; margin-bottom: 6px; font-size: 13px; color: var(--texto-baixo); }
.pecas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pecas .seta { flex: none; color: var(--acento); }
.ou { font-size: 13px; font-style: italic; color: var(--texto-baixo); }
.ou-bloco { margin: 14px 0 10px; font-size: 13px; font-style: italic; color: var(--texto-baixo); }
.frag { margin: 0; font-size: 15px; font-weight: 600; }
.build .grupo + .grupo { margin-top: 18px; }
.build .cond { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--acento-vivo); }
.build details.grupo summary { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; list-style: none; font-weight: 700; font-size: 15px; color: var(--acento-vivo); }
.build details.grupo summary::-webkit-details-marker { display: none; }
.build details.grupo summary::before { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--acento); border-bottom: 2px solid var(--acento); transform: rotate(-45deg); }
.build details.grupo[open] summary::before { transform: rotate(45deg); }
.build details.grupo[open] summary { margin-bottom: 8px; }
.build ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.build .motivo { margin: 4px 0 0; font-size: 14px; color: var(--texto-baixo); }
.build .nota { font-size: 14px; font-style: italic; color: var(--texto-baixo); }
.build .sub { margin-top: 4px; font-size: 14px; font-weight: 700; }
.build .sep { height: 1px; background: var(--linha); }
.dif dl { margin: 0; display: grid; gap: 10px; }
.dif dl div { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dif dt { font-size: 14px; color: var(--texto-baixo); }
.dif dd { margin: 0; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.dif dd b { font-size: 15px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 2px; background: var(--painel-alto); box-shadow: inset 0 0 0 1px var(--linha-forte); }
.pips i.on { background: var(--destaque); box-shadow: none; }

/* Guia */
.notas, .rodape { min-width: 0; }
.navega { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
.navega h2 { margin: 0; font: 700 23px/1.2 var(--titulo); letter-spacing: .06em; color: var(--acento-vivo); }
.navega div { display: flex; gap: 8px; }
.navega button { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 8px; border: 1px solid var(--linha-forte); background: var(--painel); color: var(--texto); font-weight: 600; font-size: 15px; }
.navega button:hover { border-color: var(--acento-vivo); }
.navega img { width: 24px; height: 24px; border-radius: 4px; }
.lembretes { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: n; }
.lembretes li { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: start; padding: 12px 16px; border-radius: 10px; background: var(--painel); border: 1px solid var(--linha); font-size: 17px; line-height: 1.6; counter-increment: n; }
.lembretes li::before { content: counter(n); width: 30px; height: 30px; margin-top: 1px; display: grid; place-items: center; border-radius: 50%; background: var(--destaque); color: var(--tinta-botao); font: 800 15px/1 var(--titulo); }
.kw { font-weight: 700; color: var(--texto); text-decoration: underline; text-decoration-color: var(--destaque); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.resumo { margin-bottom: 32px; padding: 16px 20px; border-radius: 10px; background: var(--painel); border: 1px solid var(--linha); }
.resumo h3 { margin: 0 0 8px; font: 700 13px var(--corpo); letter-spacing: .14em; text-transform: uppercase; color: var(--texto-baixo); }
.secao + .secao { margin-top: 34px; }
.secao h3 { margin: 0 0 12px; font: 700 21px/1.25 var(--titulo); letter-spacing: .04em; color: var(--acento-vivo); }
.secao p { margin: 0 0 14px; font-size: 17px; line-height: 1.7; }
.secoes ul { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 10px; }
.secoes li { position: relative; padding-left: 22px; font-size: 17px; line-height: 1.7; }
.secoes li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 7px; height: 7px; transform: rotate(45deg); background: var(--destaque); }
.cds { width: 100%; max-width: 560px; border-collapse: collapse; font-size: 15px; }
.cds th, .cds td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
.cds th { font-weight: 700; color: var(--texto); white-space: nowrap; }
.cds td { color: var(--texto-baixo); font-variant-numeric: tabular-nums; }
.rodape { display: block; margin-top: 16px; font-size: 14px; color: var(--texto-baixo); }
.rodape p { margin: 0; }
.rodape a { display: inline-block; padding: 10px 0; margin: -10px 0; }
.estado-planilha:not(:empty) { margin-top: 6px; font-size: 13px; }

/* Pick travado: as duas artes frente a frente, como a tela de carregamento */
.trava { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; gap: 4vw; padding: 6vh 6vw; background: rgba(6, 6, 4, .9); cursor: pointer; }
.trava::before { content: ""; position: absolute; left: 50%; top: 50%; width: 60vmin; height: 60vmin; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, var(--brilho), var(--brilho-2) 40%, transparent 70%); pointer-events: none; }
.trava figure { position: relative; margin: 0; width: min(100%, 34vh); aspect-ratio: 308 / 560; border-radius: 10px; overflow: hidden; border: 2px solid var(--botao-2); box-shadow: 0 18px 50px rgba(0, 0, 0, .6); }
.trava img { width: 100%; height: 100%; object-fit: cover; }
.trava figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 10px 12px; text-align: center; font: 800 clamp(18px, 3vh, 28px)/1.1 var(--titulo); color: var(--sobre-arte); background: linear-gradient(transparent, rgba(8, 8, 6, .9)); }
.trava .vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 clamp(28px, 6vh, 56px)/1 var(--titulo); color: #fff8e8; letter-spacing: .08em; }
.trava.on .eu { animation: entra-e .7s cubic-bezier(.16, 1, .3, 1) both; }
.trava.on .ele { animation: entra-d .7s cubic-bezier(.16, 1, .3, 1) both; }
.trava.on .vs, .trava.on::before { animation: brilha .9s .25s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes entra-e { from { transform: translateX(-30vw); opacity: 0; } }
@keyframes entra-d { from { transform: translateX(30vw); opacity: 0; } }
@keyframes brilha { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }

@media (max-width: 1100px) {
  .palco { grid-template-columns: 340px minmax(0, 1fr); }
  .anel { padding: 16px 14px 18px; }
  .anel h2 { font-size: 17px; letter-spacing: .1em; gap: 10px; }
  .carga { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .setup-completo { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .setup-completo .build { grid-column: auto; grid-row: auto; }
}
@media (max-width: 900px) {
  :root { --barra: 60px; }
  .palco { padding: 12px var(--borda) 48px; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .anel { position: static; padding: 12px 12px 4px; }
  .anel h2 { font-size: 16px; margin-bottom: 10px; }
  .filtros { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; max-width: none; margin: 8px -12px 0; padding: 4px 12px; }
  .filtros::-webkit-scrollbar, .lista::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  /* No celular a lista vira uma faixa de rostos que rola para o lado. */
  .roda { width: auto; aspect-ratio: auto; margin: 4px -12px 0; border-radius: 0; }
  .mira { display: none; }
  .lista { position: static; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-snap-type: x proximity; padding: 12px 12px 14px; -webkit-mask-image: none; mask-image: none; }
  .pick { flex: none; width: 56px; scroll-snap-align: start; }
  .vazio { position: static; inset: auto; padding: 8px 0 14px; }
  .card { height: 168px; }
  .seta-mira { display: none; }
  .quem .guia { white-space: nowrap; font-size: 12.5px; }
  .quem .guia .pips i { width: 8px; height: 8px; }
  .setup-completo .dif { order: -1; }
  .alvo { top: 13%; height: 32%; }
  .quem .n { font-size: 20px; }
  .quem .n.longo { font-size: 16px; }
  .travar { width: 54px; height: 54px; font-size: 17px; }
  .quem .t { font-size: 13px; }
  .card .quem { padding: 0 10px 12px; }
  /* No celular cada item do setup vira uma linha: rótulo à esquerda, ícones à direita. */
  .carga { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .slot { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--linha); }
  .slot:first-child { border-top: 0; padding-top: 0; }
  .slot dt { margin: 0; }
  .slot dd { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .opt { font-size: 15px; }
  .opt img, .opt .soquete { width: 32px; height: 32px; }
  .setup { padding: 16px; }
  .setup-completo { grid-template-columns: minmax(0, 1fr); }
  .navega h2 { font-size: 20px; }
  .lembretes li { font-size: 16px; grid-template-columns: 38px minmax(0, 1fr); padding: 12px 14px; }
  .secao p, .secoes li { font-size: 16.5px; }
}
@media (max-width: 520px) {
  .trocar b { font-size: 18px; }
  .navega .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .trava.on .eu, .trava.on .ele, .trava.on .vs, .trava.on::before { animation: none; }
  .trocar svg { transition: none; }
}
</style>
</head>
<body>
<a class="pular" href="#matchup">Pular para o matchup</a>
<header class="bar">
  <div class="bar-in">
    <div class="guias">
      <button class="trocar" type="button" id="trocar" aria-expanded="false" aria-controls="menuGuias">
        <span id="trocarImg"></span>

flegends.com/cdn/16.20.1/img/spell/SummonerExhaust.png","Mercs":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3111.png","Tabis":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3047.png","Rapidez":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3009.png","Craquen":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6672.png","Vamps":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3008.png","Crit":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6676.png","Letalidade":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3179.png","Scaling":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/7202_Sorcery.png","Terminus":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3302.png"},"matchups":[["Ahri","PTA","Impacto repentino","Ignite","Mercs / Vamps","Crit","short trade -> não deixa ela procar trovão, desviando de uma skill a troca é sua\nela sempre tem ult mid game então gank e só com stun aliado ou se ela der over\nvc da stat check depois se ela não estiver mt forte, é free kill sem o charme",1],["Akali","PTA / Electro","Scaling","Ignite","Mercs","Crit","early lane é obrigatório vc dar poke até não querer mais, se estiver sem dshield vc tem que solar\nlvl 4 ela tenta revidar,  leva ela passear no E com o arpel\nusa ult pra revelar na fumaça quando ela tentar matar seu adc, de pistola ela te da 100 0",1],["Anivia","PTA","Inspiração","TP","Mercs / Rapidez","Tanto faz","troca dela é forte mas vc pega press early, solável se ela ficar confiante e vc desviar do Q\ngank ou roaming, tomou o Q e o R = deu ruim, ela te da stat check com item\nlvl 6 press dela, não insista muito nas lutas 3v3 que ela é muito forte e da peel pro time",1],["Annie","PTA","Osso revestido","TP","MERCS RUSH !!!","Tanto faz","early solável, depois não. ela te da outrange sempre, mas se gastar stun na wave pode lutar\npress e skirmish sua sempre, roam também, mas o roam dela resulta em kill se encaixar\nela só tem ameaça com o F e R, ela vai tentar te dar ik ou setar gank com eles up certeza",1],["Aurelion Sol","PTA / Electro","Impacto repentino","Ignite","Tanto faz","Craquen / Crit","lvl 1 seu, basta não deixar o Q explodir, tem que solar no mínimo umas duas vezes, rola dive\nda pra fazer short trade pra amaciar depois jogar o E quando ele parar pra bater na wave\njoga o E na frente dele e segue o W atirando nele xD press seu e skirmish tbm, segue o roam dele",1],["Aurora","Electro","Precisão","Ignite","Mercs","Crit","early lane é seu mas os cd do Q dela é baixo, desviou de algo = arpel pra cima e tenta matar\nseu R revela o W dela mas o R dela desvia dos tiros, tomou E + Q com ela de ult up só da recall\ndesvia sempre pra trás, pros lados n rola muito, late é quem ver o outro primeiro mata",1],["Azir","PTA","Impacto repentino","TP","Mercs / Rapidez","Tanto faz","early solável e da pra ignorar os soldados pra bater nele se não for mais de um\n com item ele tem mais DPS e range, além da ult ser apelona pra setar gank ou mesmo pra te solar\npress even e skirmish / roam muito seu, sidelande dele mas da pra matar",1],["Brand","PTA","Inspiração","Ignite","Mercs","Tanto faz","bem fodase fora de tf, da pra focar ele em skirmish também, auto defesa PÍFIA desse boneco\nele pode ultar do nada, não vai dar 100 0, faz vamps e fica full hp ou da recall e volta de tp\n não tem pq dar ego, normalmente vc vai estar na vantagem ja que ele não presta em x1",1],["Cassiopeia","PTA","Inspiração","Ignite","Mercs / Rapidez","Crit","use o arpel pra fugir caso ela te acerte o Q, você tem mais waveclear gank normalmente é kill\nela extende muito fácil. side dela\nmiasma não deixa lançar o arpel, mas não te para se ja estiver no ar**. durante o arpel ult dela = stun",1],["Diana","PTA","Osso revestido","Ignite","Mercs / Vamps","Craquen","poke dela é forte e all in também, se ela errar o Q pode lutar sem muito medo, desvia pra trás\njoga respeitando, se ficar low da recall é melhor que morrer, é solável mas ela tem que jogar mal\nguarde o flash para não tomar a ult, skirmish even, roam seu, press dela",1],["Ekko","PTA","Osso revestido","Ignite","Mercs","Tanto faz","lvl 1 seu, short trade dele mas estendendo vc ganha, skirmish é even, vc tem que adivinhar o W\npress é sua sempre, lategame compra corta cura e foca ele nas lutas\nward azul pra ultar normalmente mata quando ele rebobina pra fog dps de pickar alguém",1],["Fizz","PTA","Osso revestido","Ignite","Mercs","Crit","lvl 1 seu, ele tem muito dano, o E dele volta antes do seu, mas se desviar pode estender a troca\nbem volátil, mas o press é seu sempre e skirmish também, lvl 6 é bom guardar o flash pro tubarão\nside lane é seu desde que ele não esteja feedado, e se estiver é só respeitar o range",1],["Galio","PTA","Scaling","Ignite","Mercs / Rapidez","Crit","bata nele, mas fique fora do range e longe da wave pra não tomar full combo ou muito poke\npress sua, pingue quando ele for pra fog, pode seguir o roam mas sem dar facecheck\nlutas normalmente são em grupo, ele acertando o E mata alguém quase sempre, mas a lane é sua",1],["Hwei","PTA / Electro","Impacto repentino","Ignite","Mercs / Vamps","Crit","fácil early, mindgame arpel no fear dele é free kill, ele da bastante dano\ndesvia na diagonal pra trás quando ele jogar o tapete, dai vc não toma a garra, fica atrás da wave\nse ele for ruim joga pra matar na lane, se n skirmish é facil, press é disputado depois do primeiro b",1],["Irelia","PTA","Osso revestido","Ignite","TABI RUSH !!!!","Craquen / Crit","lvl 1 você tem pressão, dê bastante dano pra facilitar sua vida, nunca lute contra ela stackada\njoga o Q nos minions que ela quer dar dash pra negar/dar dano, foque sempre em desviar do E dela\n sidelane contra não da bom, costumam farmar bem então não tome outscale",1],["Jayce","PTA","Impacto repentino","Ignite","Tabis / Vamps","Tanto faz","lvl 1 é free kill com um arpel bom, press seu early, lvl 6 geralmente tem ângulo pra solar\nse a lane estiver difícil, luta é even mas roam vc tem vantagem, vc limpa wave mais rápido\nnunca tome o full combo canhão e martelo, bumerangue quando ele pular = shield no empurrão",1],["Kassadin","PTA","Impacto repentino","Ignite","Tanto faz","Tanto faz","obrigatório matar ele 2 ou 3 vezes, da pra divar FÁCIL, press infinita sua e skirmish também\nnão troque kill, o objetivo é deixar ele fraco o máximo de tempo possível\nlvl 11 com 2 ou 3 itens ele já fica forte, da trabalho em tf, side você ainda mata pq ta mais forte",1],["Katarina","PTA","Impacto repentino","Exhaust","Tanto faz","Craquen","exauste a ult dela,early lane vc respeita as adagas e da bastante poke, \nnão fique perto dos minions que ela vai farmar com o Q,\n kat AP tem letal maior com alternador hextech, kat de Conquistador é mais forte cedo",0],["Kayle","PTA","Impacto repentino","Ignite","Tanto faz","Tanto faz","ela acha que te vence lvl 1 mas se vc tive o mínimo de spacing e usar um bom arpel vc sola\né free lane, tenta forçar a ult e depois divar, é bom dar harass pra não deixar ela free farm, mas side\nvc baita a ult dela e vai embora com o arpel e depois ulta, etc. vc não perde se ela não tiver feedada",1],["Kog'Maw","PTA","Impacto repentino","Exhaust","Tanto faz","Tanto faz","lvl 1 dele com o W muito forte, full build ele da muito dano.\nele é muito papel, então o letal é alto, short trade muito boa\nnao fique na wave pra não tomar o E junto dos minions, cuidado com o spacing na lentidão do E dele",0],["LeBlanc","PTA","Impacto repentino","Ignite","Mercs","Craquen","lane volátil, passiva e PTA diferenciam real de clone, alinha o bumerangue com ela e a marca do W\nsua ult revela a invisibilidade mas o clone pode tankar, ela te da 100 0 com qualquer vantagem\nskirmish é seu e roaming é even, vc normalmente vai ter press se ela não ultar a wave",0],["Lissandra","PTA","Scaling","TP","Mercs","Tanto faz","lvl 1 seu, poke lane, ela seta gank muito bem depois do 6, com item ela ganha\nshort trade dela long sua, não fique na wave, press even, skirmish sua\nnormalmente ela joga pra skirmish e pra gank, difícil sair kill então foque em farmar e ficar full hp",0],["Locke","PTA","Osso revestido","Exhaust","Mercs","Craquen / Crit","E somente pra trás, não ande pra frente se ele acertou um prego\nflashe a ult dele, exausth o aa dos prego\nmove speed e corta cura na build",0],["Lux","PTA / Electro","Tanto faz","Ignite","Mercs / Vamps","Tanto faz","lvl 1 seu, poke lane, ela ulta em qualquer oportunidade, mr cedo é bom\njogue com a passiva up, ela sempre revida o dano\nE pra frente sem setup não vale o risco. gank normalmente é kill pra ambos os lados",1],["Malzahar","PTA / Electro","Scaling","TP","Mercs / Vamps","Tanto faz","lane afk, da pra matar pq ele não tem como se defender, farme as baratinhas, press é sua\nfique longe da wave pra não pegar aids, desviando do Q é free kill, lvl 6 sempre tem gank, não morra\nem tf quem ele ultar morre, jogue pro revive, não seja o alvo da ult, side é sua se for 1v1",0],["Malphite","PTA","Scaling","Ignite","Mercs / Vamps","Terminus / Crit","lvl 1 2 3 free lane, SEMPRE devolva QAA no pneu se não você perde mais vida que ele\nguarde o E pro slow seja pra fugir ou dar chase, dê dano constante pra manter o shield dele desativado\nnão entre no range do Q dele se não for pra devolver dano com a passiva up",0],["Mel","PTA","Tanto faz","","Mercs / Vamps","Tanto faz","lvl 1 seu, resto da lane dela, muito poke e não rola all in direito, só com gank\nela tem press mas você ganha skirmish, bota e mr cedo são bons, jogar side dps é tranquilo\njogar pra roaming, não importa muito ficar um pouco atrás dela",0],["Naafiri","PTA","Tanto faz","Ignite","Tabis","Craquen / Crit","early bem jogado é seu, farma os cachorros, fica fora da wave, press é igual, skirmish é igual\nleva o cachorro passear quando ela te ultar, não vai cancelar o arpel, E pra spacing nas trocas\nbumerangue nos cachorros pra esticar o range, tomou os 2 Q = perdeu a troca",0],["Orianna","PTA","Impacto repentino","TP","Mercs","Tanto faz","poke lane difícil mas solável, ela errando o Q ou usando W na wave pode lutar\npress even, skirmish / roam seu, pode guardar o flash pra ult dela que você quase sempre vence\nroam normalmente é seu, ela não te da 100 0 sem item, então da pra baitar roam e virar nela",0],["Pantheon","PTA","Osso revestido","TP","TABI RUSH !!!!","Craquen / Crit","lvl 1 é seu com spacing, pinga ult dele lvl 6, trocas são dele, range do W = do seu aa\nbumerangue no pulo dele pra ganhar o shield rápido, gank é kill pra ambos os lados\npega press sem se expor, skirmish dele é forte, segue os roam pra sobrar algo ou pega barricada",0],["Qiyana","PTA","Osso revestido","Ignite","Tabis","Crit","abusa lvl 1 que a lane é fácil, sai até kill, não perca o osso à toa, skirmish é even roaming é seu\ndepois de item ela te mata no full combo, vale investir em couraça de pano cedo\npress é seu pq se ela dar combo na wave vc mata, ult revela o Q no mato",0],["Ryze","PTA","Scaling","TP","Mercs","Tanto faz","early é não tomar muito combo ou poke, ele não tem ameaça de kill mas disputa press\ncom item ele dá stat check, luta é sua, pode dar roaming ou farmar afk, normalmente gank é kill\nsó não tomar outscale, fica longe da wave",0],["Swain","PTA","Inspiração","Ignite","Mercs / Rapidez","Crit","lvl 1 seu, early meio afk, desvie do E e desengage quando ele ultar, não deixe ele stackar muito\nskirmish seu, press também, gank normalmente é kill,",0],["Sylas","PTA","Osso revestido","Ignite","Mercs","Craquen","cedo é seu desviando deireito, se ele der o E pra frente se esconde na wave e troca AA\npress é seu, se ele gastar mt skill em minion pode comprar a luta, tenta não perder osso à toa\nquem estiver forte da stat check, roam e tf é seu, usou seu R em vc = zoa no /all depois de matar",0],["Syndra","PTA / Electro","Impacto repentino","TP","Mercs","Tanto faz","lvl 1 full seu, dê dano pra facilitar o early, fique fora da wave, despediçou o E = arpel pra cima\nem gank e lutas fique do lado oposto do seu jg pra não tomar o E os dois, press even\ncom item normalmente quem ela stunar morre, é bom jogar pra reviver pq sempre alguem toma",0],["Taliyah","PTA","Impacto repentino","Ignite","Mercs","Craquen / Crit","solável cedo, ela não tem ameaça de verdade se ficar atrás da wave / fora do range mas tem dano\nmindgame cancelando o arpel cedo pra baitar o tapete normalmente resulta em troca ganha\ncom vantagem é free lane, roam é seu, luta é even, mata ela se usar o tapete errado",0],["Talon","Electro","Precisão","Ignite","Tabis / Vamps","Letalidade / Crit","volátil, sem osso pq ele tira com o W muito fácil, não tome W à toa, lvl 1 seu se não tomar aa, fique longe da wave\nse ele vier dar o W pra pokear revide com Q + auto e saia, pingue sempre que ele sumir\nult sua revela a ult dele, seguir roam = kill normalmente",0],["Twisted Fate","PTA / Electro","Impacto repentino","Ignite","Mercs, 100%","Tanto faz","muito solável, desvie dos Q, fique longe dos minions, carta na wave = oportunidade\nele seta gank bem, lembre de pingar sempre que ele avançar a wave e tiver ult\nnão fique no mapa low hp pq ele pode ultar, costumam farmar bem então não tome outscale",0],["Veigar","PTA","Scaling","TP","Mercs / Vamps","Tanto faz","difícil sair kill se os dois jogarem direito, não tome Q de graça, stun vc só toma se for noob \nele seta gank direito bem se vc ficar no range, skirmish sempre seu e roam também\nult dele machuca mas pra finalizar, dentro da gaiola foque em desviar do meteoro pq dói",0],["Vel'Koz","PTA","Inspiração","Ignite","Mercs / Vamps","Tanto faz","poke lane, solável, ele tem bastante dano mas fora isso é de boa, se ele gastar o E vai pra cima\nskirmish seu, press seu, mas ele limpa wave rápido, da pra fazer mindgame no E e troca boa\nlane bem chata só de farmar e acompanhar mapa, gank é free kill, n importa muito ele farmar mais",0],["Vex","PTA / Electro","Osso revestido","TP","MERCS RUSH !!!","Tanto faz","annie de skill shot, o W dela é forte então não vá melee, pingue o mia sempre\ncooldowndo do Q dela abaixa bastante depois, mas o resto das skills é mais que seu Q\nela tende a dar ik lategame, então jogue pro revive",0],["Viktor","PTA","Scaling","TP","Mercs","Tanto faz","só troque com shield up, fique fora do range do Q, vc até empata mas é fácil de perder troca\nlate game é bem solável, por isso é bom jogar mais safe, gank normalmente é free kill sua\nskirmish e roam é seu mas press normalmente é dele",0],["Vladimir","PTA","Tanto faz","Ignite","Mercs / Rapidez","Craquen / Crit","early full seu, espere ele chupar a wave antes de lutar, depois sem all win pq ele da stat check\npoça demora mais pra voltar que o arpel, e ele usa tarde, força o W e da o arpel de novo que sai kill\npress seu, skirmish sua, roam seu, só é problema com item",0],["Xerath","PTA","Impacto repentino","Ignite","Tanto faz","Crit","poke lane, se chegar perto / ele errar stun = GG, bota cedo e desvia bastante, fica longe da wave\nele tem waveclear, skirmish é sua, normalmente foca o jungler e usa o reset nele\nele sempre tenta descer pra ultar quando vc da roaming, da pra baitar e virar nele",0],["Yasuo","PTA","Osso revestido","Ignite","Tabi","Crit","early volátil, fique longe de wave pq ele surfa\nele te da stat check sempre, fica atento em gank do seu time a parede faz virar 1v1 entre ele e seu jg\nsidelane ele tem vantagem, yasuo não da roam então não perca waves / barricada",0],["Yone","PTA","Tanto faz","Ignite","Tanto faz","Craquen / Crit","harass sempre, ele tem dano mas você tem bem mais, joga pra matar e com press\nlate game ele dá muito dano, jogando direito vc não toma o Q e o R dele sem setup\ncostumam farmar bem então não tome outscale",1],["Zed","PTA / Electro","Impacto repentino","Ignite","Tabis / Vamps","Letalidade / Crit","early lane fácil, rola até dive, tem vantagem antes dos itens, não tome muito poke, press seu\n usando arpel na direção que ele estava quando ultou você deixa ele pra trás, aí é só vc ultar\n late game é solável even se você desviar, mas se estiver feedado ele não tem que acertar nada",1],["Zoe","PTA","Inspiração","Ignite","Mercs","Tanto faz","volátil, respeite a bolha, tomou perdeu a troca, fique atrás da wave sem tomar o dano em área do Q\ncuidado com o Q da fog, gank normalmente é kill, press roam e skirmish seus\ncleanse é pra tirar o soninho mas é meio cheese, só vale se tiver outro stun importante",0]]},{"id":"mordekaiser","campeao":{"id":"Mordekaiser","nome":"Mordekaiser","titulo":"o Revenã de Ferro"},"rota":"","autor":"Meowdekaiser","formato":"completo","fonte":"Notas da planilha de matchups do Meowdekaiser (em inglês, como no original).","links":[{"rotulo":"Ver a planilha original","url":"https://docs.google.com/spreadsheets/d/1BVH44IPxZNBQshDf90XZRJbfKvavVCUIIo_boyBVF8o/edit?gid=1560260169"},{"rotulo":"Twitch","url":"https://www.twitch.tv/meowdekaiser_"},{"rotulo":"X","url":"https://x.com/Meowdekaiser"}],"matchups":[{"nome":"Aatrox","planilha":"Aatrox","id":"Aatrox","titulo":"a Espada Darkin","dificuldade":{"early":3,"mid":2,"late":3,"overall":3},"tldr":["Don't die level 1","Rush Bramble","Look at his build"],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"If Aatrox rushes Hex Drinker / Maw of Malmortius:","linhas":[{"tipo":"item","texto":"Bramble Vest Rush -> Boots","passos":[[{"nome":"Bramble Vest Rush","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"}],[{"nome":"Boots","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1001.png"}]]},{"tipo":"sep"},{"tipo":"rotulo","texto":"If he rushes Hex Drinker / Maw Of Malmortius, then go:"},{"tipo":"item","texto":"Cosmic Drive","passos":[[{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( To keep up with him and play for a longer fight )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To Reduce His Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( For Ramping Damage )"},{"tipo":"item","texto":"Bloodletter's Curse / Liandry's / Flex Items","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"},{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Flex Items","icone":null}]],"motivo":"( Bloodletter's if there's more Magic resistance on the enemy team, and Liandry's if not. If your biggest issues aren't tanky, flex your items from here )"}]},{"rotulo":"If he doesn't rush Hex Drinker / Maw of Malmortius:","linhas":[{"tipo":"item","texto":"Bramble Vest Rush -> Boots","passos":[[{"nome":"Bramble Vest Rush","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"}],[{"nome":"Boots","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1001.png"}]]},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Big Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To Reduce His Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( More Damage^ )"},{"tipo":"item","texto":"Bloodletter's Curse / Liandry's / Flex Items","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"},{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Flex Items","icone":null}]],"motivo":"( Bloodletter's if there's more Magic resistance on the enemy team, and Liandry's if not. If your biggest issues aren't tanky, flex your items from here )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive","22-10 (Based on level)"],["Q","14 / 12 / 10 / 8 / 6"],["W (chains)","20 / 18 / 16 / 14 / 12"],["E (dash)","9 / 8 / 7 / 6 / 5 ( Only look to E when his E is down )"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1 it's actually possible to get priority as long as you space out Aatrox's abilities correctly. This should be relatively easy because he doesn't have his dash yet."]},{"tipo":"p","texto":"Do note that it is still possible to lose the all-in level one. Commit to a short trade, space out his Q's, but don't commit long enough for his cooldowns to come back up."},{"tipo":"lista","itens":["Level 2 is your strongest point in this matchup since your shield bash should enable you to win an all-in."]},{"tipo":"p","texto":"If you can find the opportunity to, fight him now."},{"tipo":"lista","itens":["Level 3 and onwards, is all about spacing and baiting out his E dash, and then consequently punishing him with your own E into all-inning him until he is too far away to trade with effectively.","Level 6 is when this matchup gets a lot easier because now, you can force to him to stay a certain amount of distance within you for as long as you get your E off."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["With Aatrox, your main goal is to try and punish his E cooldown by spacing back and forth out of his individual Q ranges.","If he does E, all-in him until he's too far away to trade with effectively."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Look at his itemization because if he itemizes into Hex Drinker / Maw Of Malmortius, you should go Cosmic Drive rush to space out his Q's better and simultaneously time out his Hex Drinker / Maw Of Malmortius shield."]},{"tipo":"p","texto":"This is pretty easy to do as your rush is Bramble Vest into Boots anyways, so you purposely delay your build path for the sake of acquiring knowledge."},{"tipo":"p","texto":"If he doesn't go Maw Of Malmortius, and instead goes basically any other setup, then your main goal is to now focus soley on bursting him down as opposed to playing towards a longer fight."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ulting Aatrox's W while it's attached to you will cancel it out since the projectile no longer has anything to latch onto."]},{"tipo":"p","texto":"Like- I know that it's considered to be a \"useless ability,\" but it feels nice to cancel something that impairs you anyways, no?"},{"tipo":"lista","itens":["In the mid-game, swap out bramble vest for oblivion orb if they have multiple sources of healing."]}]}]},{"nome":"Ahri","planilha":"Ahri","id":"Ahri","titulo":"a Raposa de Nove Caudas","dificuldade":{"early":3,"mid":3,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs. Ahri","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her charm duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q","7"],["W (MS boost)","9 / 8 / 7 / 6 / 5"],["E (Charm)","12"],["Ult","140 / 120 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up early priority, you're outranged and walking up for CS while her Q is up is just asking for poke.","At level 2 and onwards, try to bait out her charm by spacing back and forth behind minions and: if you can, try fishing for any potential E opportunities once said charm is down."]},{"tipo":"p","texto":"Otherwise: Just wait for level 6 to all-in her."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Ahri roots herself for a second when she uses her charm, so: if you've baited it out properly, you can potentially look for an E -> Q angle."]},{"tipo":"p","texto":"But... most of the time it's just going to be a matter of running her down with Stormraider's Surge once you've gotten both your ultimate and some sort of way of closing the distance (Rocketbelt, Flash, etc.)"}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Try to avoid getting hit by Ahri's Q orb return unless you want a fistful of true damage splattered all over your face."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["As previously mentioned: her E cannot go through minions, so try and go in and out of cover from minions to try and bait it out for a potential all-in opportunity."]},{"tipo":"p","texto":"She should be relatively weak in the all-in."},{"tipo":"lista","itens":["When Ahri ults, she has a slight lockdown period between her casts, if you're quick enough: you can land a skillshot where she's going to be as she's dashing."]},{"tipo":"p","texto":"If you're not confident in landing said skillshot, just auto attack her because an auto attack will always out-damage a missed skillshot, and you can always fire the skillshot at a more guaranteed opportunity later if you need to."}]}]},{"nome":"Akali","planilha":"Akali","id":"Akali","titulo":"a Assassina Renegada","dificuldade":{"early":2,"mid":3,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Deathfire Touch","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/DeathfireTouch/DEATHFIRE_TOUCH_KEYSTONE.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Scorch","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Scorch/Scorch.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs. Akali","linhas":[{"tipo":"item","texto":"Cosmic Drive","passos":[[{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( So you can maintain distance after she dashes )"},{"tipo":"item","texto":"Gluttonous Greaves","passos":[[{"nome":"Gluttonous Greaves","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223008.png"}]],"motivo":"( Mercury Treads isn't that useful here anyways )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Kunai's)","1.5"],["W (Shroud)","20 / 19 / 18 / 17 / 16"],["E (Shuriken Flip )","16 / 14.5 / 13 / 11.5 / 10"],["Ult","120 / 90 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["In the early game, only walk up to CS when her Q is down, otherwise: stand outside of her Q range and poke her down.","Give up early priority, and play for a wave rebound with an HP advantage + minions, assuming you spaced correctly."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["If her shroud ever goes on cooldown, walk up and try commiting towards a longer trade, if she decides to fight you for some reason, then: exhaust her and run her down."]},{"tipo":"p","texto":"All of her damage comes from short burst trades rather than sustained battles, so you should be able to win assuming you're at a high amount of HP to survive said initial burst."},{"tipo":"lista","itens":["Your Q actually slightly outranges her Q, the problem is that it has a significantly longer channel animation and you root yourself during said animation."]},{"tipo":"p","texto":"Now: usually, with a regular setup like Conqueror, this matchup would be extremely painful due to how much more consistent her poke is, but with Deathfire Touch, you have more leeway to miss more Q's and still win assuming you space outside of her Q range semi-competently."},{"tipo":"lista","itens":["When she goes for a Q -> passive procc, go for a W -> shield bash procc assuming your secondary meter is high."]},{"tipo":"p","texto":"(It's not exactly rocket science: In my opinion, this matchup is purely stat-based; whoever has the better setup will win.)"}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If Akali recasts her E from afar, Q towards her, however: If Akali recasts her E close to you, there is a chance that she will try to go for an E -> R cast to move behind you instead of in front of you."]},{"tipo":"p","texto":"Now: this is a complete gamble and completely on  the Akali if she decides to commit to an E -> R, but if you can predict it by Q'ing behind you, you'll be able to negate her outplay potential."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can ult her when she pops out of invisibility from her shroud in order to remove said shroud."]}]}]},{"nome":"Akshan","planilha":"Akshan","id":"Akshan ista","itens":["Give up priority early, and when you reach level 2, try to go for an extended trade whenever she can't explicitly stun you with her passive."]},{"tipo":"p","texto":"That's it; that's all you do. It's really that easy, and it gets even easier once you get Mercury Treads where you can start even more tenacity on top of your initial tenacity / slow resist that you've gotten from your runes."},{"tipo":"p","texto":"Just be aware of the enemy jungler because that's the only real way she can get a form of threat onto you."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to look to trade onto Annie when she has 0 stacks of her passive because then: she has no ability to setup a stun onto you, even if she rolls her face on her keyboard.","Look to time your E with her W cast as she self-roots herself while casting said ability."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Be hyper aware of any potential gank that she can setup via her passive (You're only safe when it's at 0 stacks since she can just spam the rest of her abilities to get the stun otherwise)."]},{"tipo":"p","texto":"If you don't know where the enemy jungler is, be very cautious about trading into Annie."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you see the Annie exhaust her W and her ult, you can try to deny her follow-up Q stun with your own ult by deleting her projectile mid-air."]},{"tipo":"p","texto":"This requires really good timing though."}]}]},{"nome":"Aurelion Sol","planilha":"Aurelion Sol","id":"AurelionSol","titulo":"o Forjador de Estrelas","dificuldade":{"early":3,"mid":2,"late":3,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png" nning away, If she Q's forward, Q her on the head, If she W's, buffer your Q into it, If she E's, use your E."},{"tipo":"p","texto":"If you can, try to extend the trade until your W shield gets low, otherwise: just take the health advantage."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Because Bel'veth has 5 different ways to dodge your Q and an additional way to reduce your Q's damage, it is imperative that you wait until you can guarantee your skillshots to fire said skillshots."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Play excessively patiently and wait for her to make the first move, if you play proactively, you will lose if the Bel'veth is competent."]}]}]},{"nome":"Brand","planilha":"Brand","id":"Brand","titulo":"a Vingança Flamejante","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone"
