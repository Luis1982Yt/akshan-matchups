ds.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( So you can keep up with him while also still having resolve tree for second wind sustain )"},{"tipo":"item","texto":"Mecury's Treads","passos":[[{"nome":"Mecury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce his stun duration )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( So you can deal damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Heal)","12 / 10 / 8 / 6 (Based on level)"],["Q (Poke tool)","10 / 9 / 8 / 7 / 6"],["W (Empowered AA)","5"],["E (Dash)","14 / 13.5 / 13 / 12.5 / 12"],["Ult","100 / 85 / 70"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Sleeper lane; you can't really do anything too aggressive, but it's not like he's going to kill you either unless you overextend into his turret like an idiot, (don't be an idiot).","Like- the most you're going to get is a CS or plate lead if you both play it well."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Just try to chip him down with max ranged Q's and if he ever tries to combo you with his E, try to buffer it and look for a long trade.","You should be able to outsustain him as long as you use your W whenever he goes for his combos."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["His only way of finding a solokill onto you is if he insec's you under turret because you stupidly overextended for a turret plate"]},{"tipo":"p","texto":"So, just don't play like an idiot, and you should be okay."}]},{"titulo":"Tips","blocos":[{"tipo":"p","texto":"In the mid game, just push out the side waves because he can't really contest you in the side lane,"},{"tipo":"p","texto":"And then just go for an objective with a numbers advantage or something."},{"tipo":"p","texto":"It's kind of pointless to try and split vs him / perma stick to the side lane for 9 years because you're never going to get the opportunity to kill the guy, so just try to outvalue him with macro."}]}]},{"nome":"Graves","planilha":"Graves","id":"Graves","titulo":"o Foragido","dificuldade":{"early":2,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","13 / 11.25 / 9.5 / 7.75 / 6"],["W (Smoke Screen)","26 / 24 / 22 / 20 / 18"],["E (Dash)","16 / 15 / 14 / 13 / 12 ( Reduced by 0.5 seconds for each pellet he hits )"],["Ult","100 / 80 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up priority level 1, and just let the wave push towards you.","Level 2, level up your W and go for a shield bash procc if he ever dashes aggressively against you, otherwise: just keep W recasting whenever you're out-of-combat and your W meter is high.","Level 3, start playing aggressively so that you can secure the crash his turret, and get a recall of your own."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Wait for the Graves player to use his E dash, and once he does use his E dash, this is your go-sign to start firing your own abilities.","Stand behind minions for as long as physically possible against a Graves player since his auto attacks are counted as projectiles, and minions can block them,","Also: Stand away from walls so that Graves can't instantly procc his Q2 by having it's travel time finished early against said wall.","When Graves fires his Q directly towards you, walk towards the side, and then fire your Q so that you don't self-root yourself for his Q2 to land on top of you."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Graves W can cancel your ultimate if he casts it in the middle of your ult animation."]},{"tipo":"p","texto":"There's not much counterplay you can do against this, so you're just going to have to deal with it until you've walked outside of the smoke-screen."},{"tipo":"p","texto":"I guess you could theoretically flash outside of his W range before it hits you to land your ultimate, but that's not really worth it in my eyes."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["When you're going for an extended trade against Graves, try to save your ultimate until after he's used his dash a couple of times to YOINK more armor and magic resistance."]}]}]},{"nome":"Gwen","planilha":"Gwen","id":"Gwen","titulo":"A Costureira Encantada","dificuldade":{"early":2,"mid":3,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Raw burst damage^)"},{"tipo":"item","texto":"Gluttonous Greaves","passos":[[{"nome":"Gluttonous Greaves","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223008.png"}]],"motivo":"( Mercury Treads aren't that useful here anyways)"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Kaenic Rookern / Spirit's Visage","passos":[[{"nome":"Kaenic Rookern","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222504.png"},{"nome":"Spirit's Visage","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223065.png"}]],"motivo":"( Only build if Gwen is still a problem, otherwise: build variety )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Snip Snip!)","6.5 / 5.75 / 5 / 4.25 / 3.5"],["W (Hallowed Mist)","22 / 21 / 20 / 19 / 18"],["E (Dash)","13 / 12.5 / 12 / 11.5 / 11 ( Gwen's first AA after E'ing refunds some cooldown )"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level one, take note of which ability she's leveled up as this will determine how you will try and use your range advantage to secure priority for level two.","If she's leveled up her Q, try to tether right outside of her Q range and poke her while you're outside of it."]},{"tipo":"p","texto":"If she Q's, and you spaced correctly, you can auto attack the minions while her Q is on cooldown."},{"tipo":"lista","itens":["Once you hit level two, level up your W, and walk up as aggressively as possible to abuse your shield bash damage.","If she fights you now, you can win the all-in due to your ability to stat check her during this time.","From here, keep playing aggressive until the level 6 mark, in which you should try to space out her abilities."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Prioritize movement over damage; use your abilities AFTER she's exhausted hers.","You can throw out E's as she's going for CS, and if she dashes, walk exceptionally aggressively to try and zone her with your shield bash damage and your Q damage.","If she W's, walk into her W and fight her there.","If she ults, auto attack her, wiggle side to side in front of her face to bait out another cast of her ultimate, and rinse and repeat until her ult is completely used up."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you don't punish her weaker early game, you will most likely get outscaled in the 1v1 until you've gotten both Kaenic Rookern and Spirit's Visage as your third and fourth items (which will take a really long time).","And if you don't manage to dodge any of her abilities post level 6, there's a high chance that you can still lose due to her raw DPS output."]},{"tipo":"p","texto":"So: space correctly, and accordingly."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["After she's used her E dash, her Q is effectively a self root. This is the best time to land your E and consequently your R.","If she W's early in the 1v1, and you still have your ultimate, feel free to ult her directly in the face (assuming you have a good angle for it). To both deconstruct her W and take away her resistances, and to gain further resistances from the stats she would've gained from her W for yourself."]}]}]},{"nome":"Hecarim","planilha":"Hecarim","id":"Hecarim","titulo":"a Sombra da Guerra","dificuldade":{"early":1,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Rylai's Crystal Scepter","passos":[[{"nome":"Rylai's Crystal Scepter","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"( To slow him down and reduce his damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (DPS tool)","4 / 3.25 / 2.5 / 1.75 (Based on Rampage stacks)"],["W (Aura)","14"],["E (MS boost + Empowered AA)","20 / 19 / 18 / 17 / 16"],["Ult","140 / 120 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, you should play relatively safe, but not too safe since you don't want to give him too much control of the wave (and subsequently a free amount of ramping Q stacks (1/3) on the wave) without suffering a lot of poke damage from your Q.","Level 2, level up your W, and contest him, if he fights back, Q him, use your W when your shield is going to be high, shield bash procc him on the head, and then back off when your W shield is about to run low or keep engaging if he's going to die first.","Level 3, start slowly pushing the wave towards him so that you can secure a crash on the turret, and then play towards a rebound back to your wave to setup a freeze, or recall if you have enough gold for a blasting wand for your Dusk & Dawn."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Post level 3, if he hasn't gotten his Q stacks, don't let him get any off the wave without taking a significant amount of damage from your Q poke and shield bash procc's,"]},{"tipo":"p","texto":"In fact: don't let him get to the wave at all verbatim, just fight him. It's not like he's going to win because he, again: has 0 Q stacks."},{"tipo":"lista","itens":["Post level 6, god, do we even need to talk about level 6? It's just overkill at that point."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Hecarim can cancel out your ultimate with his ultimate, but because of how fast his ult cast is, it's hard for him to ult directly on top of you."]},{"tipo":"p","texto":"So, if he ever does use his ultimate, it's probably to run away, which is annoying: but it's not like you're getting killed for it."},{"tipo":"lista","itens":["Don't stand near his turret if he's level 6 since he can theoretically insec you back into it with an ult fear followed up by a charged up E knockback."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Don't let him stack his Q's on the wave, and you should be fine."]}]}]},{"nome":"Heimerdinger","planilha":"Heimerdinger","id":"Heimerdinger","titulo":"o Inventor Idolatrado","dificuldade":{"early":5,"mid":3,"late":2,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Mercury Treads","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce his CC duration )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To get into initation range^ )"},{"tipo":"item","texto":"Dusk & Dawn / Riftmaker","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"},{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( So you can deal damage^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Turret)","1 (Recharge: 20; Max: 3 stacks)"],["W (Rockets)","11 / 10 / 9 / 8 / 7"],["E (Stun)","11"],["Ult","100 / 85 / 70"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"p","texto":"Level 1, you should try to take out any turrets that he's trying to set up with your Q so that you live through the early game a bit easier. If he tries setting up his STUPID LITTLE turrets again, destroy them with your Q and your E's respectively."},{"tipo":"p","texto":"Your main goal is to just survive until you get yourlevel 6."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Assuming you're level 6, If he ever walks up with no turrets in his inventory and you can land your E -> R, do it."]},{"tipo":"p","texto":"He'll only be able to spawn one big turret and that is not going to save him from the giant metal mace that is about to become his hat."},{"tipo":"p","texto":"Once you get rocketbelt powerspike, you don't even have to wait for him to mess up because your initation range will be greater than his zoning range meaning that if he is standing on top of his turrets, he's already dead because you can just rocketbelt -> E -> R -> free kill."},{"tipo":"p","texto":"Again, just make sure he has no turrets in his inventory before committing to an all-in."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Dodge Heimerdinger's stun or at the very least: don't be near currently active turrents if you are hit by it.","DO NOT, under any circumstances, fight Heimerdinger when he has his turrets set up without your ultimate."]},{"tipo":"p","texto":"If he has 0 turrets remaining, then you can fight him, but otherwise: don't."},{"tipo":"p","texto":"ESPECIALLY when you have a jungler with you, just ping them off and don't bother unless you know for a fact that the Heimerdinger is one-shot."},{"tipo":"p","texto":"If they go in anyways, you can just report them."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Conserve your HP at all costs, and whatever you do: do not die before level 6.","You can tell how many turrets he has in his pocket by the gears around him."]}]}]},{"nome":"Hwei","planilha":"Hwei","id":"Hwei","titulo":"o Visionário","dificuldade":{"early":4,"mid":3,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Unsealed Spellbook","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/UnsealedSpellbook/UnsealedSpellbook.png"},{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"/ Cash Back (Personal preference)","icone":null},{"nome":"Triple Tonic","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/PerfectTiming/AlchemistCabinet.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury Treads","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( Extra Tenacity )"},{"tipo":"item","texto":"Rylai's","passos":[[{"nome":"Rylai's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"nota","texto":"[ I'm testing something out in this specific matchup ]"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Damage)","10 / 9 / 8 / 7 / 6"],["W (Utility)","18 / 17.5 / 17 / 16.5 / 16"],["E (Crowd Control)","12 / 11.5 / 11 / 10.5 / 10"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["You can't really interact with an artillery mage in the early game in general, so: sit back, give up lane priority, wait for the wave to get to your side of the lane, and play for the rebound back to his turret,"]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke he's dishing out onto you, feel free to recall and use your teleport to get back into lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Hwei due to his range advantage, I mean: I guess you could theoretically try to get an E angle after he uses his E fear, but most of the time: they aren't going to just waste the ability for 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, swap one of your summoners for cleanse, and then just run at the Hwei until he uses his fear on you,"]},{"tipo":"p","texto":"When he does that: use your cleanse, ult him, and then just kill him in an all-in. It's really just that simple."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt and mercury treads powerspike since you can just eat the fear, utilize the tenacity from your itemization and runes, and then just rockebelt","> ult him -> kill him again."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you're under 40% HP, recall and teleport back since you're most likely going to get dived by the enemy jungler while the wave is near your turret."]},{"tipo":"p","texto":"It's literally their only win condition against you in this lane, so just be wary of that."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can try to bait out his E fear by walking near his Q -> E puddle since some Hwei's will try to greed for damage by pulling you towards his Q -> E puddle to procc their passive.","If you ever manage to close the distance onto the Hwei without him using his fear onto you, you can buffer your E or your Q into his stun to effectively negate it's duration since both your Q and your E self-root you anyways."]}]}]},{"nome":"Illaoi","planilha":"Illaoi","id":"Illaoi","titulo":"a Sacerdotisa Cráquem","dificuldade":{"early":4,"mid":3,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( To reduce his healing )"},{"tipo":"item","texto":"Liandry's","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"}]],"motivo":"( Even more damage^)"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive","18 – 7 (Based on level)"],["Q (Damage)","10 / 9 / 8 / 7 / 6"],["W (Empowered AA)","4"],["E (PTSD)","16 / 15 / 14 / 13 / 12"],["Ult","120 / 95 / 70"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["In the early game; before level 6, you want to look for long trades if she ever misses E or try trading as long as possible behind minions."]},{"tipo":"p","texto":"This will deny her E making it heavily favored towards you."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, It's mostly just a game of spamming Q or E and trying to weave around to dodge her E."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6, when you both have your ultimate, you might think that you can just permanently press ult on her an win."]},{"tipo":"p","texto":"But, here's the thing: she can cancel your ultimate with her own ultimate."},{"tipo":"p","texto":"Luckily for you, there's a solution to this, which I'll include in the tips section:"}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["To avoid getting your ultimate canceled by Illaoi's ultimate, wait for her to either use her long Q animation OR wait to use your ultimate while she's using her E when you're mid-long range in relation to her."]},{"tipo":"p","texto":"( Note: NOT short range E's because she can still get her ultimate off and cancel your ultimate )."},{"tipo":"p","texto":"This is because if you wait for these opportunities to ult, she will be locked out of using her ultimate until she's finished her respective animation making it so that she ends up being a free kill."},{"tipo":"p","texto":"You can achieve this by going in and then backing out, most Illaoi players will follow your engage with a W -> E angle, and if you were able to create some distance, then now: you can ult during her E animation and then get her in the death realm without her E."},{"tipo":"p","texto":"However, if the Illaoi is bad, she might not even know that this feature exists and just press R as soon as she presses E."},{"tipo":"p","texto":"If she ever does this: then you know that she's trolling and is now a free kill if you use your ultimate which turns this matchup from a 3 to a 2."}]}]},{"nome":"Irelia","planilha":"Irelia","id":"Irelia","titulo":"a Dançarina das Lâminas","dificuldade":{"early":2,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Bramble Vest","passos":[[{"nome":"Bramble Vest","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"}]],"motivo":"( Anti-healing )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Dash)","10 / 9 / 8 / 7 / 6"],["W (Damage resistance)","20 / 18 / 16 / 14 / 12"],["E (Stun)","16 / 14.5 / 13 / 11.5 / 10"],["Ult","125 / 105 / 85"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"p","texto":"As long as you don't troll your first three levels, you should be completely fine. Just let her push in and play for the rebound."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Post level 3, If she ever fights you and your W is stacked up, you can Q onto her AFTER she dashes and just run her down with your W + Shield Bash while SAVING your E for when there are no longer any minions she can dash to in order to escape from you."]},{"tipo":"p","texto":"From here, assuming you're playing for the rebound, shove it, recall, get your powerspikes and wait for level 6."},{"tipo":"lista","itens":["Once you get level 6, just ult her if she ever goes in with no stacks on her passive and then just oustat check her."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Save your Q for AFTER she dashes, not before because otherwise: she can dodge it."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you need to get your Q damage off, and she's already dashing towards you with her Q, press Q pre-emptively, and then flash backwards to since she's going to arrive where your previous location was, making it so that your new Q position will smash her on the head.","When using your ultimate, stand near the edge of your ult wall, and then Q at her to deny her from dodging your Q with her Q dash, since she'll be dashing right on top of you, instead of behind you, due to the wall being in the way."]},{"tipo":"p","texto":"If she walks away during this time, she's losing out on DPS, meaning: you'll probably just beat her if you just auto attack her to death."}]}]},{"nome":"Ivern","planilha":"Ivern","id":"Ivern","titulo":"o Pai do Verde","dificuldade":{"early":4,"mid":3,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce his root duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Root)","14 / 13 / 12 / 11 / 10"],["W (Bush)","0.5 (Recharge: 20; Max: 3 stacks)"],["E (Shield)","11 / 10 / 9 / 8 / 7"],["Ult","140 / 130 / 120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Very similarly to a lot of ranged matchups, you want to just let the wave push into you since you're realistically not going to be able to catch up to him to actually harass him, at least: not without it being incredibly risky without your levels 1-3.","Just preserve your HP, play for the rebound, recall, and then setup a freeze on your side of the lane so that he has to overextend to trade with you."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to walk up as far as possible while still having a minion in front of you to block his root,","If he ever auto attacks you, that's your go-to sign to fire out an E or a Q since his range is relatively low at 475.","As long as you are able to get a long trade into him, whether that's by waiting for him to use his root and then hard trading into him, or if that's by closing the initial distance and then buffering said root,"]},{"tipo":"p","texto":"You should generally be able to win all-ins against him."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6, Ivern's ultimate, Daisy, can still traverse realms, which means that in any extended trade, you are given a timer before Daisy proceeds to knock you up and Ivern proceeds to root you afterwards."]},{"tipo":"p","texto":"Meaning, that when Daisy is about to use her three-part knock up onto you, you want to try and time your abilities right before it properly goes off."},{"tipo":"p","texto":"If you are really good at this, you can even get your ultimate off as the projectile is spawning in the normal realm to give yourself an extra buffer period."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can, try to start your ultimate away from bushes or lead him away from bushes in all-ins, so that he doesn't have access to any empowered auto attacks from his W passive."]}]}]},{"nome":"Jarvan IV","planilha":"Jarvan IV","id":"JarvanIV","titulo":"o Exemplo de Demacia","dificuldade":{"early":1,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Empowered AA Target immunity)","6 / 5 / 4 / 3 (based on level)"],["Q (Poke Tool)","10 / 9 / 8 / 7 / 6"],["W (Shield)","9"],["E (Flag / Attack speed steroid)","12 / 11.5 / 11 / 10.5 / 10"],["Ult","120 / 105 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Most Jarvan players will just sit back and spam Q pokes onto you until you get low for a lethal, which is annoying, but it does mean you're most likely going to have easy access to the wave due to their weak all-in potential.","Therefore, before level 6, you should generally try to keep the wave rebounding back and forth, and ideally find recall timers when you inevitably shove the wave into him.","However, post level 6 is when you should have the wave be on your side of the lane since you now have a way to force him into an extended trade with you via your ultimate."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["If the Jarvan is semi-competent, you shouldn't really be able to trade into him because he's just going to spam max range Q pokes onto you and stay outside of your Q range.","I mean, if you can punish his E and cooldowns respectively since he can no longer use his flag to get out if he ever uses said abilities to poke you, then go for trades for as long as they can last for, but that's probably not going to happen.","Post level 6 is the only time when you're actually going to be able to trade into him, so just wait til then, and then wait for him to use either his E or his Q for poke, and then just simply kill him after ulting him."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Jarvan has extremely good gank setup, so try to be hyper aware of wherever the enemy jungler is at all times before making any aggressive and/or extended plays."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can ult the Jarvan while his flag is down, you can YOINK more attack speed."]}]}]},{"nome":"Jax","planilha":"Jax","id":"Jax","titulo":"o Grão-Mestre das Armas","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Maximum Burst )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Reduces His Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Dash)","8 / 7.5 / 7 / 6.5 / 6"],["W (Empowered AA)","7 / 6 / 5 / 4 / 3"],["E (Stun)","17 / 15 / 13 / 11 / 9"],["Ult","110 / 100 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["As long as you don't troll your first three levels, you should probably be fine. Just let him push in, play for the rebound, shove the wave in, let the wave bounce back and just play for short trades until level 6."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Don't walk up too far if your W is down because otherwise you won't be able to negate the damage he deals with his ability rotations.","Hold your Q and your E abilities almost exclusively for the Jax, not the wave."]},{"tipo":"p","texto":"If he spots you using Q or your E on the wave, then he's going to go in and then just hard win with an ability rotation."},{"tipo":"lista","itens":["Wait for him to walk up and Q him on the head over and over again and just outplay him with your range.","If he ever jumps in, just E him behind you, walk forward, and then go for a long trade while saving your ultimate for when he uses his E button."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Some Jax OTP's will engage on top of you with really low HP values and burst you down with Last Stand."]},{"tipo":"p","texto":"Do not be afraid to flash their E stun if they do this."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Assuming Jax isn't abusing last stand, try to time your Q or your E into Jax's E to buffer and subsequently tank the stun."]},{"tipo":"p","texto":"Your Q and R are self-stuns anyways, might as well use them when you're about to get hit by cc."}]}]},{"nome":"Jhin","planilha":"Jhin","id":"Jhin","titulo":"o Virtuoso","dificuldade":{"early":3,"mid":1,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Plated steelcaps","passos":[[{"nome":"Plated steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","7 / 6.5 / 6 / 5.5 / 5"],["W (Root)","12"],["E (Traps)","2 ( Recharge: 24 / 21.5 / 19 / 16.5 / 14; Max: 3 stacks )"],["Ult","120 / 105 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Like any regular marksman matchup: sit back, give up lane priority, wait for the wave to get on your side of the lane, and then play for the rebound back to his turret."]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke he's dishing out onto you, just recall and run back to lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Jhin due to his range advantage, I mean: I guess you could theoretically try to get an E angle after he uses his W root, but most of the time: they aren't going to just waste the ability for 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, and then just run at the Jhin until she uses his root on you,"]},{"tipo":"p","texto":"When he does that: use your E, ult him, and then just kill him in an all-in. It's really just that simple."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt powerspike since you can just eat the root, utilize the tenacity from your minor runes, and then just rockebelt -> ult him-> kill him again."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Don't recall in an exceptionally obvious spot if you're low hp, since some Jhin players like to go ult snipes while you're recalling.","If you're under 40% HP, recall and walk back to lane since you're most likely going to get dived by the enemy jungler while the wave is near your turret."]},{"tipo":"p","texto":"It's literally their only win condition against you in this lane, so just be wary of that."},{"tipo":"lista","itens":["Be wary of any wombo combo gank setups since Jhin can snipe you with his W for an easy follow-up CC tool."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Don't stand next to low HP minions since Jhin's Q will deal additional damage if it has killed a previous target before hitting you."]}]}]},{"nome":"Jayce","planilha":"Jayce","id":"Jayce","titulo":"o Defensor do Amanhã","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Plated steelcaps","passos":[[{"nome":"Plated steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Leap -> Slam)","16 / 14 / 12 / 10 / 8 / 6"],["W (Static Field)","10"],["E (Knockback;)","20 / 18 / 16 / 14 / 12 / 10"],["Ult","6"],["- Ranged form",""],["Q (Poke tool)","8"],["W (AS Steroid)","13 / 11.4 / 9.8 / 8.2 / 6.6 / 5"],["E (Gate)","16"],["Ult","6"]]},{"tipo":"p","texto":"- Melee form"}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up priority wave 1 and play for the rebound, crash the wave, let the wave slowly push back towards you, and keep repeating this process until you get level 6."]},{"tipo":"p","texto":"He's a ranged lane bully, there's not much you can do until you get your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, this matchup is INCREDIBLY painful if the Jayce spaces well. The only thing you can do against a Jayce before level 6 is to get a long lane, have him use his melee Q against you, E while he's midair, and then play for a long trade."]},{"tipo":"p","texto":"However that is all dependent on whether or not the Jayce is stupid enough to randomly use his melee Q."},{"tipo":"p","texto":"So just try to survive until you reach your level 6."},{"tipo":"lista","itens":["Post level 6, this matchup is definitely more playable:"]},{"tipo":"p","texto":"Look to fish him with E -> R's and then run just: him down with your ultimate."},{"tipo":"p","texto":"Your goal in the mid-game is to get enough anti-kite via your rocketbelt to make it so that he cannot kite you and enough damage items be able to actually take him out with your DPS."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Stand behind minions to avoid getting hit by his gate-empowered Q blasts."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to use your E while he's in the middle of his melee Q animation or:","Try to buffering your E or Q while he's knocking you back with his Melee E knockback.","You can ult away his acceleration gate, if he ever uses it early without his Q shock blast to heavily reduce his damage output."]}]}]},{"nome":"K'Sante","planilha":"K'sante","id":"KSante","titulo":"o Orgulho de Nazumah.","dificuldade":{"early":3,"mid":3,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Unflinching","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Unflinching/Unflinching.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To reduce magic resistance )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage item )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main trading tool)","3.5 – 2 (based on bonus resistances)  • 2.33 – 1.33"],["W (Knockback)","14 / 13 / 12 / 11 / 10"],["E (Dash)","10 / 9.5 / 9 / 8.5 / 8 / ( All-out reduces this cooldown by 50% )"],["Ult",": 120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["On the first wave, fight for priority, and Q him if he ever gets in range, this is the one time in the lane where your effective range will outrange his, so abuse it.","On your level 2 powerspike, level up your W and walk at him, if he fights back: play for the long trade."]},{"tipo":"p","texto":"If he doesn't fight back, crash the wave, go for a recall, and just keep bouncing waves back and forth until you get your Bloodletter's Curse."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Throughout most of the lane, you want to try spamming your Q AFTER spacing out his E + Q because his E + Q has a total range of 715 range [465 (Basic Q range) +250 (Non ally E dash range)] while your Q has a range of only 625."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["His W and his ultimate can cancel your ultimate, but you can channel your ultimate RIGHT before his W finishes since it has a 0.5 second cast time and get it off just in time."]},{"tipo":"p","texto":"( Or wait until he's used his three unstoppables, but that's probably not the best idea because you want to reduce his magic resist as soon as possible to reduce his burst )"},{"tipo":"lista","itens":["DO NOT Q into his W damage reduction, wait for it to be used first, and then Q him.","Also: do not stand anywhere remotely near his turret if he is level 6 because he can and will insec you if you overextend too far."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Once you get your first two items, you should be able to kill him in the 1v1 duel, therefore, you want to ideally force K'sante into the side lane by pushing the side lanes and then consequently force a numbers advantage; a 5v4 instead of a 5v5 at an objective timer."]},{"tipo":"p","texto":"Remember: It doesn't matter if you're weaker in teamfights against K'sante if he's forced to respond to YOU pushing out waves. (If he doesn't respondto you, he's going to be behind on items for future fights)"},{"tipo":"p","texto":"Just try to survive until your two item powerspike and you should be fine."}]}]},{"nome":"Kai'Sa","planilha":"Kai'sa","id":"Kaisa","titulo":"a Filha do Vazio","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttac  17 / 15.5 / 14"],["E (MS boost)","16 / 14.5 / 13 / 11.5 / 10"],["Ult",": 130 / 100 / 70"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up level 1 priority since you're never going to be able to realistically catch up to her anyways,","Level 2, level up your W and just keep playing safe and sustaining through the lane.","Third wave, let it crash into you, and then start playing off the rebound on the fourth wave."]},{"tipo":"p","texto":"Ideally, you want to try and farm up until your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You don't exactly 'trade' into a Kai'sa player because of her range and movement speed advantage, but don't fret: as once you get level 6 powerspike it should be relatively easy to just all-in her with ghost + ultimate.","Your entire setup is all set around one thing: 'SCREW SKILLSHOTS, I'm just going to auto attack you to death with my superior burst setup!'"]},{"tipo":"p","texto":"If you don't have the confidence to all-in her on your level 6 powerspike, you can just farm up until you get dusk & dawn, lobotimize yourself, and then just kill her in an all-in with your ultimate."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6, Kai'sa can use her ultimate to dodge one of your skillshots and subsequently: get a gigantic shield for using said ultimate."]},{"tipo":"p","texto":"There's not much counterplay to this. I guess: just don't use burst tools while her shield is up."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can, try to use your ultimate until after Kai'sa has used her E to YOINK more attack speed.","Additionally: play safe whenever she about to reach 5 stacks of her passive onto you, since she'll be able to deal a lot of bonus damage onto you otherwise."]}]}]},{"nome":"Kalista","planilha":"Kalista","id":"Kalista","titulo":"a Lança da Vingança","dificuldade":{"early":4,"mid":3,"late":3,"overall":4},"tldr":[],"runas":[[
