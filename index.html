 there, start firing out your own Q's, and prioritize walking forwards instead of backwards when her Q's come back up, and E close to yourself to create extra distance between the two of you as she dashes past you to set up a follow-up Q."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["DO NOT stand in melee range of her if she has all of her Q's up, because if she can utilize Q animation cancels, your HP is genuinely just going to explode."]},{"tipo":"p","texto":"If she can't, it doesn't really matter as much."},{"tipo":"lista","itens":["If you're under 50% hp, and you're both level 6, RECALL, her ultimate has an execute mechanic and I can guarantee that you will not be able to survive her all-in combo, even with plated steelcaps."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Make sure to time your E during her Q3 animation since it locks her out of her own E dash."]},{"tipo":"p","texto":"If you mistime it, then you've lost lane pressure for the next 18 seconds of the game, which is why this matchup is so difficult."}]}]},{"nome":"Rumble","planilha":"Rumble","id":"Rumble","titulo":"a Ameaça Mecânica","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the distance^ )"},{"tipo":"item","texto":"Gluttonous Greaves","passos":[[{"nome":"Gluttonous Greaves","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223008.png"}]],"motivo":"( Mercury Treads aren't that useful here anyways)"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Flamethrower)","10 / 9 / 8 / 7 / 6"],["W (Shield / MS Boost)","6"],["E (Main poke tool)","0.5"],["Ult","130 / 105 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, stand behind minions and try to secure priority."]},{"tipo":"p","texto":"Rumble's nature as a poke champion makes his all-ins pretty weak without his overheat passive, but level 1, he doesn't have the ability to procc it, so abuse that to its fullest."},{"tipo":"lista","itens":["Level 2, level up your E if he's overextending towards the center of the lane, but otherwise: just level up your W and play for shield bash procc's if he ever walks in melee range to get CS / sustaining through his poke.","Level 3, crash the wave and look for a reset if you can."]},{"tipo":"p","texto":"Even though you can win against Rumble in an extended trade (if his passive is down), it's hard to really to consistently get into range to apply said long trade."},{"tipo":"p","texto":"So just stay behind minions, force him off of melee range to the wave with the pressure from your E and Q, and just repeat this cycle until he either overextends or until you've gotten your level 6."}]},{"titulo":"How to trade","blocos":[{"tipo":"p","texto":"Before level 6, play as aggressively as possible behind the wave and try to time your E with his E pre-fire since it roots him for a split second."},{"tipo":"p","texto":"If you can successfully land the E, Q him, procc your passive, and use your W for an extra shield bash procc."},{"tipo":"p","texto":"You generally want to extend the trade for as long as possible UNLESS he has his overheat passive up, in which case you should focus on backing off instead of overextending."},{"tipo":"p","texto":"Post level 6, you want to try and ult him either when his overheat passive is about to expire or when he's on a low amount of heat. Even with his ultimate up, he's no match for your all-in power assuming you can land your E during his E pre-fire animation."},{"tipo":"p","texto":"If you have rocketbelt though, you can just straight up rocketbelt -> E -> R him whenever he's vaguely in range and secure a kill that way too."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Before level 6, DO NOT go for an extended trade against him if he has his overheat passive up (Unless it's about to expire soon)","Try to dodge one harpoon before all-inning rumble because if he lands multiple harpoons in a row, he'll stack a percentile of magic resistance shred onto you."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can ult away Rumble's ultimate if he ever fires it early.","Try to ult him when he's at a low amount of heat (since his abilities won't be empowered) or when his overheat passive is about to expire since it will give you additional stats to yoink and he'll end up having a lower amount of attack speed than what he initially had after this overheat passive expires completely."]}]}]},{"nome":"Ryze","planilha":"Ryze","id":"Ryze","titulo":"o Mago Rúnico","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rylai's","passos":[[{"nome":"Rylai's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"( Combos with Approach Velocity )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( So you can keep up with him )"},{"tipo":"item","texto":"Rocketbelt / Riftmaker","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"},{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Depending on if there's more ranged on the enemy team or melee )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main damage tool)","5"],["W (Slow / Root if E is applied)","11 / 10.5 / 10 / 9.5 / 9"],["E (Spell Mark)","3.5 / 3.25 / 3 / 2.75 / 2.5"],["Ult","180 / 160 / 140"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, give up priority since you can't really contest his level 2 cc chain early on, and then just play for the eventual rebound back to his turret."]},{"tipo":"p","texto":"Afterwards, find a recall angle and rinse and repeat with bouncing the waves back and forth until you've gotten your Rylai's + Approach Velocity powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Luckily, because phase rush is finally removed, Ryze isn't nearly as slippery as he once was. But: It's not like you're going to be able to find any particular engage angles until you've gotten your Rylai's + Approach Velocity + Mercury Treads powerspike.","However, once you do get it, try to land your Q or E either during the downtime of his E + W combo or while he's in the middle of casting an animation."]},{"tipo":"p","texto":"If you can land one of the abilities, you can easily set up the other one and because of the slow gained from Rylai's, the movement speed gained from approach velocity, and the tenacity from your general setup, you should be able to consistently stay in range long enough to completely run him down and kill him in a dedicated all-in."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Ryze has the ability to ult outside of your range, but if he ever does this: just ult him and limit it's range to within your domain."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ideally you want to try to punish him as hard as you possibly can while you are on your Rylai's + Approach Velocity + Mercury Treads powerspike."]},{"tipo":"p","texto":"Play for as many skirmishes as you can and try to close the game out early before Ryze gets the opportunity to hyper scale into the late game."},{"tipo":"lista","itens":["Ryze stands still for a second while he's using his abilities, you can exploit this and use your abilities when Ryze is using his so that you can guarantee that your E and your Q will hit."]}]}]},{"nome":"Sejuani","planilha":"Sejuani","id":"Sejuani","titulo":"a Fúria do Norte","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred their magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Dash)","18 / 16.5 / 15 / 13.5 / 12"],["W (Main poke tool)","9 / 8 / 7 / 6 / 5"],["E (Stun)","1.5"],["Ult","120 / 105 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["In terms of wave states, if you can bait out and dodge her W poke, then generally: you should try and pressure her off of the wave."]},{"tipo":"p","texto":"If you get priority, level up your W level 2, and walk excessively forward to pressure her off of the wave, and from here: try to get your W stacked up, if she tries to poke you, use your W shield off the damage and walk forward to try and use your shield bash AA against her."},{"tipo":"p","texto":"If you don't get priority of the wave, still level up your W level 2, and just wait for her to use her poke to then shield it and then attempt to go for a shield bash auto attack until your W shield meter gets low."},{"tipo":"p","texto":"In either scenario: you want to try and eventually getting a large wave to crash onto her turret, recall and play for a rebound back to your turret to play for a freeze."},{"tipo":"p","texto":"If you get too low, and need to recall early, that's fine too. Just don't die."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Generally, in this matchup, you should try to extend trades for as long as possible since she tends to be favored in shorter trades due to her burst oriented nature.","In essence: if you are both high hp, you're at the advantage, and if you're both at low hp: then Sejauni's in the advantage.","Before level 6, your main goal is to try and save your E pull until after she's user her Q dash, otherwise: just spam Q on top of her if she's already in-range of you.","When she's in lethal range (~20% hp), send out your E, and try to body block her from dashing out with her Q dash.","Post level 6, you can try forcing a fight with your ultimate until after she's used her dash or if she's near your turret since both instances will help guarantee a longer fight."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Sejauni deals a surprising amount of damage in her all-in combo (30% HP), just recall when you're low and don't ego.","Additionally: keep track of how many melee auto attacks that the enemy jungler / support can do, if they can deal a lot in quick succession: be VERY wary of any potential ganks onto you since Sejuani has an easy setup tool with her E stun."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to stay as close as possible to the Sejauni at all times to deny her from getting enough space to land an empowered ultimate since otherwise: it'll stun you for longer and deal extra magic damage.","If you can ult Sejauni before her passive wears down from any damage she's taken, you can YOINK and extra amount of armor and magic resistance.","If somebody on Sejauni's team can land a lot of melee hits against you for her to procc her E stun onto you, try utling either Sejauni or said enemy to deny getting CC chained to death."]}]}]},{"nome":"Sett","planilha":"Sett","id":"Sett","titulo":"o Chefe","dificuldade":{"early":4,"mid":2,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Reduces His Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"nota","texto":"[ Variety Item ]"},{"tipo":"item","texto":"Zhonya's","passos":[[{"nome":"Zhonya's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223157.png"}]],"motivo":"( To avoid his W damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA's)","9 / 8 / 7 / 6 / 5"],["W (Strongest damage tool)","18 / 16.5 / 15 / 13.5 / 12"],["E (Stun)","16 / 14.5 / 13 / 11.5 / 10"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Sett's early game is extremely oppressive, so give up level 2 priority, and play towards rebounding the wave back towards him."]},{"tipo":"p","texto":"When you crash the wave, recall for some items, and play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Ideally, you want to try and poking him down with your Q while staying out of range of his E."]},{"tipo":"p","texto":"For context: Sett's E has 490 range even if he uses the pythagreom theorem; angles it to get the maximum distance."},{"tipo":"p","texto":"While Mordekaiser's Q has 625 range and Mordekaiser's E has a target cast range of 700."},{"tipo":"lista","itens":["If Sett ever gets into melee range with you, press E backwards and send him flying away from you.","When Sett is around 25% HP with no W charged up, this is your lethal range to commit towards an all-in with your E -> Q -> W -> Shield bash AA.","Sett's E can only stun you when he has another target to grab on the other side, but fortunately for you: your ultimate can negate that by making it so that the only target he can use his E on is you."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Your ultimate can be canceled by his ultimate assuming he's in melee range from you, so try and ult him from a farther amount of distance to guarantee it."]},{"tipo":"p","texto":"NEVER ult him directly in melee range post level 6."},{"tipo":"lista","itens":["Do not all-in the Sett if he's full hp or near his turret because you will lose a dedicated all-in before you get your dedicated plated steelcaps and level 6 powerspikes.","Be aware that Sett has the ability to insec you into his turret if you overextend too far."]},{"tipo":"p","texto":"Don't overextend too far."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If Sett walks up to turret to hit it, don't trade into him too hard without your ultimate because he might be planning on diving you with his ultimate and charged up W."]},{"tipo":"p","texto":"Just Q him, and shield bash AA him, and then step back to see what his next move is."},{"tipo":"p","texto":"If he dives you, his W shouldn't be charged up enough to kill you."},{"tipo":"p","texto":"If he doesn't dive you, wait for his W meter to go back down and poke him down again with your E + AA's."}]}]},{"nome":"Shaco","planilha":"Shaco","id":"Shaco","titulo":"o Bufão Demoníaco","dificuldade":{"early":3,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Deathfire Touch","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/DeathfireTouch/DEATHFIRE_TOUCH_KEYSTONE.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Cosmic Drive","passos":[[{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( So you can keep up with him while also still having resolve tree for second wind sustain )"},{"tipo":"item","texto":"Mecury's Treads / Plated Steelcaps","passos":[[{"nome":"Mecury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"},{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( AP vs. AD Shaco )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( So you can deal damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Invisibility / Dash)","13 / 12.5 / 12 / 11.5 / 11"],["W (Trap / Fear)","15"],["E (Knife throw)","8"],["Ult","100 / 90 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, walk with your wave, since some (mentally ill) Shaco players might try to go for a proxy onto you, if they do try to go for it, fight them off.","When the waves meet, you ideally want to fight for priority so that you can crash the third wave for a cheater recall, and subsequently: a rebound back to your turret -> a freeze on your side of the lane.","So long as you can get the Shaco to overextend in your territory, you should be fine to just beat him down whenever he walks up for CS."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Trade for as long as possible against the Shaco until you start to go beyond unmarked and potentially trapped territory."]},{"tipo":"p","texto":"The last thing you want to happen against a Shaco player is to get feared by one trap -> feared by another trap -> feared by a recently placed trap, since it will chunk your HP down significantly."},{"tipo":"lista","itens":["Just try to chip him down with max ranged Q's, and if he ever uses his Q invisibility dash, then look to land your E (ideally while he's trying to use his own E poke onto you)","You should be able to outsustain him as long as you use your W whenever he throws his E knife at you.","Post level 6, when you see Shaco use his ultimate, identify which one is the real Shaco by seeing which one takes more damage from your passive, and then proceed to ult the real Shaco to avoid getting blasted by Shaco's death-clone-damage."]},{"tipo":"p","texto":"Bonus points if you can also time your ultimate while you're in an area with a bunch of pre-established traps, since they will not follow him through the death realm."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Be aware of the location of his traps at all times to avoid taking an unnecessary amount of damage.","If you ever see the Shaco randomly use his ultimate, be ESPECIALLY aware of it's timer and existence, since if you don't see it explode, there's a good chance he's going to command his clone to run away, walk towards you, use his Q invisbility, make the clone look like it's him, and then have it explode on top of you for a lot of damage."]},{"tipo":"p","texto":"Don't get cheesed."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Don't get rage-baited, I know it's a Shaco, and I KNOW you DESPERATELY want to kill him, but if you're low HP: recall, and don't greed for the kill because you're going to end up looking stupid.","If you're forced to push the wave into him, be sure to walk behind your minions and linearly with your minions so that they can tank any incoming traps."]}]}]},{"nome":"Shen","planilha":"Shen","id":"Shen","titulo":"o Olho do Crepúsculo","dificuldade":{"early":2,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Maximum Burst )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Reduces His Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA's)","8 / 7.25 / 6.5 / 5.75 / 5"],["W (AA block)","16 / 14.5 / 13 / 11.5 / 10"],["E (Taunt / Dash)","18 / 16 / 14 / 12 / 10"],["Ult","200 / 180 / 160"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["DO NOT die levels 1-2, these are the only timers where you can lose the Shen player."]},{"tipo":"p","texto":"Play respectfully, preserve your HP, let him get priority, and then beat him down level 3 when you have all of your abilities up in a dedicated all-in since Shen is only strong in extremely short trades."},{"tipo":"p","texto":"From here, you should push out the wave and recall afterwards for your some items and then play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 3, DO NOT trade into the Shen, you will lose all of your HP and be unable to trade with him afterwards.","Post level 3, try to engage with your E while the Shen is in the middle of an auto attack on the wave.","If the Shen dashes into you with his E, you should try to buffer his taunt with your Q and effectively negate it's CC.","When Shen uses his W (Spirit's Refuge), try to prioritze movement over auto attacking him since he's just going to block it anyways."]},{"tipo":"p","texto":"Ideally, try to walk towards wherever his escape-plan could possibly be at."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Like I said before in this entry: DO NOT DIE before level 3, this is the only time when he's stronger than you in combat stats.","Post level 6, PING your teammate's that there's a Shen in the game whenever you don't directly see him in the map."]},{"tipo":"p","texto":"And when I say ping: I mean ping in an almost schizophrenic paranoia-induced kind of way:"},{"tipo":"p","texto":"If you see the man move outside of vision for a split second: ASSUME he's going to be ulting one of his teammates IMMEDIATELY, and make sure your teammate's are blinded by the Shen."},{"tipo":"p","texto":"PING, PING, PING!!!!! PLEASE!"}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Post level 6, you want to try and hold a freeze on your side of the wave for as long as possible."]},{"tipo":"p","texto":"If he ever ults out, shove the wave immediately and try to get as many turret plates as possible."},{"tipo":"p","texto":"If you're strong enough to contest the enemy jungler, go for a proxy after getting a turret plate and ward the enemy jungle to see if you can maybe snag a camp while you're there."},{"tipo":"p","texto":"If you can't, just recall before the Shen comes back, and make use of your tempo advantage to recall and get an additional itemization powerspike."}]}]},{"nome":"Shyvana","planilha":"Shyvana","id":"Shyvana","titulo":"a Meio-Dragão","dificuldade":{"early":2,"mid":3,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Maximum Burst^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA's)","10 / 9 / 8 / 7 / 6 (Lowered by 0.5 seconds per basic AA)"],["W (Shield / MS boost)","13 / 12.25 / 11.5 / 10.75 / 10"],["E (Fireball)","12 / 11 / 10 / 9 / 8"],["Ult","Technically it's 0, but she needs to get her fury to 100 to use it."]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1 is the only time when you're genuinely weaker against her, so just play safe and play towards your level 2 powerspike.","Once you get your level 2, you can start trading against her with your Q's and W shield bash procc's, as for the wave: just let it push into you so that you can force the Shyvana to overextend and consequently play for longer trades.","Generally, you want to keep the wave on your side of the lane for as long as possible since Shyvana heavily loses the short trades against you."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, play for short trades against her by using your Q's and W shield bash procc's, and keep trades going for as long as possible until you start to see her prepping her Q3 (which deals additional true damage) or when your W shield starts to get low,","Post level 6, so long as your ultimate doesn't get canceled by her ultimate, you should be able to permanently out-stat check her with your ultimate."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Against a Shyvana player, you either want to use your ultimate when she's already used hers, while she's in the middle of animation, or when you're out of vision against her,"]},{"tipo":"p","texto":"Since she'll be able to cancel your ultimate with her ultimate otherwise."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Pay attention to Shyvana's build since an AD shyvana will deal more focused damage against one of your carries and an AP shyvana will deal more AOE damage against your team."]},{"tipo":"p","texto":"If it's an AD Shyvana, you don't need to prioritize her nearly as much with your ultimate unless she's actively on one of your carries."},{"tipo":"p","texto":"If it's an AP Shyvana however, make sure that you are either positionally seperated by your team so that her R -> E combo doesn't deal massive amounts of AOE damage."},{"tipo":"p","texto":"Alternatively: you can also just ult her if your team wants to willingly clump together to get hit by 50 million AOE skillshots."}]}]},{"nome":"Singed","planilha":"Singed","id":"Singed","titulo":"o Químico Louco","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Cull","passos":[[{"nome":"Cull","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1083.png"}]],"motivo":"( You're never interacting with him anyways )"},{"tipo":"item","texto":"Rylai's Crystal Scepter","passos":[[{"nome":"Rylai's Crystal Scepter","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"( Combos with Approach Velocity )"},{"tipo":"item","texto":"Boots Of Swiftness","passos":[[{"nome":"Boots Of Swiftness","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223009.png"}]],"motivo":"( So you can keep up with him )"},{"tipo":"item","texto":"Riftmaker / Force Of Nature","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Force Of Nature","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224401.png"}]],"motivo":"( Does the enemy have 3+ AP? )"},{"tipo":"item","texto":"Riftmaker / Force Of Nature","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Force Of Nature","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224401.png"}]],"motivo":"( Build whatever you didn't build second as your third item )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poison Trail)","1"],["W (Glue)","17 / 16 / 15 / 14 / 13"],["E (Fling)","10 / 9.5 / 9 / 8.5 / 8"],["Ult","100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Remember to walk up with the wave level 1 so you can deny his level 1 proxy,","Your goal in this lane is to try and make it as proactive as possible; deny his proxies as much as you can WITHOUT sacrificing your own waves.","Now: keep note of what setup the Singed is running, if he's going Ignite + Flash, then you have to keep in mind that this Singed has MEGA gigantic balls and play safe during his level 2 powerspike.","If he's going Ghost + Flash however, then you can somewhat contest him when he goes to use his poison on the wave."]},{"tipo":"p","texto":"But: if he's stubborn, he's probably still going to get the wave pushed out and he's probably going to end up going the long way to proxy you."},{"tipo":"p","texto":"Don't follow him, it's not worth chasing the Singed in the early game to deny his proxy."},{"tipo":"p","texto":"Just farm under turet until you can get a back timer, get a cull, and then rinse and repeat until you've gotten your Rylai's + Approach Velocity powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Just stand outside of his purple gas cloud and trade with him for as long as possible until he's too far to continiously prolong a trade without taking an absurd amount of damage from his Q.","When you get your Rylai's + Approach Velocity powerspike, land a Q onto him and trade for as long as possible as per usual."]},{"tipo":"p","texto":"If he gets under 50% hp, go for an ult angle and commit towards a longer trade to try and play towards a solokill."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Singed W, despite looking like it disappears after you ult him, does not lose it's effectiveness and instead decides that it wants to have the ability to:"]},{"tipo":"p","texto":"TRAVERSE REALMS! Which is really annoying because he can still slow you down with glue that looks like it doesn't even exist."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you time your ultimate for after when Singed uses his ultimate, you can gain more stats that way."]}]}]},{"nome":"Sion","planilha":"Sion","id":"Sion","titulo":"o Colosso Morto-Vivo","dificuldade":{"early":2,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred their magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main trading tool)","10 / 9 / 8 / 7 / 6 (Lowered to 2 seconds if his Q gets CC'd)"],["W (Shield)","15 / 14 / 13 / 12 / 11"],["E (Armor reduction / Slow)","12 / 11 / 10 / 9 / 8"],["Ult","140 / 100 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, You should try getting priority into this lane, slow push the second and third, and either cheater recall or let the wave rebound back to you to set up a freeze on your side of the lane."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your E pull during his Q animation to shorten it's duration or straight up cancel it if the Sion doesn't release his Q early."]},{"tipo":"p","texto":"From there, just Q him on the head and then run him down until he gets too far away."},{"tipo":"lista","itens":["Additionally: If you can buffer your Q or your R just when he's about to hit you with his ultimate, you can effectively negate it's CC."]},{"tipo":"p","texto":"Also: While it does seem counter productive to ult him while his R is about to hit you, keep in mind that your ultimate has a cast-time, and by ulting him right as he's about to land on top of you, you'll be able to get a successful buffer."},{"tipo":"p","texto":"Bonus points if you get your ult off right as he goes for a charged up Q after CC'ing you with his ultimate"}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Sion's E shreds your armor, so try to avoid Sion E or any of his abilities that follow up with his Sion E with flash to avoid taking an absurd amount of damage."]},{"tipo":"p","texto":"Especially if it's a lethality Sion instead of a tank Sion."},{"tipo":"lista","itens":["Sion's ultimate gives him roaming potential, so just keep that in mind whenever he's not in lane."]},{"tipo":"p","texto":"Though, most Sion players just use their ultimate to get back to lane quicker for a tempo advantage."},{"tipo":"p","texto":"Just don't be under his turret when you hear his ult sound go off if does use his ultimate for lane."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you ult Sion while he's charging his Q, and the Sion doesn't cancel his Q early, you can completely negate all the damage you would've gotten because apparently: his Q is left behind in whatever realm he casted it in."]},{"tipo":"p","texto":"However, do note that this does mean it's theoretically for one of your teammate's to die from a completely invisible Sion Q."},{"tipo":"p","texto":"Which: pfft- sucks for them lmao. (See video example to the right)"}]}]},{"nome":"Skarner","planilha":"Skarner","id":"Skarner","titulo":"o Soberano Primordial","dificuldade":{"early":2,"mid":2,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred their magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main trading tool)","8 / 6.75 / 5.5 / 4.25 / 3"],["W (Shield)","10 / 9 / 8 / 7 / 6"],["E (Charge)","22 / 21 / 20 / 19 / 18"],["Ult","120 / 105 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Get priority, shove the wave, play for the bounce back, rebound the wave, recall, get your items, and just rinse and repeat until you've gotten your items for the mid-game."]},{"tipo":"p","texto":"Against a competent Skarner player, you're not going to have too much kill threat into them until you've reached your very first item, but it's not like he can kill you either"},{"tipo":"p","texto":"Unless you overextend into his turret and get insec'd, but at that point, you kind of deserve to die."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Just try to hit him with your E's and Q's whenever he gets into range.","When you see him picking up his Q rock, stand behind minions, but not too close to the minions so that they block the AOE rock throw."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6 especially: Do not overextend into his side of the lane since there's a good chance he's going to insec you back into his turret and cheese you."]},{"tipo":"p","texto":"Just let the wave slowly push back towards you, and you should be fine."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["When you ult the Skarner, try to have your back towards your ult wall, since Skarner cannot use his E wall stun onto you if he pushes you into it.","Given that his E push-back and ultimate have long channel animations, try to buffer your Q or your R into said abilities to effectively negate their CC onto you."]}]}]},{"nome":"Smolder","planilha":"Smolder","id":"Smolder","titulo":"o Filhote Flamejante","dificuldade":{"early":2,"mid":1,"late":2,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Anti kite + reduces his damage )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]]},{"tipo":"nota","texto":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )\""}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main trading tool)","5.5 / 5 / 4.5 / 4 / 3.5"],["W (Slowing projectile)","14 / 13 / 12 / 11 / 10"],["E (Main peel tool)","24 / 22 / 20 / 18 / 16"],["Ult","120 / 110 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, give up priority since his range advantage can be quite oppressive.","Level 2, just keep playing safe until you get both your W and your E to start trading against him.","Level 3 is when the wave is going to start slowly rebounding towards him, assuming you let the wave push towards you, which means that you can (maybe) start looking for trades against him and fish for all-ins whenever he overextends to use his spells against you."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your E pull for when Smolder goes for a Q or a W onto you and then subsequently chase him down once you've landed your Q to procc your Stromraider's surge.","Level 6, this matchups gets easier considering you can prolong the all-in duration with your ultimate, and once you get your rocketbelt, it gets even more easier since you can just rocketbelt -> E -> R him whenever he's vaguely in range."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["The only thing you have to really worry about in this matchup is when he starts to scale with his passive execute mechanic, so when that happens: just him away so that you team doesn't have to deal with a weaker elder dragon on the enemy team."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can't find a lead before you get rocketbelt, don't worry since once you do end up getting it, you can essentially face-roll against the Smolder after you get your all-in combo and snowball significantly from there."]},{"tipo":"p","texto":"In other words: your mid-game power is absolutely ridiculous into him."}]}]},{"nome":"Soraka","planilha":"Soraka","id":"Soraka","titulo":"a Filha das Estrelas","dificuldade":{"early":4,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( To reduce her healing )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her root duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main trading tool)","8 / 7 / 6 / 5 / 4"],["W (Ally heal)","6 / 5 / 4 / 3 / 2"],["E (Silence)","20 / 19 / 18 / 17 / 16"],["Ult","150 / 135 / 120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Soraka's early game is suprisingly oppressive, so just keep playing safe until you get your rocketbelt powerspike into her.","That means giving up level 1 priority, playing safe during the second and third waves, and preserving your HP so that you can play the rebound back to her effectively."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Soraka isn't a matchup you exactly trade with due to her range advantage, but more-so a matchup that you have to survive until you get your tools to properly all-in her.","Once you get your level 6, try to time your E pull for when Soraka walks up to use her Q poke, if you can land everything, you should be able to just kill her in an all-in.","If you can't get into range to land your E, just wait until you get your rocketbelt powerspike to E -> R","> all-in her whenever she's vaguely in range."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Try to use the movement speed gained from Stormraider's surge to charge at the Soraka when you start getting into teamfights to deny her from healing the rest of her team.","When Soraka uses her silence against you, use the movement speed gained from Stormraider's Surge to walk right past it."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Play patient, play safe, and do not underestimate Soraka's lethal ranges."]}]}]},{"nome":"Swain","planilha":"Swain","id":"Swain","titulo":"o Grande General Noxiano","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rylai's Crystal Scepter","passos":[[{"nome":"Rylai's Crystal Scepter","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"( Combos with Approach Velocity )"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( Anti-healing )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main trading tool)","7 / 6 / 5 / 4 / 3"],["W (Slow / Vision)","22 / 21 / 20 / 19 / 18"],["E (Root)","12 / 11.5 / 11 / 10.5 / 10"],["Ult","120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1. just give priority and try not to take too much poke from his Q damage,","Level 2, it's about the same story since you need both your W and your E to start trading against him, just level up your W for sustain for now.","Level 3, is when the wave is starting to rebound back towards him, assuming you let the wave push towards you, which means that you can start looking to trade into him and fish for all-ins whenever he's either in a bad situation to use his E or when he misses said E."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Stand outside of the wave if the Swain is far away from you to avoid having E hitbox 'lolipop' and detonate on a nearby minion to grab you with an extended hitbox.","If you are the close the Swain however, try to have a minion be behind you so that you can deny his E root when he goes for it."]},{"tipo":"p","texto":"Pre level 6: So long as you can get a longer trade with the Swain by denying his E with good movement, you should be able to theoretically win in any dedicated all-in since his in-combat pressure is all ability rotation based."},{"tipo":"p","texto":"Post level 6: you'll still be able to win in any dedicated all-in against him so long as you can deny his root or start fighting while it's on cooldown."},{"tipo":"p","texto":"Just be sure to use your ignite to cut his healing from his ultimate when he uses it, and you should be fine to just out-dps him to death."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you're really low HP, don't recall at really obvious spots since Swain can cancel your recall by using his W onto you."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Mordekaiser's ultimate has a 0.5 second cast time, while Swain's W takes 2 seconds to fully activate, try using your ultimate when he goes for his W to deny the slow onto you.","It's easier to land your E onto Swain if you can time it when he goes for a Q or an auto attack, he's not going to stand still for long, but he will stand still for at least a fraction of a second which is all you can really ask for in this matchup.","Post level 6, you can guarantee your E pull by setting it up with your ultimate with your ult's 75% slow."]}]}]},{"nome":"Sylas","planilha":"Sylas","id":"Sylas","titulo":"o Abjugado","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main poke tool)","10 / 9 / 8 / 7 / 6"],["W (Heal / Targeted Dash)","12 / 10.5 / 9 / 7.5 / 6"],["E (Dash -> Chain Dash)","13 / 12 / 11 / 10 / 9"],["Ult","80 / 55 / 30 ( 200% for each target's base ultimate cooldown )"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, get priority of the wave and stand behind minions in case he levels up his E for damage.","Level 2, level up your W and play as aggressively as possible while still going back every so often to negate his E2 (Abduct) damage with your minions.","Level 3, shove the third wave, crash it, and either recall for some items or stay in lane to hold a freeze when the wave inevitably bounces back towards you."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["When it comes to trading with Sylas, the most you can do is just zone him out of minions whenever his Q (Chain Lash) is down with your own Q."]},{"tipo":"p","texto":"You can't really force a fight onto him with your E since he can just dash out of it with his E1 (Abscond),"},{"tipo":"p","texto":"But it's not like he can dash onto you since you can easily just sidestep back into your minions and consequently punish him with your own E and extend said trade towards an all-in since his kit is oriented towards cycling his abilities for burst damage."},{"tipo":"p","texto":"Just wait until you get your Dusk & Dawn and then win any fight he takes onto you."},{"tipo":"p","texto":"Even if he dodges all of your Q's with his dashes and potentially his rocketbelt, it shouldn't matter anyways since you have Dusk & Dawn + PTA and can just auto attack him to death."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Whoever ults second has a huge advantage over the other because they can steal more stats back."]},{"tipo":"p","texto":"So, if you can, try holding your ultimate in the 1v1 until AFTER he's used his stolen mordekaiser ultimate on you."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["In the mid game, most Sylas players just like to yoink Mordekaiser ultimate and ult anyone except for Mordekaiser in teamfights ( If they ult you, just ult him back and it's a free kill )."]},{"tipo":"p","texto":"From here you have three options:"},{"tipo":"p","texto":"1. Ult someone else so that now, it's a 2v2 in the death realm. 2. Ult the Sylas before he can ult one of your hyper carries so that he's neutralized, you might actually lose the fight now, but at least your hypercarry can still contribute to the fight 3. You kill the Sylas after he leaves your ultimate and give him the PTSD that only Mordekaiser mains know of; being abandoned by your team after you kill someone in your death realm."},{"tipo":"p","texto":"But yeah, he's not a hard counter to Mordekaiser because he will almost 100% lose an all-in against you ( unless you ult him first and then he ults you )."},{"tipo":"p","texto":"Additional note: You can tell if he can use your ultimate or not based on the duration of the Sylas-ult-effect that's on top of you and if he doesn't actively have your ult showcasing next to his health bar."},{"tipo":"p","texto":"If this is the case, then you can just ult him straight up with no worries."}]}]},{"nome":"Syndra","planilha":"Syndra","id":"Syndra","titulo":"a Soberana Sombria","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her stun duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main poke tool)","7"],["W (Telekinetic grab)","13 / 12 / 11 / 10 / 9"],["E (Main peel tool)","15"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Unless the Syndra stupidly uses her E knockback on the air, there's not much you can really do to threaten her throughout the early game.","Just play safe, try not to get lined up for her Q -> E stun combo, and keep crashing rebounding waves while powering through her poke, at least until level 6."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Once you do reach level 6, (no, you are not going to be able to trade before then, welcome to Mordekaiser top lane), wait for the wave to be on your side of the lane, and then: walk excessively aggressively:"]},{"tipo":"p","texto":"If she goes for a Q -> E stun, flash it (or eat it and save your flash), and then ult her for an all-in."},{"tipo":"p","texto":"She's pretty hopeless in extended fights as most of her damage is ability rotation based."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["As long as Syndra has her Q and W or her E active, you can't really walk up to her until she's burnt her CC tools, at least: before you get your mercury treads and rocketbelt powerspikes."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to use your ultimate during the start of her ultimate to almost completely negate it since her balls won't come to the death realm.","Syndra has a stacking mechanic where if she deals two instances of  damage to an enemy champion within 4 seconds, she'll grant herself 1 / 2 / 3 (based on level) Splinters."]},{"tipo":"p","texto":"And once she gets 120 splinters, her AP has a permanent +15% bonus."},{"tipo":"p","texto":"So try and focus immensely on dodging her skillshots if you so happen to get hit by one to delay her 120 splinter powerspike for as long as possible."}]}]},{"nome":"Tahm Kench","planilha":"Tahm Kench","id":"TahmKench","titulo":"o Rei do Rio","dificuldade":{"early":1,"mid":2,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred his magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main poke tool)","7 / 6.5 / 6 / 5.5 / 5"],["W (Knockup)","21 / 20 / 19 / 18 / 17 (Refunds by 40 - 50% if he lands it )"],["E (Grey health shield)","3"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Tahm Kench has HORRIBLE wave control, meaning that you can easily secure level 2 priority into him.","Slow push the first three waves, crash it, and then either recall or let the wave rebound for a freeze.","The only thing you have to do is not walk in front of the minions while pushing out the wave. If you can manage to do that, you'll be fine."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Stand behind the minions and try to play as aggressively proactively as you can while still being able to dip behind the wave for cover from his Q."]},{"tipo":"p","texto":"Before level 6: If he ever overextends to Q you, land your E while he's self-rooted and commit towards an all-in."},{"tipo":"p","texto":"Post level 6: If he's near your turret, you can ult him and save your E for when he goes for his W."},{"tipo":"p","texto":"Alternatively, you can also try using your E to set up your ultimate to make it so that he never gets the opportunity to W (Abyssal Dive) towards an empty vision pocket to begin with."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["The only possible way that the Tahm Kench can get a kill onto you is if you overextend near his turret post-level 6 and consequently get kidnapped for your over-confidence."]},{"tipo":"p","texto":"So just let the wave slowly bounce back and play towards a freeze whenever you can to avoid this scenario."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you want to fight the Tahm Kench, let the wave push back towards you."]},{"tipo":"p","texto":"But if you want to do literally anything else, shove the wave as much as possible without being in danger of getting kidnapped under his turret since Tahm Kench has one of the worst wave clearing capabilities in the entire game."}]}]},{"nome":"Taliyah","planilha":"Taliyah","id":"Taliyah","titulo":"a Tecelã de Pedras","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her stun duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main poke tool)","7 / 6 / 5 / 4 / 3"],["W (Knockup)","14 / 12.5 / 11 / 9.5 / 8"],["E (Unraveled Earth)","14"],["Ult","180 / 150 / 120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Like most ranged matchups, just let the wave push into you, and preserve your HP to secure a rebound, and then just freeze the wave so that she has to overextend in order to farm.","Post level 6, you almost always want to have the wave on your side of the lane, until you get too low to maintain it, in which case: you should just push the wave out, secure a crash, secure a recall, and then rinse and repeat."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Stand behind minions to avoid tanking damage from her Q, and then: while it's down, walk up aggressively to see if you can punish her cooldown window.","If she goes for an E -> W rupture angle, and she's low, flash it, and then all-in her to death.","Level 6, it's all just a matter of getting that initial distance to buffer your ultimate into her W rupture, If you can manage to do that, you should have been able to secure an all-in for a free kill."]},{"tipo":"p","texto":"This gets a lot easier once you get rocketbelt, but be wary, since if you rocketbelt too late and/or into her E (Unraveled Earth), you will get stunned."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Don't use your rocketbelt into her E (Unraveled Earth), unless you want to explicitly get stunned.","Post level 6, whenever you don't explicitly see the Taliyah in lane, assume that she is roaming and ping accordingly."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can ult away Taliyah's E (Unraveled Earth), but this won't really matter too much if she's competent enough to use her spells in time."]}]}]},{"nome":"Talon","planilha":"Talon","id":"Talon","titulo":"a Sombra da Lâmina","dificuldade":{"early":3,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Hail Of Blades","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/HailOfBlades/HailOfBlades.png"},{"nome":"Taste Of Blood","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/TasteOfBlood/GreenTerror_TasteOfBlood.png"},{"nome":"Grisly Mementos","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/GrislyMementos/GrislyMementos.png"},{"nome":"Ultimate Hunter","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/UltimateHunter/UltimateHunter.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive -> Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Hextech Gunblade","passos":[[{"nome":"Hextech Gunblade","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223146.png"}]],"motivo":"( To play off of HOB's mixed damage scaling)"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To Reduce His Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Extra Omnivamp )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main damage tool)","8 / 7.5 / 7 / 6.5 / 6"],["W (Main poke tool)","9 / 8.5 / 8 / 7.5 / 7"],["E (Flip)","2 ( On-Terrain Cooldown: 160 / 135 / 110 / 85 / 60 )"],["Ult","100 / 80 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Most Talon players should concede level 1 priority because of their overall weak all-in power compared to Mordekaiser, so just get level priority.","Level 2, if the Talon walks up for CS, level up your W and apply a shield bash procc against them, otherwise: just focus on slow pushing the wave.","Crash the third wave, and then go for either a reset or wait for a rebound back to your turret."]},{"tipo":"p","texto":"Ideally, you want to have a long lane so that you can punisht the down-time Talon players have they land all of their abilities."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Just try poking them out with Q's over and over again while continiously fishing for shield bash procc's,"]},{"tipo":"p","texto":"If they dash on top of you, or if you're able to get the distance in, trade with them with hail of blades, and use your W + shield bash procc on the third auto attack to get the most amount of total uptime."},{"tipo":"lista","itens":["Once you reach level 6, and they have a relatively low amount of HP, wait for them to walk up to the wave to land a W to last a minion, and then land your E -> R to secure a pull and subsequent all-in with your ultimate's 75% slow.","You should always be able to win an all-in, asumming you are not low enough to get bursted down by Talon's full combo."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Make sure to position your ultimate in a way where he can't just flip over a wall and escape you entirely."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Whenever Talon is not in lane, BE SURE TO PING your teammates that there is a Talon in the game because there's a good chance he might be roaming instead of laning against you."]}]}]},{"nome":"Taric","planilha":"Taric","id":"Taric","titulo":"o Escudo de Valoran","dificuldade":{"early":3,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity"
