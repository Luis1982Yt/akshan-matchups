/* ---------- Akshan 3D ----------
   Modelo do jogo (modelo/akshan.glb, gerado por scripts/modelo3d) em idle; arrastar gira, clique faz
   uma emote e os botões tocam cada animação. Só carrega em tela larga, no guia do Akshan e no site
   publicado (aberto como arquivo o navegador bloqueia o .glb), depois que o resto da página abriu.
   O X da caixa esconde e centraliza tudo de novo (vem ligado); a alça na borda direita traz de volta. */
const TELA_3D = matchMedia("(min-width: 1720px)");
// Cada botão toca uma sequência de clipes: [nome no .glb, quantas vezes].
const SEQ_3D = {
  dance: [["dance_intro", 1], ["dance", 2]], taunt: [["taunt_intro", 1], ["taunt", 3]], laugh: [["laugh", 1]],
  attack: [["attack1", 1], ["attack2", 1], ["crit", 1], ["crit_to_idle", 1]], recall: [["recall", 1]],
};
const EMOTES_3D = ["dance", "taunt", "laugh"];
// Sons tirados dos bancos do jogo (sons/akshan3d, gerados por scripts/modelo3d/sons3d.py): quantas variações
// cada um tem (o jogo sorteia uma) e o que toca quando cada clipe começa. "nome@0.3" = 0,3 s depois;
// "nome~" repete até a sequência acabar (a música da dança).
const VARIACOES_3D = { dance_cast: 1, dance: 1, taunt_cast: 1, taunt: 8, laugh: 1, recall: 1, aa1: 3, aa2: 3, crit: 3,
  vo_taunt: 1, vo_laugh: 1, vo_recall: 5, vo_aa1: 4, vo_aa2: 4, vo_crit: 4 };
const SONS_CLIPE_3D = {
  dance_intro: ["dance_cast"], dance: ["dance~"], taunt_intro: ["taunt_cast", "vo_taunt"], taunt: ["taunt"],
  laugh: ["laugh", "vo_laugh"], recall: ["recall", "vo_recall"],
  attack1: ["aa1@.15", "vo_aa1"], attack2: ["aa2@.15", "vo_aa2"], crit: ["crit@.2", "vo_crit"],
};
const SONS_VOLTA_3D = { taunt: ["taunt"] };
// Variações das falas em inglês, quando diferem das em português.
const VARIACOES_VO_EN = {};  // tocam de novo a cada repetição do clipe
let sons3d = [];
// Ao voltar para o idle, só os sons que repetem param; falas e efeitos terminam sozinhos.
function paraRepeticoes3d() { sons3d.forEach(x => { if (x.loop) x.pause(); }); }
function paraSons3d() {
  sons3d.forEach(x => (x.pause ? x.pause() : clearTimeout(x)));
  sons3d = [];
}
function tocaSons3d(lista) {
  if (!somLigado || !lista) return;
  lista.forEach(item => {
    const repete = item.endsWith("~");
    const [nome, atraso] = item.replace("~", "").split("@");
    const vo = nome.startsWith("vo_"), k0 = skinAtual();
    const n = (vo && L === "en" && VARIACOES_VO_EN[nome]) || (k0.id && !vo && k0.sons && k0.sons[nome]) || VARIACOES_3D[nome];
    if (!n) return;
    const vai = () => {
      // Efeitos: pasta da skin. Falas: pasta da língua (sons/akshan3d/en/ no modo inglês).
      const k = skinAtual(), pasta = vo ? (L === "en" ? "en/" : "") : (k.id ? k.id + "/" : "");
      const a = new Audio(`sons/akshan3d/${pasta}${nome}-${Math.floor(Math.random() * n)}.ogg`);
      a.volume = nome.startsWith("vo_") ? .8 : nome === "dance" ? .45 : .5;
      a.loop = repete;
      a.play().catch(() => {});
      sons3d.push(a);
    };
    if (atraso) sons3d.push(setTimeout(vai, parseFloat(atraso) * 1000)); else vai();
  });
}
let estado3d = "";  // "" ainda não tentou, "carregando", "pronto" ou "falhou"
let ligado3d = true;
try { ligado3d = localStorage.getItem("akshan3d") !== "0"; } catch (e) {}

function atualiza3d() {
  const pode = location.protocol !== "file:" && TELA_3D.matches && guia && guia.id === "akshan" && estado3d !== "falhou";
  $("abre3d").hidden = !(pode && !ligado3d);
  document.documentElement.classList.toggle("com-3d", pode && ligado3d);
  if (pode && ligado3d && !estado3d) iniciaAkshan3d();
}
function liga3d(sim) {
  ligado3d = sim;
  if (!sim) paraSons3d();
  try { localStorage.setItem("akshan3d", sim ? "1" : "0"); } catch (e) {}
  toca(sim ? "abre" : "fecha");
  atualiza3d();
  (sim ? $("fecha3d") : $("abre3d")).focus({ preventScroll: true });
}
$("fecha3d").addEventListener("click", () => liga3d(false));
$("abre3d").addEventListener("click", () => liga3d(true));

let geracao3d = 0, desmonta3d = null, chroma3d = null;
// Troca de skin com o 3D aberto: desmonta a cena atual e carrega o modelo da skin nova.
function recarrega3d() {
  if (!estado3d || estado3d === "falhou") return;
  geracao3d++;
  if (desmonta3d) { desmonta3d(); desmonta3d = null; }
  estado3d = "";
  atualiza3d();
}
async function iniciaAkshan3d() {
  estado3d = "carregando";
  const geracao = ++geracao3d;
  const box = $("akshan3d"), canvas = $("cena3d");
  box.classList.remove("pronto");
  try {
    const [THREE, { GLTFLoader }, bytes] = await Promise.all([
      import("three"), import("three/addons/loaders/GLTFLoader.js"),
      fetch(modeloSkin(skinAtual())).then(r => { if (!r.ok) throw new Error("modelo " + r.status); return r.arrayBuffer(); }),
    ]);
    const gltf = await new GLTFLoader().parseAsync(bytes, "");
    if (geracao !== geracao3d) return;  // trocaram de skin enquanto baixava
    const fim = new AbortController(), ouve = { signal: fim.signal };
    const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    r.setClearColor(0x000000, 0);
    r.outputColorSpace = THREE.SRGBColorSpace;
    const cena = new THREE.Scene(), cam = new THREE.PerspectiveCamera(26, 1, 10, 4000);
    cena.add(new THREE.HemisphereLight(0xfff4d6, 0x221a0c, 1.1));
    const luz = new THREE.DirectionalLight(0xffd66b, 2.2); luz.position.set(200, 400, 300); cena.add(luz);
    const contorno = new THREE.DirectionalLight(0xffc24a, 3); contorno.position.set(-300, 250, -400); cena.add(contorno);
    const m = gltf.scene;
    // O jogo dá luz própria à textura (selfIllumination 0.7): emissivo com o mesmo mapa.
    m.traverse(o => { if (o.isMesh) { const mt = o.material; mt.emissive = new THREE.Color(0xffffff); mt.emissiveMap = mt.map; mt.emissiveIntensity = .55; o.frustumCulled = false; } });
    // Chroma: troca o mapa de cor dos materiais (nome do material = chave da textura) e guarda o original.
    const mats = new Map(), carregador = new THREE.TextureLoader().setCrossOrigin("anonymous");
    m.traverse(o => { if (o.isMesh && !mats.has(o.material.name)) mats.set(o.material.name, { mt: [], orig: o.material.map }); if (o.isMesh) mats.get(o.material.name).mt.push(o.material); });
    const aplicaMapa = (chave, mapa) => (mats.get(chave) || { mt: [] }).mt.forEach(mt => { mt.map = mapa; mt.emissiveMap = mapa; mt.needsUpdate = true; });
    chroma3d = () => {
      const ch = chromaAtual();
      mats.forEach((v, chave) => aplicaMapa(chave, v.orig));
      if (!ch) return;
      Object.entries(ch.texturas).forEach(([chave, url]) => {
        if (!mats.has(chave)) return;
        carregador.load(url, tx => {
          if (chromaAtual() !== ch) { tx.dispose(); return; }  // trocaram de novo enquanto baixava
          const orig = mats.get(chave).orig;
          tx.flipY = orig.flipY; tx.colorSpace = orig.colorSpace; tx.wrapS = orig.wrapS; tx.wrapT = orig.wrapT;
          aplicaMapa(chave, tx);
        });
      });
    };
    chroma3d();
    m.rotation.y = -.35;  // de leve virado para o conteúdo, à esquerda
    cena.add(m);
    const caixa = new THREE.Box3().setFromObject(m), centro = caixa.getCenter(new THREE.Vector3()), alt = caixa.getSize(new THREE.Vector3()).y;
    // Brilho dourado no chão, embaixo dos pés (círculo com degradê, desenhado num canvas 2D).
    const tela = document.createElement("canvas"); tela.width = tela.height = 128;
    const g2 = tela.getContext("2d"), grad = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, "rgba(255,200,90,.55)"); grad.addColorStop(1, "rgba(255,200,90,0)");
    g2.fillStyle = grad; g2.fillRect(0, 0, 128, 128);
    const chao = new THREE.Mesh(new THREE.PlaneGeometry(alt * .75, alt * .75),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(tela), transparent: true, depthWrite: false }));
    chao.rotation.x = -Math.PI / 2; chao.position.set(centro.x, caixa.min.y + 1, centro.z);
    cena.add(chao);
    // Folga para os chutes da dança e o braço levantado da piada.
    const enquadra = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(w, h, false);
      cam.aspect = w / h;
      const dist = (alt * 1.25 / 2) / Math.tan(THREE.MathUtils.degToRad(cam.fov / 2)) / Math.min(1, cam.aspect / .55);
      cam.position.set(centro.x, centro.y + alt * .04, centro.z + dist); cam.lookAt(centro.x, centro.y + alt * .04, centro.z);
      cam.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(enquadra); ro.observe(canvas);
    enquadra();

    const mixer = new THREE.AnimationMixer(m), clipe = n => gltf.animations.find(a => a.name === n);
    const acao = (n, vezes) => { const a = mixer.clipAction(clipe(n)); a.setLoop(THREE.LoopRepeat, vezes || Infinity); a.clampWhenFinished = true; return a; };
    const idle = acao("idle");
    const parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let atual = idle, fila = [], emote = null, ultima = "", voltas = 0;
    const tocaClipe = a => { a.reset().play(); if (atual !== a) a.crossFadeFrom(atual, .25, false); atual = a; tocaSons3d(SONS_CLIPE_3D[a.getClip().name]); };
    const marcaBotoes = () => $("anim3d").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.anim === emote));
    const proximo = () => {
      if (fila.length) { const [n, v] = fila.shift(); tocaClipe(acao(n, v)); return; }
      emote = null; marcaBotoes(); paraRepeticoes3d(); tocaClipe(idle);
    };
    const anima = nome => { paraSons3d(); emote = nome; fila = SEQ_3D[nome].slice(); marcaBotoes(); proximo(); };
    mixer.addEventListener("finished", proximo);
    // De tempos em tempos o idle troca pela variação.
    mixer.addEventListener("loop", e => {
      if (e.action !== idle) { tocaSons3d(SONS_VOLTA_3D[e.action.getClip().name]); return; }
      if (emote || parado) return;
      if (++voltas % 3 === 0) { emote = "var"; fila = [["idle_var", 1]]; proximo(); }
    });
    if (parado) idle.paused = true;  // com "reduzir movimento" o idle fica parado; os botões ainda funcionam

    $("anim3d").innerHTML = Object.keys(SEQ_3D).map(n => n.length === 1
      ? `<button type="button" class="tecla" data-anim="${n}" aria-pressed="false">${n.toUpperCase()}</button>`
      : `<button type="button" data-anim="${n}" data-t="a_${n}" aria-pressed="false">${t("a_" + n)}</button>`).join("");
    $("anim3d").addEventListener("click", e => { const b = e.target.closest("[data-anim]"); if (b) anima(b.dataset.anim); }, ouve);

    // Arrastar gira; clique sem arrastar faz uma emote sorteada.
    let arrasto = null;
    canvas.addEventListener("pointerdown", e => { arrasto = { x: e.clientX, girou: false }; canvas.setPointerCapture(e.pointerId); }, ouve);
    canvas.addEventListener("pointermove", e => {
      if (!arrasto) return;
      const dx = e.clientX - arrasto.x;
      if (!arrasto.girou && Math.abs(dx) < 4) return;
      arrasto.girou = true; canvas.classList.add("girando");
      m.rotation.y += dx * .012; arrasto.x = e.clientX;
    }, ouve);
    const solta = () => {
      if (arrasto && !arrasto.girou) {
        const op = EMOTES_3D.filter(n => n !== ultima);
        anima(ultima = op[Math.floor(Math.random() * op.length)]);
      }
      arrasto = null; canvas.classList.remove("girando");
    };
    canvas.addEventListener("pointerup", solta, ouve);
    canvas.addEventListener("pointercancel", () => { arrasto = null; canvas.classList.remove("girando"); }, ouve);

    idle.play();
    const relogio = new THREE.Clock();
    let visivel = true;
    const io = new IntersectionObserver(([e]) => { visivel = e.isIntersecting; }); io.observe(box);
    const quadro = () => {
      if (fim.signal.aborted) return;
      const dt = relogio.getDelta();
      if (!document.hidden && visivel && box.offsetParent) { mixer.update(Math.min(dt, .1)); r.render(cena, cam); }
      requestAnimationFrame(quadro);
    };
    mixer.update(0);
    quadro();
    desmonta3d = () => {
      chroma3d = null;
      fim.abort(); ro.disconnect(); io.disconnect(); paraSons3d(); mixer.stopAllAction();
      cena.traverse(o => { if (o.isMesh) { o.geometry.dispose(); [].concat(o.material).forEach(mt => { mt.map && mt.map.dispose(); mt.dispose(); }); } });
      r.dispose();
    };
    box.classList.add("pronto");
    estado3d = "pronto";
  } catch (e) {
    console.warn("Akshan 3D não carregou:", e);
    estado3d = "falhou";
    atualiza3d();
  }
}
setTimeout(atualiza3d, 50);
// App instalável e abrindo sem internet (sw.js); aberto como arquivo não tem como.
// Contador de visitas da Vercel (Web Analytics): sem cookies, só no site publicado.
if (location.hostname.endsWith("vercel.app")) {
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  const sv = document.createElement("script"); sv.defer = true; sv.src = "/_vercel/insights/script.js"; document.head.appendChild(sv);
}
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}  // logo depois de montar a página, sem esperar as imagens
TELA_3D.addEventListener("change", atualiza3d);
</script>
