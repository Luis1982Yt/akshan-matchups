,"icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Unflinching","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Unflinching/Unflinching.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive Force","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( To reduce his healing / sustain )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce his stun duration )"},{"tipo":"item","texto":"Liandry's / Dusk & Dawn","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Tanky team vs. Squishy team )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred his magic resist )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Note","All of his basic abilities have their cooldowns reduced by 1 - 2 seconds per passive hit."],["Q (Heal)","3"],["W (Tether / Shield)","15"],["E (Stun)","16 / 15 / 14 / 13 / 12"],["Ult","180 / 150 / 120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Taric genuinely has terrifying all-in potential until you've gotten some sort of anti-healing to cut down his sustain.","Give up level 1 priority, and play exclusively towards short trading with him.","Level 2, level up your W and only fight him with your Q's and shield bash auto attacks.","Level 3 is when the wave is going to start slowly rebounding towards him, assuming you let the wave push towards you, make sure your HP is high so that you can effectively secure the crash."]},{"tipo":"p","texto":"Keep playing safe until you've gotten Oblivion Orb, and once you've gotten that powerspike, you can expand your trade durations a little bit to make him use more of his mana."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before you get your oblivion orb, the only trades you want to be doing against him are max range Q's, and shield bash procc's if he ever gets too close."]},{"tipo":"p","texto":"Trading with him long in the early game is a generally bad idea since he'll just be able to out-sustain you."},{"tipo":"lista","itens":["Once you do get your oblivion orb powerspike, you can start prolonging trades until your W shield gets low to make him use more of his mana on healing himself with his Q."]},{"tipo":"p","texto":"If he gets low enough for an all-in to kill him (around 30% HP) or if he runs out mana, prolong the trade."},{"tipo":"lista","itens":["Follow the same philosophy once you get your ultimate."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["In teamfights, make sure to ult away the Taric when he starts to use his ultimate so that your team doesn't have to deal with a bunch of invulnerable enemies."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Do not underestimate Taric's all-in pressure early game despite him being a support champion. It is deceptively strong."]}]}]},{"nome":"Teemo","planilha":"Teemo","id":"Teemo","titulo":"o Explorador Veloz","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adapative Force","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( So you can keep your passive on-going with auto attacks )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( So you can keep up with him and make his W less annoying )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( To Deal Damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Blind)","7"],["W (MS Boost)","14"],["E (Poison)","Passive"],["Ult","0.25 ( Recharge: 35 / 30 / 25 )"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, don't walk up until you see the Teemo in action, Some Teemo players will try and cheese you for a lot of damage using their passive.","Give up level 2 priority, and play for the rebound back to his turret.","Afterwards, just rebound the wave, and find a recall angle to start building towards your mercury treads and just keep repeating the cycle of waves bouncing back and forth until you've gotten your level 6 powerspike."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, most of the time, you're not going to be able to find an all-in angle since Teemo's just so damn fast with his W movement speed,"]},{"tipo":"p","texto":"But: there is a slight window that you can abuse when Teemo goes for his auto attacks and Q animation respectively since both of them momentarily root him for a split second, which MIGHT be long enough for you to land your E and subsequently your Q for an all-in with your passive."},{"tipo":"p","texto":"Try to trade for as long as possible until your W shield is about to break down."},{"tipo":"lista","itens":["Post level 6: this matchup gets a lot easier since you can guarantee your E grab with your ultimate's 75% slow by combo-ing your E into your R when he goes for his aforementioned auto attack and Q animations."]},{"tipo":"p","texto":"Although: I'd recommend trying to save your ult for as long as possible until you're just about to run into a shroom, in which case: you can just ult it away."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Be wary of Teemo's invisibility passive at all times, if the situation feels too good to be true; if you're allowed to get a seemingly free turret plate, it probably is."]},{"tipo":"p","texto":"Back off."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Before an important objective, get a sweeper trinket and clear the upcoming pathway to the objective with said sweeper to get rid of any shrooms that may be in the way."]}]}]},{"nome":"Thresh","planilha":"Thresh","id":"Thresh","titulo":"o Guardião das Correntes","dificuldade":{"early":3,"mid":1,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Ability Haste","icone":null},{"nome":"Adapative Force","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt / Riftmaker","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"},{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( On-hit vs. Tank Thresh )"},{"tipo":"item","texto":"Plated Steelcaps / Mecury's Treads","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"},{"nome":"Mecury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( On-hit vs. Tank Thresh )"},{"tipo":"item","texto":"Dusk & Dawn / Cosmic Drive","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( On-hit vs. Tank Thresh )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Hook)","19 / 16.5 / 14 / 11.5 / 9"],["W (Shield)","21 / 20 / 19 / 18 / 17"],["E (Flay)","13 / 12.25 / 11.5 / 10.75 / 10"],["Ult","100 / 80 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Just let the Thresh push into you during the first three waves since there's not much you can do against ranged matchups in the early laning phase.","Then: just rebound the wave, and then either recall for health or stay in lane to not miss EXP.","If you ever get to low from his poke, don't ego, and just recall for HP, you'll hard-win at level 6 anyways."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Ideally wait for the Thresh to use his empowered E auto attack on the minions before walking up to CS since you'll take more damage from his short trades if you don't.","If he goes for an auto attack -> E pull onto you, respond with an ability buffer with your E -> Q and then just force an all-in until your W shield gets low since he's relatively weak in the all-ins."]},{"tipo":"p","texto":"Do note that some Thresh players might lean into lethal tempo for extra power in extended trades, in which case you should only commit towards all-ins while the wave is near your turret so that you have that extra buffer period to back off when your W shield starts to decay significantly."},{"tipo":"lista","itens":["Post level 6: you should just be able to out-stat check him in any trades you go into him."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["The only possible way that the Thresh can get a solo kill onto you is if you overextend near his turret while your minions are low and consequently get kidnapped for your over-confidence."]},{"tipo":"p","texto":"So just let the wave slowly bounce back and play towards a freeze whenever you can to avoid this scenario."},{"tipo":"lista","itens":["Be hyper aware of where the enemy jungler is since he has incredibly effective gank setup with his W and CC tools in his kit."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Thresh's The Box (R) pillars will be visible in all realms, but it will only affect enemies in the realm it was cast. So don't be afraid to use your ultimate on his ult."]}]}]},{"nome":"Tristana","planilha":"Tristana","id":"Tristana","titulo":"a Artilheira Yordle","dificuldade":{"early":4,"mid":3,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Anti kite + reduces her damage )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Attack speed boost)","20 / 19 / 18 / 17 / 16"],["W (Leap)","22 / 20 / 18 / 16 / 14 (Resets on takedown or if her E is popped on max stacks)"],["E (Explosive Charge)","16 / 15.5 / 15 / 14.5 / 14"],["Ult","100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Your main goal in this lane is to just wait until you get your plated steelcaps powerspike to E -> R -> run her down for a free solokill,"]},{"tipo":"p","texto":"Until then, just play safe with your Second Wind + Doran's Shield sustain."},{"tipo":"p","texto":";Let the wave push into you, play for the rebound, recall, and just rinse and repeat until you've gotten your ult and your plated steelcaps powerspikes."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your Q's and E grabs with her auto attack animation since in the early game, it's relatively low at a base 550 range"]},{"tipo":"p","texto":"If she's on your side of the lane, and you've procc'd Stormraider's rush with your E + Q, feel free to run her down after she uses her leap since she'll no longer have one of her key peel tools."},{"tipo":"lista","itens":["Post level 6, when the wave is on your side of the lane, it's basically the same idea except when you cast your E, you should follow it up with your ultimate to lock her down in your ultimate."]},{"tipo":"p","texto":"She'll probably use her ultimate to knock you away, but because of your ult's duration and stormraider's movement speed, you should be able to catch up with her."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Tristana has not one, but two ways to peel you off of her; her W leap, and her ultimate knockback."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ideally try to have your ultimate in a wide and open area to deny her from knocking you away, and then jumping over a wall to escape from you.","Tristana's attack range increases with each level up, but as long as you rush hextech rocketbelt, it shouldn't really matter too much."]}]}]},{"nome":"Trundle","planilha":"Trundle","id":"Trundle","titulo":"o Rei dos Trolls","dificuldade":{"early":3,"mid":2,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Maximum Burst )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Reduces His Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA)","3.5"],["W (Attack speed / MS Empowerement Zone)","18 / 17 / 16 / 15 / 14"],["E (Pillar)","21 / 19.5 / 18 / 16.5 / 15"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Trundle is EXTREMELY deadly when you get into melee range of him, so just give up level 2 priority, and play towards rebounding the wave back towards him."]},{"tipo":"p","texto":"When you crash the wave, recall for some items, and play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Ideally, you want to try poking him down with your Q while making sure you're not in range for him to create an extended trade with his E pillar.","If he ever gets too close, E backwards to push him away from you.","Once you're level 6 and he's in lethal range ( About 40% HP ), you can walk up a bit closer to him, if he R's, instantly ult him.","Additionally: If Trundle R's you, you should ignite him immediately to cut his healing and then proceed to ult him back to steal your stats back."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["DO NOT stand near walls when you're going against a Trundle since Trundle has the ability to use his pillar to make it so that you're completely stuck in said wall for the next 6 seconds of your life."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Play exclusively around your ignite and ultimate timers so that you have the highest possible chance of winning.","You can ult away Trundle's Frozen Domain and pillar with your ultimate if you're confident in winning, but just be wary that he's probably going to immediately ult you afterwards."]},{"tipo":"p","texto":"Make sure you ignite his ultimate or have some form of grevious wounds, because otherwise:"},{"tipo":"p","texto":"You will die."}]}]},{"nome":"Tryndamere","planilha":"Tryndamere","id":"Tryndamere","titulo":"o Rei Bárbaro","dificuldade":{"early":4,"mid":3,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Grasp Of The Undying","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/GraspOfTheUndying/GraspOfTheUndying.png"},{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Warden's Mail","passos":[[{"nome":"Warden's Mail","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3082.png"}]],"motivo":"( To reduce his burst damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Maximum Burst^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Heal)","12"],["W (AD Reduction / Slow)","14"],["E (Dash)","12 / 11 / 10 / 9 / 8 (Lowered by 0.75 / 1.5 seconds [ On champs ], if he crits)"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Tryndamere, with grasp or hail of blades or lethal tempo is always going to be EXTREMELY scary when you fight him close-range."]},{"tipo":"p","texto":"Give up level 2 priority, stay behind minions, and poke him down when he overextends onto you."},{"tipo":"p","texto":"When the wave gets your turret, play for the rebound and slowly push it out while continously poking the Tryndamere as you slowly push out."},{"tipo":"p","texto":"Afterwards, get a recall off, and get your Warden's Mail / Plated Steelcaps components (Dealer's choice)."},{"tipo":"p","texto":"You'll still probably not be able to beat him when you do get Warden's Mail / plated steelcaps in an all-in, but it does help with giving you a little bit more time to stall out his ultimate."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Ideally try to stand outside of his auto attack range and force him to use his E spin against you if he ever wants to trade with you.","If he doesn't spin onto you, keep playing the neutral game and keep repeatedly poking him with your Q's over and over again.","If Tryndamere does spin on you, use your W, procc your grasp + shield bash ontohim with an auto attack, and then E him away to then Q him on the head."]},{"tipo":"p","texto":"You never want to play fair; only play towards short trades until he's really low HP (30% hp), AND you have exhaust."},{"tipo":"p","texto":"If he's in lethal range, try to time your E when he's in the middle of his auto attack animation (or if he's already used it), exhaust him when he's in range and pray that you have enough damage to get him to use his ultimate early."},{"tipo":"p","texto":"If you can get him to use his ultimate early, run and stall for at long as possible: but not too far in case you can potentially snag a kill against him."},{"tipo":"p","texto":"If you're successful in surviving, you can walk back and finish him off with a Q onto the head."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Be exceptionally aware of what runes the Tryndamere is going since it will determine the amount of leniency you have when it comes to the duration of trades."]},{"tipo":"p","texto":"Grasp Tryndamere is only useful for the initial auto attack and should be traded with a little bit longer with your shield bash and passive before backing off."},{"tipo":"p","texto":"Hail Of Blades Tryndamere requires you to keep the trade as short as physically possible to avoid tanking a potential triple crit combo IF he has a high amount of fury."},{"tipo":"p","texto":"If he doesn't have a high amount of fury, you can afford to extend a trade a little bit longer, so long as he's engaging on your side of the wave."},{"tipo":"p","texto":"And finally: Lethal Tempo Tryndamere requires you to exclusively play for short trades unless you know for sure that you can get a quick lethal procc against him."},{"tipo":"p","texto":"If a lethal tempo tryndamere uses his ultimate against you, use your E to force him off and do not engage him until his ultimate is just about to run out"}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to ult the Tryndamere when he's at lower HP so that you can yoink more AD.","In the mid game, try to keep lanes pushed out before teamfights so he cannot splitpush and destroy your entire base for free."]},{"tipo":"p","texto":"If he decides to push until priority is equal and join a teamfight, you can either ult him immediately when he jumps onto your backline OR you can use your ultimate after he ults so that you can stall for a couple of seconds and then instantly kill him when he leaves the death realm."}]}]},{"nome":"Twisted Fate","planilha":"Twisted Fate","id":"TwistedFate","titulo":"o Mestre das Cartas","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Mercury Treads / Plated Steelcaps","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"},{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Extra Tenacity vs. AP TF / Reduces damage vs. AD TF )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","6 / 5.75 / 5.5 / 5.25 / 5"],["W (Empowered AA)","6"],["E (On-hit effect)","Passive"],["Ult","170 / 140 / 110"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up level 1 priority since Twisted Fate's range advantage and poke is hard to deal with before you get your level 6 powerspike.","Honestly: just sit back, let the wave push into you, and stay healthy enough to efficiently play off the rebound back to his turret."]},{"tipo":"p","texto":"Once you get your level 6, you should be able to steamroll him by perma ulting him after buffering your E into his W stun card."},{"tipo":"p","texto":"So just play patient until then."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your E pulls for when Twisted Fate goes for auto attacks or tries to use his empowered W auto attack, if you land it: Q him on the head.","Post level 6: If he uses his yellow card on you, you should have enough tenacity to power through it, get your pull to land after buffering it into his card, and then you should just ult him and commit towards an all-in."]},{"tipo":"p","texto":"Even if he goes AD Twisted Fate, he doesn't have nearly enough damage to genuinely contest you."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Look at his build to see if you need to go either plated steelcaps or mercury treads,"]},{"tipo":"p","texto":"If he's going AD Twisted Fate: build plated steelcaps to nullify his all-in power. If he's going AP Twisted Fate: build mercury treads so that you can both reduce his CC duration and conveniently reduce his magic damage."},{"tipo":"lista","itens":["Be sure to ping 24/7 when Twisted Fate is level 6 since he can easily roam onto your allies and murder them in cold blood."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can time your ultimate extremely well, you can potentially get your ult off while his empowered W card is flying through the air, and negate it by traversing realms."]}]}]},{"nome":"Twitch","planilha":"Twitch","id":"Twitch","titulo":"o Semeador da Peste","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Invisibility / Attack speed steroid)","16 (Resets on takedown)"],["W (Slow)","13 / 12 / 11 / 10 / 9"],["E (Passive Detonation)","12 / 11 / 10 / 9 / 8"],["Ult","90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, don't walk up until you see the Twitch in action, Some Twitch players will try and cheese you for a lot of damage using their Q.","Give up level 2 priority, and play for the rebound back to his turret.","Afterwards, just rebound the wave, and find a recall angle to start building towards your mercury treads and just keep repeating the cycle of waves bouncing back and forth until you've gotten your level 6 powerspike."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Just wait for the Twitch to momentarily root himself when he goes for an auto attack on you or the wave and land your skillshots from there."]},{"tipo":"p","texto":"Try to trade for as long as possible until your W shield is about to break down."},{"tipo":"lista","itens":["Post level 6: This matchup gets even easier since not only can you more easily secure your E grab with your ultimate's 75% slow by combo-ing your E into your R when he goes for his aforementioned auto attack animations, but he will also most likely use some sort of stat steroid before your ult lands."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Whenever Twitch is not actively in lane, assume he is either roaming or hiding in a bush, in either case you should perma ping your teammates that there is a Twitch actively in the game."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ideally try to use your ultimate after he uses his ultimate and his Q, since you will be able to YOINK more stats that way (AD and attack speed respectively).","You can ult away Twitch's W if he uses it on you to not deal with it's slow."]}]}]},{"nome":"Udyr","planilha":"Udyr","id":"Udyr","titulo":"o Andarilho Espiritual","dificuldade":{"early":4,"mid":4,"late":4,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs. AD Udyr","linhas":[{"tipo":"item","texto":"Dark Seal / Boots","passos":[[{"nome":"Dark Seal","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1082.png"},{"nome":"Boots","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1001.png"}]],"motivo":"( To scout out his build )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Maximum Burst )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( Reduces His Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]},{"rotulo":"Items vs. Tank Udyr","linhas":[{"tipo":"item","texto":"Dark Seal / Boots","passos":[[{"nome":"Dark Seal","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1082.png"},{"nome":"Boots","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1001.png"}]],"motivo":"( To scout out his build )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item )"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( To reduce his healing / sustain )"},{"tipo":"item","texto":"Liandry's / Cosmic Drive","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"},{"nome":"Cosmic Drive","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224629.png"}]],"motivo":"( Damage / Mobility )"},{"tipo":"item","texto":"Bloodletter's Curse","passos":[[{"nome":"Bloodletter's Curse","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/4010.png"}]],"motivo":"( To shred their magic resist )"}]}],"secoes":[{"titulo":"","blocos":[{"tipo":"p","texto":"AD Udyr"}]},{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"p","texto":"Every form is 6 seconds."}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, sit back and let the wave slowly push into you.","Repeat the same process for the second and third waves, and conserve your HP so that you can effectively play off the rebound."]},{"tipo":"p","texto":"After you crash said rebounded wave, recall, let the wave slowly push back towards you, and then try to set up for a freeze so that you can play towards short trades on your conditions rather than his."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["If it's an AD Udyr, DO NOT let him get into melee range of you since he will completely shred your HP down with two quick awakened Q auto attacks."]},{"tipo":"p","texto":"Sit back, let him go for CS, Q him on the head, and if he ever charges at you with his E, pull him away unless you're 100% sure that you can kill him with an all-in lethal combo (15% HP)"}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Udyr has the ability to cancel your ultimate with his awakened E, so just wait for him to either be in a different stance before ulting him, or wait for him to use one of his awakened abilities."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you see the AD Udyr get close to one of your carries, use your ultimate on him as soon as he either switches out of his E stance or after he's used one of his awakened abilities."]},{"tipo":"p","texto":"If you are too late, your carry will die."},{"tipo":"p","texto":"If you proceed to ult him while he can still use his unstoppability, your ultimate will be wasted, but at the very least: he won't be able to one-shot anyone with an awakened Q anymore, which is nice."},{"tipo":"p","texto":"Tank Udyr"}]},{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"p","texto":"Every form is 6 seconds."}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, sit back and let the wave slowly push into you.","Repeat the same process for the second and third waves, and conserve your HP so that you can effectively play off the rebound."]},{"tipo":"p","texto":"After you crash said rebounded wave, recall, let the wave slowly push back towards you, and then try to set up for a freeze so that you can run the Udyr down whenever he walks up for CS."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["If it's a Tank Udyr, feel free to hit him whenever he walks up to minions and try to extend trades for as long as possible until your W shield gets low since it's not like he can do much damage to you anyways."]},{"tipo":"p","texto":"If the Tank Udyr is at low HP, be sure to zone him off of minions with your Q to deny him from healing off of the wave with his W for free."},{"tipo":"p","texto":"Most of the time though: this lane is going to be relatively AFK until you start getting into teamfights."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Udyr has the ability to cancel your ultimate with his awakened E, so just wait for him to either be in a different stance before ulting him, or wait for him to use one of his awakened abilities."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Post level 6, if Udyr ever uses his awakened ultimate onto you, and you're still in range of him: feel free to ult him because your DOMAIN EXPANSION will overtake his PUNY and PATHETIC ice storm and will negate it completely."]},{"tipo":"p","texto":"This also works extremely well in teamfights if you have nobody else that you should use your ultimate against."}]}]},{"nome":"Urgot","planilha":"Urgot","id":"Urgot","titulo":"o Encouraçado","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Cut Down","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/CutDown/CutDown.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Warden's Mail","passos":[[{"nome":"Warden's Mail","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3082.png"}]],"motivo":"( To Reduce His Early Damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^)"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To Reduce His Damage Further )"},{"tipo":"item","texto":"Flex Items from here for the enemy team.","passos":[[{"nome":"Flex Items from here for the enemy team.","icone":null}]]}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","10 / 9.5 / 9 / 8.5 / 8"],["W (Rapid fire AA's)","12 / 9 / 6 / 3 / 0"],["E (Shield + Flip + Dash)","16 / 15.5 / 15 / 14.5 / 14"],["Ult","100 / 85 / 70"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Urgot is significantly stronger than you in the first two levels of the lane, DO NOT die before you get all of your abilities."]},{"tipo":"p","texto":"Just let him have the initial push, and then you should be able to start playing the game as the wave rebounds back towards him."},{"tipo":"p","texto":"And once you get your Warden's Mail, it should get even easier since you don't even need him to use his grab first before trading into him."},{"tipo":"p","texto":"Additionally, you should also try having the wave push towards you instead of towards him so that you can abuse the fact that you win in sustained battles compared to Urgot's more burst oriented playstyle."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Whenever you do trade into an Urgot, try to stand on one side of his body for as long as possible to avoid taking additional passive procc's.","Before you get your Warden's mail, wait for him to use his E grab first before trading into him since his E grab will additionally give him a shield."]},{"tipo":"p","texto":"Once you get Warden's mail though, it shouldn't matter nearly as much since you're just going to be way too tanky for him to deal with since Warden's mail will reduce each of his W ticks by a flat amount"},{"tipo":"p","texto":"(Which is extremely overpowered against Urgot for obvious reasons )"},{"tipo":"lista","itens":["Urgot has the ability to \"surf\" your E pull with his E grab, so whenever you go for your grab:"]},{"tipo":"p","texto":"(Which you should only go for if you have warden's mail) Just be sure to step to the side in case he goes for this play."},{"tipo":"lista","itens":["Post level 6: Ideally try to use your ultimate before he uses his E onto you so that you can negate a lot of his all-in damage"]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you both have your ultimates, use your W when you're around 50% hp instead of edging it until the very end so that you can prevent his incoming burst damage for his ultimate execute."]},{"tipo":"p","texto":"If you W too early, you won't be able to shield the incoming damage that's necessary for his lethal ranges,"},{"tipo":"p","texto":"And if you W too late, you're just going to die to his ultimate instead."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can ult Urgot before he gets his ult recast threshold to prevent his R2 recast projectile from reaching his target in the first place."]},{"tipo":"p","texto":"If you're too late though, you can just ult him anyways to prevent his fear from landing on the rest of your teammates."}]}]},{"nome":"Varus","planilha":"Varus","id":"Varus","titulo":"a Flecha da Vingança","dificuldade":{"early":5,"mid":5,"late":3,"overall":5},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Mercury Treads / Plated Steelcaps","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"},{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( AP vs. On-hit Varus )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"},{"tipo":"item","texto":"Kaenic Rookern / Experimental Hexplate","passos":[[{"nome":"Kaenic Rookern","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222504.png"},{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( AP vs. On-hit Varus )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","16 / 15 / 14 / 13 / 12"],["W (Q Empowerment)","40"],["E (Hail of Arrows)","18 / 16 / 14 / 12 / 10"],["Ult","100 / 80 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["In first wave, just sit under turret until the first three melee minions get low, and then once that happens, walk up into EXP range, and if the Varus doesn't zone you out for this, you can even Q the wave to get the gold from said minions.","Afterwards, just try to preserve your HP and farm until turret, until the wave state begins to bounce back towards the Varus, in which case: try to use your minion wave advantage to secure a crash.","From there, just keep playing safe and wait until your ult is up."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Realistically, you're not going to get any good grab angles, unless the Varus is extremely stupid and walks up way too far for an auto attack.","If he does walk up too far, feel free to E -> Q him on the head.","If you have your ultimate, and he still has a tendency to keep walking up way too close, feel free to close the distance in whatever way you can (without using flash) and then all-in him.","From there, just be wary of what you have to watch out for."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["PLEASE! I'M BEGGING YOU! Flash his ult or triple stacked Q, because if you don't dodge either ability, you will die."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Be hyper aware of his ult animation, this is THE most important ability for you to look out for.","Theoretically, if you have enough tenacity, and enough distance, you could flash his Q after he ults you, but this really reliant on you getting to that powerspike to begin with, relatively safely.","Also, take note of what build he's going:","If he's going AP Varus, remember to build Kaenic Rookern and, if you need it, Spirit Visage as well to deny his burst damage.","If he's going on-hit Varus, remember to build plated steelcaps and maybe a frozen heart in the mid-game.","And if he's going poke lethality Varus, take note that: that specific guy is an absolute idiot."]}]}]},{"nome":"Vayne","planilha":"Vayne","id":"Vayne","titulo":"a Caçadora Noturna","dificuldade":{"early":4,"mid":4,"late":4,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Tumble)","6 / 5 / 4 / 3 / 2 (Reduced cooldown when ulted 30 / 40 / 50%)"],["W (Percent True damage 3-hit)","Passive"],["E (Knockback / Stun)","20 / 18 / 16 / 14 / 12"],["Ult","100 / 85 / 70"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["In first wave, just sit under turret until the first three melee minions get low, and then once that happens, walk up into EXP range, and if the Vayne doesn't zone you out for this, you can even Q the wave to get the gold from said minions.","Afterwards, just try to preserve your HP and farm until turret, until the wave state begins to bounce back towards the Vayne, in which case: try to use your minion wave advantage to secure a crash.","From there, just keep playing safe and wait until your ult is up."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Realistically, you're not going to get any good grab angles, unless the Vayne is extremely ADHD and decides to roll forwards to poke you, in which case, you should try and go for a grab during her roll animation forwards and then subsequently smash her head in with your Q.","When she gets low or if you have dusk & dawn, you can actually look for a kill angle onto her with ghost if you can get an ult off.","When she rolls for invisibilty, assume she can come from every single angle, and prioritize movement over damage, to avoid getting stunned into a wall.","From there, save your Q for if she's in a spot where you'll know you can guarantee it or until she's used her roll."]},{"tipo":"p","texto":"(Sometimes you can even just auto attack a Vayne to death if you have Dusk & Dawn if she just refuses to roll which I find really funnily ironic)"}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["DO NOT put yourself into a situation where you can get stunned into a wall under any circumstance."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to hug the border on your ultimate because if the Vayne tries to use her E while your back is towards your ultimate border instead of a wall, it won't stun you."]}]}]},{"nome":"Veigar","planilha":"Veigar","id":"Veigar","titulo":"o Pequeno Mestre do Mal","dificuldade":{"early":3,"mid":2,"late":3,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce his stun duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Blast Poke tool)","6 / 5.5 / 5 / 4.5 / 4"],["W (Artillery poke tool)","8 – 0 (based on  Phenomenal Evil stacks)"],["E (Stun Cage)","20 / 18.5 / 17 / 15.5 / 14"],["Ult","120 / 90 / 60"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, give up priority since his range advantage can be quite oppressive.","Level 2, just keep playing safe until you get both your W and your E to start trading against him.","Level 3 is when the wave is going to start slowly rebounding towards him, assuming you let the wave push towards you, which means that you can (maybe) start looking for trades against and fish for all-ins whenever he overextends to use his spells against you."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your E pull for when Veigar for an auto attack harass or a Q harass onto you, and then subsequently chase him down once you've landed your Q to procc your Stormraider's Surge.","Once he uses his cage though, stand along the edge, but don't stun yourself, and try to get a little bit more damage before backing off."]},{"tipo":"p","texto":"(Unless he's in lethal range, in which you can just flash over the stun and just kill him right there)."},{"tipo":"lista","itens":["If he decides to confidently walk up to you with his cage down, just engage on top of him and kill him like normal.","Post level 6, this matchup gets even easier considering the fact that you can just simply ult away the cage and not even worry about it."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["In the far later stages of the game, you'll probably need to buy heavy magic resistance like: Kaenic + Spirit Visage, so that you don't get one-shotted by him.","Veigar's ultimate deals more damage the lower the enemy target is, so if you can: try to use your shield earlier as opposed to edging it so that you don't get within that lethal range."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can't find a lead before you get rocketbelt, don't worry since once you do end up getting it, you can essentially face-roll against the Veigar after you get your all-in combo and snowball significantly from there."]},{"tipo":"p","texto":"In other words: your mid-game power is absolutely ridiculous into him."}]}]},{"nome":"Vel'Koz","planilha":"Vel'koz","id":"Velkoz","titulo":"o Olho do Vazio","dificuldade":{"early":4,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Unsealed Spellbook","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/UnsealedSpellbook/UnsealedSpellbook.png"},{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"/ Cash Back (Personal preference)","icone":null},{"nome":"Triple Tonic","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/PerfectTiming/AlchemistCabinet.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury Treads","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( Extra Tenacity )"},{"tipo":"item","texto":"Rylai's","passos":[[{"nome":"Rylai's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"nota","texto":"[ I'm testing something out in this specific matchup ]"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","7"],["W (Another poke tool)","1.5 ( Recharge: 19 / 18 / 17 / 16 / 15 )"],["E (Knockup)","12 / 11.5 / 11 / 10.5 / 10"],["Ult","100 / 90 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["You can't really interact with an artillery mage in the early game in general, so: sit back, give up lane priority, wait for the wave to get to your side of the lane, and play for the rebound back to his turret,"]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke he's dishing out onto you, feel free to recall and use your teleport to get back into lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Vel'koz due to his range advantage, I mean: I guess you could theoretically try to get an E angle after he uses his E (Tectonic Disruption), but most of the time: they aren't going to just waste their only peel tool for literally 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, swap one of your summoners for cleanse, and then just run at the Vel'koz until he uses his E (Techtonic Disruption) on you,"]},{"tipo":"p","texto":"When he does that: use your cleanse, ult him, and then just kill him in an all-in. It's really just that simple."},{"tipo":"p","texto":"(And yes: Vel'koz E can be cleansed since it's an initial knockup followed by a stun; a suspension. It's basically like Nami W)."},{"tipo":"p","texto":"Ideally try to save your E pull for when he uses his ult, but you can't always guarantee that you'll get the timing off."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt since you can just rockebelt after him once he uses his E (Techtonic Disruption) -> ult him -> kill him again."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you're under 40% HP, recall and teleport back since you're most likely going to get dived by the enemy jungler while the wave is near your turret."]},{"tipo":"p","texto":"It's literally their only win condition against you in this lane, so just be wary of that."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to dodge two of his abilities before commiting towards an all-in to avoid taking true damage from his passive."]}]}]},{"nome":"Vex","planilha":"Vex","id":"Vex","titulo":"a Melancolista","dificuldade":{"early":3,"mid":2,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Mercury Treads","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her fear duration )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To get into range )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","8 / 7 / 6 / 5 / 4"],["W (Shield / Close-ranged AOE Spell)","16 / 15 / 14 / 13 / 12"],["E (AOE Marker)","12"],["Ult","140 / 120 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Like most ranged matchups, just let the wave push into you, and preserve your HP to secure a rebound, and then just freeze the wave so that she has to overextend in order to farm.","Post level 6, you almost always want to have the wave on your side of the lane, until you get too low to maintain it, in which you should just push the wave out, secure a crash, secure a recall, and then rinse and repeat."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Vex literally no peel tools besides her passive, if it's up, you should play respectfully back and wait for her to use an ability.","If it's not up though, feel free to walk directly at her and contest her on every single CS she goes for.","Ideally try to time your abilities when she goes for either: an auto attack or one of her own abilities.","You should be able to win in almost every single all-in that you find yourself against her, assuming you started the fight at high HP, due to her burst centric nature.","DO NOT walk up if you are marked by her E and can help it, because otherwise: you will take a lot of free burst damage."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Vex's ultimate makes her go unstoppable as she dashes, so try to either rush your ultimate and use it before she's able to use hers, or wait for her to recast her own ultimate so that your ultimate doesn't get denied by her unstoppability."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Because Vex's abilities are entirely AOE, you should try to stand away or inside of the wave, depending if whether or not you want the wave away or towards you."]}]}]},{"nome":"Vi","planilha":"Vi","id":"Vi","titulo":"a Defensora de Piltover","dificuldade":{"early":4,"mid":2,"late":1,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Dash / Engage tool)","12 / 10.5 / 9 / 7.5 / 6"],["W (3-Hit Armor Break)","Passive"],["E (AOE Marker)","1 ( Recharge: 12 / 11 / 10 / 9 / 8 )"],["Ult","140 / 115 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["In the first, second, and third waves, just play safe and let her get priority and conserve your HP to make sure that you can safely secure the rebound back to her turret."]},{"tipo":"p","texto":"Be sure to not stand near your minions if she still has her E charges up so that you don't get poked out."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Vi top lane's entire gimick is to repeatedly charge at you with Q, procc hail of blades, and then back off to poke you down with E's and utilize her high health regeneration to sustain through the lane."]},{"tipo":"p","texto":"Meaning: you want to try and prolong trades against her for as long as possible after negating her Q damage while the wave is on your side of the lane."},{"tipo":"p","texto":"Now: this can be done with one of two ways:"},{"tipo":"lista","itens":["You can either dodge it with good movement or with flash,","or you can cancel her Q dash with your E."]},{"tipo":"p","texto":"Either way: you should be able be able to land an E pull and then extend said trade to your heart's content since a majority of her trade patterns from rapid instances of burst damage."},{"tipo":"lista","itens":["If Vi is not using her Q against you, she'll most likely poke you out with her E AOE damage,","The only thing that changes about this matchup is when she reaches level 6, which I'll go over in the next section of this entry."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Vi's ultimate can cancel your ultimate if she times it while you're in the middle of the cast duration since she will become unstoppable / immune to all forms of crowd control."]},{"tipo":"p","texto":"Just wait for her to use her ultimate first,"},{"tipo":"p","texto":"Since if you try to ult her at point-blank range so that the ult duration is effectively shorter, you're just going to be met with surprise when you realize how long Vi's unstoppability lasts for."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you can time your ultimate with Vi's Q charge animation, you can actually sneak your ultimate early into her combo without having to wait for her ultimate to be used first since she'll be completely locked out of using any of her abilities while dashing with Q."]}]}]},{"nome":"Viego","planilha":"Viego","id":"Viego","titulo":"O Rei Destruído","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his burst damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Sword Thrust)","5 / 4.5 / 4 / 3.5 / 3"],["W (Dash / Stun)","8"],["E (Camouflaging Mist)","14 / 12 / 10 / 8 / 6"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Viego can secure level 2 really easily by using his Q on the wave and subsequently using empowered auto attacks to thin out the wave."]},{"tipo":"p","texto":"So just play back for the first three waves of the game, and stay healthy enough so that you can start trading against him when the wave inevitably rebounds back towards him."},{"tipo":"p","texto":"If you can, try to have the wave on your side of the map so that he has to overextend for his trades."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["A majority of the time when you're trading against Viego, you want to try and focus more-so on avoiding his trade patterns instead of creating your own."]},{"tipo":"p","texto":"If he lands his Q onto you, stand outside of his follow-up empowered auto attack range, and wait for the mark on top of you to wear off."},{"tipo":"p","texto":"Once it wears off, walk up to get your own Q and shield bash trades while standing behind minions to avoid getting hit by his W stun and follow-up empowered auto attack."},{"tipo":"lista","itens":["Before level 6, you can more accurately land your E pulls if you can time it when Viego is in the middle of his empowered auto animations or while he's in the middle of channeling his W, which slows him down by 10%.","Post level 6, this matchup gets a lot easier since your ultimate just ends up out-statchecking him a majority of the time."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6, Viego can theoretically cancel your ultimate with his ultimate, but to counteract this: just wait for him to start channeling his W animation since he'll be locked out of using his ultimate while channeling said W."]},{"tipo":"p","texto":"Alternatively, you can also just wait for him to use his ultimate first."},{"tipo":"lista","itens":["If one of your teammates die outside of your death realm, and Viego got an assist on them, he can possess said teammate, get a second of invulnerability, a bunch of HP back, and a refund on his ultimate."]},{"tipo":"p","texto":"WHICH IS REALLY ANNOYING. Unfortunately though: you don't really have too much counterplay."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can theoretically get more stats if you ult Viego while he's inside of his E shroud, but honestly: just keep ulting him while he's channeling his W animation to avoid the risk of getting your ultimate canceled."]}]}]},{"nome":"Viktor","planilha":"Viktor","id":"Viktor","titulo":"o Arauto do Arcano","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce his stun duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA)","9 / 8 / 7 / 6 / 5"],["W (Stun Zone)","17 / 16 / 15 / 14 / 13"],["E (Main poke tool)","12 / 11 / 10 / 9 / 8"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["It's really hard to do much into a Viktor due to his range advantage, at least: before level 6 and rocketbelt, so just try and play safe before then.","Just let him get priority, and keep your HP high so that you can play the rebound back to him efficiently and secure the shove."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, try to land your E and subsequent Q, when Viktor walks up to procc his empowered Q auto attack."]},{"tipo":"p","texto":"Other than that though, there's not many opportunities you can play off of since he just outranges you at every point of the game."},{"tipo":"lista","itens":["However, when you do get level 6, you can force an extended trade onto him after landing your E when he overextends for the previously mentioned empowered auto attack with your ultimate."]},{"tipo":"p","texto":"From here, ignite him, procc your Stormraider's Surge and walk past his W when he places it down."},{"tipo":"p","texto":"You should be able to easily win the all-in so long as you didn't get poked too hard before starting the trade."},{"tipo":"p","texto":"This gets even easier once you get your rocketbelt since you can just dash onto him when he's vaguely in range for your E -> combo."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Make sure to use your bonus movement speed from your setup to walk pas
