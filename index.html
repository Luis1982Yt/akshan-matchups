t his W, unless you want to get stunned"]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try ulting the Viktor after he uses his W or ultimate since they don't traverse through realms."]},{"tipo":"p","texto":"In teamfights though: it might be better to ult him early so that he doesn't use said abilities on your teammates instead of on you."}]}]},{"nome":"Vladimir","planilha":"Vladimir","id":"Vladimir","titulo":"o Sanguinário Escarlate","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Negatron Cloak","passos":[[{"nome":"Negatron Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1057.png"}]],"motivo":"( To Reduce His Damage )"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( To Reduce His healing )"},{"tipo":"item","texto":"Rylai's","passos":[[{"nome":"Rylai's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"item","texto":"Boots of Swiftness","passos":[[{"nome":"Boots of Swiftness","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223009.png"}]],"motivo":"( To Keep Up With Him )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main Damage Tool)","9 / 7.9 / 6.8 / 5.7 / 4.6"],["W (Pool)","28 / 25 / 22 / 19 / 16"],["E (AOE Spell)","13 / 11 / 9 / 7 / 5"],["Ult","120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["If the Vladimir resembles any sort of human being, you won't be able to get any effective trades against him.","Just play safe and wait until you get your Rylai's + Approach Velocity powerspike"]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can only really start actually trading with him once you get your Rylai's + Approach Velocity powerspike.","But once you do get it, try and land an E or a Q when the Vladimir walks up to poke you with his empowered Q.","From there, all you have to do is just ult him.","If he pools your ultimate, because you have your Rylai's slow + Approach Velocity movement speed, you should be able to keep up with him and then be able to ult his head again.","Then: just kill him, it's not like he's going to be able to out-DPS you or out-kite you because of your current setup."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Do not get hit by his empowered Q, if he walks up to use said empowered Q, back off.","Be exceptionally wary of his W cooldown because this is his only peel tool.","Now, even though you should be aware of it, in 99% of cases, he's realistically not going to use it until you use one of your engage tools.","And even if you do use one of your engage tools, he's just going to avoid all of your damage and run away from you until you've gotten your Rylai's + Approach Velocity powerspike."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Don't play too aggressive until you've gotten your Rylai's + Approach Velocity powerspike.","You can't really do anything until you get it, so just play safe and try to be wary of where the enemy jungler is."]}]}]},{"nome":"Volibear","planilha":"Volibear","id":"Volibear","titulo":"a Tempestade Implacável","dificuldade":{"early":4,"mid":3,"late":2,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( Anti-heal for when your ignite is down )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Stun / MS Boost)","12 / 11.5 / 11 / 10.5 / 10"],["W (Mark -> Heal)","5"],["E (Main damage tool / Shield)","16"],["Ult","160 / 135 / 110"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["For the first wave, just sit back and give up priority, it's hard to win level 1 unless he wastes his E.","From there, just sit back and poke him out, and preserve your HP so that you can effectively rebound the wave to play towards your level 6 powerspike."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to stand at a range where you can see his engage coming from a mile away."]},{"tipo":"p","texto":"If he doesn't fight you now, then feel free to poke him down until he starts charging right at you."},{"tipo":"p","texto":"If he charges right at you, and he's above 30% hp, E him away and back off."},{"tipo":"p","texto":"If he charges right at you, but he's under 30% HP, E him towards you, Q him, and hit him with a shield bash procc."},{"tipo":"p","texto":"If he keeps fighting you, keep track of his W debuff that's applied to you, and when it reaches around the 50% mark, ignite him, and then: proceed to kill him."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Volibear has the ability to cancel your ultimate with his own ultimate, however there is a counter to this while I'll include in the tips section."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["To prevent Volibear from canceling your ultimate with his own ultimate, you should try timing your ultimate through his Q windup animation since while he's Q'ing, he's locked out of using his other abilities for a small time frame."]},{"tipo":"p","texto":"Now: if you mess this up by either ulting him while his hands are in the air (too late) or if you mess this up by ulting him just a bit too soon, then you're probably going to die without your ultimate."},{"tipo":"p","texto":"So: don't mess up."},{"tipo":"p","texto":"Do note that most Volibear players will combine their E and Q together, so if you ult away his E, then he's going to be left without his shield."},{"tipo":"p","texto":"If he's a tank volibear player, this won't matter nearly as much since he has a ton of defensive stats."},{"tipo":"p","texto":"But if he's an AP Volibear player, this is essentially a death sentence."}]}]},{"nome":"Warwick","planilha":"Warwick","id":"Warwick","titulo":"a Ira Desimpedida de Zaun","dificuldade":{"early":4,"mid":3,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Coup de Grace","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/CoupDeGrace/CoupDeGrace.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Bramble Vest / Oblivion Orb","passos":[[{"nome":"Bramble Vest","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3076.png"},{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( Anti-heal for when your ignite is down )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Ramp Item^ )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Bite)","8 / 7.5 / 7 / 6.5 / 6"],["W (Mark -> Heal)","80 / 70 / 60 / 50 / 40"],["E (Damage reduction / Fear)","15 / 14 / 13 / 12 / 11"],["Ult","110 / 90 / 70"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Warwick is extremely strong in early all-ins, so just him get priority so that you can have the security of your turret so that you can keep playing for short trades."]},{"tipo":"p","texto":"Whenever he walks up to hit a minion, Q him on the head from max range and respective his early all-in power."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["As stated before, the goal of this lane is to just keep poking him on the head with your Q's until he's around lethal range (20% HP ), in which case you can actually burst him down with your all-in combo because of your rune setup + summoner spells:"]},{"tipo":"p","texto":"E -> Ignite - > Q -> W -> Shield bash AA -> finish him off with AA's."},{"tipo":"lista","itens":["If the Warwick ever gets too close to you, wait for him to use his Q and then E him away from you to then subsequently Q him on the head."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Warwick can stop your ultimate in two ways, the most obvious application of this is him ulting your ultimate and becoming unstoppable."]},{"tipo":"p","texto":"But most of the time: the Warwick ends up moving way too fast which makes it unreliable for him to ult at you to cancel his ultimate, so if they ever try canceling your ult with their ult, it's most likely to just run away. Which: is annoying, but: hey! At least his ult is down now."},{"tipo":"p","texto":"( And! You can aura farm him in all chat with a singular question mark to assert dominance because he's evidently very much scared of you if he's only using his ultimate to run away from you. )"},{"tipo":"p","texto":"The less obvious way he can do this is by using his Q while your ult is being cast."},{"tipo":"p","texto":"The reason why this works is because of some mysterious spaghetti code where instead of giving him a regular dash, it decides that the best course of action is to make him both simultaneous exist and not exist at the exact same time!"},{"tipo":"p","texto":"Making it so that even those it looks like he exists, he's actually just temporarily invulnerable to all forms of CC, which includes your ultimate! YAY! ISN'T THAT FUN??? ( No, not it isn't )"},{"tipo":"p","texto":"So, if you want to avoid suffering from Schrodinger's Cat syndrome: then try and ult him while he doesn't have any targets to latch onto or until after he uses his Q."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If the Warwick is exceptionally behind, and he's been missing from lane for a really long time, there's a good chance the Warwick is trying to roleplay as a jungler now."]},{"tipo":"p","texto":"Just be sure to ping your low HP teammates that there might be a Warwick coming for them, and shove your wave to get some tower plates in his absence."}]}]},{"nome":"Wukong","planilha":"Wukong","id":"MonkeyKing","titulo":"o Macaco Rei","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA)","8 / 7.5 / 7 / 6.5 / 6"],["W (Clone)","22 / 21 / 20 / 19 / 18"],["E (Targeted Dash / Attack speed steroid)","10 / 9.25 / 8.5 / 7.75 / 7"],["Ult","130 / 110 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Usually Wukong's level 1 is known to be EXTREMELY strong because his passive gives him armor and his E grants attack speed, however you don't care about the massive amounts of armor he gets from his passive because you deal magic damage."]},{"tipo":"p","texto":"Thererefore, you should easily be able to get priority in this lane."},{"tipo":"lista","itens":["Get priority, slow push the third wave, and then either play for a rebound or get a cheater recall off."]},{"tipo":"p","texto":"Whichever plan you're going for, try to set up a freeze whenever you can to force him in all-ins against you."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Whenever he walks up to the wave, Q him on the head and try to prolong the trade with auto attacks","If Wukong ever dashes into you, keep auto attacking him until your passive comes up and keep in mind that he has the ability to W out.","You'll know if he ever W's out since you'll be able to see his highlight temporarily from your passive damage.","If Wukong ever W's away from you, E him back towards you and prolong the trade until he gets too far away to keep chasing.","Post level 6: you can force the fight to go for longer without worrying about him reaching his turret by ulting him while he's using E dash animation."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Be sure that you're ulting the correct Wukong instead of his clone since if you're ulting his clone, you'll be left without your ultimate and will most likely die to his follow-up engage."]},{"tipo":"p","texto":"You can make sure that you're ulting the real Wukong by pressing your R during his E dash animation which is something that his clone can't repilicate."},{"tipo":"p","texto":"Alternatively: you can also just wait for him to use his W first before ulting him."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["In the mid-game, try ulting the Wukong whenever he goes into your team to both steal some of the bonus armor he gets from his passive and some of the attack speed he gets from his E,"]},{"tipo":"p","texto":"But to also deny him from getting a potential 1v9 engage against your team."}]}]},{"nome":"Xerath","planilha":"Xerath","id":"Xerath","titulo":"o Mago Ascendente","dificuldade":{"early":4,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Unsealed Spellbook","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/UnsealedSpellbook/UnsealedSpellbook.png"},{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"/ Cash Back (Personal preference)","icone":null},{"nome":"Triple Tonic","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/PerfectTiming/AlchemistCabinet.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury Treads","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( Extra Tenacity )"},{"tipo":"item","texto":"Rylai's","passos":[[{"nome":"Rylai's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"nota","texto":"[ I'm testing something out in this specific matchup ]"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Blast Poke Tool)","9 / 8 / 7 / 6 / 5"],["W (Artillery Poke Tool)","14 / 13 / 12 / 11 / 10"],["E (Stun)","13 / 12.5 / 12 / 11.5 / 11"],["Ult","130 / 115 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["You can't really interact with an artillery mage in the early game in general, so: sit back, give up lane priority, wait for the wave to get to your side of the lane, and play for the rebound back to his turret,"]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke he's dishing out onto you, feel free to recall and use your teleport to get back into lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Xerath due to his range advantage, I mean: I guess you could theoretically try to get an E angle after he uses his E stun, but most of the time: they aren't going to just waste the ability for 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, swap one of your summoners for cleanse, and then just run at the Xerath until he uses his stun on you,"]},{"tipo":"p","texto":"When he does that: use your cleanse, ult him, and then just kill him in an all-in. It's really just that simple."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt and mercury treads powerspike since you can just eat the stun, utilize the tenacity from your itemization and runes, and then just rockebelt","> ult him -> kill him again."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you're under 40% HP, recall and teleport back since you're most likely going to get dived by the enemy jungler while the wave is near your turret."]},{"tipo":"p","texto":"It's literally their only win condition against you in this lane, so just be wary of that."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you ever manage to close the distance onto the Xerath without him using his stun onto you, you can buffer your E or your Q into his stun to effectively negate it's duration since both your Q and your E self-root you anyways."]}]}]},{"nome":"Xin Zhao","planilha":"Xin Zhao","id":"XinZhao","titulo":"o Senescal de Demacia","dificuldade":{"early":3,"mid":2,"late":1,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( To reduce his healing )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA's -> Knockup)","7 / 6.5 / 6 / 5.5 / 5"],["W (Poke / Damage Tool)","12 / 11 / 10 / 9 / 8"],["E (Targeted Dash / Attack speed steroid)","11"],["Ult","120 / 110 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Xin zhao actually has a surprisingly strong level 1 all-in with his E, so just play back and give up level 2 priority to make use of your superior burst trades.","Level 2, level up your W and play towards trading with him whenever your Q and W are up.","Let the third wave crash into you, and then play towards the rebound back to his turret."]},{"tipo":"p","texto":"Throughout the early game, all you want to do is play for short trades until you get your level 6, in which case you can just ult him and kill him in an all-in."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Walk forwards whenever your Q and W are up to play towards a short trade with your superior range advantage and superior burst advantage via your W shield bash procc.","Post level 6, just E -> R him whenever he's in range and he should just permanently lose against you in an all-in due to your stat advantage."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Pay attention to when Xin zhao's spear is glowing since he can potentiall W -> E dash -> Knockup with no counterplay."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you're having a slight amount of trouble all-inning him, you can try ulting him after he's used his E dash so that you can YOINK more attack speed."]}]}]},{"nome":"Yasuo","planilha":"Yasuo","id":"Yasuo","titulo":"o Imperdoável","dificuldade":{"early":3,"mid":1,"late":1,"overall":1},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Sword Thrust)","4-1.33 (Based on bonus attack speed)"],["W (Windwall)","25 / 23 / 21 / 19 / 17"],["E (Targeted Dash)","0.5 / 0.4 / 0.3 / 0.2 / 0.1 ( Target immunity: 10 / 9 / 8 / 7 / 6 )"],["Ult","70 / 50 / 30"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1: Try to play a bit safe, but not too safe; Q him whenever he gets into range but respect the fact that he does have lethal tempo."]},{"tipo":"p","texto":"Now: how Yasuo differs from his brother is that he gets an absolutely insane amount of mobility from his level 2 E rank up."},{"tipo":"p","texto":"Just play safe now and let the wave push into you so that you can play for a subsequent rebound, and keep playing safe until you're able to get your level 6, in which case now is finally a good time to trade into him."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6: It's generally not a good idea to do anything except for Q poke since Yasuo can very easily dodge all of your skillshots by dashing towards minions with his E.","Post level 6: just straight up E -> R -> Q -> W -> Shield bash AA -> auto attack him until he's dead if he ever walks up to your side of the lane.","If Yasuo is far away from you, you can use your Q directly on top of him since his E travel animation is not nearly quick enough to get through a max range Mordekaiser Q.","However, if Yasuo is close to you, save your Q until AFTER he's used his E dash onto you, when he does this, then: you can Q him on the head and give him irreversible brain damage."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Yasuo's wind wall, despite looking like it disappears after you ult him, does not lose it's effectiveness and instead decides that it wants to have the ability to:"]},{"tipo":"p","texto":"TRAVERSE REALMS! Which is honestly not that annoying in this matchup considering that the only ability he can effectively windwall is your E, but it's something to keep note of."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Because your ultimate takes you and your opponent to a 1v1, you can effectively lower Yasuo's mobility to only dashing towards you, which is really helpful at limiting his overall options.","In all-ins: try to use your Q until after you've procc'd his passive to avoid his passive from getting a lot of effective value during it's uptime."]}]}]},{"nome":"Yone","planilha":"Yone","id":"Yone","titulo":"o Inesquecido","dificuldade":{"early":3,"mid":3,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Sword Thrust)","4-1.33 (Based on bonus attack speed)"],["W (Shield Slash)","14 – 6 (Based on bonus attack speed)"],["E (Dash / Spirit Form)","22 / 19 / 16 / 13 / 10"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1: Try to play a bit safe, but not too safe; Q him whenever he gets into range but respect the fact that he does have lethal tempo.","Level 2 is when you can actually play on the aggressive because of shield bash, try to trade with him now."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Fight him whenever your W shield is high as his nature as a squishy skirmisher will make him susceptible to high burst damage combos."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["DO NOT use your ultimate when Yone is already E'd because he can potentially cancel your ultimate outright","Do note that if you do ult the Yone and THEN he E's, his E will be prolonged throughout the entire ult duration, BUT he cannot recast his E which therefore makes him a lot more predictable.","If Yone lands his ultimate on you, he will teleport behind you which can potentially lead to a missed Q."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["When you do land your ultimate, do not be afraid to simply just run him down. If he E's, keep chasing him because he now has no way to dodge your Q with a non-predictable dash.","If you see the Yone casting his ultimate, try to Q behind yourself instead of at the Yone because if the Yone lands his ultimate, then he will teleport behind you and your Q will consequently miss."]}]}]},{"nome":"Yorick","planilha":"Yorick","id":"Yorick","titulo":"o Pastor de Almas","dificuldade":{"early":2,"mid":4,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Overgrowth","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Overgrowth/Overgrowth.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Plated steelcaps","passos":[[{"nome":"Plated steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA)","6 / 5.5 / 5 / 4.5 / 4"],["W (Wall)","20 / 18 / 16 / 14 / 12"],["E (Poke Tool / Marker / Armor Shred)","12 / 11 / 10 / 9 / 8"],["Ult","160 / 130 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, you can easily secure priority due to your significantly stronger level 1.","Level 2, level up your E if he gets too close to the wave for an all-in with level priority, but otherwise: just level up your W and walk aggressively to zone him out with your W shield, and subsequent shield bash procc threat.","Level 3, is when you're going to have to start keeping track of the amount of currently active ghouls that he can summon up."]},{"tipo":"p","texto":"If he has enough for 3-4 ghouls, back off, and focus on being erratic with your movement to avoid getting poked down by his E, and especially to not get caged in by his W."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level three: try to walk up and zone him off as many minions as possible, If he walks up, all-in him until either you get a solokill or he backs off the wave.","From level three to level five is when you need to time your aggressiveness with how many graves he has set up / how many minions he can potentially create by hitting you with his E."]},{"tipo":"p","texto":"If it's 2 or less, you shouldn't be too scared and can keep on playing on the aggressive by zoning him off of the wave and force him to decide if he wants to try and poke you down with his E (which shouldn't do much since he doesn't have too many graves up),"},{"tipo":"p","texto":"or if he wants to farm minions with his E, in which case you can play even more aggressively and try to zone him off of EXP range entirely."},{"tipo":"lista","itens":["Post Level 6 is when you should try to close the distance as much as possible without using your ultimate, whether by with good movement, cheating it with rocketbelt, or by using your E."]},{"tipo":"p","texto":"( Typically after you bait out his E, or when he uses Q on the wave and temporarily self-roots himself )."},{"tipo":"p","texto":"Your main goal here is to try and be as proactive as you can to force him to use his cage early against you."},{"tipo":"p","texto":"If he does use his cage, this is your go-sign to ult him immediately and commit towards an all-in."},{"tipo":"p","texto":"Just don't get poked down too hard before that opportunity arises."},{"tipo":"lista","itens":["If you can't close the distance for an all-in post level 6, no worries: just sit back and keep poking down his maiden with Q's or E's until you've gotten your Rocketbelt so that you can actually be able to consistently close the distance."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["There's currently a bug in the game where if you kill the Yorick while you're in the death realm, and his Maiden is up, then the Maiden will just not die???"]},{"tipo":"p","texto":"However, even though it's still alive, when Yorick respawns, he'll be able to STILL summon another Maiden even if the other is still alive."},{"tipo":"p","texto":"And he can theoretically keep doing this infinitely until he either dies outside of your death realm or every single instance of a Yorick maiden is dead."},{"tipo":"p","texto":"So make sure to kill the Maiden after you kill the Yorick, because otherwise: you're going to get bombarded by his harem."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Be sure to keep the side lanes pushed out before heading towards an objective so that Yorick doesn't get an omega splitpush while you're away for a teamfight.","If Yorick decides that he does want to play towards teamfights, you should still be way more useful than him by the nature of his W and passive ghouls easily being countered by how many auto attacks are going to be firing all over the place in said teamfights."]}]}]},{"nome":"Zaahen","planilha":"Zaahen","id":"Zaahen","titulo":"O Indissociável","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Empowered AA's -> Knockup)","10 / 9 / 8 / 7 / 6"],["W (Pull)","14 / 13.5 / 13 / 12.5 / 12"],["E (Dash)","10 / 9.5 / 9 / 8.5 / 8"],["Ult","110 / 95 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, let him get priority and wait for level 2 to start playing the game.","Level 2 onwards, go beat the ever living PISS out of him everytime that man goes for farm with your Q's and shield bash procc's.","Additionally, you should also try having the wave push towards you instead of towards him so that you can abuse the fact that you win short trades exceptionally hard with said Q and said W shield bash procc's."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your Q while he's csing or after he's used his dash since he can potentially dodge if you don't.","Basically just try to prolong short trades for as long as possible before the Zaahen gets passive fully stacked so that you don't have to deal with getting Zaahen'd (TM) as he revives and instantly kill you."]},{"tipo":"p","texto":"It's like Warwick in a sense where you're just trying to poke him down over and over again until he gets in lethal range for you to officially commit towards an all-in."},{"tipo":"lista","itens":["Zaahen's a lot more lenient compared to Warwick when it comes down to his lethal ranges, basically any all-in fight where the Zaahen starts at 40% or lower HP, should be a fight that's heavily favored towards you."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Pay attention to when Zaahen's glaive is glowing since he can potentially W -> E dash -> Knockup with no counterplay.","Zaahen's ultimate CAN cancel Mordekaiser ultimate since it's an unstoppable, so just try and wait for him to use it first."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you don't feel like waiting for Zaahen's ultimate to finish channeling to fire your own ultimate, you can use your ultimate about half a second before Zaahen's ultimate fully finishes channeling to get your ultimate off slightly quicker.","Additionally: Try to ult him after his initial combo onto you so that he can stack up his passive and you can steal more %AD to burst him down quicker."]}]}]},{"nome":"Zac","planilha":"Zac","id":"Zac","titulo":"a Arma Secreta","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Oblivion Orb","passos":[[{"nome":"Oblivion Orb","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3916.png"}]],"motivo":"( To reduce his healing )"},{"tipo":"item","texto":"Liandry's","passos":[[{"nome":"Liandry's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"}]],"motivo":"( Even more damage^)"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke -> Pull)","14 / 12.5 / 11 / 9.5 / 8"],["W (Explosion)","5"],["E (Dash)","21 / 18 / 15 / 12 / 9"],["Ult","120 / 105 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Try to get priority, slow the push the wave, and subsequently crash the third wave for either a rebound into a freeze or a cheater recall into an eventual freeze on the wave."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Step on as many blobs as possible before the Zac can to negate the healing he would get from them.","Before level 6, it's really hard to force him out of lane due to his stupidly high amounts of sustain, but it's not like he can exactly threaten you either before level 6."]},{"tipo":"p","texto":"Just go for any trade you possibly can whenever your W shield is high with your E's and Q's, ideally try to aim said abilities during his E or Q animations respectively so that it's easier to land."},{"tipo":"lista","itens":["Post level 6 and after you've poked the Zac down a bit (~40% HP) start a fight with your E + your R, a high amount of shield and a high amount of HP, and play towards killing him an all-in."]},{"tipo":"p","texto":"He's probably going to ult you after this, in which case you should ignite him, procc your passive and walk towards the blobs before you send out your Q's onto him since your Q is technically a self-root."},{"tipo":"p","texto":"You should theoretically be able to win in a dedicated all-in."},{"tipo":"p","texto":"Just be sure to save your next E for if the Zac wants to escape with his own E ( Elastic Slingshot ) after you both leave your ultimate."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Look at his blobs and step up on them, if he reaches them first, he's going to get an absolutely absurd amount of sustain via his passive."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you ult him before he can Q a minion, then his Q is completely useless making it a lot easier to fight him because you cut a CC and damage tool inside of his all-in combo."]}]}]},{"nome":"Zed","planilha":"Zed","id":"Zed","titulo":"o Mestre das Sombras","dificuldade":{"early":4,"mid":4,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"},{"tipo":"item","texto":"Zhonya's Hourglass","passos":[[{"nome":"Zhonya's Hourglass","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223157.png"}]],"motivo":"( To negate his ult damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main Poke Tool)","6"],["W (Shadow)","20 / 19 / 18 / 17 / 16"],["E (AOE Slash)","5 / 4.5 / 4 / 3.5 / 3"],["Ult","120 / 110 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["You can't really interact with Zed e in the early game in general, so just: sit back, give up lane priority, wait for the wave to get to your side of the lane, and play for the rebound back to his turret,"]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke he's dishing out onto you, just recall and run back to lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Zed isn't exactly a champion that you trade with just purely based on the nature of his W (Living Shadow), so just play safe until you've reached your level 6 and dusk & dawn powerspikes."]},{"tipo":"p","texto":"Once you've gotten to those respective points, ghost at him when he's on your side of the lane and auto attack him with shield bash + dusk & dawn procc's until he's used his ult on you."},{"tipo":"p","texto":"When he does that, you can go for a Q directly on top of his head, unless he can recast his W, in which case you should just for an E and keep hitting him with dusk & dawn procc's until he's exhausted all of his mobility options so that your Q has a higher chance of landing."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Similar to Leblanc, you should try to line your skillshots with where he currently is and where he can recast his dash because if you don't do that, then he will obvious recast his dash and dodge whatever skillshot that you were planning on landing against him."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Zed teleports behind you when he uses his ultimate, so if you want to unexpectedly guarantee your Q onto him, Q and then flash backwards right after he's finished ulting you, so that you can land it right on top of him."]}]}]},{"nome":"Ziggs","planilha":"Ziggs","id":"Ziggs","titulo":"o Especialista em Hexplosivos","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Unsealed Spellbook","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/UnsealedSpellbook/UnsealedSpellbook.png"},{"nome o: sit back, give up lane priority, wait for the wave to get to your side of the lane, and play for the rebound back to his turret,"]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke he's dishing out onto you, feel free to recall and use your teleport to get back into lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Ziggs due to his range advantage, I mean: I guess you could theoretically try to get an E angle after he uses his W (Satchel Charge), but most of the time: they aren't going to just waste their only peel tool for literally 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, and then just ghost at the Ziggs until he uses his W (Satchel Charge) on you,"]},{"tipo":"p","texto":"When he does that: use your flash, ult him, and then just kill him in an all-in. It's really just that simple."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt since you can just rockebelt after him once he uses his W satchel -> ult him -> kill him again."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you're under 40% HP, recall and teleport back since you're most likely going to get dived by the enemy jungler while the wave is near your turret."]},{"tipo":"p","texto":"It's literally their only win condition against you in this lane, so just be wary of that."},{"tipo":"lista","itens":["Ziggs satchel, despite looking like it disappears after you ult him, does not lose it's effectiveness and instead decides that it wants to have the ability to:"]},{"tipo":"p","texto":"TRAVERSE REALMS! Which is really annoying because he can theoretically hop away from you with a bomb that doesn't even look like it exists."}]},{"titulo":"Tips","blocos":[{"tipo":"li const VOLUME = { grade: .45, passa: .18, travar: .5, avanca: .4, volta: .4, chip: .4, abre: .4, fecha: .4, clique: .35, vo: .8 };
let somLigado = true;
try { somLigado = localStorage.getItem("som") !== "desligado"; } catch (e) {}
let ultimoPassa = 0;
function toca(nome, arquivo) {
  if (!somLigado) return;
  if (nome === "passa") { const agora = performance.now(); if (agora - ultimoPassa < 70) return; ultimoPassa = agora; }
  const a = new Audio(arquivo || `sons/ui/${nome}.ogg`);
  a.volume = VOLUME[nome] ?? .4;
  a.play().catch(() => {});
}
function marcaSom() {
  $("som").setAttribute("aria-pressed", somLigado);
  $("som").setAttribute("aria-label", somLigado ? "Desligar os sons" : "Ligar os sons");
}

/* ---------- Dados de cada guia ---------- */
function prepara(g) {
  if (g.formato === "simples") {
    g.lista = g.matchups.map(([nome, runa, sec, spell, bota, build, notas, guia]) => ({
      nome, runa, sec, spell, bota, build, guia: !!guia,
      id: g.champs[nome].id, titulo: g.champs[nome].title, slug: slug(nome),
      linhas: notas.split("\n").map(l => l.trim().replace(/\s{2,}/g, " ")).filter(Boolean),
      hay: (nome + " " + notas).toLowerCase(),
    }));
    g.lista.forEach(c => { c.hayN = normal(c.hay); });
  } else {
    g.lista = g.matchups.map(m => ({ ...m, slug: slug(m.nome), hay: textoDe(m).toLowerCase() }));
    g.lista.forEach(c => { c.hayN = normal(c.hay); });
  }
}
function textoDe(m) {
  const partes = [m.nome, m.planilha, ...m.tldr];
  m.itens.forEach(gr => { partes.push(gr.rotulo); gr.linhas.forEach(l => partes.push(l.texto || "", l.motivo || "")); });
  m.secoes.forEach(s => { partes.push(s.titulo); s.blocos.forEach(b => partes.push(...(b.itens || (b.linhas ? b.linhas.flat() : [b.texto])))); });
  return partes.join(" ");
}

// Filtros: dentro do mesmo grupo vale qualquer um; entre grupos, todos.
const FILTROS = {
  simples: g => [
    { id: "guia", grupo: "guia", rotulo: "No guia", teste: c => c.guia },

    { id: "Electro", grupo: "runa", rotulo: "Electro", icone: g.icones.Electro, teste: c => /electro/i.test(c.runa) },
  ],
  completo: () => [
    { id: "facil", grupo: "dif", rotulo: "Fácil", teste: c => c.dificuldade.overall <= 2 },
    { id: "medio", grupo: "dif", rotulo: "Médio", teste: c => c.dificuldade.overall === 3 },
    { id: "dificil", grupo: "dif", rotulo: "Difícil", teste: c => c.dificuldade.overall >= 4 },
  ],
};

/* ---------- Planilha ao vivo: o guia lê a planilha do autor quando abre ---------- */
function lerCsv(t) {
  const linhas = []; let linha = [], campo = "", aspas = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (aspas) {
      if (c === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && t[i + 1] === "\n") i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = "";
    } else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}
function linhasDaPlanilha(t) {
  const linhas = lerCsv(t), cab = linhas.shift() || [];
  if (!/campe/i.test(cab[0] || "")) throw new Error("cabeçalho inesperado");
  return linhas.filter(r => (r[0] || "").trim()).map(r => {
    r = r.concat(Array(8).fill("")).slice(0, 8);
    return [r[0].trim(), ...r.slice(1, 7).map(x => x.trim()), /^s/i.test(r[7].trim()) ? 1 : 0];
  });
}
// Campeão novo na planilha: pega id e título no Data Dragon.
const chaveNome = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
let ddCampeoes;
async function completaCampeoes(g, nomes) {
  if (!ddCampeoes) ddCampeoes = fetch(`${DD}${VER}/data/pt_BR/champion.json`).then(r => r.json()).then(j => j.data);
  const por = {};
  Object.values(await ddCampeoes).forEach(c => { por[chaveNome(c.name)] = c; por[chaveNome(c.id)] = c; });
  nomes.forEach(n => { const c = por[chaveNome(n)]; if (c) g.champs[n] = { id: c.id, title: c.title }; });
}
function aplicaMatchups(g, rows) {
  g.matchups = rows.filter(r => g.champs[r[0]]);
  g.lista = null;
  if (guia !== g) return;
  const slugAtual = current && current.slug;
  prepara(g);
  current = g.lista.find(c => c.slug === slugAtual) || g.lista[0];
  renderLista();
  renderDetalhe(false);
  marcaHash();
}
function usaCopiaSalva(g) {
  if (!g.planilha) return;
  try {
    const salvo = JSON.parse(localStorage.getItem("planilha:" + g.id) || "null");
    if (salvo && salvo.rows && salvo.rows.length) {
      Object.assign(g.champs, salvo.champs);
      g.matchups = salvo.rows.filter(r => g.champs[r[0]]);
    }
  } catch (e) {}
}
function mostraPlanilha(g) {
  const el = $("estadoPlanilha");
  if (!el || guia !== g) return;
  el.textContent = !g.planilha ? "" :
    g.sincronia === "ok" ? "Atualizado agora da planilha." :
    g.sincronia === "arquivo" ? "Aberto como arquivo: mostrando a cópia salva. O site publicado lê a planilha ao vivo." :
    g.sincronia === "falhou" ? "Sem conexão com a planilha: mostrando a última cópia salva." :
    "Buscando a versão mais nova da planilha…";
}
async function sincroniza(g) {
  if (!g.planilha || g.sincronia) return;
  // O Google não libera a planilha para página aberta como arquivo (file://).
  if (location.protocol === "file:") { g.sincronia = "arquivo"; mostraPlanilha(g); return; }
  g.sincronia = "buscando";
  mostraPlanilha(g);
  try {
    const { id, gid } = g.planilha;
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}&_=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("planilha respondeu " + r.status);
    const rows = linhasDaPlanilha(await r.text());
    const faltam = rows.filter(x => !g.champs[x[0]]).map(x => x[0]);
    if (faltam.length) await completaCampeoes(g, faltam);
    aplicaMatchups(g, rows);
    g.sincronia = "ok";
    try { localStorage.setItem("planilha:" + g.id, JSON.stringify({ quando: Date.now(), rows: g.matchups, champs: g.champs })); } catch (e) {}
  } catch (e) {
    g.sincronia = "falhou";
  }
  mostraPlanilha(g);
}

// Apelidos que o jogador digita na seleção de campeões.
const APELIDOS = { tf: "twistedfate", lb: "leblanc", asol: "aurelionsol", sol: "aurelionsol", mf: "missfortune", tk: "tahmkench", tahm: "tahmkench",
  kog: "kogmaw", vel: "velkoz", j4: "jarvaniv", xin: "xinzhao", ww: "warwick", gp: "gangplank", ez: "ezreal", cass: "cassiopeia", kass: "kassadin",
  kat: "katarina", kata: "katarina", mundo: "drmundo", yi: "masteryi", voli: "volibear", morde: "mordekaiser", heimer: "heimerdinger",
  fiddle: "fiddlesticks", nida: "nidalee", noc: "nocturne", ori: "orianna", sera: "seraphine", panth: "pantheon", malz: "malzahar",
  liss: "lissandra", vlad: "vladimir", trynd: "tryndamere", naut: "nautilus", bel: "belveth", cho: "chogath", rek: "reksai", kha: "khazix",
  aurelion: "aurelionsol", twisted: "twistedfate", leb: "leblanc", ali: "alistar", blitz: "blitzcrank", ilaoi: "illaoi", kayn: "kayn" };
const normal = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
// Relevância: 4 = nome começa (ou apelido), 3 = nome contém, 1 = só nas notas, 0 = não bate.
function relevancia(c, t) {
  if (!t) return 1;
  const k = chaveNome(c.nome), tk = t.replace(/[^a-z0-9]/g, "");
  if (tk && (k.startsWith(tk) || (APELIDOS[tk] && k.startsWith(APELIDOS[tk])))) return 4;
  if (tk && (k.includes(tk) || (c.planilha && chaveNome(c.planilha).includes(tk)))) return 3;
  return c.hayN.includes(t) ? 1 : 0;
}
function passaFiltros(c) {
  const grupos = {};
  filtros.filter(f => ativos.has(f.id)).forEach(f => (grupos[f.grupo] = grupos[f.grupo] || []).push(f));
  return Object.values(grupos).every(fs => fs.some(f => f.teste(c)));
}

function renderLista() {
  const t = normal(q.value.trim());
  const avaliados = guia.lista.map(c => [c, relevancia(c, t)]).filter(([c, n]) => n > 0 && passaFiltros(c));
  if (t) avaliados.sort((a, b) => b[1] - a[1]);
  shown = avaliados.map(x => x[0]);
  const soNota = new Set(t ? avaliados.filter(x => x[1] === 1).map(x => x[0]) : []);
  const foco = shown.includes(current) ? current : shown[0];
  lista.innerHTML = shown.map(c => {
    const marca = guia.formato === "simples"
      ? (c.guia ? '<span class="ponto" aria-hidden="true"></span>' : "")
      : (c.dificuldade.overall ? `<span class="nivel" aria-hidden="true">${c.dificuldade.overall}</span>` : "");
    const extra = guia.formato === "simples" ? (c.guia ? ", no guia" : "") : (c.dificuldade.overall ? `, dificuldade ${c.dificuldade.overall} de 5` : "");
    return `<button type="button" class="pick${soNota.has(c) ? " so-nota" : ""}" data-id="${c.slug}" data-ini="${esc(c.nome.charAt(0))}" aria-current="${c === current}" tabindex="${c === foco ? 0 : -1}" title="${esc(c.nome)}${soNota.has(c) ? " (achado nas notas)" : ""}">
      <img src="${sq(c.id)}" alt="" width="56" height="56">${marca}<span class="sr">${esc(c.nome)}${extra}${soNota.has(c) ? ", achado nas notas" : ""}</span></button>`;
  }).join("");
  $("vazio").hidden = shown.length > 0;
  $("contagem").textContent = `${shown.length}/${guia.lista.length}`;
  if (current) atualizaVizinhos();
}

function vizinhos(passos) {
  const list = shown.includes(current) ? shown : guia.lista;

}

/* ---------- Formato simples (planilha do Akshan) ---------- */
const ICON = [
  [/^pta$/i, "PTA", "runa"], [/^electro$/i, "Electro", "runa"],
  [/^impacto repentino$/i, "Impacto repentino", "runa"], [/^osso revestido$/i, "Osso revestido", "runa"],
  [/^inspira/i, "Inspiração", "runa"], [/^precis/i, "Precisão", "runa"],
  [/^ignite$/i, "Ignite"], [/^tp$/i, "TP"], [/^exhaust$/i, "Exhaust"],
  [/^mercs/i, "Mercs"], [/^tabis?/i, "Tabis"], [/^rapidez$/i, "Rapidez"], [/^craquen$/i, "Craquen"],
  [/^vamps$/i, "Vamps", "", "Grevas Vorazes"], [/^crit$/i, "Crit", "", "A Coletora"],
  [/^letalidade$/i, "Letalidade", "", "Glaive Sombria"], [/^scaling$/i, "Scaling", "runa", "Feitiçaria"],
  [/^terminus$/i, "Terminus"],
];
function opt(raw) {
  const rush = /rush/i.test(raw);
  const word = raw.replace(/rush/i, "").replace(/!+/g, "").trim();
  const hit = ICON.find(([re]) => re.test(word));
  const label = rush ? word.charAt(0) + word.slice(1).toLowerCase() : word;
  const icon = hit ? `<img src="${guia.icones[hit[1]]}" alt="" width="36" height="36">` : '<span class="soquete" aria-hidden="true"></span>';
  return `<div class="opt${hit && hit[2] ? " " + hit[2] : ""}"${hit && hit[3] ? ` title="${esc(hit[3])}"` : ""}>${icon}<span>${esc(label)}</span>${rush ? '<span class="rush">rush</span>' : ""}</div>`;
}
function slot(label, val) {
  let body;
  if (!val) body = '<span class="livre">Sem anotação</span>';
  else if (/^tanto faz$/i.test(val)) body = '<span class="livre">Tanto faz</span>';
  else if (/,/.test(val)) body = opt(val);
  else body = val.split(/\s*\/\s*/).map(opt).join("");
  return `<div class="slot"><dt>${label}</dt><dd>${body}</dd></div>`;
}
const KW = /(?<![\wÀ-ÿ])(lvl ?\d+|press|skirmish|roam(?:ing)?|gank|stat check|outscale|free kill|free lane|100 0|side ?lane|late ?game|early)(?![\wÀ-ÿ])/gi;
const marca = line => esc(line).replace(KW, m => `<span class="kw">${m}</span>`);

/* ---------- Formato completo (runas, itens, dificuldade e seções) ---------- */
const TITULOS = { "Enemy Cooldowns": "Cooldowns do inimigo", "Early Game": "Early game", "How to trade": "Como trocar", "What to watch out for": "Cuidado com", "Tips": "Dicas", "Mini Rant": "Desabafo" };
const KW_EN = /\b(level \d+|lvl \d+)\b/gi;
const marcaEn = t => esc(t).replace(KW_EN, m => `<span class="kw">${m}</span>`);
const pips = n => `<span class="pips" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<i${i <= n ? ' class="on"' : ""}></i>`).join("")}</span>`;
const peca = (p, runa) => `<span class="peca${runa ? " runa" : ""}">${p.icone ? `<img src="${p.icone}" alt="" width="32" height="32">` : '<span class="soquete" aria-hidden="true"></span>'}<span>${esc(p.nome)}</span></span>`;

function linhaItem(l) {
  if (l.tipo === "sep") return '<li class="sep" aria-hidden="true"></li>';
  if (l.tipo === "rotulo") return `<li class="sub">${esc(l.texto)}</li>`;
  if (l.tipo === "nota") return `<li class="nota">${esc(l.texto)}</li>`;
  const passos = l.passos.map(alts => alts.map(p => peca(p)).join('<span class="ou">ou</span>')).join(SETA_PASSO);
  return `<li><div class="pecas">${passos}</div>${l.motivo ? `<p class="motivo">${esc(l.motivo)}</p>` : ""}</li>`;
}

function setupCompleto(c) {
  const runas = c.runas.map((bloco, i) => (i ? '<p class="ou-bloco">ou</p>' : "") + bloco.map(l => l.rotulo === "Fragmentos"
    ? `<div class="linha-runa"><span class="rot">${esc(l.rotulo)}</span><p class="frag">${l.pecas.map(p => esc(p.nome)).join(" · ")}</p></div>`
    : `<div class="linha-runa"><span class="rot">${esc(l.rotulo)}</span><div class="pecas">${l.pecas.map(p => peca(p, true)).join("")}</div></div>`).join("")).join("");
  const itens = c.itens.map((g, i) => {
    const ol = `<ol lang="en">${g.linhas.map(linhaItem).join("")}</ol>`;
    const cond = g.rotulo && g.rotulo !== "Items vs." ? g.rotulo : "";
    if (i === 0) return `<div class="grupo">${cond ? `<p class="cond" lang="en">${esc(cond)}</p>` : ""}${ol}</div>`;
    return `<details class="grupo"><summary><span lang="en">${esc(cond || "Other build")}</span></summary>${ol}</details>`;
  }).join("");
  const dif = [["early", "Early"], ["mid", "Mid"], ["late", "Late"], ["overall", "Geral"]]
    .map(([k, r]) => `<div><dt>${r}</dt><dd aria-label="${c.dificuldade[k] ?? "sem nota"} de 5">${pips(c.dificuldade[k])}<b>${c.dificuldade[k] ?? "–"}/5</b></dd></div>`).join("");
  return `<div class="setup-completo">
    <section class="bloco"><h3>Runas</h3>${runas || '<p class="livre">Sem anotação</p>'}</section>
    <section class="bloco build"><h3>Itens</h3>${itens || '<p class="livre">Sem anotação</p>'}</section>
    <section class="bloco dif"><h3>Dificuldade</h3><dl>${dif}</dl></section>
  </div>`;
}

function blocoTexto(b) {
  if (b.tipo === "tabela") return `<table class="cds"><tbody>${b.linhas.map(([k, v]) => `<tr><th scope="row">${esc(k)}</th><td>${esc(v)}</td></tr>`).join("")}</tbody></table>`;
  if (b.tipo === "lista") return `<ul>${b.itens.map(t => `<li>${marcaEn(t)}</li>`).join("")}</ul>`;
  return `<p>${marcaEn(b.texto)}</p>`;
}
function notasCompleto(c) {
  const resumo = c.tldr.length ? `<section class="resumo"><h3>Resumo</h3><ul>${c.tldr.map(t => `<li>${esc(t)}</li>`).join("")}</ul></section>` : "";
  return `<div class="secoes" lang="en">${resumo}${c.secoes.map(s => `<section class="secao">${s.titulo ? `<h3 lang="pt-BR">${esc(TITULOS[s.titulo] || s.titulo)}</h3>` : ""}${s.blocos.map(blocoTexto).join("")}</section>`).join("")}</div>`;
}

// Rola só a lista (não a página) até o rosto escolhido.
function rolaNaLista(tile) {
  const r = tile.getBoundingClientRect(), c = lista.getBoundingClientRect();
  const dx = r.left < c.left + 8 ? r.left - c.left - 16 : r.right > c.right - 8 ? r.right - c.right + 16 : 0;
  const dy = r.top < c.top + 8 ? r.top - c.top - 16 : r.bottom > c.bottom - 30 ? r.bottom - c.bottom + 44 : 0;
  if (dx || dy) lista.scrollBy({ left: dx, top: dy, behavior: semMovimento() ? "auto" : "smooth" });
}

function travar() {

  const t = $("trava");

  if (semMovimento()) { desce(); return; }
  t.innerHTML = `<figure class="eu"><img src="${arte(guia.campeao.id)}" alt=""><figcaption>${esc(guia.campeao.nome)}</figcaption></figure>
    <figure class="ele"><img src="${arte(current.id)}" alt=""><figcaption>${esc(current.nome)}</figcaption></figure><span class="vs">VS</span>`;
  t.hidden = false; t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  const fecha = () => { clearTimeout(fechaTrava); t.hidden = true; t.classList.remove("on"); t.onclick = null; desce(); };
  fechaTrava = setTimeout(fecha, travadas++ ? 950 : 1500);

  if (b) { toca("grade"); select(guia.lista.find(c => c.slug === b.dataset.id)); }
});
// Hover na lista só com mouse, como no cliente.
lista.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const b = e.target.closest(".pick");
  if (b && !b.contains(e.relatedTarget)) toca("passa");
});
let avisoBusca;
q.addEventListener("input", () => {
  renderLista();
  if (shown.length === 1) select(shown[0]);
  clearTimeout(avisoBusca);
  avisoBusca = setTimeout(() => anuncia(shown.length ? `${shown.length} campeões` : "Nenhum campeão com essa busca"), 700);
});
$("filtros").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  const f = b.dataset.f;
  ativos.has(f) ? ativos.delete(f) : ativos.add(f);
  toca("chip");
  b.setAttribute("aria-pressed", ativos.has(f));
  renderLista();
});
$("limpar").addEventListener("click", () => {
  q.value = ""; ativos.clear();
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", "false"));
  renderLista();
  q.focus();
});
lista.addEventListener("keydown", e => {
  const b = e.target.closest(".pick");
  if (!b || e.altKey || e.ctrlKey || e.metaKey) return;
  const picks = [...lista.querySelectorAll(".pick")], i = picks.indexOf(b);
  const cols = picks.filter(x => x.offsetTop === picks[0].offsetTop).length || 1;
  const destino = { ArrowRight: i + 1, ArrowLeft: i - 1, ArrowDown: i + cols, ArrowUp: i - cols, Home: 0, End: picks.length - 1 }[e.key];
  if (destino === undefined) return;
  e.preventDefault();
  e.stopPropagation();
  const alvo = picks[Math.max(0, Math.min(picks.length - 1, destino))];
  picks.forEach(x => { x.tabIndex = x === alvo ? 0 : -1; });
  alvo.focus({ preventScroll: true });
  rolaNaLista(alvo);
});
$("miraAnt").addEventListener("click", () => { toca("volta"); select(vizinhos([-1])[0]); });
$("miraProx").addEventListener("click", () => { toca("avanca"); select(vizinhos([1])[0]); });
$("travar").addEventListener("click", travar);
$("ant").addEventListener("click", () => { toca("volta"); select(vizinhos([-1])[0]); });
$("prox").addEventListener("click", () => { toca("avanca"); select(vizinhos([1])[0]); });
document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$("trava").hidden) { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); $("trava").onclick(); } return; }
  if (!$("menuGuias").hidden) { if (e.key === "Escape") { abreMenu(false); $("trocar").focus(); } return; }
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); return; }
  if (document.activeElement === q) {
    if (e.key === "Enter" && shown[0]) { toca("grade"); select(shown[0]); q.blur(); }
    if (e.key === "Escape") { q.value = ""; renderLista(); q.blur(); }
    return;
  }
  if (e.target.closest && e.target.closest("input, textarea, select, .lista")) return;
  if (e.key === "ArrowRight") { toca("avanca"); select(vizinhos([1])[0]); }
  if (e.key === "ArrowLeft") { toca("volta"); select(vizinhos([-1])[0]); }
});

/* ---------- Começo: link com guia (#mordekaiser/aatrox), link antigo do Akshan (#ahri) ou o último guia usado ---------- */
function lerHash() {
  const [a, b] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (GUIAS.some(g => g.id === a)) return [a, b];
  if (a) return [GUIAS[0].id, a];
  let ultimo = null;
  try { ultimo = localStorage.getItem("guia"); } catch (e) {}
  return [ultimo, null];
}
addEventListener("hashchange", () => {
  const [g, i] = lerHash();
  if (g === guia.id && i === current.slug) return;
  if (g === guia.id) select(guia.lista.find(c => c.slug === i)); else escolheGuia(g, i);
});
escolheGuia(...lerHash());
</script>
