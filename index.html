]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Spear transfer)","9"],["W (Vision spirit)","30"],["E (Burst tool)","10 / 9.5 / 9 / 8.5 / 8"],["Ult",": 160 / 140 / 120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up level 1 priority since you're never going to be able to realistically catch up to her anyways,","Level 2, level up your W and just keep playing safe and sustaining through the lane.","Third wave, let it crash into you, and then start playing off the rebound on the fourth wave."]},{"tipo":"p","texto":"Ideally, you want to try and farm up until your plated steelcaps + level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You don't exactly 'trade' into a Kalista player because of her ridiculously high amount of dashes, but don't fret: as once you get level 6 and plated steelcaps, it should be relatively easy to just all-in her with ghost + ultimate.","Your entire setup is all set around one thing: 'SCREW SKILLSHOTS, I'm just going to auto attack you to death with my superior burst setup!'"]},{"tipo":"p","texto":"If you don't have the confidence to all-in her on your level 6 and plated steelcaps powerspike, you can just farm up until you get dusk & dawn, lobotimize yourself, and then just ghost -> kill her in an all-in with your ultimate."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6, Be hyper-aware of the enemy jungler or whoever Kalista decided to link with her passive since she can easily setup a gank with her ultimate onto you."]},{"tipo":"p","texto":"If you don't see Kalista' partner, there's a good chance that they are sitting in fog-of-war, ready to jump you."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Kalista has a slight delay between her dashes, so try and follow the trajectory of her previous dash with your Q, and then fire it since she'll effectively root herself for a split second."]},{"tipo":"p","texto":"This requires really good timing though, so I don't blame you if you want to just farm until Dusk & Dawn."}]}]},{"nome":"Karma","planilha":"Karma","id":"Karma","titulo":"a Iluminada","dificuldade":{"early":4,"mid":3,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her root duration )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","9 / 8 / 7 / 6 / 5"],["W (Root)","12"],["E (Shield)","10 / 9.5 / 9 / 8.5 / 8"],["Ult",": 40 / 38 / 36 / 34"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Unless the Karma suffers from an actual lobotomy in the middle of the game, there's not much you can really do to threaten her due to her range advantage, her shield, and her W chain-root."]},{"tipo":"p","texto":"Just play safe, let the wave push towards you, play for the rebound, and keep bouncing waves back and forth until you're able to get your ultimate + Mercury treads."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Stand behind minions and, emphasis on try: to land an E onto her if she wastes a Q on the minions. You're probably going to miss, but: hey! It's worth a shot.","Once you get mercury treads, rocketbelt, and level 6, (no, you are not going to be able to trade before then, welcome to Mordekaiser top lane), wait for the wave to be on your side of the lane, and then, walk excessively aggressively when Karma's Q is down."]},{"tipo":"p","texto":"If you can find the opportunity to: rocketbelt -> E -> R her and secure your E pull with your ultimate's 75% slow, from here: she's probably going to use her W onto you, in which case you should try to time your Q as soon as you are rooted, to effectively negate it's CC."},{"tipo":"p","texto":"Afterwards, once all of her abilities are down, utilize the movement speed gained from Stormraider's Surge to run her down within your ultimate."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Karma's root gets an additional CC increase if she uses it with her ultimate, so ideally try to time any of your all-ins while her ultimate is down so that you don't suffer from an extra long from of crowd control."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Keep a mental note of her 40 / 38 / 36 / 34 second ultimate cooldown that gets lowered by 4 seconds every time she lands a damaging ability against enemies."]},{"tipo":"p","texto":"This is what is going dictate when you're allowed to walk up and potentially fish for an E poke, and when you're going to have to sit back and concede wave pressure."}]}]},{"nome":"Karthus","planilha":"Karthus","id":"Karthus","titulo":"a Voz Mortal","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Gluttonous Greaves","passos":[[{"nome":"Gluttonous Greaves","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223008.png"}]],"motivo":"( Plated Steelcaps / Mercury Treads won't do much in the isolated 1v1 anyways. )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","1"],["W (Wall MR Debuff)","15"],["E (Damaging Aura)","Toggle"],["Ult",": 200 / 180 / 160"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, due to his range advantage with his Q's, it's difficult to secure priority, so just play save during your first three waves, and conserve your HP to effectively play off the rebound."]},{"tipo":"p","texto":"Consequently: I'd personally level up W level 2 so that I can sustain to reach my level three powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 3, just play safe since you don't have enough damage to procc Stormraider's Surge which is going to be when your all-in timers are going to be based around.","Post level 3, if you can land an E, land it, Q them on the head, shield bash AA them, and then procc Stormraider's Surge while using the movement to dodge as many Q's as possible from the Karthus."]},{"tipo":"p","texto":"Once your movement speed is about to wear out, gauge the situation:"},{"tipo":"lista","itens":["Is the Karthus low? (30% HP), then all-in him and kill him.","Is the Karthus still high HP? (Above 30%), then just back off and play off your next Stormraider's Surge procc."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Karthus' W (Wall of Pain) shreds magic resistance if you run into it,"]},{"tipo":"p","texto":"So ideally: try to either not walk through it or ult it away so that you don't take nearly as much damage."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to priortize dodging Karthus' q's over landing your own skillshots since firing off a Q or an E, will temporarily root you."]},{"tipo":"p","texto":"If you can manage to dodge one of his Q's, use the slight downtime of his Q CD to opportunistically land your own Q."},{"tipo":"lista","itens":["Karthus' ultimate does not traverse realms, so: if you see Karthus using his ultimate in a teamfight, either ult him to deny it from hitting your team, or ult somebody else so that you don't have to deal with it."]}]}]},{"nome":"Kassadin","planilha":"Kassadin","id":"Kassadin","titulo":"o Andarilho do Vazio","dificuldade":{"early":1,"mid":3,"late":4,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Raw burst damage^)"},{"tipo":"item","texto":"Gluttonous Greaves","passos":[[{"nome":"Gluttonous Greaves","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223008.png"}]],"motivo":"( Mercury Treads aren't that useful here anyways)"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"},{"tipo":"item","texto":"Kaenic Rookern / Spirit's Visage","passos":[[{"nome":"Kaenic Rookern","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222504.png"},{"nome":"Spirit's Visage","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223065.png"}]],"motivo":"( Only build if Kassadin is still a problem, otherwise: build variety )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke)","9 / 8.5 / 8 / 7.5 / 7"],["W (Empowered AA)","7"],["E (Damaging cone)","21 / 20 / 19 / 18 / 17 (-0.75 seconds per nearby ability usage)"],["Ult","5 / 3.5 / 2"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Get priority, slow push the second and third waves, and then just let the wave rebound back to you so that you can just freeze the lane."]},{"tipo":"p","texto":"Then: whenever he walks up, harass him."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, he is incredibly punishable and incredibly immobile."]},{"tipo":"p","texto":"Just wait for him to use his Q orb to farm for CS, and then just use your E to grab him and commit to a trade for as long as possible."},{"tipo":"p","texto":"If he ever walks up for CS, poke him. Is he going to use an auto attack? W and then shield bash AA him."},{"tipo":"p","texto":"DO NOT let him breathe, because this is your strongest point against him."},{"tipo":"lista","itens":["Post level 6, you generally want to have the same idea of punishing him whenever he farms, but you need to now have the lane be on your side of the lane before commiting towards an all-in with your ultimate.","Additionally: try saving your skillshots until after you've seen Kassadin use his teleport so that you can ensure that your spells will land."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["When using your ultimate, don't give him any crevices that he could potentially teleport and consequently get away from you."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["When Kassadin gets his magic shield from his Q orb, wait for it to fall off, and then use your burst tools to punish him down."]}]}]},{"nome":"Katarina","planilha":"Katarina","id":"Katarina","titulo":"a Lâmina Sinistra","dificuldade":{"early":3,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Note","Every ability gets -15 seconds if she gets a takedown."],["Q (Poke)","11 / 10 / 9 / 8 / 7"],["W (MS boost)","15 / 14 / 13 / 12 / 11"],["E (Dash)","12 / 11 / 10 / 9 / 8 ( Resets by a large% if she picks up a dagger )"],["Ult","75 / 60 / 45"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1 is the only point of the game where you can consistently land skillshots against her, so try zoning her out of the wave with your Q poke and secure level 2 priority.","Level 2, rank up your W if she's close towards the wave since you're not going to be able to land your E anyways, and threaten her with shield bash procc's."]},{"tipo":"p","texto":"If she's away from the wave when you hit level 2, you can theoretically level up your E for additional poke, but this is pretty risky considering that you're lacking a massive damage and survivability tool against an assassin in the early game."},{"tipo":"lista","itens":["Level 3, crash the third wave, and go for a recall for a cheater reset or stay in lane to soak up EXP until you've hit your level 6 powerspike."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Wait for Katarina to use her E dash, and then Q her before she's able to reset said E dash by picking up one of her daggers."]},{"tipo":"p","texto":"If she's still in range for you to keep hitting her, use your W and apply a shield bash procc onto her."},{"tipo":"p","texto":"That's it. That's all the counter play you can do against her. You can't do anything into her until she uses her dash first, but if she doesn't use her dash, she's not really that threatening."},{"tipo":"lista","itens":["Post level 6 is a diferent story though, since you can now limit her mobility down to only towards you or and daggers that she's created."]},{"tipo":"p","texto":"Essentially: just wait for her to overextend into your side of the lane, and then try getting your ultimate off before she's able to slip right past you."},{"tipo":"lista","itens":["You're realistically not going to be able to land your Q's consistently into her, but that's okay. Just auto attack her to death with PTA and dusk & dawn proccs in your ultimate, and you should be fine."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Keep track of Katarina's itemization, if she's going on-hit: then you need to build mixed resistances, but if she's building AP, then just build magic resistance items depending on how quickly she bursts you down."]},{"tipo":"p","texto":"(Priority list from high burst to low burst is: Kaenic Rookern, Spirit's Visage, and Force Of Nature)"}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Post level 6, try to save your E until after you've secured your ultimate and after she's used her own ultimate to cancel her channel."]}]}]},{"nome":"Kayle","planilha":"Kayle","id":"Kayle","titulo":"a Justa","dificuldade":{"early":2,"mid":1,"late":4,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}],[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To get into initation range )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]},{"rotulo":"Items vs.","linhas":[{"tipo":"nota","texto":"[ Get Oblivion Orb as soon as Kayn gets red form, otherwise: just keep building towards your first item ]"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( More Burst Damage^ )"},{"tipo":"sep"},{"tipo":"nota","texto":"[ If he's going red Kayn ]"},{"tipo":"item","texto":"Liandry's Torment","passos":[[{"nome":"Liandry's Torment","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6653.png"}]],"motivo":"( To keep grevious wounds ticking on him when he ults you )"},{"tipo":"sep"},{"tipo":"item","texto":"Zhonya's Hourglass","passos":[[{"nome":"Zhonya's Hourglass","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223157.png"}]]},{"tipo":"nota","texto":"( To avoid taking damage from his ultimate )\""}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke)","12 / 11 / 10 / 9 / 8"],["W (Heal + MS boost)","15"],["E (Empowered AA)","8 / 7.5 / 7 / 6.5 / 6"],["Ult","160 / 120 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"p","texto":"Level 1 you actually lose the 1v1 against a level 1 Kayle in an all-in, so you usually just want to play to poke her out with your Q and let the wave push into you and then play for the rebound."},{"tipo":"p","texto":"Once you get level 3 and you have a long lane to run her down in with the rebound, land your E, go for an all-in, and threaten her to recall when you crash the wave / force her to TP back."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Wait for Kayle to walk up to either use her Q poke or use her E to farm if she's pre-6, this is your best opportunity to land your abilities in the middle of her animations."]},{"tipo":"p","texto":"Most of the time, at least: before you get rocketbelt, your E will miss, BUT: when you do get your rocketbelt, so that you can enter your initation range which is right outside her ranged form zoning range."},{"tipo":"p","texto":"It's guaranteed that you will at least land your ult which is the most important part of this matchup."},{"tipo":"p","texto":"From here, You should have enough damage and anti-kite to just perma kill her from here on out."},{"tipo":"p","texto":"So just keep spam rocketbelt ulting onto her and try to get enough solo kills to secure a victory before she reaches level 16."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["In the rare chances where she is able to get back and reach level 16, you want to try to ult her and just stall for as long as possible, you don't need to kill her, just stall."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Kayle's W has an absurdly long cooldown at 15 seconds, if you can: try to play aggressive during the time when it's down."]}]},{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Dash)","7 / 6.5 / 6 / 5.5 / 5"],["W (Poke)","13 / 12 / 11 / 10 / 9"],["E (Wall walk)","21 / 19 / 17 / 15 / 13"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Kayn's has a deceptively scary level 1, so just give up priority and play towards your level 2 powerspike","Level 2, rank up your W, stack it up, and then trade with the Kayn with your Q's and shield bash procc's for as long as possible until your W shield gets low.","On the third wave, let it crash since otherwise: you'll take a lot of damage from the minions and play towards the rebound back to his turret."]},{"tipo":"p","texto":"Ideally you want to try and have the wave be on your side of the lane at all times since you can abuse your significantly stronger burst trades with shield bash."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Just try to poke him with your E and Q's whenever he walks up to farm minions,"]},{"tipo":"p","texto":"After the initial trade, try to save your Q's until after he's used his Q dash to guarantee it since he can theoretically dodge it with his Q by dashing through you if he's close enough towards you."},{"tipo":"lista","itens":["Before level 6, try to prolong trades for as long as possible until you W shield gets low, when it gets low, just back off.","Post level 6, keep playing trades the exact same way, but when he decides to ult you, make sure to stay away from walls to avoid giving him an escape path."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If Kayn goes red form, be sure to buy oblivion orb as soon as possible to cut down his healing,","If Kayn goes blue form, he's going to lose out on a lot of kill pressure, but he's going to be really hard to kill."]},{"tipo":"p","texto":"Be sure to ping your teammates if it's a blue Kayn since they tend to orientate more towards roaming as opposed to laning 1v1 against you."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If it's a red Kayn player, you can try to time your Q into his W knockup to buffer through the CC.","If Kayn goes through the wall to heal with his E, you can force an extended trade against him since he'll be out of his primary escape tool against you."]},{"tipo":"p","texto":"This is especially important post level 6 since you don't want him to completely ignore you and run through the other side of a wall to negate your ult pressure."},{"tipo":"p","texto":"Alternatively, you can also manipulate your ultimate arena to not be facing towards any escape paths if you feel like the only way of extending a trade against said Kayn is to use your ultimate."}]}]},{"nome":"Kennen","planilha":"Kennen","id":"Kennen","titulo":"o Coração da Tempestade","dificuldade":{"early":3,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce stun duration )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To get into initation range )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","7 / 6.25 / 5.5 / 4.75 / 4"],["W (Electrical Surge)","13 / 11.25 / 9.5 / 7.75 / 6"],["E (MS boost)","10 / 9 / 8 / 7 / 6"],["Ult","120"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, give up priority and let him push into you, play for the rebound, shove out the wave, recall."]},{"tipo":"p","texto":"Let the wave push back into you and then just farm until rocketbelt and level 6."}]},{"titulo":"How to trade","blocos":[{"tipo":"p","texto":"Pre 6, If he ever walks up to auto attack you, he's in range to get smacked in the head."},{"tipo":"p","texto":"So smack him in the head with Q anytime he walks up."},{"tipo":"p","texto":"Once you do get level 6, this matchup should be a lot more playable, basically if he's like 60% hp from your Q poke and he gets close enough to land an E+R, just go for it and then just run him down and kill him."},{"tipo":"p","texto":"Even if he does manage to get some distance between the two of you, just rocketbelt him and kill him anyways."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Kennen is really deadly in teamfights because of his AOE ultimate, but, luckily for you: you're playing a champion that can completely negate that and turn it back to a 1v1.","Kennen is really annoying because of his passive stun, but if you can spot him wasting his W or Q on the wave, play aggressively during it's down-time."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you ult Kennen while he's ulting, you'll steal some of the resistances he gets from his ultimate which is pretty nice.","Try to exhaust Kennen while he's using his ult."]}]}]},{"nome":"Kled","planilha":"Kled","id":"Kled","titulo":"o Cavaleiro Intratável","dificuldade":{"early":4,"mid":3,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror - > Triumph - > Alacrity","icone":null},{"nome":"Coup De Grace","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/CoupDeGrace/CoupDeGrace.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( Damage Item^ )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Mounted Q (Bear Trap)","11 / 10 / 9 / 8 / 7"],["Dismounted Q (Shotgun)","3"],["W (AS Boost)","13 / 12 / 11 / 10 / 9 (lowered by 1.5 / 0.5 sec. per hit depending on target )"],["E (Dash)","13 / 12 / 11 / 10 / 9"],["Ult","140 / 125 / 110"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"p","texto":"You REALLY have to respect Kled's early game ( levels 1-5 ), just sit back, let the wave push into you, poke him with max ranged Q's, use your W against his burst and play for as short of trades as you possible can."},{"tipo":"p","texto":"Then, play for the rebound, crash the wave, and then let the wave bounce back."},{"tipo":"p","texto":"DO NOT DIE before level 6."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, play exclusively for short trades.","Once you do get level 6 however, this matchup completely turns around to your favor."]},{"tipo":"p","texto":"Poke him out with Q's and when he's about to be dismounted and has his W up to yoink more attack speed: E -> R -> Ignite -> AA until dismount -> Q -> W -> Shield bash AA -> Finish him off with your passive + Conqueror stacks."},{"tipo":"p","texto":"If you're able to get the above mentioned combo off once he's under lethal range and are able to snowball past laning phase, you should be fine for the rest of the game."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you do not have all your abilities up for an all-in burst combo, you do not have the ability to kill a low HP Kled."]},{"tipo":"p","texto":"DO NOT TRY IT!"},{"tipo":"lista","itens":["Sometimes, when Kled's are behind, they'll do the patented: \"run off, and roam\" strat."]},{"tipo":"p","texto":"Just make sure to ping your teammates if Kled is ever missing."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you use your ultimate while his W is up ( when his sword looks shiny ), you'll yoink some of the bonus attack speed he gets from his W."]}]}]},{"nome":"Kog'Maw","planilha":"Kog'maw","id":"KogMaw","titulo":"a Boca do Abismo","dificuldade":{"early":3,"mid":2,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Boots / Plated Steelcaps","passos":[[{"nome":"Boots","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/1001.png"},{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( AP vs. On-hit Kog'maw )"},{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To get into initiation range^ )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","7"],["W (Empowered AA's)","17"],["E (MS Slow)","12"],["Ult","2 / 1.5 / 1"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Give up level 1 priority, and conserve your HP to play off the third wave.","Level 2, level up your W and just keep playing safe and sustaining through the lane.","Third wave, let it crash, and then start playing off the rebound on the fourth wave."]},{"tipo":"p","texto":"Ideally you want to try and farm up until your plated steelcaps + level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your skillshots when Kog'maw walks up to use his Q poke or to CS minions, but don't commit towards an all-in until you've gotten your plated steelcaps + level 6 powerspikes.","Once you have gotten your plated steelcaps and level 6 powerspike, force an all-in by successfuly timing an E into an R when he goes for an auto attack."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Kog'maw Q partially shreds your armor and magic resistance, so try to dodge it first before ulting him to avoid taking extra damage."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ideally try to start fights while his W is on cooldown since it's where a significant amount of his power budget is in.","Kog'Maw's Void Ooze (E) can follow him between realms."]}]}]},{"nome":"LeBlanc","planilha":"Leblanc","id":"Leblanc","titulo":"a Farsante","dificuldade":{"early":4,"mid":3,"late":3,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her root duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Clones)","60"],["Q (Poke tool)","6"],["W (Dash","15 / 13.75 / 12.5 / 11.25 / 10"],["E (Root)","14 / 13.25 / 12.5 / 11.75 / 11"],["Ult","45 / 35 / 25"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Honestly: It's a lot easier to play this lane by sitting back, and giving up priority to play towards bouncing the waves back and forth."]},{"tipo":"p","texto":"So: just do that, repeat the cycle, and wait for your level 6 + Mercury Treads."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["When Leblanc uses her W against you, if you can line up your E to hit both her and wherever she initially used said W, go for it, since it will guarantee a pull whether or not she teleports back."]},{"tipo":"p","texto":"Same idea applies with your Q, but it's not nearly as long which makes this strategy more difficult for it."},{"tipo":"lista","itens":["If her W has already been cast, you can just E her directly and commit towards an all-in.","This is about the only play you can actually go for until you've gotten your level 6 and Mercury Treads, once you've gotten this powerspike, just wait for her to use her W, ult her, eat the root that is about come at you, and reduce it's duration passively with all of the tenacity in your setup,"]},{"tipo":"p","texto":"And then proceed to run her down in your ultimate while her W is down. If she recasts her W dash with her ultimate, stand in the center of her last dashed position, and then Q directly towards her."},{"tipo":"p","texto":"Ideally: you want to wait until her dash has timed out to commit towards a certain direction since she'll no longer have the ability to use her insane amount of mobility."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["When Leblanc reaches low HP, she has the ability to create a mirage to momentarily distract you until said mirage has expired."]},{"tipo":"p","texto":"Wait until you see the real Leblanc use some sort of ability to commit towards chasing a Leblanc since the only thing that Leblanc can make her clone do: is move around and do fake auto attacks."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Keep track of her W cooldown at all times because this timer will determine when you will play aggressively and when you will play passively."]}]}]},{"nome":"Lee Sin","planilha":"Lee Sin","id":"LeeSin","titulo":"o Monge Cego","dificuldade":{"early":3,"mid":3,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror - > Triumph - > Alacrity","icone":null},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Revitalize","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/Revitalize/Revitalize.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone": alk up to his turret without the wave actively tanking turret shots, unless you want to get insec'd and die a cheesy death."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to use your shield at higher HP values to avoid tanking extra damage because Lee Sin's Q deals more damage the lower max% HP you are."]}]}]},{"nome":"Lissandra","planilha":"Lissandra","id":"Lissandra","titulo":"a Bruxa Gélida","dificuldade":{"early":3,"mid":3,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her stun duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[ ocos":[{"tipo":"tabela","linhas":[["Q (Nail poke)","10 / 9 / 8 / 7 / 6"],["W (Main defensive tool)","18 / 17 / 16 / 15 / 14"],["E (Dash)","10 (Resets on takedown)"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Locke has a pretty threatening early trade pattern, so just let him get priority of the wave.","Level 2, level up your W and keep playing back while sustaining with your W throughout the lane, if he dashes onto you now, Q him, and then save your W until it gets to a high shield amount, W, and then keep trading with him until it goes low.","Level 3, play for the rebound back to his turret, and keep bouncing waves back and forth until level 6 where you can find a reliable kill angle."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["DO NOT overextend and let him get a 3 nail -> auto procc without spacing him out so that he has to over-commit with E first.","As said earlier, if he ever engages onto you first with his E, Q him, play patient with your W, hit him with a massive shield-bash procc, and then keep trading with him until your W goes down.","Post level 6: this matchup gets easier since you can now force him to stay in range of you with his ultimate."]},{"tipo":"p","texto":"Ideally try to use your ultimate until after he's used his E first so that you can more reliably kill him, but if you position your ultimate in a way where there are no easy walls for him to dash around:"},{"tipo":"p","texto":"You should be able to just kill him in an all-in regardless."}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["When Locke uses his ultimate onto you: use your W shield around the 30% mark and not a moment later so that you don't get executed by his ultimate."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can theoretically ult away his initial ultimate cast, but this requires VERY specific timing."]},{"tipo":"p","texto":"If you got hit by it, it won't matter if you ult him later since his ult applies a debuff and isn't location reliant."},{"tipo":"p","texto":"I MEAN: still ult him, since he is most likely going to use his all-in combo onto you and in principle:"},{"tipo":"p","texto":"It's generally always better to use your ultimate as the start of an enemy's combo to reduce the most amount of damage possible."}]}]},{"nome":"Lucian","planilha":"Lucian","id":"Lucian","titulo":"o Purificador","dificuldade":{"early":4,"mid":3,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce her damage )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":" his ultimate is where the majority of his damage comes from."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to position your ultimate in a way where he can't use his E over a wall to escape easily from you."]}]}]},{"nome":"Lulu","planilha":"Lulu","id":"Lulu","titulo":"a Fada Feiticeira","dificuldade":{"early":4,"mid":3,"late":3,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her polymorph duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main poke tool)","7"],["W (Polymorph / AS + MS boost)","18"],["E (AA empowerment)","10 / 9.5 / 9 / 8.5 / 8"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Let the first three waves push into you, and just preserve your HP so that you can safely secure a rebound back to her turret.","After crashing the wave, recall if you're low or stay in lane so that you don't miss any EXP."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to time your skillshots while she's using her Q projectile onto you in order to minimize the uptime on it's slow (80%, decaying over two seconds).","Only commit towards longer trades when you have an initially high amount of W shield to work off of since she can deal a surprising amount of poke damage without being initially punished due to her strong self-peel tools.","Post level 6: this matchup gets relatively easier since you can force a long trade onto her after exhausting all of her self-peel tools in the initial engage."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Post level 6: Lulu has pretty good gank setup via her ultimate knockup, so just be wary of the enemy jungler."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Don't ego too hard into a Lulu, yes: she's a support, so she'll have low damage compared to other top laners, but in exchange: she has really strong self-peel tools which makes it difficult to fight her if you're fighting in any trade that isn't explicitly an all-in."]},{"tipo":"p","texto":";If you're having trouble in the early laning phase, that's fine, just wait for your rocketbelt and mercury tread powerspikes so that you can find easier engage angles."}]}]},{"nome":"Lux","planilha":"Lux","id":"Lux","titulo":"a Dama da Luz","dificuldade":{"early":4,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( To reduce her root duration )"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Root)","10"],["W (Shield)","12 / 11.5 / 11 / 10.5 / 10"],["E (Main poke tool)","10 / 9.5 / 9 / 8.5 / 8"],["Ult","60 / 50 / 40"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["You can't really interact with Lux in the early game in general, so: sit back, give up lane priority, wait for the wave to get to your side of the lane, and play for the rebound back to her turret,"]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke he's dishing out onto you, just recall and run back to lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Lux due to her range advantage, I mean: I guess you could theoretically try to get an E angle after she uses her Q root, but most of the time: they aren't going to just waste the ability for 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, and then just run at the Lux until she uses her root on you,"]},{"tipo":"p","texto":"When she does that: use your E, ult her, and then just kill her in an all-in. It's really just that simple."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt and mercury treads powerspike since you can just eat the root, utilize the tenacity from your itemization and runes, and then just rockebelt","> ult her -> kill her again."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Don't recall in an exceptionally obvious spot if you're low hp, since some Lux players like to go ult snipes while you're recalling.","If you're under 40% HP, recall and run back to lane since you're most likely going to get dived by the enemy jungler while the wave is near your turret."]},{"tipo":"p","texto":"It's literally their only win condition against you in this lane, so just be wary of that."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you ever manage to close the distance onto the Lux without her using her root onto you, you can buffer your E or your Q into her root to effectively negate it's duration since both your Q and your E self-root you anyways."]}]}]},{"nome":"Malphite","planilha":"Malphite","id":"Malphite","titulo":"o Fragmento do Monolito","dificuldade":{"early":2,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rylai's Crystal Scepter","passos":[[{"nome":"Rylai's Crystal Scepter","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"item","texto":"Boots Of Swiftness","passos":[[{"nome":"Boots Of Swiftness","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223009.png"}]],"motivo":"( So you can keep up with him )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( So you can actually deal damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Poke tool)","8"],["W (Empowered AA's)","10 / 9.5 / 9 / 8.5 / 8"],["E (AOE slam)","7"],["Ult","130 / 115 / 100"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"p","texto":"Get priority, shove the wave, play for the bounce back, rebound the wave, recall, get your items, and just rinse and repeat until you've reached Rylai's."},{"tipo":"p","texto":"You don't really have that much kill threat until you reach your very first item, but it's not like he can really kill you either."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Before level 6, just find any opportunities to go for an E -> Q whenever you can, you'll most likely find these opportunities when he walks up to land his own Q, in which case you should shield first with your W, and then retaliate back at him.","Post level 6, you can find a little bit more of a leeway to potentially get a solokill with an all-in, but if the Malphite is competent, he's just going to outkite you with his ult.","Once you get your Rylai's, however, it's just a matter of landing a singular skillshot and then running him down with your passive.","If you want to secure the kill, feel free to ult him so that he's contained in your realm and forced to ult inside of your ultimate, in which case you can just follow through and kill him anyways."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["He CAN use his ultimate to cancel your ultimate but this requires VERY specific timing that I've never seen a Malphite pull off reliably before."]},{"tipo":"p","texto":"So: just don't worry about it too much."},{"tipo":"lista","itens":["What you should worry more about is the potential gank setup he can apply onto you with his ultimate. Sure, he might not kill you, but his jungler might."]},{"tipo":"p","texto":"So just be wary of where the enemy jungler is at all times, especially post level 6."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you're bringing ghost in this matchup, make sure to ghost AFTER he's Q'd you, instead of before he lands it because his Q steals a percentage of your movement speed."]}]}]},{"nome":"Malzahar","planilha":"Malzahar","id":"Malzahar","titulo":"o Profeta do Vazio","dificuldade":{"early":3,"mid":2,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Stormraider's Surge","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/PhaseRush/StormraidersSurgeRuneIcon2.png"},{"nome":"Nimbus Cloak","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/NimbusCloak/6361.png"},{"nome":"Transcendence","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/Transcendence/Transcendence.png"},{"nome":"Gathering Storm","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/GatheringStorm/GatheringStorm.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Double Adaptive","icone":null},{"nome":"Scaling Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"nota","texto":"[ Flex Boots depending on the enemy team comp ]"},{"tipo":"item","texto":"Riftmaker / Dusk & Dawn","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Damage Item, basically pick whichever one is more suited towards the enemy team composition )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Spellshield)","30 / 24 / 18 / 12 (based on level)"],["Q (Poke tool)","6"],["W (Annoying little RATS)","8"],["E (DOT)","11 / 10 / 9 / 8 / 7"],["Ult","140 / 110 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Like most ranged matchups, just let wave push into you, and preserve your HP to secure a rebound, and then just freeze the wave so that he has to overextend in order to farm.","Post level 6, you should almost always want to have the wave on your side of the lane, until you get too low to maintain it, in which you should just push the wave out, secure a crash, secure a recall, and then rinse and repeat."]}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Tether in and out of Malzahar's Q range to bait it, and once he uses it, confidently walk up since he'll no longer have his main poke tool."]},{"tipo":"p","texto":"In the first rotation of this, your main goal is to just take out his spell shield, and then in the second rotation of this, you want to (try) to land your E -> Q -> all-in since he tends to have low amounts of overall DPS."},{"tipo":"lista","itens":["Try to stand away from minions that are dying from his E, so that you don't get it spread onto you and take additional poke damage for free.","Post rocketbelt, this matchup gets extremely easy since you can always guarantee an all-in with rocketbelt to break his spell shield -> E -> R -> free kill, you just have to wait til' then."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["DO NOT use your ultimate if his passive spell shield is up since it will cancel your ultimate entirely.","Post level 6, be HEAVILY aware of where the enemy jungler is, since Malzahar has extremely good gank setup; if you don't know where the enemy jungler is, assume he's on your side of the map."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["You can technically ult away Malzahar's voidlings, but this shouldn't matter too much since they do so little damage anyways (It's good to keep in mind though)."]}]}]},{"nome":"Maokai","planilha":"Maokai","id":"Maokai","titulo":"o Ente Sinistro","dificuldade":{"early":2,"mid":1,"late":2,"overall":2},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Haste","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendHaste/LegendHaste.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity/Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rylai's","passos":[[{"nome":"Rylai's","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"item","texto":"Mercury's Treads","passos":[[{"nome":"Mercury's Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( So you can keep up with him )"},{"tipo":"item","texto":"Riftmaker","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"}]],"motivo":"( So you can actually deal damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Passive (Empowered AA)","30 – 20 (based on level) (Cooldown is lowered by ability hits)"],["Q (Poke tool)","7 / 6.5 / 6 / 5.5 / 5"],["W (Root)","14 / 13 / 12 / 11 / 10"],["E (Sapling toss)","18 / 17 / 16 / 15 / 14"],["Ult","130 / 110 / 90"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"p","texto":"Get priority, shove the wave, play for the bounce back, rebound the wave, recall, get your items, and just rinse and repeat until you've reached Rylai's."},{"tipo":"p","texto":"You don't really have that much kill threat until you reach your very first item, but it's not like he can really kill you either."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Just try to hit him with max range Q's to avoid getting hit by his Q.","If he ever uses his W root, that's your go-sign to use your E against him and force an all-in.","If he doesn't use his W root ever, well: just wait for Rylai's and all you need to do is land literally one singular skillshot so that you can enable the rest of your abilities, which will then enable you to run him down and kill him with your passive."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Maokai has a REALLY nasty CC chain which makes it especially important that you keep note of the enemy jungler.","Additionally: DO NOT stand near his turret unless you want to get insec'd, this is the only way he can possibly get a solokill onto you.","Be aware that Maokai W makes him untargetable to any kind of damage making it so that if he's good enough, he can dodge your E with his W."]},{"tipo":"p","texto":"Just: don't use your E early against him ever, yeah? Wait for him to use his W first, and then E."},{"tipo":"lista","itens":["Don't stand near the bushes since he can poke you down harder with empowered E's."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Ideally, if you can, try to push out side-waves so that he's forced to respond to them, and from there:"]},{"tipo":"p","texto":"Either run him down with Rylai's + Approach Velocity or just force 5v4's, if he abandons the wave, he'll slowly bleed out on resources."},{"tipo":"lista","itens":["In teamfights, it's pretty to good to ult the Maokai and secure the kill against Maokai early to make it so that he can't use his ultimate and subsequent CC chain on your team."]}]}]},{"nome":"Master Yi","planilha":"Master Yi","id":"MasterYi","titulo":"o Espadachim Wuju","dificuldade":{"early":4,"mid":4,"late":5,"overall":4},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Press the attack","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/PressTheAttack/PressTheAttack.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Bone Plating","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Attack Speed","icone":null},{"nome":"Adaptive Force","icone":null},{"nome":"Flat Health","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Dusk & Dawn","passos":[[{"nome":"Dusk & Dawn","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/222510.png"}]],"motivo":"( Max Burst Damage^ )"},{"tipo":"item","texto":"Plated Steelcaps","passos":[[{"nome":"Plated Steelcaps","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223047.png"}]],"motivo":"( To reduce his damage )"},{"tipo":"item","texto":"Riftmaker / Nashor's Tooth","passos":[[{"nome":"Riftmaker","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/224633.png"},{"nome":"Nashor's Tooth","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223115.png"}]],"motivo":"( Damage Item, go Nashor's Tooth if you want to hard focus on 1v1ing your laner^ )"},{"tipo":"item","texto":"Experimental Hexplate","passos":[[{"nome":"Experimental Hexplate","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223073.png"}]],"motivo":"( Movement speed + damage )"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main damage tool)","20 / 19.5 / 19 / 18.5 / 18 (Lowered by 1 second per AA)"],["W (Healing + Damage resistance)","10"],["E (Empowered AA's)","14"],["Ult","85"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["Level 1, you lose, since he can theoretically dodge your Q with his Q, so just play safe and give up priority.","Level 2, it's tradeable assuming your shield is high before you start said trade. Otherwise: you lose."]},{"tipo":"p","texto":"Generally speaking though: you generally want to play safe until you get your Dusk & Dawn powerspike since from level 3 onwards, he kind of just beats you until you get some sort of point and click burst tool."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["Try to go for very non-commital Q pokes against him when he goes to farm for minions, since if you use your Q while you're fighting him, he has two ways to completely negate said Q (by dodging it or by 'blocking' it with his W)","Generally speaking though: you only want to extend trades for as long as your W shield is high, because otherwise: you'll just lose."]},{"tipo":"p","texto":"At least: until you get your Dusk & Dawn powerspike."},{"tipo":"lista","itens":["Once you do get your Dusk & Dawn powerspike, save your E until he uses his meditate to cancel it, and utilize sheen proccs to burst him down with PTA and Dusk & Dawn."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["Keep track of his Q and W cooldown timers since this will dictate whenever you are allowed to use your own Q."]}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["Try to save your Q in longer fights until after he's used both his Q and his W, because otherwise: he'll either be able to entirely or effectively negate it."]}]}]},{"nome":"Mel","planilha":"Mel","id":"Mel","titulo":"o Reflexo da Alma","dificuldade":{"early":4,"mid":2,"late":2,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Unsealed Spellbook","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/UnsealedSpellbook/UnsealedSpellbook.png"},{"nome":"Magical Footwear","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/MagicalFootwear/MagicalFootwear.png"},{"nome":"/ Cash Back (Personal preference)","icone":null},{"nome":"Triple Tonic","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Inspiration/PerfectTiming/AlchemistCabinet.png"},{"nome":"Approach Velocity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/ApproachVelocity/ApproachVelocity.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/MirrorShell.png"},{"nome":"Second Wind","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/SecondWind/SecondWind.png"}]},{"rotulo":"Fragmentos","pecas":[{"nome":"Adaptive Force","icone":null},{"nome":"Movement Speed","icone":null},{"nome":"Tenacity / Slow Resist","icone":null}]}]],"itens":[{"rotulo":"Items vs.","linhas":[{"tipo":"item","texto":"Rocketbelt","passos":[[{"nome":"Rocketbelt","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223152.png"}]],"motivo":"( To close the initial distance )"},{"tipo":"item","texto":"Mercury Treads","passos":[[{"nome":"Mercury Treads","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223111.png"}]],"motivo":"( Extra Tenacity )"},{"tipo":"item","texto":"Rylai's Crystal Scepter","passos":[[{"nome":"Rylai's Crystal Scepter","icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/223116.png"}]],"motivo":"(Combos with Approach Velocity)"},{"tipo":"nota","texto":"[ I'm testing something out in this specific matchup ]"}]}],"secoes":[{"titulo":"Enemy Cooldowns","blocos":[{"tipo":"tabela","linhas":[["Q (Main poke tool)","10 / 9 / 8 / 7 / 6"],["W (Reflect / Shield)","38 / 35 / 32 / 29 / 26"],["E (Root)","11 / 10.5 / 10 / 9.5 / 9"],["Ult","120 / 100 / 80"]]}]},{"titulo":"Early Game","blocos":[{"tipo":"lista","itens":["You can't really interact with an artillery mage in the early game in general, so: sit back, give up lane priority, wait for the wave to get to your side of the lane, and play for the rebound back to her turret,"]},{"tipo":"p","texto":"From there: either choose to recall for health or to stay in lane to not miss EXP."},{"tipo":"p","texto":"If you're ever too low from the poke she's dishing out onto you, feel free to recall and use your teleport to get back into lane so that you can play towards your level 6 powerspike."}]},{"titulo":"How to trade","blocos":[{"tipo":"lista","itens":["You can't exactly 'trade' with a Mel due to her range advantage, I mean: I guess you could theoretically try to get an E angle after she uses her E stun, but most of the time: they aren't going to just waste the ability for 0 reason.","Just play safe until you get your level 6, wait for the wave to be on your side of the wave, swap one of your summoners for cleanse, and then just run at the Mel until she uses her root on you,"]},{"tipo":"p","texto":"When she does that: use your cleanse, ult her, and then just kill her in an all-in. It's really just that simple."},{"tipo":"lista","itens":["This matchup gets even easier once you get your rocketbelt and mercury treads powerspike since you can just eat the stun, utilize the tenacity from your itemization and runes, and then just rockebelt","> ult him -> kill her again."]}]},{"titulo":"What to watch out for","blocos":[{"tipo":"lista","itens":["If you're under 40% HP, recall and teleport back since you're most likely going to get dived by the enemy jungler while the wave is near your turret."]},{"tipo":"p","texto":"( This is especially important against Mel since she has an execute mechanic on her passive )"},{"tipo":"p","texto":"It's literally their only win condition against you in this lane, so just be wary of that."}]},{"titulo":"Tips","blocos":[{"tipo":"lista","itens":["If you ever manage to close the distance onto the Mel without her using her stun onto you, you can buffer your E or your Q into her stun to effectively negate it's duration since both your Q and your E self-root you anyways.","Mel's W does literally nothing against you, lmao-"]}]}]},{"nome":"Mordekaiser","planilha":"Mordekaiser","id":"Mordekaiser","titulo":"o Revenã de Ferro","dificuldade":{"early":null,"mid":2,"late":1,"overall":3},"tldr":[],"runas":[[{"rotulo":"Principal","pecas":[{"nome":"Conqueror","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Conqueror/Conqueror.png"},{"nome":"Triumph","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/Triumph.png"},{"nome":"Alacrity","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Precision/LegendAlacrity/LegendAlacrity.png"},{"nome":"Last Stand","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Sorcery/LastStand/LastStand.png"}]},{"rotulo":"Secundária","pecas":[{"nome":"Shield Bash","icone":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/MirrorShell/Mirr
