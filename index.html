","pecas":["CashBack","PerfectTiming"]},"bota":{"texto":"Mercúrio","pecas":["3111"]},"build":{"texto":"Tanto faz","pecas":[]},"dificuldade":"facil"}},"traducao":{"linhas":{"short trade -> não deixa ela procar trovão, desviando de uma skill a troca é sua":"short trade -> don't let her proc Electrocute, dodge one skill and the trade is yours","ela sempre tem ult mid game então gank e só com stun aliado ou se ela der over":"she always has ult mid game so only gank with an ally stun or if she overextends","vc da stat check depois se ela não estiver mt forte, é free kill sem o charme":"you stat check her later if she isn't too fed, free kill without charm","early lane é obrigatório vc dar poke até não querer mais, se estiver sem dshield vc tem que solar":"early lane you must poke her nonstop, if she has no Doran's Shield you have to solo kill","lvl 4 ela tenta revidar, leva ela passear no E com o arpel":"lvl 4 she tries to fight back, take her on a walk with your E grapple","usa ult pra revelar na fumaça quando ela tentar matar seu adc, de pistola ela te da 100 0":"use ult to reveal her in the shroud when she goes for your ADC, gun form she one-shots you from full","troca dela é forte mas vc pega press early, solável se ela ficar confiante e vc desviar do Q":"her trades are strong but you get early prio, killable if she gets cocky and you dodge Q","gank ou roaming, tomou o Q e o R = deu ruim, ela te da stat check com item":"on ganks or roams, eating Q + R = you're done, she stat checks you with items","lvl 6 press dela, não insista muito nas lutas 3v3 que ela é muito forte e da peel pro time":"lvl 6 prio is hers, don't force 3v3 fights, she's very strong and peels for her team","early solável, depois não. ela te da outrange sempre, mas se gastar stun na wave pode lutar":"killable early, not later. she always outranges you, but if she wastes stun on the wave you can fight","press e skirmish sua sempre, roam também, mas o roam dela resulta em kill se encaixar":"prio and skirmish are always yours, roams too, but her roams get kills if they land","ela só tem ameaça com o F e R, ela vai tentar te dar ik ou setar gank com eles up certeza":"she's only a threat with Flash and R, she'll try to all-in you or set up ganks with them up for sure","lvl 1 seu, basta não deixar o Q explodir, tem que solar no mínimo umas duas vezes, rola dive":"lvl 1 is yours, just don't let Q explode, you should solo kill him at least twice, dives work","da pra fazer short trade pra amaciar depois jogar o E quando ele parar pra bater na wave":"short trade to soften him, then E when he stops to hit the wave","joga o E na frente dele e segue o W atirando nele xD press seu e skirmish tbm, segue o roam dele":"E in front of him and follow his W shooting him xD prio is yours and skirmish too, follow his roams","early lane é seu mas os cd do Q dela é baixo, desviou de algo = arpel pra cima e tenta matar":"early lane is yours but her Q cooldown is low, dodged something = grapple in and go for the kill","seu R revela o W dela mas o R dela desvia dos tiros, tomou E + Q com ela de ult up só da recall":"your R reveals her W but her R dodges the shots, ate E + Q with her ult up = just recall","desvia sempre pra trás, pros lados n rola muito, late é quem ver o outro primeiro mata":"always dodge backwards, sideways doesn't really work, late game whoever sees the other first wins","early solável e da pra ignorar os soldados pra bater nele se não for mais de um":"killable early, you can ignore the soldiers to hit him if there's only one","com item ele tem mais DPS e range, além da ult ser apelona pra setar gank ou mesmo pra te solar":"with items he has more DPS and range, and his ult is busted for setting up ganks or even solo killing you","press even e skirmish / roam muito seu, sidelande dele mas da pra matar":"prio is even and skirmish / roam are very much yours, side lane is his but he's killable","bem fodase fora de tf, da pra focar ele em skirmish também, auto defesa PÍFIA desse boneco":"pretty irrelevant outside teamfights, you can focus him in skirmishes too, this guy's self defense is PATHETIC","ele pode ultar do nada, não vai dar 100 0, faz vamps e fica full hp ou da recall e volta de tp":"he can ult out of nowhere, he won't one-shot you, buy Vamps and stay full hp or recall and TP back","não tem pq dar ego, normalmente vc vai estar na vantagem ja que ele não presta em x1":"no need to ego, you'll usually be ahead since he's bad 1v1","use o arpel pra fugir caso ela te acerte o Q, você tem mais waveclear gank normalmente é kill":"use the grapple to escape if she lands Q, you have more waveclear, ganks are usually a kill","ela extende muito fácil. side dela":"she extends very easily. side lane is hers","miasma não deixa lançar o arpel, mas não te para se ja estiver no ar**. durante o arpel ult dela = stun":"miasma stops you from casting the grapple, but doesn't stop you if you're already swinging**. her ult during the grapple = stun","poke dela é forte e all in também, se ela errar o Q pode lutar sem muito medo, desvia pra trás":"her poke is strong and so is her all-in, if she misses Q you can fight without much fear, dodge backwards","joga respeitando, se ficar low da recall é melhor que morrer, é solável mas ela tem que jogar mal":"play respectfully, if you're low recall, better than dying, she's killable but only if she misplays","guarde o flash para não tomar a ult, skirmish even, roam seu, press dela":"save Flash to dodge her ult, skirmish even, roam yours, prio hers","lvl 1 seu, short trade dele mas estendendo vc ganha, skirmish é even, vc tem que adivinhar o W":"lvl 1 is yours, short trades are his but you win extended ones, skirmish is even, you have to guess his W","press é sua sempre, lategame compra corta cura e foca ele nas lutas":"prio is always yours, late game buy anti-heal and focus him in fights","ward azul pra ultar normalmente mata quando ele rebobina pra fog dps de pickar alguém":"blue ward to ult him usually kills when he rewinds into fog after picking someone","lvl 1 seu, ele tem muito dano, o E dele volta antes do seu, mas se desviar pode estender a troca":"lvl 1 is yours, he has a lot of damage, his E comes back before yours, but if you dodge you can extend the trade","bem volátil, mas o press é seu sempre e skirmish também, lvl 6 é bom guardar o flash pro tubarão":"very volatile, but prio is always yours and skirmish too, at lvl 6 save Flash for the shark","side lane é seu desde que ele não esteja feedado, e se estiver é só respeitar o range":"side lane is yours as long as he isn't fed, and if he is just respect his range","bata nele, mas fique fora do range e longe da wave pra não tomar full combo ou muito poke":"hit him, but stay out of range and away from the wave so you don't eat a full combo or too much poke","press sua, pingue quando ele for pra fog, pode seguir o roam mas sem dar facecheck":"prio is yours, ping when he goes into fog, you can follow his roams but don't facecheck","lutas normalmente são em grupo, ele acertando o E mata alguém quase sempre, mas a lane é sua":"fights are usually grouped, if he lands E someone almost always dies, but the lane is yours","fácil early, mindgame arpel no fear dele é free kill, ele da bastante dano":"easy early, grapple mindgame on his fear is a free kill, he deals a lot of damage","desvia na diagonal pra trás quando ele jogar o tapete, dai vc não toma a garra, fica atrás da wave":"dodge diagonally backwards when he casts the carpet so you don't eat the claw, stay behind the wave","se ele for ruim joga pra matar na lane, se n skirmish é facil, press é disputado depois do primeiro b":"if he's bad play to kill him in lane, if not skirmish is easy, prio is contested after the first back","lvl 1 você tem pressão, dê bastante dano pra facilitar sua vida, nunca lute contra ela stackada":"lvl 1 you have pressure, deal a lot of damage to make your life easier, never fight her stacked","joga o Q nos minions que ela quer dar dash pra negar/dar dano, foque sempre em desviar do E dela":"throw Q on the minions she wants to dash to, to deny/deal damage, always focus on dodging her E","sidelane contra não da bom, costumam farmar bem então não tome outscale":"sidelane against her doesn't go well, they usually farm well so don't get outscaled","lvl 1 é free kill com um arpel bom, press seu early, lvl 6 geralmente tem ângulo pra solar":"lvl 1 is a free kill with a good grapple, early prio is yours, at lvl 6 there's usually an angle to solo kill","se a lane estiver difícil, luta é even mas roam vc tem vantagem, vc limpa wave mais rápido":"if the lane is hard, fights are even but you have the roam advantage, you clear waves faster","nunca tome o full combo canhão e martelo, bumerangue quando ele pular = shield no empurrão":"never eat the full cannon + hammer combo, boomerang when he jumps = shield up for the knockback","obrigatório matar ele 2 ou 3 vezes, da pra divar FÁCIL, press infinita sua e skirmish também":"you must kill him 2 or 3 times, diving is EASY, infinite prio is yours and skirmish too","não troque kill, o objetivo é deixar ele fraco o máximo de tempo possível":"don't trade kills, the goal is to keep him weak for as long as possible","lvl 11 com 2 ou 3 itens ele já fica forte, da trabalho em tf, side você ainda mata pq ta mais forte":"lvl 11 with 2 or 3 items he gets strong, he's a pain in teamfights, side lane you still kill him because you're stronger","exauste a ult dela,early lane vc respeita as adagas e da bastante poke,":"exhaust her ult, early lane respect the daggers and poke a lot,","não fique perto dos minions que ela vai farmar com o Q,":"don't stand near the minions she's going to farm with Q,","kat AP tem letal maior com alternador hextech, kat de Conquistador é mais forte cedo":"AP Kat has higher kill pressure with Hextech Alternator, Conqueror Kat is stronger early","ela acha que te vence lvl 1 mas se vc tive o mínimo de spacing e usar um bom arpel vc sola":"she thinks she beats you lvl 1 but with minimal spacing and a good grapple you solo kill her","é free lane, tenta forçar a ult e depois divar, é bom dar harass pra não deixar ela free farm, mas side":"it's a free lane, try to force her ult and then dive, harass so she doesn't free farm, but side lane","vc baita a ult dela e vai embora com o arpel e depois ulta, etc. vc não perde se ela não tiver feedada":"you bait her ult, leave with the grapple and then ult, etc. you don't lose if she isn't fed","lvl 1 dele com o W muito forte, full build ele da muito dano.":"lvl 1 is his with a very strong W, full build he deals a lot of damage.","ele é muito papel, então o letal é alto, short trade muito boa":"he's very squishy, so kill pressure is high, short trades are very good","nao fique na wave pra não tomar o E junto dos minions, cuidado com o spacing na lentidão do E dele":"don't stand in the wave so you don't eat E with the minions, watch your spacing in his E slow","lane volátil, passiva e PTA diferenciam real de clone, alinha o bumerangue com ela e a marca do W":"volatile lane, passive and PTA tell the real one from the clone, line up the boomerang with her and her W pad","sua ult revela a invisibilidade mas o clone pode tankar, ela te da 100 0 com qualquer vantagem":"your ult reveals her invisibility but the clone can tank it, she one-shots you from full with any lead","skirmish é seu e roaming é even, vc normalmente vai ter press se ela não ultar a wave":"skirmish is yours and roaming is even, you'll usually have prio unless she ults the wave","lvl 1 seu, poke lane, ela seta gank muito bem depois do 6, com item ela ganha":"lvl 1 is yours, poke lane, she sets up ganks very well after 6, with items she wins","short trade dela long sua, não fique na wave, press even, skirmish sua":"short trades are hers, long ones yours, don't stand in the wave, prio even, skirmish yours","normalmente ela joga pra skirmish e pra gank, difícil sair kill então foque em farmar e ficar full hp":"she usually plays for skirmish and ganks, kills are hard so focus on farming and staying full hp","E somente pra trás, não ande pra frente se ele acertou um prego":"E only backwards, don't walk forward if he landed a nail","flashe a ult dele, exausth o aa dos prego":"Flash his ult, exhaust the nail autos","move speed e corta cura na build":"move speed and anti-heal in the build","lvl 1 seu, poke lane, ela ulta em qualquer oportunidade, mr cedo é bom":"lvl 1 is yours, poke lane, she ults at any opportunity, early MR is good","jogue com a passiva up, ela sempre revida o dano":"play with your passive up, she always trades back","E pra frente sem setup não vale o risco. gank normalmente é kill pra ambos os lados":"E forward without setup isn't worth the risk. ganks are usually a kill for both sides","lane afk, da pra matar pq ele não tem como se defender, farme as baratinhas, press é sua":"afk lane, you can kill him since he can't defend himself, farm the voidlings, prio is yours","fique longe da wave pra não pegar aids, desviando do Q é free kill, lvl 6 sempre tem gank, não morra":"stay away from the wave so you don't catch the plague, dodging Q is a free kill, lvl 6 there's always a gank, don't die","em tf quem ele ultar morre, jogue pro revive, não seja o alvo da ult, side é sua se for 1v1":"in teamfights whoever he ults dies, play for the revive, don't be the ult target, side lane is yours 1v1","lvl 1 2 3 free lane, SEMPRE devolva QAA no pneu se não você perde mais vida que ele":"lvl 1 2 3 free lane, ALWAYS answer the rock with Q + AA or you lose more hp than him","guarde o E pro slow seja pra fugir ou dar chase, dê dano constante pra manter o shield dele desativado":"save E for the slow, to escape or to chase, keep dealing damage to keep his shield down","não entre no range do Q dele se não for pra devolver dano com a passiva up":"don't step into his Q range unless you can trade back with your passive up","lvl 1 seu, resto da lane dela, muito poke e não rola all in direito, só com gank":"lvl 1 is yours, rest of the lane is hers, lots of poke and you can't really all-in, only with a gank","ela tem press mas você ganha skirmish, bota e mr cedo são bons, jogar side dps é tranquilo":"she has prio but you win skirmishes, early boots and MR are good, side lane later is fine","jogar pra roaming, não importa muito ficar um pouco atrás dela":"play for roams, being a bit behind her doesn't matter much","early bem jogado é seu, farma os cachorros, fica fora da wave, press é igual, skirmish é igual":"a well-played early is yours, farm the dogs, stay out of the wave, prio even, skirmish even","leva o cachorro passear quando ela te ultar, não vai cancelar o arpel, E pra spacing nas trocas":"take the dog on a walk when she ults you, it won't cancel the grapple, E for spacing in trades","bumerangue nos cachorros pra esticar o range, tomou os 2 Q = perdeu a troca":"boomerang the dogs to extend your range, ate both Qs = lost the trade","poke lane difícil mas solável, ela errando o Q ou usando W na wave pode lutar":"hard poke lane but killable, if she misses Q or uses W on the wave you can fight","press even, skirmish / roam seu, pode guardar o flash pra ult dela que você quase sempre vence":"prio even, skirmish / roam yours, save Flash for her ult and you almost always win","roam normalmente é seu, ela não te da 100 0 sem item, então da pra baitar roam e virar nela":"roams are usually yours, she can't one-shot you without items, so you can bait a roam and turn on her","lvl 1 é seu com spacing, pinga ult dele lvl 6, trocas são dele, range do W = do seu aa":"lvl 1 is yours with spacing, ping his ult at lvl 6, trades are his, his W range = your auto range","bumerangue no pulo dele pra ganhar o shield rápido, gank é kill pra ambos os lados":"boomerang his jump to get your shield fast, ganks are a kill for both sides","pega press sem se expor, skirmish dele é forte, segue os roam pra sobrar algo ou pega barricada":"take prio without exposing yourself, his skirmish is strong, follow his roams to get something or take plates","abusa lvl 1 que a lane é fácil, sai até kill, não perca o osso à toa, skirmish é even roaming é seu":"abuse lvl 1, the lane is easy, you can even get a kill, don't waste Bone Plating, skirmish is even, roaming is yours","depois de item ela te mata no full combo, vale investir em couraça de pano cedo":"after items she kills you with a full combo, early Cloth Armor is worth it","press é seu pq se ela dar combo na wave vc mata, ult revela o Q no mato":"prio is yours because if she combos the wave you kill her, ult reveals her Q in the brush","early é não tomar muito combo ou poke, ele não tem ameaça de kill mas disputa press":"early is about not eating too many combos or poke, he has no kill threat but contests prio","com item ele dá stat check, luta é sua, pode dar roaming ou farmar afk, normalmente gank é kill":"with items he stat checks, fights are yours, you can roam or afk farm, ganks are usually a kill","só não tomar outscale, fica longe da wave":"just don't get outscaled, stay away from the wave","lvl 1 seu, early meio afk, desvie do E e desengage quando ele ultar, não deixe ele stackar muito":"lvl 1 is yours, early is kind of afk, dodge E and disengage when he ults, don't let him stack too much","skirmish seu, press também, gank normalmente é kill,":"skirmish is yours, prio too, ganks are usually a kill,","cedo é seu desviando deireito, se ele der o E pra frente se esconde na wave e troca AA":"early is yours if you dodge properly, if he E's forward hide in the wave and trade autos","press é seu, se ele gastar mt skill em minion pode comprar a luta, tenta não perder osso à toa":"prio is yours, if he wastes a lot of skills on minions you can take the fight, try not to waste Bone Plating","quem estiver forte da stat check, roam e tf é seu, usou seu R em vc = zoa no /all depois de matar":"whoever is stronger stat checks, roam and teamfights are yours, used your R on you = flame him in /all after you kill him","lvl 1 full seu, dê dano pra facilitar o early, fique fora da wave, despediçou o E = arpel pra cima":"lvl 1 is fully yours, deal damage to make early easier, stay out of the wave, she wasted E = grapple in","em gank e lutas fique do lado oposto do seu jg pra não tomar o E os dois, press even":"in ganks and fights stand on the opposite side of your jungler so you don't both eat the E, prio even","com item normalmente quem ela stunar morre, é bom jogar pra reviver pq sempre alguem toma":"with items whoever she stuns usually dies, play for the revive because someone always gets hit","solável cedo, ela não tem ameaça de verdade se ficar atrás da wave / fora do range mas tem dano":"killable early, she's not a real threat if you stay behind the wave / out of range but she has damage","mindgame cancelando o arpel cedo pra baitar o tapete normalmente resulta em troca ganha":"mindgaming by canceling the grapple early to bait the rock carpet usually wins the trade","com vantagem é free lane, roam é seu, luta é even, mata ela se usar o tapete errado":"with a lead it's a free lane, roam is yours, fights are even, kill her if she misuses the carpet","volátil, sem osso pq ele tira com o W muito fácil, não tome W à toa, lvl 1 seu se não tomar aa, fique longe da wave":"volatile, no Bone Plating because his W pops it too easily, don't eat W for free, lvl 1 is yours if you don't take autos, stay away from the wave","se ele vier dar o W pra pokear revide com Q + auto e saia, pingue sempre que ele sumir":"if he comes in to poke with W answer with Q + auto and back off, ping every time he goes missing","ult sua revela a ult dele, seguir roam = kill normalmente":"your ult reveals his ult, following his roams = usually a kill","muito solável, desvie dos Q, fique longe dos minions, carta na wave = oportunidade":"very killable, dodge his Qs, stay away from minions, card on the wave = opening","ele seta gank bem, lembre de pingar sempre que ele avançar a wave e tiver ult":"he sets up ganks well, remember to ping every time he shoves the wave with ult up","não fique no mapa low hp pq ele pode ultar, costumam farmar bem então não tome outscale":"don't stay on the map low hp because he can ult, they usually farm well so don't get outscaled","difícil sair kill se os dois jogarem direito, não tome Q de graça, stun vc só toma se for noob":"hard to get a kill if both play well, don't eat Q for free, you only get stunned if you're a noob","ele seta gank direito bem se vc ficar no range, skirmish sempre seu e roam também":"he sets up ganks really well if you stay in range, skirmish is always yours and roam too","ult dele machuca mas pra finalizar, dentro da gaiola foque em desviar do meteoro pq dói":"his ult hurts but only to finish, inside the cage focus on dodging the meteor because it hurts","poke lane, solável, ele tem bastante dano mas fora isso é de boa, se ele gastar o E vai pra cima":"poke lane, killable, he has a lot of damage but otherwise it's chill, if he wastes E go in","skirmish seu, press seu, mas ele limpa wave rápido, da pra fazer mindgame no E e troca boa":"skirmish yours, prio yours, but he clears waves fast, you can mindgame his E for a good trade","lane bem chata só de farmar e acompanhar mapa, gank é free kill, n importa muito ele farmar mais":"really boring lane of just farming and tracking the map, ganks are a free kill, it doesn't matter much if he farms more","annie de skill shot, o W dela é forte então não vá melee, pingue o mia sempre":"skillshot Annie, her W is strong so don't go melee, always ping when she's missing","cooldowndo do Q dela abaixa bastante depois, mas o resto das skills é mais que seu Q":"her Q cooldown drops a lot later, but the rest of her skills have longer cooldowns than your Q","ela tende a dar ik lategame, então jogue pro revive":"she tends to one-shot late game, so play for the revive","só troque com shield up, fique fora do range do Q, vc até empata mas é fácil de perder troca":"only trade with your shield up, stay out of Q range, you can trade evenly but it's easy to lose trades","late game é bem solável, por isso é bom jogar mais safe, gank normalmente é free kill sua":"late game he's very killable, so play safer, ganks are usually a free kill for you","skirmish e roam é seu mas press normalmente é dele":"skirmish and roam are yours but prio is usually his","early full seu, espere ele chupar a wave antes de lutar, depois sem all win pq ele da stat check":"early is fully yours, wait for him to Q the wave before fighting, later no all-ins because he stat checks","poça demora mais pra voltar que o arpel, e ele usa tarde, força o W e da o arpel de novo que sai kill":"pool comes back slower than the grapple and he uses it late, force the W and grapple again for the kill","press seu, skirmish sua, roam seu, só é problema com item":"prio yours, skirmish yours, roam yours, he's only a problem with items","poke lane, se chegar perto / ele errar stun = GG, bota cedo e desvia bastante, fica longe da wave":"poke lane, if you get close / he misses stun = GG, early boots and dodge a lot, stay away from the wave","ele tem waveclear, skirmish é sua, normalmente foca o jungler e usa o reset nele":"he has waveclear, skirmish is yours, usually focus the jungler and use the reset on him","ele sempre tenta descer pra ultar quando vc da roaming, da pra baitar e virar nele":"he always tries to come down to ult when you roam, you can bait it and turn on him","early volátil, fique longe de wave pq ele surfa":"volatile early, stay away from the wave because he surfs it","ele te da stat check sempre, fica atento em gank do seu time a parede faz virar 1v1 entre ele e seu jg":"he always stat checks you, watch out on your team's ganks, the wall turns it into a 1v1 between him and your jungler","sidelane ele tem vantagem, yasuo não da roam então não perca waves / barricada":"he has the side lane advantage, Yasuo doesn't roam so don't lose waves / plates","harass sempre, ele tem dano mas você tem bem mais, joga pra matar e com press":"always harass, he has damage but you have way more, play to kill and with prio","late game ele dá muito dano, jogando direito vc não toma o Q e o R dele sem setup":"late game he deals a lot of damage, if you play well you don't eat his Q and R without setup","costumam farmar bem então não tome outscale":"they usually farm well so don't get outscaled","early lane fácil, rola até dive, tem vantagem antes dos itens, não tome muito poke, press seu":"easy early lane, even dives work, you're ahead before items, don't eat too much poke, prio yours","usando arpel na direção que ele estava quando ultou você deixa ele pra trás, aí é só vc ultar":"grappling toward where he was when he ulted leaves him behind, then you just ult","late game é solável even se você desviar, mas se estiver feedado ele não tem que acertar nada":"late game is killable or even if you dodge, but if he's fed he doesn't need to land anything","volátil, respeite a bolha, tomou perdeu a troca, fique atrás da wave sem tomar o dano em área do Q":"volatile, respect the bubble, ate it = lost the trade, stay behind the wave without eating the Q area damage","cuidado com o Q da fog, gank normalmente é kill, press roam e skirmish seus":"watch out for Q from the fog, ganks are usually a kill, prio, roam and skirmish are yours","cleanse é pra tirar o soninho mas é meio cheese, só vale se tiver outro stun importante":"Cleanse removes the sleep but it's kind of cheese, only worth it if they have another important stun","• Early/Trocas: Faça short trades sem deixar ela ativar o Trovão (Electrocute); desviando de uma das skills a troca é sua pra extender, principalmente o charme (E).":"• Early/Trades: Take short trades without letting her proc Electrocute; if you dodge one of her skills the trade is yours to extend, especially the charm (E).","• Cuidados: No mid game ela sempre tem ult. Só busque gank/all-in com CC aliado ou se ela se expor muito errado, se não ela foge.":"• Watch out: By mid game she always has ult. Only go for a gank/all-in with allied CC or if she's badly out of position, otherwise she escapes.","• Macro: Se ela não estiver muito forte, você vence no stat check. Caso queira brigar com ela na side, guarde seu E / R para quando ela sair do range com a Ult":"• Macro: If she isn't too strong, you win the stat check. If you want to fight her on the side lane, save your E / R for when she leaves range with her Ult","• Early/Trocas: Punir o early game com poke constante, se não ela te dá all-in. Nível 4 ela tenta revidar o dano na lane.":"• Early/Trades: Punish her early game with constant poke, otherwise she'll all-in you. At level 4 she tries to trade back in lane.","• Cuidados: Se ela acertar o E, você consegue recuar com o Arpéu sem ser cancelado. Sempre respeite os spikes de item.":"• Watch out: If she lands E, you can back off with your Grappling Hook without being canceled. Always respect her item spikes.","• Macro: Respeite o dano dela no late game. Use a Ult para revelar a posição dela na fumaça (W) em Team Fights ou x1.":"• Macro: Respect her late game damage. Use your Ult to reveal her position in the shroud (W) in teamfights or 1v1.","• Early/Trocas: Troca dela é forte, mas você garante pressão no early. Solável se ela se expor e você desviar do Q.":"• Early/Trades: Her trades are strong, but you secure early pressure. Killable if she overextends and you dodge the Q.","• Cuidados: Evite tomar o combo Q + R (ela te vence no stat check após fechar item).":"• Watch out: Avoid getting hit by the Q + R combo (she beats you in the stat check after completing an item).","• Macro: No nível 6 a pressão vira dela. Evite lutas 3v3 prolongadas, pois ela tem muito peel e controle de grupo.":"• Macro: At level 6 the pressure shifts to her. Avoid drawn-out 3v3 fights, she has a lot of peel and crowd control.","• Early/Trocas: Solável no early game; depois fica mais difícil pelo outrange. Lute somente se ela gastar o stun na wave.":"• Early/Trades: Killable in the early game; it gets harder later because she outranges you. Only fight if she uses the stun on the wave.","• Cuidados: A maior ameaça é o combo Flash + R para te dar instakill ou setar gank.":"• Watch out: Her biggest threat is the Flash + R combo to one-shot you or set up a gank.","• Macro: Você domina a pressão de rotas, skirmishes e roamings. Atente-se aos roams dela.":"• Macro: You own lane pressure, skirmishes and roams. Watch out for her roams.","• Early/Trocas: Domínio no Nível 1 (não deixe o Q explodir). Busque de 1 a 2 solos no early e explore oportunidades de dive.":"• Early/Trades: Level 1 is yours (don't let the Q explode). Look for 1 to 2 solo kills early and take dive opportunities.","• Cuidados: Faça short trades para desgastar e use o Arpéu (E) para punir quando ele parar para bater na wave.":"• Watch out: Take short trades to whittle him down and use your Grappling Hook (E) to punish when he stops to hit the wave.","• Macro: Pressão de rota e skirmish totalmente suas; acompanhe os roamings dele.":"• Macro: Lane pressure and skirmishes are fully yours; follow his roams.","• Early/Trocas: Rota favorável no early, mas o CD do Q dela é curto. Se ela errar skills, entre com o Arpéu (E).":"• Early/Trades: Favorable lane early, but her Q cooldown is short. If she misses skills, go in with your Grappling Hook (E).","• Cuidados: Sempre desvie para trás (para os lados não funciona bem). Se tomar E + Q com a Ult dela ativa, dê recall.":"• Watch out: Always dodge backwards (dodging sideways doesn't work well). If you take E + Q with her Ult up, recall.","• Macro: Sua Ult revela o W dela, mas a Ult dela desvia dos seus tiros. No late game, quem iniciar primeiro vence.":"• Macro: Your Ult reveals her W, but her Ult dodges your shots. In the late game, whoever engages first wins.","• Early/Trocas: Solável no early; é possível ignorar os soldados para bater direto nele se houver apenas um invocado.":"• Early/Trades: Killable early; you can ignore the soldiers and hit him directly if only one is summoned.","• Cuidados: Com itens fechados, ele ganha em DPS e alcance. A Ult dele é perigosa para setar ganks ou all-in.":"• Watch out: With completed items he wins on DPS and range. His Ult is dangerous for setting up ganks or all-ins.","• Macro: Pressão equilibrada; skirmish e roaming muito favoráveis para você. Na sidelane ele ganha força, mas é abatível.":"• Macro: Even pressure; skirmishes and roams are very favorable for you. He gets stronger on the side lane, but he's killable.","• Early/Trocas: Fora de teamfights ele tem auto-defesa fraca. Foque ele em skirmishes sem hesitar.":"• Early/Trades: Outside of teamfights his self-defense is weak. Focus him in skirmishes without hesitating.","• Cuidados: A Ult dele causa muito dano surpresa; faça Vampíricas para manter HP cheio ou dê recall/TP se necessário.":"• Watch out: His Ult deals a lot of surprise damage; build Gluttonous Greaves to stay at full HP or recall/TP if needed.","• Macro: Não dê brechas por ego; em condições normais você estará em vantagem no 1v1.":"• Macro: Don't give openings out of ego; under normal conditions you'll have the advantage in the 1v1.","• Early/Trocas: Se tomar o Q, use o Arpéu (E) para recuar. Você tem mais waveclear; ganks nela costumam ser kill fácil.":"• Early/Trades: If you get hit by Q, use your Grappling Hook (E) to back off. You have more waveclear; ganks on her are usually an easy kill.","• Cuidados: O Miasma (W) impede de conjurar o Arpéu (E), mas não cancela se você já estiver no ar. Durante o voo do E, a Ult dela ainda te estuna.":"• Watch out: Miasma (W) stops you from casting the Grappling Hook (E), but doesn't cancel it if you're already in the air. During the E flight, her Ult still stuns you.","• Macro: Ela se expõe facilmente. A sidelane é mais favorável a ela no decorrer do jogo.":"• Macro: She exposes herself easily. The side lane favors her as the game goes on.","• Early/Trocas: Poke e all-in dela são fortes. Se ela errar o Q, lide com ela e desvie para trás.":"• Early/Trades: Her poke and all-in are strong. If she misses Q, deal with her and dodge backwards.","• Cuidados: Se ficar low HP, dê recall em vez de arriscar. Guarde o Flash para reagir à Ult dela.":"• Watch out: If you get low, recall instead of risking it. Save Flash to react to her Ult.","• Macro: Skirmish equilibrado, roaming favorável a você, pressão de rota favorável a ela.":"• Macro: Skirmishes are even, roaming favors you, lane pressure favors her.","• Early/Trocas: Nível 1 seu. Short trade é dele, mas em trocas estendidas você vence.":"• Early/Trades: Level 1 is yours. Short trades are his, but you win extended trades.","• Cuidados: Tente antecipar o W dele. No late game, compre Corta-Cura e foque ele nas lutas.":"• Watch out: Try to predict his W. In the late game, buy anti-heal and focus him in fights.","• Macro: Pressão sua. Guarde Ward Azul para ultar nele após ele usar a Ult (R) de volta para a fog.":"• Macro: Pressure is yours. Save a Farsight ward to ult him after he uses his Ult (R) back into the fog.","• Early/Trocas: Nível 1 seu. O E dele volta antes do seu, mas desviando de skills você vence trocas longas.":"• Early/Trades: Level 1 is yours. His E comes back before yours, but by dodging skills you win long trades.","• Cuidados: Rota volátil; guarde o Flash no nível 6 para reagir ao tubarão (Ult).":"• Watch out: Volatile lane; at level 6 save Flash to react to the shark (Ult).","• Macro: Pressão e skirmishes suas. Sidelane sua a menos que ele esteja muito feedado.":"• Macro: Pressure and skirmishes are yours. Side lane is yours unless he's very fed.","• Early/Trocas: Puna de longe, mas fique fora do alcance e longe da wave para não tomar o combo completo.":"• Early/Trades: Punish from range, but stay out of range and away from the wave so you don't eat the full combo.","• Cuidados: Ele acertando o E em lutas em grupo é mortal. Fique atento a pings de MIA quando ele for para a fog.":"• Watch out: Him landing E in group fights is deadly. Watch for MIA pings when he goes into the fog.","• Macro: Pressão sua. Acompanhe roams sem dar facecheck em arbustos.":"• Macro: Pressure is yours. Follow roams without facechecking bushes.","• Early/Trocas: Early game fácil. Mindgame com Arpéu (E) no Fear dele garante kill fácil.":"• Early/Trades: Easy early game. Mindgaming his Fear with your Grappling Hook (E) gets an easy kill.","• Cuidados: Desvie na diagonal para trás quando ele usar o tapete para evitar a garra. Fique atrás da wave.":"• Watch out: Dodge diagonally backwards when he uses the carpet to avoid the claw. Stay behind the wave.","• Macro: Se ele jogar mal, busque o solo na lane. Skirmish fácil; pressão disputada após o primeiro B.":"• Macro: If he plays badly, go for the solo kill in lane. Easy skirmishes; pressure is contested after the first back.","• Early/Trocas: Nível 1 favorável. Dê bastante dano inicial e nunca lute contra ela com passiva estacada.":"• Early/Trades: Level 1 is favorable. Deal a lot of early damage and never fight her with her passive stacked.","• Cuidados: Jogue o Q nos minions que ela quer dar dash para negar farm/causar dano. Foque em desviar do E.":"• Watch out: Throw your Q on the minions she wants to dash to, to deny farm/deal damage. Focus on dodging her E.","• Macro: Evite trocar na sidelane contra ela; ela escala muito bem com farm.":"• Macro: Avoid trading with her on the side lane; she scales very well with farm.","• Early/Trocas: Nível 1 é kill fácil com um bom Arpéu (E). Pressão sua no early; nível 6 há janela para solo kill.":"• Early/Trades: Level 1 is an easy kill with a good Grappling Hook (E). Early pressure is yours; at level 6 there's a window for a solo kill.","• Cuidados: Nunca tome o combo completo de Canhão + Martelo. Use o bumerangue (Q) ao ser empurrado para ativar o escudo.":"• Watch out: Never take the full Cannon + Hammer combo. Use the boomerang (Q) when you get pushed back to activate the shield.","• Macro: Se a lane complicar, você tem vantagem em roaming e waveclear rápido.":"• Macro: If the lane gets tough, you have the advantage in roaming and fast waveclear.","• Early/Trocas: Obrigatório matar 2 a 3 vezes no early. Dive é muito viável. Pressão e skirmish infinitos a seu favor.":"• Early/Trades: You must kill him 2 to 3 times early. Diving is very viable. Endless pressure and skirmishes in your favor.","• Cuidados: Não troque kills 1 por 1; seu objetivo é atrasar o pico de poder dele o máximo possível.":"• Watch out: Don't trade kills 1 for 1; your goal is to delay his power spike as long as possible.","• Macro: Nível 11 com 2 itens ele fica perigoso em TF, mas na sidelane você ainda o vence se mantiver a vantagem.":"• Macro: At level 11 with 2 items he gets dangerous in teamfights, but on the side lane you still beat him if you keep the lead.","• Early/Trocas: Respeite as adagas no chão e aplique poke constante. Não fique perto dos minions que ela farmar com Q.":"• Early/Trades: Respect the daggers on the ground and poke constantly. Don't stand near the minions she farms with Q.","• Cuidados: Kat AP tem spike alto com Alternador Hextech; Kat de Conquistador é mais forte no early game. Use Exaustão na Ult dela.":"• Watch out: AP Kat has a big spike with Hextech Alternator; Conqueror Kat is stronger in the early game. Exhaust her Ult.","• Macro: Acompanhe os roams para impedir que ela receba kills fáceis.":"• Macro: Follow her roams so she doesn't get easy kills.","• Early/Trocas: Nível 1 favorável com bom spacing e Arpéu. Dê harass constante para negar o free farm.":"• Early/Trades: Level 1 is favorable with good spacing and Grappling Hook. Harass constantly to deny her free farm.","• Cuidados: Baita a Ult dela, recue com o Arpéu e depois reengaje com a sua Ult.":"• Watch out: Bait her Ult, back off with the Grappling Hook and then re-engage with your Ult.","• Macro: Rota muito favorável. Force a Ult dela para armar dives e controlar o jogo antes que ela escale.":"• Macro: Very favorable lane. Force out her Ult to set up dives and control the game before she scales.","• Early/Trocas: Cuidado com o Nível 1 dele com W ativo. Ele é um canhão de vidro, mate ele antes que devolva o dano.":"• Early/Trades: Watch out for his level 1 with W active. He's a glass cannon, kill him before he deals his damage back.","• Cuidados: Não fique na wave para não tomar o E junto dos minions. Cuidado com o spacing na lentidão do E.":"• Watch out: Don't stand in the wave so you don't take the E along with the minions. Mind your spacing in the E slow.","• Macro: Faça short trades eficientes para vencê-lo antes que alcance o late game.":"• Macro: Take efficient short trades to beat him before he reaches the late game.","• Early/Trocas: Rota volátil. Sua passiva e o PTA identificam a verdadeira LeBlanc do clone.":"• Early/Trades: Volatile lane. Your passive and PTA reveal the real LeBlanc from the clone.","• Cuidados: Alinhe o bumerangue (Q) com ela e a marca do W. A Ult (R) revela a invisibilidade dela, mas o clone pode tankar.":"• Watch out: Line up the boomerang (Q) with her and the W mark. Your Ult (R) reveals her invisibility, but the clone can tank it.","• Macro: Skirmish favorável e roaming equilibrado. Você garante pressão se ela não ultar a wave.":"• Macro: Favorable skirmishes and even roaming. You keep pressure if she doesn't ult the wave.","• Early/Trocas: Nível 1 seu com foco em poke. Ela não tem sustentação no early.":"• Early/Trades: Level 1 is yours, focus on poke. She has no sustain early.","• Cuidados: Não fique na wave. Ela seta ganks perfeitamente a partir do nível 6; mantenha HP cheio.":"• Watch out: Don't stand in the wave. She sets up ganks perfectly from level 6; keep your HP full.","• Macro: Skirmish favorável a você. Foque em farmar bem e manter pressão sem se expor a ganks.":"• Macro: Skirmishes favor you. Focus on farming well and keeping pressure without exposing yourself to ganks.","• Early/Trocas: Use o Arpéu (E) apenas para trás. Não avance se ele te acertar um prego.":"• Early/Trades: Only use your Grappling Hook (E) backwards. Don't push forward if he hits you with a nail.","• Cuidados: Guarde o Flash para a Ult dele e use Exaustão nos auto-ataques dos pregos.":"• Watch out: Save Flash for his Ult and Exhaust his nail auto-attacks.","• Macro: Priorize velocidade de movimento e Corta-Cura na sua build.":"• Macro: Prioritize movement speed and anti-heal in your build.","• Early/Trocas: Nível 1 seu com all-in antes dos minions chegarem. Jogue sempre com a passiva do escudo disponível.":"• Early/Trades: Level 1 is yours with an all-in before the minions arrive. Always play with your shield passive available.","• Cuidados: Usar Arpéu (E) para frente sem visão ou setup é arriscado quando ela tiver alguns itens. MR cedo é muito útil.":"• Watch out: Using the Grappling Hook (E) forward without vision or setup is risky once she has a few items. Early MR is very useful.","• Macro: Lane de burst mage; ela fica pescando skills, tem um letal muito alto. Ande na fog com muito cuidado pra não ser explodido.":"• Macro: Burst mage lane; she fishes with her skills and has very high lethality. Walk through the fog very carefully so you don't get blown up.","• Early/Trocas: Lane tranquila. Mate as baratinhas para ganhar ouro e negue a pressão dele.":"• Early/Trades: Easy lane. Kill the voidlings to earn gold and deny his pressure.","• Cuidados: Fique longe da wave para não pegar o E (Aids). Desviando do Q, ele fica vulnerável.":"• Watch out: Stay away from the wave so you don't catch the E (Malefic Visions). If he misses Q, he's vulnerable.","• Macro: Nível 6 dele atrai ganks. Em TFs, jogue em função do seu revive e não seja o alvo da Ult dele. Sidelane 1v1 é sua.":"• Macro: His level 6 draws ganks. In teamfights, play around your revive and don't be his Ult target. The 1v1 side lane is yours.","• Early/Trocas: Níveis 1 a 3 você tem muita vantagem. Sempre devolva Q + AA quando ele usar o pneu (Q) para trocar dano e usar o Escudo.":"• Early/Trades: Levels 1 to 3 you have a big advantage. Always answer with Q + AA when he uses the tire (Q) to trade and use the Shield.","• Cuidados: Guarde o Arpéu (E) para o slow do Q dele (seja para fugir ou perseguir). Mantenha dano constante para desativar o escudo dele.":"• Watch out: Save the Grappling Hook (E) for his Q slow (whether to escape or chase). Keep up constant damage to break his shield.","• Macro: Não entre no alcance do Q dele sem a passiva do escudo pronta. Não tente desviar da Ult com o E, não da tempo. Buildando Terminus e farmando bem, a sidelane é sua.":"• Macro: Don't step into his Q range without your shield passive ready. Don't try to dodge his Ult with E, there's no time. Building Terminus and farming well, the side lane is yours.","• Early/Trocas: Foque em desviar do Q. Use a move speed da passiva para entrar / se manter no range.":"• Early/Trades: Focus on dodging her Q. Use the passive's move speed to get in / stay in range.","• Cuidados: Dificuldade para All-in solo sem gank aliado. Bota e Resistência Mágica cedo ajudam bastante.":"• Watch out: Hard to all-in solo without an allied gank. Early boots and Magic Resist help a lot.","• Macro: Não se preocupe se ficar um pouco atrás em farm, foque no mapa. Não ulte caso ela tenha o W.":"• Macro: Don't worry if you fall a bit behind in farm, focus on the map. Don't ult if she has W.","• Early/Trocas: Farme os cachorros. Fique fora da wave, faça ela escolher entre acertar os Minions ou você. Nunca tome todo o combo.":"• Early/Trades: Farm the dogs. Stay out of the wave, make her choose between hitting the minions or you. Never take the full combo.","• Cuidados: Quando ela ultar em você, use o Arpéu na direção oposta (não cancela a skill). Use o bumerangue nos cães para estender alcance.":"• Watch out: When she ults onto you, use the Grappling Hook in the opposite direction (it doesn't cancel the skill). Use the boomerang on the dogs to extend its range.","• Macro: Jogue as lutas com objetivo de reviver os aliados, ela fica muito frágil sem o W.":"• Macro: Play fights with the goal of reviving your allies, she's very fragile without W.","• Early/Trocas: Lane de poke difícil, porém solável se ela errar o Q ou gastar o W na wave.":"• Early/Trades: Tough poke lane, but killable if she misses Q or uses W on the wave.","• Cuidados: Guarde o Flash para reagir à Ult (R) dela para garantir a vitória na troca.":"• Watch out: Save Flash to react to her Ult (R) to make sure you win the trade.","• Macro: Skirmish e roaming favoráveis para você. Ela não te dá 100-0 sem itens fechados, permitindo baitar roams.":"• Macro: Skirmishes and roaming favor you. She can't one-shot you without completed items, so you can bait roams.","• Early/Trocas: Nível 1 seu mantendo spacing. O alcance do W dele é igual ao do seu auto-ataque.":"• Early/Trades: Level 1 is yours if you keep your spacing. His W range is the same as your auto-attack.","• Cuidados: Jogue o bumerangue no pulo dele para gerar escudo rápido. Skirmish dele é muito forte no early.":"• Watch out: Throw the boomerang at his jump to get a quick shield. His early skirmishes are very strong.","• Macro: Avise o nível 6 dele no ping (Ult). Pegue pressão sem se expor e acompanhe os roams ou pegue barricadas.":"• Macro: Ping his level 6 (Ult). Take pressure without exposing yourself and follow his roams or take plates.","• Early/Trocas: Abuse do Nível 1 para criar vantagem de vida ou kill. Não perca o Osso Revestido à toa.":"• Early/Trades: Abuse level 1 to build an HP lead or get a kill. Don't waste Bone Plating for nothing.","• Cuidados: Com um item fechado, ela tem All-in mortal no combo. Investir em Couraça de Pano no início vale a pena.":"• Watch out: With one completed item, her all-in combo is deadly. Investing in an early Cloth Armor is worth it.","• Macro: Sua Ult revela a posição dela no W (invisibilidade no mato). Skirmish equilibrado e roaming seu.":"• Macro: Your Ult reveals her position in W (invisibility in the bush). Even skirmishes and roaming is yours.","• Early/Trocas: No early game, evite tomar pokes pesados. Ele não tem grande ameaça de solo kill, mas disputa pressão.":"• Early/Trades: In the early game, avoid taking heavy poke. He's not much of a solo kill threat, but he contests pressure.","• Cuidados: Fique longe da wave para não tomar dano secundário do E + Q.":"• Watch out: Stay away from the wave so you don't take splash damage from E + Q.","• Macro: Com itens ele ganha em stat check, mas lutas de equipe e roams são favoráveis a você. Evite que ele escale livre.":"• Macro: With items he wins the stat check, but teamfights and roams favor you. Don't let him scale freely.","• Early/Trocas: Nível 1 seu. Desvie do E e force recuo assim que ele ativar a Ult (R).":"• Early/Trades: Level 1 is yours. Dodge the E and force him back as soon as he activates his Ult (R).","• Cuidados: Não deixe ele estacar a passiva gratuitamente durante a fase de rotas.":"• Watch out: Don't let him stack his passive for free during the laning phase.","• Macro: Skirmish e pressão de rota totalmente seus. Ganks nele costumam resultar em kill fácil.":"• Macro: Skirmishes and lane pressure are fully yours. Ganks on him usually turn into an easy kill.","• Early/Trocas: Early game favorável desviando de skills. Se ele usar o E para frente, esconda-se na wave e troque AA.":"• Early/Trades: Favorable early game if you dodge skills. If he uses E forward, hide in the wave and trade autos.","• Cuidados: Não perca o Osso Revestido sem necessidade. Se ele gastar muitas skills na wave, compre a luta imediatamente.":"• Watch out: Don't waste Bone Plating unnecessarily. If he spends many skills on the wave, take the fight right away.","• Macro: Quem estiver à frente vence no stat check. Roaming e lutas são seus.":"• Macro: Whoever is ahead wins the stat check. Roaming and fights are yours.","• Early/Trocas: Nível 1 totalmente seu. Dê bastante dano inicial, fique fora da wave e entre com Arpéu se ela gastar o E.":"• Early/Trades: Level 1 is fully yours. Deal a lot of early damage, stay out of the wave and go in with the Grappling Hook if she uses E.","• Cuidados: Em ganks/lutas, posicione-se no lado oposto ao seu caçador para evitar que o E dela estune ambos.":"• Watch out: In ganks/fights, position on the opposite side of your jungler so her E doesn't stun you both.","• Macro: Pressão equilibrada. Com itens fechados, jogue em função do seu revive (passiva do Akshan).":"• Macro: Even pressure. With completed items, play around your revive (Akshan's passive).","• Early/Trocas: Solável no início se você ficar atrás da wave / fora do alcance. Cuidado com o dano das pedras.":"• Early/Trades: Killable early if you stay behind the wave / out of range. Watch out for the boulder damage.","• Cuidados: Faça mindgame cancelando o Arpéu cedo para baitar o tapete (E) dela e garantir a troca.":"• Watch out: Mindgame by canceling the Grappling Hook early to bait her carpet (E) and secure the trade.","• Macro: Com vantagem a lane fica livre. Roaming totalmente seu; puna se ela usar o tapete incorretamente.":"• Macro: With a lead the lane is free. Roaming is fully yours; punish her if she uses the carpet badly.","• Early/Trocas: Nível 1 seu se não tomar AAs. Fique longe da wave e evite tomar o W de graça.":"• Early/Trades: Level 1 is yours if you don't eat autos. Stay away from the wave and avoid taking his W for free.","• Cuidados: Se ele usar W para pokear, responda com Q + AA e recue. Avise PING sempre que ele sumir do mapa.":"• Watch out: If he uses W to poke, answer with Q + AA and back off. Always PING when he goes missing.","• Macro: Sua Ult revela a invisibilidade da Ult dele. Acompanhar os roams dele costuma gerar kills.":"• Macro: Your Ult reveals the invisibility from his Ult. Following his roams usually gets kills.","• Early/Trocas: Muito solável. Desvie do Q, fique longe dos minions e puna quando ele usar carta na wave.":"• Early/Trades: Very killable. Dodge the Q, stay away from the minions and punish when he uses a card on the wave.","• Cuidados: Ele arma ganks com facilidade. Pingue sempre que ele empurrar a wave e tiver Ult disponível.":"• Watch out: He sets up ganks easily. Ping every time he pushes the wave and has his Ult up.","• Macro: Não permaneça no mapa com HP baixo. Mantenha o ritmo de farm para não tomar outscale.":"• Macro: Don't stay on the map at low HP. Keep your farm pace so you don't get outscaled.","• Early/Trocas: Dificuldade para sair kill se ambos jogarem bem. Não tome Q de graça e evite a gaiola (E).":"• Early/Trades: Hard to get a kill if both play well. Don't take free Qs and avoid the cage (E).","• Cuidados: Dentro da gaiola, foque exclusivamente em desviar do meteoro (W).":"• Watch out: Inside the cage, focus only on dodging the meteor (W).","• Macro: Skirmish e roaming sempre seus. Em TFs, a Ult dele finaliza alvos; jogue em função de reviver aliados.":"• Macro: Skirmishes and roaming are always yours. In teamfights his Ult finishes off targets; play around reviving allies.","• Early/Trocas: Rota de poke solável. Se ele gastar o E (desposturar), vá para cima com All-in.":"• Early/Trades: Killable poke lane. If he uses E (knock-up), go in with an all-in.","• Cuidados: Faça mindgames em relação ao E dele para obter trocas favoráveis.":"• Watch out: Mindgame his E to get favorable trades.","• Macro: Skirmish e pressão suas. Ele limpa waves rápido, mas ganks nele são kill garantido.":"• Macro: Skirmishes and pressure are yours. He clears waves fast, but ganks on him are a guaranteed kill.","• Early/Trocas: Nenhuma skill dela para nos minions, então foque em spacing. O W dela tem dano alto, evite dar o E melee.":"• Early/Trades: None of her skills stop at the minions, so focus on spacing. Her W hits hard, avoid using E into melee range.","• Cuidados: O cooldown do Q dela reduz bastante no decorrer do jogo. Sempre avise o MIA.":"• Watch out: Her Q cooldown drops a lot as the game goes on. Always call MIA.","• Macro: Ela busca instakill no late game; jogue as lutas no W, buscando reviver os aliados com a passiva.":"• Macro: She looks for one-shots in the late game; play fights around her W, looking to revive allies with your passive.","• Early/Trocas: Só troque com a passiva do escudo ativa. Fique fora do alcance do Q dele.":"• Early/Trades: Only trade with your shield passive up. Stay out of his Q range.","• Cuidados: Fase de linhas difícil onde é fácil perder trocas; jogue de forma mais segura até o mid/late game.":"• Watch out: Tough laning phase where it's easy to lose trades; play safer until mid/late game.","• Macro: Skirmish e roaming são seus, embora ele costuma deter a pressão de rota inicial. Ganks nele são eficientes.":"• Macro: Skirmishes and roaming are yours, although he usually holds early lane pressure. Ganks on him are effective.","• Early/Trocas: Early game totalmente seu. Espere ele gastar o Q na wave antes de iniciar trocas.":"• Early/Trades: Early game is fully yours. Wait for him to use Q on the wave before starting trades.","• Cuidados: A poça (W) tem tempo de recarga maior que seu Arpéu (E). Force o W dele, recue e use o E em seguida.":"• Watch out: The pool (W) has a longer cooldown than your Grappling Hook (E). Force out his W, back off and then use E.","• Macro: Pressão, skirmish e roams favoráveis para você até ele fechar múltiplos itens.":"• Macro: Pressure, skirmishes and roams favor you until he completes multiple items.","• Early/Trocas: Rota de poke. Se você se aproximar ou ele errar o stun, a vitória na troca é sua.":"• Early/Trades: Poke lane. If you get close or he misses the stun, the trade is yours.","• Cuidados: Comprar Botas cedo é fundamental para desviar das skills. Fique fora da wave de minions.":"• Watch out: Buying boots early is key to dodging his skills. Stay out of the minion wave.","• Macro: Skirmish seu. Quando der roaming, fique atento pois ele tentará ultar de longe; baita a jogada e vire nele.":"• Macro: Skirmishes are yours. When you roam, stay alert because he'll try to ult from far away; bait the play and turn on him.","• Early/Trocas: Mantenha distância da wave para evitar que ele deslize (E) até você. Use o Q quando ele entrar no range.":"• Early/Trades: Keep away from the wave so he can't dash (E) to you. Use Q when he steps into range.","• Cuidados: Faça o early game valer enquanto ele não tem bota. Atenção em ganks aliados, a Parede de Vento (W) anula você.":"• Watch out: Make the early game count while he has no boots. Careful in allied ganks, Wind Wall (W) blocks you.","• Macro: Ele tem vantagem na sidelane e não costuma dar roams. Não perca recursos.":"• Macro: He has the side lane advantage and doesn't usually roam. Don't waste resources.","• Early/Trocas: Aplique harass constante. Você tem mais dano no early game; jogue para matar e manter pressão.":"• Early/Trades: Harass constantly. You have more early damage; play to kill and keep pressure.","• Cuidados: No late game o dano dele escala muito. Com bom posicionamento, evite tomar o Q3 e a Ult sem setup.":"• Watch out: In the late game his damage scales a lot. With good positioning, avoid taking Q3 and his Ult without setup.","• Macro: Mantenha o farm elevado para não tomar outscale. Em TF se posicione para não tomar a ult junto do seu time":"• Macro: Keep your farm high so you don't get outscaled. In teamfights position so you don't get hit by his ult along with your team","• Early/Trocas: Early game favorável. Evite tomar poke das shurikens, faça ele escolher entre você e o farm.":"• Early/Trades: Favorable early game. Avoid taking shuriken poke, make him choose between you and the farm.","• Cuidados: Ao usar o Arpéu na direção em que ele estava quando ultou, você ganha distância e evita o combo.":"• Watch out: Using the Grappling Hook toward where he was when he ulted gains distance and avoids the combo.","• Macro: Ele depende de combar e sair do range, use seu E e R para entrar no espaço dele quando ele estiver sem cooldowns.":"• Macro: He depends on comboing and leaving range, use your E and R to get into his space when his cooldowns are down.","• Early/Trocas: Rota volátil. Respeite a Bolha (E): se tomar, perderá a troca. Fique atrás da wave sem tomar dano em área do Q.":"• Early/Trades: Volatile lane. Respect the Bubble (E): if it hits you, you lose the trade. Stay behind the wave without taking Q area damage.","• Cuidados: Cuidado com o Q vindo da fog de guerra. Ganks nela costumam ser muito eficientes.":"• Watch out: Watch out for Q coming from the fog of war. Ganks on her are usually very effective.","• Macro: Pressão de rota, roaming e skirmish totalmente seus.":"• Macro: Lane pressure, roaming and skirmishes are fully yours."},"celulas":{"Impacto repentino":"Sudden Impact","Osso revestido":"Bone Plating","Inspiração":"Inspiration","Precisão":"Precision","Rapidez":"Swiftness","Craquen":"Kraken","Letalidade":"Lethality","Tanto faz":"Any","Tabi":"Tabi","Mercs, 100%":"Mercs, 100%","Mercúrio":"Mercury's","Vampíricas":"Gluttonous","Berserker":"Berserker's"}}}];

const VOLUME = { grade: .45, passa: .18, travar: .5, avanca: .4, volta: .4, chip: .4, abre: .4, fecha: .4, clique: .35, vo: .8 };
let somLigado = true;

let ultimoPassa = 0;
function toca(nome, arquivo) {
  if (!somLigado) return;
  if (nome === "passa") { const agora = performance.now(); if (agora - ultimoPassa < 70) return; ultimoPassa = agora; }
  const a = new Audio(arquivo || `sons/ui/${nome}.ogg`);
  a.volume = VOLUME[nome] ?? .4;
  a.play().catch(() => {});
}
function marcaSom() {
  $("som").setAttribute("aria-pressed", somLigado);
  $("som").setAttribute("aria-label", t(somLigado ? "somOff" : "somOn"));
}

      nome, runa, sec, spell, bota, build, guia: !!guia,
      id: g.champs[nome].id, titulo: g.champs[nome].title, titulo_en: g.champs[nome].title_en, mira: g.champs[nome].mira, slug: slug(nome),
      dif: (g.icones_planilha && g.icones_planilha[nome] && g.icones_planilha[nome].dificuldade) || null,
      linhas: notas.split("\n").map(l => l.trim().replace(/\s{2,}/g, " ")).filter(Boolean),
      hay: (nome + " " + notas + " " + notas.split("\n").map(l => (g.traducao && g.traducao.linhas[l.trim().replace(/\s{2,}/g, " ")]) || "").join(" ")).toLowerCase(),
    }));
    g.lista.forEach(c => { c.hayN = normal(c.hay); });
  } else {
    g.lista = g.matchups.map(m => ({ ...m, slug: slug(m.nome), hay: textoDe(m).toLowerCase() }));
    g.lista.forEach(c => { c.hayN = normal(c.hay); });
  }
}
function textoDe(m) {
  const partes = [m.nome, m.planilha, ...m.tldr];
  m.itens.forEach(gr => { partes.push(gr.rotulo); gr.linhas.forEach(l => partes.push(l.texto || "", l.motivo || "")); });
  m.secoes.forEach(s => { partes.push(s.titulo); s.blocos.forEach(b => partes.push(...(b.itens || (b.linhas ? b.linhas.flat() : [b.texto])))); });
  return partes.join(" ");
}

// Dificuldade (cor da célula do campeão na planilha), na ordem do Peteruso: da pior para a mais tranquila.
const DIFS = ["muito_dificil", "dificil", "medio", "facil", "muito_facil"];
const rotuloDif = d => t("dif" + d.charAt(0).toUpperCase() + d.slice(1));
// Filtros: dentro do mesmo grupo vale qualquer um; entre grupos, todos.
const FILTROS = {
  simples: g => [
    ...DIFS.map(d => ({ id: "dif_" + d, grupo: "dif", cor: d, teste: c => c.dif === d })),
    ...["Ignite", "TP", "Exhaust"].map(s => ({ id: s, grupo: "feitico", rotulo: s, icone: g.icones[s], teste: c => c.spell === s })),
    { id: "Electro", grupo: "runa", rotulo: "Electro", icone: g.icones.Electro, teste: c => /electro/i.test(c.runa) },
  ],
  completo: () => [

  ],
};

/* ---------- Planilha ao vivo: o guia lê a planilha do autor quando abre ---------- */
function lerCsv(t) {
  const linhas = []; let linha = [], campo = "", aspas = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (aspas) {
      if (c === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && t[i + 1] === "\n") i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = "";
    } else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}
function linhasDaPlanilha(t) {
  const linhas = lerCsv(t), cab = linhas.shift() || [];
  if (!/campe/i.test(cab[0] || "")) throw new Error("cabeçalho inesperado");
  return linhas.filter(r => (r[0] || "").trim()).map(r => {
    r = r.concat(Array(8).fill("")).slice(0, 8);
    return [r[0].trim(), ...r.slice(1, 7).map(x => x.trim()), /^s/i.test(r[7].trim()) ? 1 : 0];
  });
}
// Campeão novo na planilha: pega id e título no Data Dragon.
const chaveNome = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
let ddCampeoes;
async function completaCampeoes(g, nomes) {
  if (!ddCampeoes) ddCampeoes = fetch(`${DD}${VER}/data/pt_BR/champion.json`).then(r => r.json()).then(j => j.data);
  const por = {};
  Object.values(await ddCampeoes).forEach(c => { por[chaveNome(c.name)] = c; por[chaveNome(c.id)] = c; });
  nomes.forEach(n => { const c = por[chaveNome(n)]; if (c) g.champs[n] = { id: c.id, title: c.title }; });
  // Título em inglês para o modo EN.
  try { const en = (await (await fetch(`${DD}${VER}/data/en_US/champion.json`)).json()).data; nomes.forEach(n => { const c = g.champs[n]; if (c && en[c.id]) c.title_en = en[c.id].title; }); } catch (e) {}
}
function aplicaMatchups(g, rows) {
  g.matchups = rows.filter(r => g.champs[r[0]]);
  g.lista = null;
  if (guia !== g) return;
  const slugAtual = current && current.slug;
  prepara(g);
  current = g.lista.find(c => c.slug === slugAtual) || g.lista[0];
  renderLista();
  renderDetalhe(false);
  marcaHash();
}
function usaCopiaSalva(g) {
  if (!g.planilha) return;
  try {
    const salvo = JSON.parse(localStorage.getItem("planilha:" + g.id) || "null");
    if (salvo && salvo.rows && salvo.rows.length) {
      // Só completa campeões novos: os do build já vêm com título em inglês.
      Object.entries(salvo.champs || {}).forEach(([n, c]) => { if (!g.champs[n]) g.champs[n] = c; });
      g.matchups = salvo.rows.filter(r => g.champs[r[0]]);
    }
  } catch (e) {}
}
function mostraPlanilha(g) {
  const el = $("estadoPlanilha");
  if (!el || guia !== g) return;
  el.textContent = !g.planilha ? "" :
    t({ ok: "plOk", arquivo: "plArquivo", falhou: "plFalhou" }[g.sincronia] || "plBusca");
}
async function sincroniza(g) {
  if (!g.planilha || g.sincronia) return;
  // O Google não libera a planilha para página aberta como arquivo (file://).
  if (location.protocol === "file:") { g.sincronia = "arquivo"; mostraPlanilha(g); return; }
  g.sincronia = "buscando";
  mostraPlanilha(g);
  try {
    const { id, gid } = g.planilha;
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}&_=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("planilha respondeu " + r.status);
    const rows = linhasDaPlanilha(await r.text());
    const faltam = rows.filter(x => !g.champs[x[0]]).map(x => x[0]);
    if (faltam.length) await completaCampeoes(g, faltam);
    aplicaMatchups(g, rows);
    g.sincronia = "ok";
    try { localStorage.setItem("planilha:" + g.id, JSON.stringify({ quando: Date.now(), rows: g.matchups, champs: g.champs })); } catch (e) {}
  } catch (e) {
    g.sincronia = "falhou";
  }
  mostraPlanilha(g);
}

// Apelidos que o jogador digita na seleção de campeões.
const APELIDOS = { tf: "twistedfate", lb: "leblanc", asol: "aurelionsol", sol: "aurelionsol", mf: "missfortune", tk: "tahmkench", tahm: "tahmkench",
  kog: "kogmaw", vel: "velkoz", j4: "jarvaniv", xin: "xinzhao", ww: "warwick", gp: "gangplank", ez: "ezreal", cass: "cassiopeia", kass: "kassadin",
  kat: "katarina", kata: "katarina", mundo: "drmundo", yi: "masteryi", voli: "volibear", morde: "mordekaiser", heimer: "heimerdinger",
  fiddle: "fiddlesticks", nida: "nidalee", noc: "nocturne", ori: "orianna", sera: "seraphine", panth: "pantheon", malz: "malzahar",
  liss: "lissandra", vlad: "vladimir", trynd: "tryndamere", naut: "nautilus", bel: "belveth", cho: "chogath", rek: "reksai", kha: "khazix",
  aurelion: "aurelionsol", twisted: "twistedfate", leb: "leblanc", ali: "alistar", blitz: "blitzcrank", ilaoi: "illaoi", kayn: "kayn" };

// Relevância: 4 = nome começa (ou apelido), 3 = nome contém, 1 = só nas notas, 0 = não bate.
function relevancia(c, t) {
  if (!t) return 1;
  const k = chaveNome(c.nome), tk = t.replace(/[^a-z0-9]/g, "");
  if (tk && (k.startsWith(tk) || (APELIDOS[tk] && k.startsWith(APELIDOS[tk])))) return 4;
  if (tk && (k.includes(tk) || (c.planilha && chaveNome(c.planilha).includes(tk)))) return 3;
  return c.hayN.includes(t) ? 1 : 0;
}
function passaFiltros(c) {
  const grupos = {};
  filtros.filter(f => ativos.has(f.id)).forEach(f => (grupos[f.grupo] = grupos[f.grupo] || []).push(f));
  return Object.values(grupos).every(fs => fs.some(f => f.teste(c)));
}

/* ---------- Enquadramento das artes ----------
   Cada campeão tem em meta.json o ponto do splash onde fica o centro da mira (escolhido à mão
   para a mira pegar rosto + corpo). O recorte (object-position) traz esse ponto para o meio do
   card, e a mira vai para onde ele ficou. */
const MIRA_PADRAO = [50, 38];
function enquadra(card, ponto, alvo) {
  const img = card.querySelector("img");
  if (!img) return;
  const W = card.clientWidth, H = card.clientHeight;
  if (!W || !H) return;
  const lim = (v, a, b) => Math.min(Math.max(v, a), b);
  const [fx, fy] = (ponto || MIRA_PADRAO).map(n => n / 100);
  const s = Math.max(W / 1280, H / 720), iw = 1280 * s, ih = 720 * s;
  const ox = iw - W, oy = ih - H;
  const dx = lim(fx * iw - W / 2, 0, ox), dy = lim(fy * ih - H * .45, 0, oy);
  img.style.objectPosition = `${ox > 0 ? dx / ox * 100 : 50}% ${oy > 0 ? dy / oy * 100 : 50}%`;
  if (!alvo) return;
  // Meia diagonal do losango da mira (o losango vai de 5 a 95 no viewBox de 100).
  const k = parseFloat(getComputedStyle(alvo).height) * .45;
  const x = lim(fx * iw - dx, k + 8, W - k - 8);
  const y = lim(fy * ih - dy, k, H - k);
  alvo.style.left = x + "px";
  alvo.style.top = y + "px";
}
function enquadraTudo() {
  if (!guia || !current) return;
  enquadra($("artVoce").parentElement, miraDe(guia.campeao.id));
  $("alvo").style.left = $("alvo").style.top = "";
  enquadra($("artEle").parentElement, current.mira || miraDe(current.id), $("alvo"));
}
const miraDe = id => { const c = guia.champs && Object.values(guia.champs).find(x => x.id === id); return c && c.mira; };
new ResizeObserver(() => enquadraTudo()).observe($("artEle").parentElement);

/* ---------- Formato simples (planilha do Akshan) ---------- */
const ICON = [[/^ignite$/i, "Ignite"], [/^tp$/i, "TP"], [/^exhaust$/i, "Exhaust"]];
function opt(raw) {
  const rush = /rush/i.test(raw);
  const word = raw.replace(/rush/i, "").replace(/!+/g, "").trim();
  const hit = ICON.find(([re]) => re.test(word));
  let label = rush ? word.charAt(0) + word.slice(1).toLowerCase() : word;
  if (L === "en" && guia.traducao) label = guia.traducao.celulas[label] || label;
  const icon = hit ? `<img src="${guia.icones[hit[1]]}" alt="" width="36" height="36">` : '<span class="soquete" aria-hidden="true"></span>';
  return `<div class="opt${hit && hit[2] ? " " + hit[2] : ""}"${hit && hit[3] ? ` title="${esc((L === "en" && hit[4]) || hit[3])}"` : ""}>${icon}<span>${esc(label)}</span>${rush ? '<span class="rush">rush</span>' : ""}</div>`;
}
// Ícones da célula como estão na planilha (icones_planilha.json). Se o texto mudou depois da
// última leitura das imagens, ou a célula não tem imagem, usa as peças de cada palavra.
function pecasDe(c, campo, val) {
  const p = guia.icones_planilha && guia.icones_planilha[c.nome] && guia.icones_planilha[c.nome][campo];
  if (p && p.texto === val && p.pecas.length) return p.pecas;
  // Célula sem imagem na planilha: vale a escolha feita à mão (meta.json > pecas_manuais), se o texto bate.
  const m = guia.pecas_manuais && guia.pecas_manuais[c.nome] && guia.pecas_manuais[c.nome][campo];
  if (m && m.texto === val) return m.pecas;
  const chaves = val.replace(/rush/i, "").replace(/!+/g, "").split(/\s*[\/,]\s*/)
    .flatMap(w => (guia.texto_pecas || {})[w.trim().toLowerCase()] || []);
  return [...new Set(chaves)];
}
function celula(c, campo, val) {
  const rush = /rush/i.test(val);
  let texto = /^tanto faz$/i.test(val) ? `<span class="livre">${t("tantoFaz")}</span>` : "";
  if (!texto) {
    const limpo = val.replace(/rush/i, "").replace(/!+/g, "").trim();
    const partes = limpo.split(/\s*\/\s*/).map(w => (rush ? w.charAt(0) + w.slice(1).toLowerCase() : w))
      .map(w => (L === "en" && guia.traducao && guia.traducao.celulas[w]) || w);
    texto = `<span>${esc(partes.join(" / "))}</span>${rush ? '<span class="rush">rush</span>' : ""}`;
  }
  const icones = pecasDe(c, campo, val).map(k => guia.pecas[k]).filter(Boolean).map(p => {
    const nome = esc((L === "en" && p.nome_en) || p.nome);
    return `<img src="${p.icone}" alt="${nome}" title="${nome}" width="36" height="36"${p.runa ? ' class="runa"' : ""}>`;
  }).join("");
  return `<div class="celula">${icones ? `<span class="icones">${icones}</span>` : ""}${texto}</div>`;
}
function slot(label, val, c, campo) {
  let body;
  if (!val) body = `<span class="livre">${t("semAnot")}</span>`;
  else if (campo) body = celula(c, campo, val);
  else if (/^tanto faz$/i.test(val)) body = `<span class="livre">${t("tantoFaz")}</span>`;
  else body = val.split(/\s*\/\s*/).map(opt).join("");
  return `<div class="slot"><dt>${label}</dt><dd>${body}</dd></div>`;
}
const KW = /(?<![\wÀ-ÿ])(lvl ?\d+|press|skirmish|roam(?:ing)?|gank|stat check|outscale|free kill|free lane|100 0|side ?lane|late ?game|early)(?![\wÀ-ÿ])/gi;
const marca = line => esc(line).replace(KW, m => `<span class="kw">${m}</span>`);
// No modo EN usa a tradução da linha; se o autor editou e ainda não tem tradução, mostra o original.
function linhaNaLingua(l) {
  if (L !== "en" || !guia.traducao) return marca(l);

}

/* ---------- Formato completo (runas, itens, dificuldade e seções) ---------- */

const KW_EN = /\b(level \d+|lvl \d+)\b/gi;
const marcaEn = t => esc(t).replace(KW_EN, m => `<span class="kw">${m}</span>`);
const pips = n => `<span class="pips" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<i${i <= n ? ' class="on"' : ""}></i>`).join("")}</span>`;
const peca = (p, runa) => `<span class="peca${runa ? " runa" : ""}">${p.icone ? `<img src="${p.icone}" alt="" width="32" height="32">` : '<span class="soquete" aria-hidden="true"></span>'}<span>${esc(p.nome)}</span></span>`;

function linhaItem(l) {

function setupCompleto(c) {

    : `<div class="linha-runa"><span class="rot">${esc(l.rotulo)}</span><div class="pecas">${l.pecas.map(p => peca(p, true)).join("")}</div></div>`).join("")).join("");
  const itens = c.itens.map((g, i) => {
    const ol = `<ol lang="en">${g.linhas.map(linhaItem).join("")}</ol>`;

    if (i === 0) return `<div class="grupo">${cond ? `<p class="cond" lang="en">${esc(cond)}</p>` : ""}${ol}</div>`;

function blocoTexto(b) {

function notasCompleto(c) {

  const cols = picks.filter(x => x.offsetTop === picks[0].offsetTop).length || 1;
  const destino = { ArrowRight: i + 1, ArrowLeft: i - 1, ArrowDown: i + cols, ArrowUp: i - cols, Home: 0, End: picks.length - 1 }[e.key];
  if (destino === undefined) return;
  e.preventDefault();
  e.stopPropagation();
  const alvo = picks[Math.max(0, Math.min(picks.length - 1, destino))];

  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$("trava").hidden) { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); $("trava").onclick(); } return; }
  if (!$("menuGuias").hidden) { if (e.key === "Escape") { abreMenu(false); $("trocar").focus(); } return; }
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); return; }
  if (document.activeElement === q) {

    return;
  }
  if (e.target.closest && e.target.closest("input, textarea, select, .lista")) return;
  if (e.key === "ArrowRight") { toca("avanca"); select(vizinhos([1])[0]); }
  if (e.key === "ArrowLeft") { toca("volta"); select(vizinhos([-1])[0]); }
  // Cima/baixo andam uma linha da grade (na faixa de uma linha só, um campeão).
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const picks = [...lista.querySelectorAll(".pick")];
    if (!picks.length) return;
    e.preventDefault();
    const linha = picks.filter(x => x.offsetTop === picks[0].offsetTop).length;
    const cols = linha < picks.length ? linha : 1, desce = e.key === "ArrowDown";
    const i = Math.max(0, shown.indexOf(current)), n = i + (desce ? cols : -cols);

    const c = n >= 0 && n < shown.length ? shown[n] : cols === 1 ? vizinhos([desce ? 1 : -1])[0] : null;
    if (!c) return;
    toca(desce ? "avanca" : "volta");
    select(c);
  }
});

/* ---------- Skin do Akshan: troca a paleta (tokens em :root[data-skin]), a arte do card e o retrato do topo ---------- */
function abreSkins(abrir) {
  const m = $("skinMenu");
  if (abrir) {
    const atual = skinAtual();
    const ch = chromaAtual();
    m.innerHTML = SKINS.map(k => {
      const linha = `<button type="button" data-skin="${k.id}" aria-pressed="${k === atual}"><img src="${tileSkin(guia.campeao.id, k.num)}" alt="" width="40" height="40">${esc((L === "en" && k.nome_en) || k.nome)}</button>`;
      const cs = k === atual ? CHROMAS[k.id] || [] : [];
      if (!cs.length) return linha;
      return linha + `<div class="skin-chromas" role="group" aria-label="${t("chromas")}"><button type="button" class="base" data-chroma="0" aria-pressed="${!ch}" aria-label="${t("semChroma")}" title="${t("semChroma")}">–</button>${cs.map(c => {
        const nome = esc((L === "en" && c.nome_en) || c.nome);
        return `<button type="button" data-chroma="${c.num}" aria-pressed="${ch === c}" aria-label="${nome}" title="${nome}" style="--c1: ${c.cores[0] || "#888"}; --c2: ${c.cores[1] || c.cores[0] || "#888"}"></button>`;
      }).join("")}</div>`;
    }).join("");
  }
  m.hidden = !abrir;

    m.style.maxHeight = Math.max(160, innerHeight - topo - 12) + "px";
  }
  const jaAberto = abreSkins.aberto === abrir;
  abreSkins.aberto = abrir;
  $("skinBtn").setAttribute("aria-expanded", abrir);
  if (!jaAberto) toca(abrir ? "abre" : "fecha");
  if (abrir) (m.querySelector('.skin-chromas [aria-pressed="true"]') || m.querySelector('[aria-pressed="true"]') || m.querySelector("button")).focus();
}
$("skinBtn").addEventListener("click", () => abreSkins($("skinMenu").hidden));
// Falas do Akshan (sons/vo/akshan, dublagem pt-BR, de scripts/modelo3d/falas.py): uma sorteada a cada troca de skin.
// Uma pasta por língua: sons/vo/akshan (dublagem pt-BR) e sons/vo/akshan-en (voz original em inglês).
const FALAS_SKIN = { pt: 38, en: 38 };
let ultimaFala = -1;
function falaSkin() {
  const n = FALAS_SKIN[L] || FALAS_SKIN.pt;
  let i;
  do { i = Math.floor(Math.random() * n); } while (i === ultimaFala && n > 1);
  ultimaFala = i;
  toca("vo", `sons/vo/akshan${L === "en" ? "-en" : ""}/fala-${i}.ogg`);
}
function usaSkin(id) {
  if (id === skinAtual().id) return;
  falaSkin();
  if (id) document.documentElement.dataset.skin = id; else delete document.documentElement.dataset.skin;
  chromaNum = 0;
  try { id ? localStorage.setItem("skin", id) : localStorage.removeItem("skin"); localStorage.removeItem("chroma"); } catch (e) {}
  renderGuia();
  enquadraTudo();
  recarrega3d();
}
function usaChroma(num) {
  chromaNum = num;
  try { num ? localStorage.setItem("chroma", num) : localStorage.removeItem("chroma"); } catch (e) {}
  renderGuia();
  if (typeof chroma3d === "function") chroma3d();
}

/* ---------- Ao vivo: quem do "Acompanhe" está em live na Twitch (decapi.me responde sem chave) ---------- */
async function marcaAoVivo() {
  const links = [...document.querySelectorAll("#acompanhe .canal")];
  if (!links.length) return;
  await Promise.all(links.map(async a => {
    const login = new URL(a.href).pathname.split("/")[1];
    try {
      const r = await fetch(`https://decapi.me/twitch/uptime/${encodeURIComponent(login)}`, { cache: "no-store" });
      const txt = r.ok ? await r.text() : "";
      // Em live a resposta é o tempo no ar ("1 hour, 5 minutes"); fora, "... is offline".
      const vivo = /\d+\s+(second|minute|hour|day)/i.test(txt) && !/offline/i.test(txt);
      a.classList.toggle("ao-vivo", vivo);
      a.querySelector("small").textContent = vivo ? t("aoVivo") : "Twitch";
      a.closest("li").style.order = vivo ? -1 : "";
    } catch (e) {}
  }));
}
setTimeout(marcaAoVivo, 1500);
