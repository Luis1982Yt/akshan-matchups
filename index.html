/* Uma tela de seleção de campeões por guia: você, a lista de inimigos e o inimigo. Cada guia tem sua paleta; o Akshan é Sentinelas da Luz. */
:root {
  --fundo: #0c0b09;
  --painel: #15130f;
  --painel-alto: #1e1a13;
  --linha: rgba(214, 178, 98, .26);

  --botao-2: #e2b24a;
  --brilho: rgba(255, 240, 200, .55);

  --titulo: "Cinzel", "Times New Roman", serif;
  --corpo: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;

  --texto: #22170f; --texto-baixo: #66574a; --tinta-botao: #ffffff;
  --luz: rgba(255, 110, 50, .12); --sombra: 0 10px 30px rgba(80, 40, 10, .14);
  color-scheme: light;
}
/* Mordekaiser: ferro e o verde do Reino da Morte. */
:root[data-guia="mordekaiser"] {
  --fundo: #0a0d0c;
  --painel: #121715;
  --painel-alto: #19201c;
  --linha: rgba(110, 214, 156, .22);
  --linha-forte: rgba(110, 214, 156, .48);
  --acento: #63c98f;
  --acento-vivo: #97ecbb;
  --destaque: #5be39a;
  --texto: #dde7e1;
  --texto-baixo: #92a39a;
  --tinta-botao: #05110a;
  --luz: rgba(80, 220, 140, .12);
  --sombra: 0 10px 30px rgba(0, 0, 0, .5);
  --sobre-arte: #c8ffdf;
  --destaque-arte: #6cf0a8;
  --botao-1: #b5f7cf;
  --botao-2: #3fbd78;
  --brilho: rgba(200, 255, 225, .5);
  --brilho-2: rgba(80, 220, 140, .18);
  color-scheme: dark;
}
:root[data-guia="mordekaiser"][data-tema="claro"] {
  --fundo: #edf2ee;
  --painel: #fbfdfb;
  --painel-alto: #dde7e0;
  --linha: rgba(25, 110, 65, .26);
  --linha-forte: rgba(25, 110, 65, .56);
  --acento: #1d7448;
  --acento-vivo: #135a37;
  --destaque: #2fa865;
  --texto: #17201b;
  --texto-baixo: #4c5d53;
  --tinta-botao: #04120a;
  --luz: rgba(47, 168, 101, .14);
  --sombra: 0 10px 30px rgba(10, 60, 30, .14);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scrollbar-color: var(--linha-forte) var(--fundo); }
body { margin: 0; color: var(--texto); font: 400 16px/1.6 var(--corpo); -webkit-font-smoothing: antialiased; background: var(--fundo); }
/* A luz vem de cima, numa camada própria atrás de tudo. */
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(1100px 520px at 50% -120px, var(--luz), transparent 70%); }
::selection { background: var(--destaque); color: var(--tinta-botao); }
input { caret-color: var(--acento); }
button { font: inherit; color: inherit; }
img { display: block; }
img.falhou { visibility: hidden; }
a { color: var(--acento-vivo); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--acento-vivo); outline-offset: 3px; }
/* Link de pular, visível só com o foco do teclado. */
.pular { position: absolute; z-index: 40; left: 16px; top: -80px; padding: 10px 16px; border-radius: 8px; background: var(--painel); border: 1px solid var(--acento-vivo); color: var(--texto); font-weight: 700; text-decoration: none; }
.pular:focus { top: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* Barra e troca de guia */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fundo); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in oklab, var(--fundo) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); }
.bar-in { height: var(--barra); max-width: 1320px; margin: 0 auto; padding: 0 var(--borda); display: flex; align-items: center; gap: 16px; }
.guias { position: relative; min-width: 0; }
.trocar { display: flex; align-items: center; gap: 12px; min-height: 48px; max-width: 100%; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; }
.trocar:hover, .trocar[aria-expanded="true"] { border-color: var(--linha-forte); background: var(--painel); }
.trocar img { width: 38px; height: 38px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--acento); }
.trocar .txt { display: grid; min-width: 0; line-height: 1.15; }
.trocar b { font: 700 20px/1.1 var(--titulo); letter-spacing: .04em; color: var(--acento-vivo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trocar .txt span { font-size: 13px; color: var(--texto-baixo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trocar svg { flex: none; color: var(--acento); transition: transform .2s; }
.trocar[aria-expanded="true"] svg { transform: rotate(180deg); }
.menu { position: absolute; z-index: 15; top: calc(100% + 8px); left: 0; width: min(340px, calc(100vw - 32px)); padding: 8px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha-forte); box-shadow: var(--sombra); }
.menu-tit { margin: 4px 10px 6px; font: 600 12px var(--corpo); letter-spacing: .14em; text-transform: uppercase; color: var(--texto-baixo); }
.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.menu li button { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border: 0; border-radius: 8px; background: none; cursor: pointer; text-align: left; }
.menu li button:hover, .menu li button[aria-current="true"] { background: var(--painel-alto); }
.menu li img { width: 42px; height: 42px; flex: none; border-radius: 50%; }
.menu li b { display: block; font: 700 17px/1.2 var(--titulo); color: var(--texto); }
.menu li small { display: block; font-size: 13px; color: var(--texto-baixo); }
.menu li .atual { margin-left: auto; flex: none; font-size: 12px; font-weight: 700; color: var(--acento-vivo); }
.dica { margin: 6px 10px 4px; padding-top: 8px; border-top: 1px solid var(--linha); font-size: 13px; color: var(--texto-baixo); }
.acoes { margin-left: auto; display: flex; gap: 8px; }
.tema, .som, .lingua { width: 44px; height: 44px; flex: none; display: grid; place-items: center; cursor: pointer; border-radius: 50%; border: 1px solid var(--linha-forte); background: transparent; color: var(--acento-vivo); }
.tema:hover, .som:hover, .lingua:hover { background: var(--painel-alto); }
.lingua { font: 700 13px var(--corpo); letter-spacing: .04em; }
.trocar:disabled { cursor: default; }
.trocar:disabled:hover { border-color: transparent; background: none; }
.trocar:disabled svg { display: none; }
.som .mudo { display: none; }
.som[aria-pressed="false"] .ligado { display: none; }
.som[aria-pressed="false"] .mudo { display: block; }
.tema .sol { display: none; }
:root[data-tema="claro"] .tema .sol { display: block; }
:root[data-tema="claro"] .tema .lua { display: none; }

/* Palco: a lista fixa à esquerda e o matchup inteiro à direita, sem precisar rolar. */
.palco {
  max-width: 1320px; margin: 0 auto; padding: 20px var(--borda) 64px;
  display: grid; gap: 24px; grid-template-columns: 440px minmax(0, 1fr); align-items: start;
}
.detalhe { min-width: 0; display: grid; gap: 16px; }
/* Akshan 3D: só em tela larga, numa terceira coluna à direita, sobre o fundo do próprio site. */
.akshan3d { display: none; }
@media (min-width: 1720px) {
  :root.com-3d[data-guia="akshan"] .bar-in { max-width: 1760px; }
  :root.com-3d[data-guia="akshan"] .palco { max-width: 1760px; grid-template-columns: 440px minmax(0, 1fr) 380px; }
  :root.com-3d[data-guia="akshan"] .akshan3d {
    display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px;
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barra) + 16px);
    height: calc(100vh - var(--barra) - 48px); min-height: 560px;
  }
}
.akshan3d canvas { display: block; width: 100%; height: 100%; min-height: 0; cursor: grab; touch-action: none; opacity: 0; transition: opacity .8s ease; }
.akshan3d canvas.girando { cursor: grabbing; }
.akshan3d.pronto canvas, .akshan3d.pronto .anim3d { opacity: 1; }
.carrega3d { position: absolute; left: 0; right: 0; top: 45%; margin: 0; text-align: center; font: 600 13px var(--corpo); letter-spacing: .08em; color: var(--texto-baixo); animation: pulsa3d 1.4s ease-in-out infinite alternate; }
.akshan3d.pronto .carrega3d { display: none; }
@keyframes pulsa3d { from { opacity: .35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .carrega3d { animation: none; } }
.anim3d { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; opacity: 0; transition: opacity .8s ease; }
.anim3d button { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--linha-forte); background: var(--painel); color: var(--texto); font: 700 13px var(--corpo); cursor: pointer; }
.anim3d button.tecla { min-width: 36px; padding: 0; font-family: var(--titulo); }
.anim3d button:hover { background: var(--painel-alto); }
.anim3d button[aria-pressed="true"] { border-color: var(--acento-vivo); color: var(--acento-vivo); }
/* Esconder fica no canto da caixa; escondido, sobra uma alça na borda direita da tela para trazer de volta. */
.fecha3d { position: absolute; top: 0; right: 0; z-index: 2; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid var(--linha-forte); background: var(--painel); color: var(--texto-baixo); cursor: pointer; opacity: 0; transition: opacity .8s ease; }
.akshan3d.pronto .fecha3d { opacity: 1; }
.fecha3d:hover { color: var(--texto); background: var(--painel-alto); }
.abre3d { position: fixed; right: 0; top: 50%; z-index: 5; transform: translateY(-50%); display: flex; align-items: center; gap: 8px; padding: 16px 9px; border: 1px solid var(--linha-forte); border-right: 0; border-radius: 10px 0 0 10px; background: var(--painel); color: var(--acento-vivo); font: 700 13px var(--titulo); letter-spacing: .14em; writing-mode: vertical-rl; cursor: pointer; }
.abre3d:hover { background: var(--painel-alto); }
.abre3d[hidden] { display: none; }
.duelo { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { position: relative; overflow: hidden; height: 240px; border-radius: 10px; background: var(--painel); border: 1px solid var(--linha-forte); box-shadow: var(--sombra); }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
#artEle, #artVoce { position: absolute; inset: 0; }
#trocarImg { display: contents; }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(8, 8, 6, .9) 0%, rgba(8, 8, 6, .5) 34%, transparent 62%); }
.card .selo { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 3px 10px; border-radius: 4px; font: 700 12px/1.4 var(--titulo); letter-spacing: .12em; text-transform: uppercase; background: var(--destaque-arte); color: #111; }
.skin-btn { position: absolute; z-index: 3; top: 10px; right: 10px; display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(10, 10, 14, .62); color: var(--branco-arte, #f6f3ea); font: 700 12px var(--corpo); letter-spacing: .04em; cursor: pointer; backdrop-filter: blur(4px); }
.skin-btn[hidden] { display: none; }
/* Setas de trocar skin, como na seleção de campeões do jogo; a da direita fica longe do círculo VS. */
.skin-seta { position: absolute; z-index: 3; top: 50%; width: 44px; height: 56px; margin-top: -28px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--destaque-arte); cursor: pointer; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .85)); opacity: .85; transition: opacity .15s, transform .15s; }
.skin-seta[hidden] { display: none; }
.skin-seta:hover { opacity: 1; }
.skin-seta.ant { left: 4px; }
.skin-seta.ant svg { transform: scaleX(-1); }
.skin-seta.prox { right: 40px; }
.skin-seta.ant:active { transform: translateX(-2px); }
.skin-seta.prox:active { transform: translateX(2px); }
@media (max-width: 900px) { .skin-seta { width: 32px; } .skin-seta svg { width: 16px; height: 28px; } .skin-seta.prox { right: 26px; } }
/* Chromas: bolinhas com as cores do chroma, embaixo da skin escolhida no menu. */
.skin-chromas { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 6px 8px 54px; }
.skin-menu .skin-chromas button { width: 26px; min-height: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid var(--linha-forte); background: linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%); }
.skin-menu .skin-chromas button[aria-pressed="true"] { border-color: var(--acento-vivo); box-shadow: 0 0 0 2px var(--painel), 0 0 0 4px var(--acento-vivo); }
.skin-menu .skin-chromas button.base { background: var(--painel-alto); display: grid; place-items: center; color: var(--texto-baixo); font: 700 11px var(--corpo); }
/* Toque: área de 44px sem mudar o desenho. */
.skin-menu .skin-chromas button { position: relative; }
.skin-menu .skin-chromas button::after { content: ""; position: absolute; inset: -9px; }
@media (max-width: 900px) { .skin-btn { width: 32px; padding: 0; justify-content: center; } .skin-btn span { display: none; } }
.skin-btn:hover { border-color: var(--destaque-arte); }
.skin-btn svg { color: var(--destaque-arte); }
/* Toque: a área do botão cresce até 44px sem mudar o desenho. */
.skin-btn::after { content: ""; position: absolute; inset: -6px; }
/* O menu fica preso à tela (fixed), não ao card: o card corta o que passa da borda dele. A posição vem do JS. */
.skin-menu { position: fixed; z-index: 30; display: grid; align-content: start; gap: 4px; width: min(240px, calc(100vw - 24px)); overflow-y: auto; overscroll-behavior: contain; padding: 6px; border-radius: 12px; border: 1px solid var(--linha-forte); background: var(--painel); box-shadow: var(--sombra); }
.skin-menu[hidden] { display: none; }
.skin-menu button { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 10px 4px 4px; border-radius: 8px; border: 0; background: none; color: var(--texto); font: 600 14px var(--corpo); text-align: left; cursor: pointer; }
.skin-menu button:hover, .skin-menu button[aria-pressed="true"] { background: var(--painel-alto); }
.skin-menu button[aria-pressed="true"] { color: var(--acento-vivo); }
.skin-menu img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid var(--linha-forte); }
.card.inimigo .selo { left: auto; right: 12px; background: #f6f3ea; color: #111; }
.card .quem { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 16px 14px; color: #f6f3ea; }
.card.inimigo .quem { text-align: right; }
.quem .t { margin: 4px 0 0; font-size: 14px; line-height: 1.3; color: #e4ddcf; }
.quem .n { margin: 0; font: 800 clamp(24px, 2.3vw, 32px)/1.05 var(--titulo); letter-spacing: .02em; color: var(--sobre-arte); overflow-wrap: break-word; text-wrap: balance; }
.quem .n.longo { font-size: clamp(19px, 1.8vw, 25px); letter-spacing: 0; }
.quem .guia { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: #e4ddcf; }
.quem .guia.sim { color: var(--destaque-arte); }
.quem .guia > i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
.quem .guia.dif { font-weight: 700; color: #f6f3ea; }
.quem .guia.dif > i { width: 11px; height: 11px; background: var(--dif); box-shadow: 0 0 0 2px rgba(0, 0, 0, .45); }
.quem .guia.sim > i { background: currentColor; }
.quem .guia .pips i { background: rgba(255, 255, 255, .25); }
.quem .guia .pips i.on { background: var(--destaque-arte); }

/* Botão de travar: o VS entre as duas artes */
.travar {
  position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 66px; height: 66px; padding: 0; border: 3px solid var(--fundo); border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; font: 800 21px/1 var(--titulo); letter-spacing: .04em; color: #111;
  background: linear-gradient(180deg, var(--botao-1), var(--botao-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 6px 18px rgba(0, 0, 0, .45);
}
.travar:hover { filter: brightness(1.08); }
.travar:active { transform: translate(-50%, -50%) scale(.95); }

/* Lista de inimigos */
.anel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barra) + 16px); min-width: 0; padding: 18px 20px 22px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
.anel h2 { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 14px; font: 700 22px/1.2 var(--titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-vivo); text-align: center; }
.anel h2 svg { flex: none; color: var(--acento); }
.busca { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 8px; background: var(--fundo); border: 1px solid var(--linha-forte); color: var(--texto-baixo); }
.busca:focus-within { border-color: var(--acento-vivo); color: var(--acento-vivo); }
.busca input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--texto); font: 16px var(--corpo); }
.busca input::placeholder { color: var(--texto-baixo); }
.busca .conta { font: 700 13px var(--corpo); color: var(--acento); font-variant-numeric: tabular-nums; white-space: nowrap; }
.filtros { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 400px; margin: 12px auto 4px; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  background: transparent; border: 1px solid var(--linha-forte); color: var(--texto); font: 600 14px var(--corpo);
}
.chip img { width: 20px; height: 20px; border-radius: 4px; }
.chip .cor-dif { width: 11px; height: 11px; border-radius: 50%; background: var(--dif); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .35); }
.chip:hover { border-color: var(--acento-vivo); }
.chip[aria-pressed="true"] { background: var(--destaque); border-color: var(--destaque); color: var(--tinta-botao); }
.roda { position: relative; width: min(100%, 400px); aspect-ratio: 1; margin: 12px auto 0; border-radius: 50%; }
/* Mira da Punição (R do Akshan), como no jogo: losango que trava no alvo, círculo por dentro e setas laterais apontando para o centro. */
.mira { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.mira .aro { fill: none; stroke: var(--acento); stroke-width: 1.5px; }
.mira .aro.fino { stroke-width: 1px; opacity: .45; }
.mira .setas { fill: var(--acento-vivo); }
.alvo { position: absolute; z-index: 1; left: 50%; top: 50%; height: 70%; aspect-ratio: 1; transform: translate(-50%, -50%); overflow: visible; pointer-events: none; filter: drop-shadow(0 0 4px var(--mira-brilho, rgba(255, 214, 120, .75))) drop-shadow(0 1px 3px rgba(0, 0, 0, .6)); }
.alvo .losango { fill: none; stroke: var(--mira, #ffe39a); stroke-width: 3.5px; }
.alvo .aro-alvo { fill: none; stroke: #fff4d6; stroke-width: 1px; opacity: .6; }
.alvo .setas-alvo { fill: #fff4d6; opacity: .85; }
.alvo.travando { animation: trava-alvo .5s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes trava-alvo { from { opacity: 0; transform: translate(-50%, -50%) scale(1.35); } }
:root:not([data-guia="akshan"]) .alvo, :root:not([data-guia="akshan"]) .seta-mira { display: none; }
/* As setas da mira do Akshan são anterior/próximo de verdade. */
.seta-mira { position: absolute; z-index: 2; top: 50%; width: 44px; height: 44px; margin-top: -22px; display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; color: var(--acento-vivo); }
.seta-mira.esq { left: -16px; }
.seta-mira.dir { right: -16px; }
.seta-mira:hover { color: var(--destaque); }
.seta-mira svg { width: 15px; height: 24px; }
.lista {
  position: absolute; inset: 12% 12% 7%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--acento) transparent;
  -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 9px; align-content: start; padding: 12px 12px 28px;
}
.pick { position: relative; aspect-ratio: 1; padding: 0; border: 1px solid var(--linha-forte); border-radius: 6px; cursor: pointer; background: var(--painel-alto); }
.pick img { width: 100%; height: 100%; border-radius: 5px; object-fit: cover; }
.pick:has(img.falhou)::after { content: attr(data-ini); position: absolute; inset: 0; display: grid; place-items: center; font: 700 20px var(--titulo); color: var(--texto-baixo); }
/* Dificuldade da matchup = a cor da célula do campeão na planilha do Peteruso. */
:root {
  --difc-muito_facil: #22d3ee; --difc-facil: #34a853; --difc-medio: #fbbc04; --difc-dificil: #e06666; --difc-muito_dificil: #c0281c;
  --dif-muito_facil: var(--difc-muito_facil); --dif-facil: var(--difc-facil); --dif-medio: var(--difc-medio); --dif-dificil: var(--difc-dificil); --dif-muito_dificil: var(--difc-muito_dificil);
}

.pick.tem-dif { border: 2px solid var(--dif); }

.pick:focus-visible { outline-offset: 2px; }
.ver-tier { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; margin: 12px auto 0; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linha-forte); background: var(--painel-alto); color: var(--texto); font: 700 13px var(--corpo); cursor: pointer; }

@media (max-width: 900px) {

}
.legenda { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--texto-baixo); }

/* Setup */
.setup { scroll-margin-top: calc(var(--barra) + 16px); margin: 0; padding: 16px 20px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }

.soquete { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--linha-forte); background: var(--painel-alto); }

.celula { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; font-weight: 700; font-size: 16px; line-height: 1.2; color: var(--texto); }
.celula .icones { display: flex; gap: 6px; flex: none; }
.celula img { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--linha-forte); background: var(--painel-alto); }
.celula img.runa { border-radius: 50%; background: #15130f; }
.celula > span { min-width: 0; overflow-wrap: anywhere; }
.celula .livre { font-weight: 400; }
/* Desktop: ícones em cima e o texto da célula embaixo, como na planilha. */
.slot .celula, .slot .opt { flex-direction: column; align-items: flex-start; gap: 8px; }
.celula .rush, .opt .rush { font: 700 11px/1 var(--titulo); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--destaque); color: var(--tinta-botao); }
.livre { display: flex; align-items: center; min-height: 36px; font-style: italic; color: var(--texto-baixo); }
/* Setup completo: runas, itens com condições e dificuldade */
.setup-completo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); grid-template-rows: auto 1fr; gap: 20px 32px; align-items: start; }
.setup-completo .build { grid-column: 2; grid-row: 1 / span 2; }
.bloco { min-width: 0; }
.linha-runa + .linha-runa { margin-top: 12px; }
.linha-runa .rot { display: block; margin-bottom: 6px; font-size: 13px; color: var(--texto-baixo); }
.pecas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pecas .seta { flex: none; color: var(--acento); }
.ou { font-size: 13px; font-style: italic; color: var(--texto-baixo); }
.ou-bloco { margin: 14px 0 10px; font-size: 13px; font-style: italic; color: var(--texto-baixo); }
.frag { margin: 0; font-size: 15px; font-weight: 600; }
.build .grupo + .grupo { margin-top: 18px; }
.build .cond { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--acento-vivo); }
.build details.grupo summary { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; list-style: none; font-weight: 700; font-size: 15px; color: var(--acento-vivo); }
.build details.grupo summary::-webkit-details-marker { display: none; }
.build details.grupo summary::before { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--acento); border-bottom: 2px solid var(--acento); transform: rotate(-45deg); }
.build details.grupo[open] summary::before { transform: rotate(45deg); }
.build details.grupo[open] summary { margin-bottom: 8px; }
.build ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.build .motivo { margin: 4px 0 0; font-size: 14px; color: var(--texto-baixo); }
.build .nota { font-size: 14px; font-style: italic; color: var(--texto-baixo); }
.build .sub { margin-top: 4px; font-size: 14px; font-weight: 700; }

.dif dl { margin: 0; display: grid; gap: 10px; }
.dif dl div { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dif dt { font-size: 14px; color: var(--texto-baixo); }
.dif dd { margin: 0; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.dif dd b { font-size: 15px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 2px; background: var(--painel-alto); box-shadow: inset 0 0 0 1px var(--linha-forte); }
.pips i.on { background: var(--destaque); box-shadow: none; }

/* Guia */
.notas, .rodape { min-width: 0; }
.navega { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
.navega h2 { margin: 0; font: 700 23px/1.2 var(--titulo); letter-spacing: .06em; color: var(--acento-vivo); }
.navega div { display: flex; gap: 8px; }
.navega button { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 8px; border: 1px solid var(--linha-forte); background: var(--painel); color: var(--texto); font-weight: 600; font-size: 15px; }

.lembretes { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: n; }
.lembretes li { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: start; padding: 12px 16px; border-radius: 10px; background: var(--painel); border: 1px solid var(--linha); font-size: 17px; line-height: 1.6; counter-increment: n; }

.kw { font-weight: 700; color: var(--texto); text-decoration: underline; text-decoration-color: var(--destaque); text-decoration-thickness: 2px; text-underline-offset: 5px; }

.resumo h3 { margin: 0 0 8px; font: 700 13px var(--corpo); letter-spacing: .14em; text-transform: uppercase; color: var(--texto-baixo); }
.secao + .secao { margin-top: 34px; }
.secao h3 { margin: 0 0 12px; font: 700 21px/1.25 var(--titulo); letter-spacing: .04em; color: var(--acento-vivo); }
.secao p { margin: 0 0 14px; font-size: 17px; line-height: 1.7; }

.secoes li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 7px; height: 7px; transform: rotate(45deg); background: var(--destaque); }
.cds { width: 100%; max-width: 560px; border-collapse: collapse; font-size: 15px; }
.cds th, .cds td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
.cds th { font-weight: 700; color: var(--texto); white-space: nowrap; }
.cds td { color: var(--texto-baixo); font-variant-numeric: tabular-nums; }
.rodape { display: block; font-size: 14px; color: var(--texto-baixo); }
/* Fim da página: quem acompanhar (embaixo da lista) e as notas da fonte (embaixo do matchup), mais afastados. */
@media (min-width: 901px) {
  /* A lista gruda só dentro da primeira linha (sticky numa grade prende à grade inteira). */
  .col-lista { grid-column: 1; grid-row: 1; align-self: stretch; min-width: 0; }
  .detalhe { grid-column: 2; grid-row: 1; }
  .acompanhe { grid-column: 1; grid-row: 2; }

  /* A sobra de altura da coluna 3D vai para a linha de baixo: a de cima fica do tamanho do conteúdo. */

}
.acompanhe { padding: 14px 16px 12px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
.acompanhe h2 { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 10px; font: 700 14px var(--titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-vivo); }
.acompanhe ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.acompanhe .canal { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--linha); background: var(--painel-alto); color: var(--texto); text-decoration: none; }

.acompanhe li { display: flex; }

.acompanhe .canal.ao-vivo { border-color: #e5484d; box-shadow: 0 0 0 1px #e5484d inset; }

.acompanhe .canal.ao-vivo small::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: #ff3b3f; vertical-align: 1px; animation: pulsa-vivo 1.2s ease-in-out infinite alternate; }
@keyframes pulsa-vivo { from { opacity: .35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .acompanhe .canal.ao-vivo small::before { animation: none; } }
.acompanhe .dev { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--texto-baixo); }

/* App da seleção de campeões: só no desktop (é um programa para Windows). O botão abre a explicação. */
.acompanhe .baixa-app { display: none; margin: 10px 0 0; }
.acompanhe .baixa-app button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px dashed var(--linha-forte); background: none; color: var(--texto); font: 700 13px var(--corpo); cursor: pointer; }

.app-info { width: min(620px, calc(100vw - 32px)); }
.app-corpo { display: grid; gap: 16px; padding: 18px 22px 22px; font-size: 15px; line-height: 1.6; }

.app-corpo ol li::before { content: counter(passo); position: absolute; left: 0; top: -1px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--destaque); color: var(--tinta-botao); font: 700 14px var(--titulo); }

/* Pick travado: as duas artes frente a frente, como a tela de carregamento */
.trava { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; gap: 4vw; padding: 6vh 6vw; background: rgba(6, 6, 4, .9); cursor: pointer; }
.trava::before { content: ""; position: absolute; left: 50%; top: 50%; width: 60vmin; height: 60vmin; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, var(--brilho), var(--brilho-2) 40%, transparent 70%); pointer-events: none; }
.trava figure { position: relative; margin: 0; width: min(100%, 34vh); aspect-ratio: 308 / 560; border-radius: 10px; overflow: hidden; border: 2px solid var(--botao-2); box-shadow: 0 18px 50px rgba(0, 0, 0, .6); }
.trava img { width: 100%; height: 100%; object-fit: cover; }
.trava figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 10px 12px; text-align: center; font: 800 clamp(18px, 3vh, 28px)/1.1 var(--titulo); color: var(--sobre-arte); background: linear-gradient(transparent, rgba(8, 8, 6, .9)); }

@keyframes entra-e { from { transform: translateX(-30vw); opacity: 0; } }
@keyframes entra-d { from { transform: translateX(30vw); opacity: 0; } }
@keyframes brilha { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }

@media (max-width: 1100px) {
  .palco { grid-template-columns: 340px minmax(0, 1fr); }

g/perk-images/Styles/Domination/Electrocute/Electrocute.png","Impacto repentino":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Domination/SuddenImpact/SuddenImpact.png","Osso revestido":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/Resolve/BonePlating/BonePlating.png","Inspiração":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/7203_Whimsy.png","Precisão":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/7201_Precision.png","Ignite":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/spell/SummonerDot.png","TP":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/spell/SummonerTeleport.png","Exhaust":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/spell/SummonerExhaust.png","Mercs":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3111.png","Tabis":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3047.png","Rapidez":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3009.png","Craquen":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6672.png","Vamps":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3008.png","Crit":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/6676.png","Letalidade":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3179.png","Scaling":"https://ddragon.leagueoflegends.com/cdn/img/perk-images/Styles/7202_Sorcery.png","Terminus":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3302.png"},"matchups":[["Ahri","PTA","Impacto repentino","Ignite","Mercúrio / Vampíricas","Crit","• Early/Trocas: Faça short trades sem deixar ela ativar o Trovão (Electrocute); desviando de uma das skills a troca é sua pra extender, principalmente o charme (E).\n• Cuidados: No mid game ela sempre tem ult. Só busque gank/all-in com CC aliado ou se ela se expor muito errado, se não ela foge.\n• Macro: Se ela não estiver muito forte, você vence no stat check. Caso queira brigar com ela na side, guarde seu E / R para quando ela sair do range com a Ult",1],["Akali","PTA / Electro","Scaling","Ignite","Mercúrio","Crit","• Early/Trocas: Punir o early game com poke constante, se não ela te dá all-in. Nível 4 ela tenta revidar o dano na lane. \n• Cuidados: Se ela acertar o E, você consegue recuar com o Arpéu sem ser cancelado. Sempre respeite os spikes de item.\n• Macro: Respeite o dano dela no late game. Use a Ult para revelar a posição dela na fumaça (W) em Team Fights ou x1.",1],["Anivia","PTA","Inspiração","TP","Mercúrio / Rapidez","Tanto faz","• Early/Trocas: Troca dela é forte, mas você garante pressão no early. Solável se ela se expor e você desviar do Q.\n• Cuidados: Evite tomar o combo Q + R (ela te vence no stat check após fechar item).\n• Macro: No nível 6 a pressão vira dela. Evite lutas 3v3 prolongadas, pois ela tem muito peel e controle de grupo.",1],["Annie","PTA","Osso revestido","TP","Mercúrio RUSH !!!","Tanto faz","• Early/Trocas: Solável no early game; depois fica mais difícil pelo outrange. Lute somente se ela gastar o stun na wave.\n• Cuidados: A maior ameaça é o combo Flash + R para te dar instakill ou setar gank.\n• Macro: Você domina a pressão de rotas, skirmishes e roamings. Atente-se aos roams dela.",1],["Aurelion Sol","PTA / Electro","Impacto repentino","Ignite","Tanto faz","Craquen / Crit","• Early/Trocas: Domínio no Nível 1 (não deixe o Q explodir). Busque de 1 a 2 solos no early e explore oportunidades de dive.\n• Cuidados: Faça short trades para desgastar e use o Arpéu (E) para punir quando ele parar para bater na wave.\n• Macro: Pressão de rota e skirmish totalmente suas; acompanhe os roamings dele.",1],["Aurora","Electro","Precisão","Ignite","Mercúrio","Crit","• Early/Trocas: Rota favorável no early, mas o CD do Q dela é curto. Se ela errar skills, entre com o Arpéu (E).\n• Cuidados: Sempre desvie para trás (para os lados não funciona bem). Se tomar E + Q com a Ult dela ativa, dê recall.\n• Macro: Sua Ult revela o W dela, mas a Ult dela desvia dos seus tiros. No late game, quem iniciar primeiro vence.",1],["Azir","PTA","Impacto repentino","TP","Mercúrio / Rapidez","Tanto faz","• Early/Trocas: Solável no early; é possível ignorar os soldados para bater direto nele se houver apenas um invocado.\n• Cuidados: Com itens fechados, ele ganha em DPS e alcance. A Ult dele é perigosa para setar ganks ou all-in.\n• Macro: Pressão equilibrada; skirmish e roaming muito favoráveis para você. Na sidelane ele ganha força, mas é abatível.",1],["Brand","PTA","Inspiração","Ignite","Mercúrio","Tanto faz","• Early/Trocas: Fora de teamfights ele tem auto-defesa fraca. Foque ele em skirmishes sem hesitar.\n• Cuidados: A Ult dele causa muito dano surpresa; faça Vampíricas para manter HP cheio ou dê recall/TP se necessário.\n• Macro: Não dê brechas por ego; em condições normais você estará em vantagem no 1v1.",1],["Cassiopeia","PTA","Inspiração","Ignite","Mercúrio / Rapidez","Crit","• Early/Trocas: Se tomar o Q, use o Arpéu (E) para recuar. Você tem mais waveclear; ganks nela costumam ser kill fácil.\n• Cuidados: O Miasma (W) impede de conjurar o Arpéu (E), mas não cancela se você já estiver no ar. Durante o voo do E, a Ult dela ainda te estuna.\n• Macro: Ela se expõe facilmente. A sidelane é mais favorável a ela no decorrer do jogo.",1],["Diana","PTA","Osso revestido","Ignite","Mercúrio / Vampíricas","Craquen","• Early/Trocas: Poke e all-in dela são fortes. Se ela errar o Q, lide com ela e desvie para trás.\n• Cuidados: Se ficar low HP, dê recall em vez de arriscar. Guarde o Flash para reagir à Ult dela.\n• Macro: Skirmish equilibrado, roaming favorável a você, pressão de rota favorável a ela.",1],["Ekko","PTA","Osso revestido","Ignite","Mercúrio","Tanto faz","• Early/Trocas: Nível 1 seu. Short trade é dele, mas em trocas estendidas você vence.\n• Cuidados: Tente antecipar o W dele. No late game, compre Corta-Cura e foque ele nas lutas.\n• Macro: Pressão sua. Guarde Ward Azul para ultar nele após ele usar a Ult (R) de volta para a fog.",1],["Fizz","PTA","Osso revestido","Ignite","Mercúrio","Crit","• Early/Trocas: Nível 1 seu. O E dele volta antes do seu, mas desviando de skills você vence trocas longas.\n• Cuidados: Rota volátil; guarde o Flash no nível 6 para reagir ao tubarão (Ult).\n• Macro: Pressão e skirmishes suas. Sidelane sua a menos que ele esteja muito feedado.",1],["Galio","PTA","Scaling","Ignite","Mercúrio / Rapidez","Crit","• Early/Trocas: Puna de longe, mas fique fora do alcance e longe da wave para não tomar o combo completo.\n• Cuidados: Ele acertando o E em lutas em grupo é mortal. Fique atento a pings de MIA quando ele for para a fog.\n• Macro: Pressão sua. Acompanhe roams sem dar facecheck em arbustos.",1],["Hwei","PTA / Electro","Impacto repentino","Ignite","Mercúrio / Vampíricas","Crit","• Early/Trocas: Early game fácil. Mindgame com Arpéu (E) no Fear dele garante kill fácil.\n• Cuidados: Desvie na diagonal para trás quando ele usar o tapete para evitar a garra. Fique atrás da wave.\n• Macro: Se ele jogar mal, busque o solo na lane. Skirmish fácil; pressão disputada após o primeiro B.",1],["Irelia","PTA","Osso revestido","Ignite","TABI RUSH !!!!","Craquen / Crit","• Early/Trocas: Nível 1 favorável. Dê bastante dano inicial e nunca lute contra ela com passiva estacada.\n• Cuidados: Jogue o Q nos minions que ela quer dar dash para negar farm/causar dano. Foque em desviar do E.\n• Macro: Evite trocar na sidelane contra ela; ela escala muito bem com farm.",1],["Jayce","PTA","Impacto repentino","Ignite","Tabis / Vampíricas","Tanto faz","• Early/Trocas: Nível 1 é kill fácil com um bom Arpéu (E). Pressão sua no early; nível 6 há janela para solo kill.\n• Cuidados: Nunca tome o combo completo de Canhão + Martelo. Use o bumerangue (Q) ao ser empurrado para ativar o escudo.\n• Macro: Se a lane complicar, você tem vantagem em roaming e waveclear rápido.",1],["Kassadin","PTA","Impacto repentino","Ignite","Tanto faz","Tanto faz","• Early/Trocas: Obrigatório matar 2 a 3 vezes no early. Dive é muito viável. Pressão e skirmish infinitos a seu favor.\n• Cuidados: Não troque kills 1 por 1; seu objetivo é atrasar o pico de poder dele o máximo possível.\n• Macro: Nível 11 com 2 itens ele fica perigoso em TF, mas na sidelane você ainda o vence se mantiver a vantagem.",1],["Katarina","PTA","Impacto repentino","Exhaust","Tanto faz","Craquen","• Early/Trocas: Respeite as adagas no chão e aplique poke constante. Não fique perto dos minions que ela farmar com Q.\n• Cuidados: Kat AP tem spike alto com Alternador Hextech; Kat de Conquistador é mais forte no early game. Use Exaustão na Ult dela.\n• Macro: Acompanhe os roams para impedir que ela receba kills fáceis.",0],["Kayle","PTA","Impacto repentino","Ignite","Tanto faz","Tanto faz","• Early/Trocas: Nível 1 favorável com bom spacing e Arpéu. Dê harass constante para negar o free farm.\n• Cuidados: Baita a Ult dela, recue com o Arpéu e depois reengaje com a sua Ult.\n• Macro: Rota muito favorável. Force a Ult dela para armar dives e controlar o jogo antes que ela escale.",1],["Kog'Maw","PTA","Impacto repentino","Exhaust","Tanto faz","Tanto faz","• Early/Trocas: Cuidado com o Nível 1 dele com W ativo. Ele é um canhão de vidro, mate ele antes que devolva o dano.\n• Cuidados: Não fique na wave para não tomar o E junto dos minions. Cuidado com o spacing na lentidão do E.\n• Macro: Faça short trades eficientes para vencê-lo antes que alcance o late game.",0],["LeBlanc","PTA","Impacto repentino","Ignite","Mercúrio","Craquen","• Early/Trocas: Rota volátil. Sua passiva e o PTA identificam a verdadeira LeBlanc do clone.\n• Cuidados: Alinhe o bumerangue (Q) com ela e a marca do W. A Ult (R) revela a invisibilidade dela, mas o clone pode tankar.\n• Macro: Skirmish favorável e roaming equilibrado. Você garante pressão se ela não ultar a wave.",0],["Lissandra","PTA","Scaling","TP","Mercúrio","Tanto faz","• Early/Trocas: Nível 1 seu com foco em poke. Ela não tem sustentação no early.\n• Cuidados: Não fique na wave. Ela seta ganks perfeitamente a partir do nível 6; mantenha HP cheio.\n• Macro: Skirmish favorável a você. Foque em farmar bem e manter pressão sem se expor a ganks.",0],["Locke","PTA","Osso revestido","Exhaust","Mercúrio","Craquen / Crit","• Early/Trocas: Use o Arpéu (E) apenas para trás. Não avance se ele te acertar um prego.\n• Cuidados: Guarde o Flash para a Ult dele e use Exaustão nos auto-ataques dos pregos.\n• Macro: Priorize velocidade de movimento e Corta-Cura na sua build.",0],["Lux","PTA / Electro","Tanto faz","Ignite","Mercúrio / Vampíricas","Tanto faz","• Early/Trocas: Nível 1 seu com all-in antes dos minions chegarem. Jogue sempre com a passiva do escudo disponível.\n• Cuidados: Usar Arpéu (E) para frente sem visão ou setup é arriscado quando ela tiver alguns itens. MR cedo é muito útil.\n• Macro: Lane de burst mage; ela fica pescando skills, tem um letal muito alto. Ande na fog com muito cuidado pra não ser explodido.",1],["Malzahar","PTA / Electro","Scaling","Ignite","Mercúrio / Vampíricas","Tanto faz","• Early/Trocas: Lane tranquila. Mate as baratinhas para ganhar ouro e negue a pressão dele.\n• Cuidados: Fique longe da wave para não pegar o E (Aids). Desviando do Q, ele fica vulnerável.\n• Macro: Nível 6 dele atrai ganks. Em TFs, jogue em função do seu revive e não seja o alvo da Ult dele. Sidelane 1v1 é sua.",0],["Malphite","PTA","Scaling","Ignite","Mercúrio / Vampíricas","Terminus / Crit","• Early/Trocas: Níveis 1 a 3 você tem muita vantagem. Sempre devolva Q + AA quando ele usar o pneu (Q) para trocar dano e usar o Escudo.\n• Cuidados: Guarde o Arpéu (E) para o slow do Q dele (seja para fugir ou perseguir). Mantenha dano constante para desativar o escudo dele.\n• Macro: Não entre no alcance do Q dele sem a passiva do escudo pronta. Não tente desviar da Ult com o E, não da tempo. Buildando Terminus e farmando bem, a sidelane é sua.",0],["Mel","PTA","Tanto faz","","Mercúrio / Vampíricas","Crit","• Early/Trocas: Foque em desviar do Q. Use a move speed da passiva para entrar / se manter no range.\n• Cuidados: Dificuldade para All-in solo sem gank aliado. Bota e Resistência Mágica cedo ajudam bastante.\n• Macro: Não se preocupe se ficar um pouco atrás em farm, foque no mapa. Não ulte caso ela tenha o W.",0],["Naafiri","PTA","Tanto faz","Ignite","Tabis","Craquen / Crit","• Early/Trocas: Farme os cachorros. Fique fora da wave, faça ela escolher entre acertar os Minions ou você. Nunca tome todo o combo.\n• Cuidados: Quando ela ultar em você, use o Arpéu na direção oposta (não cancela a skill). Use o bumerangue nos cães para estender alcance.\n• Macro: Jogue as lutas com objetivo de reviver os aliados, ela fica muito frágil sem o W.",0],["Orianna","PTA","Impacto repentino","TP","Mercúrio","Tanto faz","• Early/Trocas: Lane de poke difícil, porém solável se ela errar o Q ou gastar o W na wave.\n• Cuidados: Guarde o Flash para reagir à Ult (R) dela para garantir a vitória na troca.\n• Macro: Skirmish e roaming favoráveis para você. Ela não te dá 100-0 sem itens fechados, permitindo baitar roams.",0],["Pantheon","PTA","Osso revestido","TP","TABI RUSH !!!!","Craquen / Crit","• Early/Trocas: Nível 1 seu mantendo spacing. O alcance do W dele é igual ao do seu auto-ataque.\n• Cuidados: Jogue o bumerangue no pulo dele para gerar escudo rápido. Skirmish dele é muito forte no early.\n• Macro: Avise o nível 6 dele no ping (Ult). Pegue pressão sem se expor e acompanhe os roams ou pegue barricadas.",0],["Qiyana","PTA","Osso revestido","Ignite","Tabis","Crit","• Early/Trocas: Abuse do Nível 1 para criar vantagem de vida ou kill. Não perca o Osso Revestido à toa.\n• Cuidados: Com um item fechado, ela tem All-in mortal no combo. Investir em Couraça de Pano no início vale a pena.\n• Macro: Sua Ult revela a posição dela no W (invisibilidade no mato). Skirmish equilibrado e roaming seu.",0],["Ryze","PTA","Scaling","TP","Mercúrio","Tanto faz","• Early/Trocas: No early game, evite tomar pokes pesados. Ele não tem grande ameaça de solo kill, mas disputa pressão.\n• Cuidados: Fique longe da wave para não tomar dano secundário do E + Q.\n• Macro: Com itens ele ganha em stat check, mas lutas de equipe e roams são favoráveis a você. Evite que ele escale livre.",0],["Swain","PTA","Inspiração","Ignite","Mercúrio / Rapidez","Crit","• Early/Trocas: Nível 1 seu. Desvie do E e force recuo assim que ele ativar a Ult (R).\n• Cuidados: Não deixe ele estacar a passiva gratuitamente durante a fase de rotas.\n• Macro: Skirmish e pressão de rota totalmente seus. Ganks nele costumam resultar em kill fácil.",0],["Sylas","PTA","Osso revestido","Ignite","Mercúrio / Vampíricas","Craquen","• Early/Trocas: Early game favorável desviando de skills. Se ele usar o E para frente, esconda-se na wave e troque AA.\n• Cuidados: Não perca o Osso Revestido sem necessidade. Se ele gastar muitas skills na wave, compre a luta imediatamente.\n• Macro: Quem estiver à frente vence no stat check. Roaming e lutas são seus.",0],["Syndra","PTA / Electro","Impacto repentino","TP","Mercúrio","Tanto faz","• Early/Trocas: Nível 1 totalmente seu. Dê bastante dano inicial, fique fora da wave e entre com Arpéu se ela gastar o E.\n• Cuidados: Em ganks/lutas, posicione-se no lado oposto ao seu caçador para evitar que o E dela estune ambos.\n• Macro: Pressão equilibrada. Com itens fechados, jogue em função do seu revive (passiva do Akshan).",0],["Taliyah","PTA","Impacto repentino","Ignite","Mercúrio","Craquen / Crit","• Early/Trocas: Solável no início se você ficar atrás da wave / fora do alcance. Cuidado com o dano das pedras.\n• Cuidados: Faça mindgame cancelando o Arpéu cedo para baitar o tapete (E) dela e garantir a troca.\n• Macro: Com vantagem a lane fica livre. Roaming totalmente seu; puna se ela usar o tapete incorretamente.",0],["Talon","Electro","Precisão","Ignite","Tabis / Vampíricas","Crit","• Early/Trocas: Nível 1 seu se não tomar AAs. Fique longe da wave e evite tomar o W de graça.\n• Cuidados: Se ele usar W para pokear, responda com Q + AA e recue. Avise PING sempre que ele sumir do mapa.\n• Macro: Sua Ult revela a invisibilidade da Ult dele. Acompanhar os roams dele costuma gerar kills.",0],["Twisted Fate","PTA / Electro","Impacto repentino","Ignite","Mercúrio, 100%","Tanto faz","• Early/Trocas: Muito solável. Desvie do Q, fique longe dos minions e puna quando ele usar carta na wave.\n• Cuidados: Ele arma ganks com facilidade. Pingue sempre que ele empurrar a wave e tiver Ult disponível.\n• Macro: Não permaneça no mapa com HP baixo. Mantenha o ritmo de farm para não tomar outscale.",0],["Veigar","PTA","Scaling","TP","Mercúrio / Vampíricas","Tanto faz","• Early/Trocas: Dificuldade para sair kill se ambos jogarem bem. Não tome Q de graça e evite a gaiola (E).\n• Cuidados: Dentro da gaiola, foque exclusivamente em desviar do meteoro (W).\n• Macro: Skirmish e roaming sempre seus. Em TFs, a Ult dele finaliza alvos; jogue em função de reviver aliados.",0],["Vel'Koz","PTA","Inspiração","Ignite","Mercúrio / Vampíricas","Tanto faz","• Early/Trocas: Rota de poke solável. Se ele gastar o E (desposturar), vá para cima com All-in.\n• Cuidados: Faça mindgames em relação ao E dele para obter trocas favoráveis.\n• Macro: Skirmish e pressão suas. Ele limpa waves rápido, mas ganks nele são kill garantido.",0],["Vex","PTA / Electro","Osso revestido","TP","Mercúrio RUSH !!!","Tanto faz","• Early/Trocas: Nenhuma skill dela para nos minions, então foque em spacing. O W dela tem dano alto, evite dar o E melee.\n• Cuidados: O cooldown do Q dela reduz bastante no decorrer do jogo. Sempre avise o MIA.\n• Macro: Ela busca instakill no late game; jogue as lutas no W, buscando reviver os aliados com a passiva.",0],["Viktor","PTA","Scaling","TP","Mercúrio","Tanto faz","• Early/Trocas: Só troque com a passiva do escudo ativa. Fique fora do alcance do Q dele.\n• Cuidados: Fase de linhas difícil onde é fácil perder trocas; jogue de forma mais segura até o mid/late game.\n• Macro: Skirmish e roaming são seus, embora ele costuma deter a pressão de rota inicial. Ganks nele são eficientes.",0],["Vladimir","PTA","Tanto faz","Ignite","Mercúrio / Rapidez","Craquen / Crit","• Early/Trocas: Early game totalmente seu. Espere ele gastar o Q na wave antes de iniciar trocas.\n• Cuidados: A poça (W) tem tempo de recarga maior que seu Arpéu (E). Force o W dele, recue e use o E em seguida.\n• Macro: Pressão, skirmish e roams favoráveis para você até ele fechar múltiplos itens.",0],["Xerath","PTA","Impacto repentino","Ignite","Mercúrio / Berserker","Craquen / Crit","• Early/Trocas: Rota de poke. Se você se aproximar ou ele errar o stun, a vitória na troca é sua.\n• Cuidados: Comprar Botas cedo é fundamental para desviar das skills. Fique fora da wave de minions.\n• Macro: Skirmish seu. Quando der roaming, fique atento pois ele tentará ultar de longe; baita a jogada e vire nele.",0],["Yasuo","PTA","Osso revestido","Ignite","Tabi","Crit / Move speed","• Early/Trocas: Mantenha distância da wave para evitar que ele deslize (E) até você. Use o Q quando ele entrar no range.\n• Cuidados: Faça o early game valer enquanto ele não tem bota. Atenção em ganks aliados, a Parede de Vento (W) anula você.\n• Macro: Ele tem vantagem na sidelane e não costuma dar roams. Não perca recursos.",0],["Yone","PTA","Tanto faz","Ignite","Tabi","Craquen / Crit","• Early/Trocas: Aplique harass constante. Você tem mais dano no early game; jogue para matar e manter pressão.\n• Cuidados: No late game o dano dele escala muito. Com bom posicionamento, evite tomar o Q3 e a Ult sem setup.\n• Macro: Mantenha o farm elevado para não tomar outscale. Em TF se posicione para não tomar a ult junto do seu time",1],["Zed","PTA / Electro","Impacto repentino","Ignite","Tabi","Crit","• Early/Trocas: Early game favorável. Evite tomar poke das shurikens, faça ele escolher entre você e o farm.\n• Cuidados: Ao usar o Arpéu na direção em que ele estava quando ultou, você ganha distância e evita o combo.\n• Macro: Ele depende de combar e sair do range, use seu E e R para entrar no espaço dele quando ele estiver sem cooldowns.",1],["Zoe","PTA","Inspiração","Ignite","Mercúrio","Tanto faz","• Early/Trocas: Rota volátil. Respeite a Bolha (E): se tomar, perderá a troca. Fique atrás da wave sem tomar dano em área do Q.\n• Cuidados: Cuidado com o Q vindo da fog de guerra. Ganks nela costumam ser muito eficientes.\n• Macro: Pressão de rota, roaming e skirmish totalmente seus.",0]],"pecas":{"3008":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3008.png","nome":"Grevas Vorazes","nome_en":"Gluttonous Greaves"},"3009":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3009.png","nome":"Botas da Rapidez","nome_en":"Boots of Swiftness"},"3031":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3031.png","nome":"Gume do Infinito","nome_en":"Infinity Edge"},"3033":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3033.png","nome":"Lembrete Mortal","nome_en":"Mortal Reminder"},"3047":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3047.png","nome":"Botas Galvanizadas de Aço","nome_en":"Plated Steelcaps"},"3095":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3095.png","nome":"Chuva de Canivete","nome_en":"Stormrazor"},"3111":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3111.png","nome":"Passos de Mercúrio","nome_en":"Mercury's Treads"},"3173":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3173.png","nome":"Esmagadores Acorrentados","nome_en":"Chainlaced Crushers"},"3174":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3174.png","nome":"Mobilização Blindada","nome_en":"Armored Advance"},"3179":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3179.png","nome":"Glaive Sombria","nome_en":"Umbral Glaive"},"3302":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img/item/3302.png","nome":"Terminus","nome_en":"Terminus"},"6672":{"icone":"https://ddragon.leagueoflegends.com/cdn/16.20.1/img
