# Uma vez por dia baixa as planilhas dos guias (Akshan do Peteruso, Mordekaiser do Meowdekaiser, Illaoi do Hachiragi), atualiza a cópia embutida no site,
# gera o index.html e, se algo mudou, faz o commit. A Vercel publica sozinha a cada push.
# Para rodar na hora: aba Actions do GitHub > "Atualizar planilhas dos guias" > Run workflow.
# Para desligar: apague este arquivo (ou desative o workflow na aba Actions).
name: Atualizar planilhas dos guias

on:
  schedule:
    - cron: "0 9 * * *"  # 6h da manhã no horário de Brasília
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-planilha
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pillow (capturas de runas da Illaoi)
        run: python3 -m pip install --quiet pillow

      - name: Baixa a planilha e gera o site
        run: |
          python3 scripts/versao_dd.py  # patch novo do LoL: ícones e cooldowns acompanham
          python3 scripts/atualizar_akshan.py
          python3 scripts/atualizar_mordekaiser.py
          python3 scripts/atualizar_illaoi.py
          python3 scripts/atualizar_kayle.py
          python3 scripts/traducao_pt.py  # nomes em PT e títulos em EN; frase nova fica no original até ser traduzida
          python3 scripts/importar_lol.py  # runas e itens de cada matchup para o app importar no cliente
          python3 scripts/build.py

      - name: Commit, se mudou algo
        run: |
          if git diff --quiet; then
            echo "Planilha sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/versao_dd.txt src/guias/akshan src/guias/mordekaiser src/guias/illaoi src/guias/kayle imagens index.html guias-app.json
          git commit -m "Atualiza a cópia das planilhas dos guias"
          git push
