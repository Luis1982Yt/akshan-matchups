/* ---------- Dados de cada guia ---------- */
// Runa, secundária, bota e build entram na busca com o nome de cada peça em PT e EN ("kraken", "mata-cráquens").
const nomesDasPecas = (g, nome) => ["runa", "sec", "bota", "build"].flatMap(campo => {
  const p = g.icones_planilha && g.icones_planilha[nome] && g.icones_planilha[nome][campo];
  return p ? p.pecas.map(k => g.pecas[k]).filter(Boolean).flatMap(x => [x.nome, x.nome_en || ""]) : [];
});
function prepara(g) {
  if (g.formato === "simples") {
    g.lista = g.matchups.map(([nome, runa, sec, spell, bota, build, notas, guia]) => ({
      nome, runa, sec, bota, build, guia: !!guia,
      // Feitiço extra combinado com o dono do site (meta.json > feitico_extra), somado ao da planilha.
      spell: g.feitico_extra && g.feitico_extra[nome] && !new RegExp(g.feitico_extra[nome], "i").test(spell) ? `${spell} / ${g.feitico_extra[nome]}` : spell,
      id: g.champs[nome].id, titulo: g.champs[nome].title, titulo_en: g.champs[nome].title_en, mira: g.champs[nome].mira, slug: slug(nome),
      dif: (g.icones_planilha && g.icones_planilha[nome] && g.icones_planilha[nome].dificuldade) || null,
      linhas: notas.split("\n").map(l => l.trim().replace(/\s{2,}/g, " ")).filter(Boolean),
      hay: (nome + " " + notas + " " + notas.split("\n").map(l => (g.traducao && g.traducao.linhas[l.trim().replace(/\s{2,}/g, " ")]) || "").join(" ")
        + " " + [runa, sec, spell, bota, build].join(" ") + " " + nomesDasPecas(g, nome).join(" ")).toLowerCase(),
    }));
    g.lista.forEach(c => { c.hayN = normal(c.hay); });
  } else {
    g.lista = g.matchups.map(m => ({ ...m, slug: slug(m.nome), dif: DIF_NOTA[m.dificuldade.overall] || null, hay: textoDe(m, g).toLowerCase() }));
    g.lista.forEach(c => { c.hayN = normal(c.hay); });
  }
}
function textoDe(m, g) {
  const partes = [m.nome, m.planilha, ...m.tldr];
  m.itens.forEach(gr => { partes.push(gr.rotulo); gr.linhas.forEach(l => partes.push(l.texto || "", l.motivo || "")); });
  m.secoes.forEach(s => { partes.push(s.titulo); s.blocos.forEach(b => partes.push(...(b.itens || (b.linhas ? b.linhas.flat() : [b.texto])))); });
  // Runas e itens entram pelo nome (busca "conqueror", "bramble"...).
  const pecas = [...m.runas.flat().flatMap(l => l.pecas || []), ...m.itens.flatMap(gr => gr.linhas.flatMap(l => (l.passos || []).flat()))];
  pecas.forEach(p => partes.push(p.nome));
  // A busca acha pela frase original e pela tradução em português (inclusive o nome em PT de cada item e runa).
  const pt = g.traducao_pt ? partes.map(p => g.traducao_pt.textos[p] || "") : [];
  if (g.traducao_pt) pecas.forEach(p => pt.push(g.traducao_pt.nomes[p.icone] || ""));
  return [...partes, ...pt].join(" ");
}

// Dificuldade (cor da célula do campeão na planilha), na ordem do Peteruso: da pior para a mais tranquila.
const DIFS = ["muito_dificil", "dificil", "medio", "facil", "muito_facil"];
// Guias com nota de 1 a 5 (formato completo) usam as mesmas cores: 1 = muito fácil … 5 = muito difícil.
const DIF_NOTA = [null, "muito_facil", "facil", "medio", "dificil", "muito_dificil"];
const rotuloDif = d => t("dif" + d.charAt(0).toUpperCase() + d.slice(1));
// Filtros: dentro do mesmo grupo vale qualquer um; entre grupos, todos.
const FILTROS = {
  simples: g => [
    ...DIFS.map(d => ({ id: "dif_" + d, grupo: "dif", cor: d, teste: c => c.dif === d })),
    ...["Ignite", "TP", "Exhaust"].map(s => ({ id: s, grupo: "feitico", rotulo: s, icone: g.icones[s], teste: c => c.spell.split(/\s*\/\s*/).includes(s) })),
    { id: "Electro", grupo: "runa", rotulo: "Electro", icone: g.icones.Electro, teste: c => /electro/i.test(c.runa) },
  ],
  completo: () => DIFS.map(d => ({ id: "dif_" + d, grupo: "dif", cor: d, teste: c => c.dif === d })),
};

/* ---------- Planilha ao vivo: o guia lê a planilha do autor quando abre ---------- */
function lerCsv(t) {
  const linhas = []; let linha = [], campo = "", aspas = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (aspas) {
      if (c === '"') { if (t[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += c;
    } else if (c === '"') aspas = true;
    else if (c === ",") { linha.push(campo); campo = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && t[i + 1] === "\n") i++;
      linha.push(campo); linhas.push(linha); linha = []; campo = "";
    } else campo += c;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}
function linhasDaPlanilha(t) {
  const linhas = lerCsv(t), cab = linhas.shift() || [];
  if (!/campe/i.test(cab[0] || "")) throw new Error("cabeçalho inesperado");
  return linhas.filter(r => (r[0] || "").trim()).map(r => {
    r = r.concat(Array(8).fill("")).slice(0, 8);
    return [r[0].trim(), ...r.slice(1, 7).map(x => x.trim()), /^s/i.test(r[7].trim()) ? 1 : 0];
  });
}
// Campeão novo na planilha: pega id e título no Data Dragon.
const chaveNome = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, "");
let ddCampeoes;
async function completaCampeoes(g, nomes) {
  if (!ddCampeoes) ddCampeoes = fetch(`${DD}${VER}/data/pt_BR/champion.json`).then(r => r.json()).then(j => j.data);
  const por = {};
  Object.values(await ddCampeoes).forEach(c => { por[chaveNome(c.name)] = c; por[chaveNome(c.id)] = c; });
  nomes.forEach(n => { const c = por[chaveNome(n)]; if (c) g.champs[n] = { id: c.id, title: c.title }; });
  // Título em inglês para o modo EN.
  try { const en = (await (await fetch(`${DD}${VER}/data/en_US/champion.json`)).json()).data; nomes.forEach(n => { const c = g.champs[n]; if (c && en[c.id]) c.title_en = en[c.id].title; }); } catch (e) {}
}
function aplicaMatchups(g, rows) {
  g.matchups = rows.filter(r => g.champs[r[0]]);
  g.lista = null;
  if (guia !== g) return;
  const slugAtual = current && current.slug;
  prepara(g);
  current = g.lista.find(c => c.slug === slugAtual) || g.lista[0];
  renderLista();
  renderDetalhe(false);
  marcaHash();
}
function usaCopiaSalva(g) {
  if (!g.planilha) return;
  try {
    const salvo = JSON.parse(localStorage.getItem("planilha:" + g.id) || "null");
    if (salvo && salvo.rows && salvo.rows.length) {
      // Só completa campeões novos: os do build já vêm com título em inglês.
      Object.entries(salvo.champs || {}).forEach(([n, c]) => { if (!g.champs[n]) g.champs[n] = c; });
      g.matchups = salvo.rows.filter(r => g.champs[r[0]]);
    }
  } catch (e) {}
}
function mostraPlanilha(g) {
  const el = $("estadoPlanilha");
  if (!el || guia !== g) return;
  el.textContent = !g.planilha ? "" :
    t({ ok: "plOk", arquivo: "plArquivo", falhou: "plFalhou" }[g.sincronia] || "plBusca");
}
async function sincroniza(g) {
  if (!g.planilha || g.sincronia) return;
  // O Google não libera a planilha para página aberta como arquivo (file://).
  if (location.protocol === "file:") { g.sincronia = "arquivo"; mostraPlanilha(g); return; }
  g.sincronia = "buscando";
  mostraPlanilha(g);
  try {
    const { id, gid } = g.planilha;
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&gid=${gid}&_=${Date.now()}`, { cache: "no-store" });
    if (!r.ok) throw new Error("planilha respondeu " + r.status);
    const rows = linhasDaPlanilha(await r.text());
    const faltam = rows.filter(x => !g.champs[x[0]]).map(x => x[0]);
    if (faltam.length) await completaCampeoes(g, faltam);
    aplicaMatchups(g, rows);
    g.sincronia = "ok";
    try { localStorage.setItem("planilha:" + g.id, JSON.stringify({ quando: Date.now(), rows: g.matchups, champs: g.champs })); } catch (e) {}
  } catch (e) {
    g.sincronia = "falhou";
  }
  mostraPlanilha(g);
}

/* ---------- Estado ---------- */
const lista = $("lista"), q = $("q");
let guia, filtros = [], current, shown = [], paginaAtual = "";
const ativos = new Set();

function escolheGuia(id, inimigo) {
  guia = GUIAS.find(g => g.id === id) || GUIAS[0];
  // "#mordekaiser/@itens" abre uma página do guia em vez de uma matchup.
  paginaAtual = inimigo && inimigo[0] === "@" && (guia.paginas || []).some(p => p.id === inimigo.slice(1)) ? inimigo.slice(1) : "";
  if (!guia.lista) { if (!guia.sincronia) usaCopiaSalva(guia); prepara(guia); }
  raiz.dataset.guia = guia.id;
  try { localStorage.setItem("guia", guia.id); } catch (e) {}
  filtros = FILTROS[guia.formato](guia);
  ativos.clear(); q.value = "";
  current = guia.lista.find(c => c.slug === inimigo) || guia.lista[0];
  renderGuia();
  renderLista();
  renderDetalhe(false);
  renderPaginas();
  marcaHash();
  sincroniza(guia);
}

// Apelidos que o jogador digita na seleção de campeões.
const APELIDOS = { tf: "twistedfate", lb: "leblanc", asol: "aurelionsol", sol: "aurelionsol", mf: "missfortune", tk: "tahmkench", tahm: "tahmkench",
  kog: "kogmaw", vel: "velkoz", j4: "jarvaniv", xin: "xinzhao", ww: "warwick", gp: "gangplank", ez: "ezreal", cass: "cassiopeia", kass: "kassadin",
  kat: "katarina", kata: "katarina", mundo: "drmundo", yi: "masteryi", voli: "volibear", morde: "mordekaiser", heimer: "heimerdinger",
  fiddle: "fiddlesticks", nida: "nidalee", noc: "nocturne", ori: "orianna", sera: "seraphine", panth: "pantheon", malz: "malzahar",
  liss: "lissandra", vlad: "vladimir", trynd: "tryndamere", naut: "nautilus", bel: "belveth", cho: "chogath", rek: "reksai", kha: "khazix",
  aurelion: "aurelionsol", twisted: "twistedfate", leb: "leblanc", ali: "alistar", blitz: "blitzcrank", ilaoi: "illaoi", kayn: "kayn" };
const normal = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
// Relevância: 4 = nome começa (ou apelido), 3 = nome contém, 1 = só nas notas, 0 = não bate.
function relevancia(c, t) {
  if (!t) return 1;
  const k = chaveNome(c.nome), tk = t.replace(/[^a-z0-9]/g, "");
  if (tk && (k.startsWith(tk) || (APELIDOS[tk] && k.startsWith(APELIDOS[tk])))) return 4;
  if (tk && (k.includes(tk) || (c.planilha && chaveNome(c.planilha).includes(tk)))) return 3;
  return c.hayN.includes(t) ? 1 : 0;
}
function passaFiltros(c) {
  const grupos = {};
  filtros.filter(f => ativos.has(f.id)).forEach(f => (grupos[f.grupo] = grupos[f.grupo] || []).push(f));
  return Object.values(grupos).every(fs => fs.some(f => f.teste(c)));
}

function renderLista() {

      <img src="${sq(c.id)}" alt="" width="56" height="56"${i < 25 ? "" : ' loading="lazy"'} decoding="async">${marca}<span class="sr">${esc(c.nome)}${extra}${soNota.has(c) ? t("srNotas") : ""}</span></button>`;

/* ---------- Enquadramento das artes ----------
   Cada campeão tem em meta.json o ponto do splash onde fica o centro da mira (escolhido à mão
   para a mira pegar rosto + corpo). O recorte (object-position) traz esse ponto para o meio do
   card, e a mira vai para onde ele ficou. */
const MIRA_PADRAO = [50, 38];
function enquadra(card, ponto, alvo) {
  const img = card.querySelector("img");
  if (!img) return;
  const W = card.clientWidth, H = card.clientHeight;
  if (!W || !H) return;
  const lim = (v, a, b) => Math.min(Math.max(v, a), b);
  const [fx, fy] = (ponto || MIRA_PADRAO).map(n => n / 100);
  const s = Math.max(W / 1280, H / 720), iw = 1280 * s, ih = 720 * s;
  const ox = iw - W, oy = ih - H;
  const dx = lim(fx * iw - W / 2, 0, ox), dy = lim(fy * ih - H * .45, 0, oy);
  img.style.objectPosition = `${ox > 0 ? dx / ox * 100 : 50}% ${oy > 0 ? dy / oy * 100 : 50}%`;
  if (!alvo) return;
  // Meia diagonal do losango da mira (o losango vai de 5 a 95 no viewBox de 100).
  const k = parseFloat(getComputedStyle(alvo).height) * .45;
  const x = lim(fx * iw - dx, k + 8, W - k - 8);
  const y = lim(fy * ih - dy, k, H - k);
  alvo.style.left = x + "px";
  alvo.style.top = y + "px";
}
function enquadraTudo() {
  if (!guia || !current) return;
  enquadra($("artVoce").parentElement, miraDe(guia.campeao.id));
  $("alvo").style.left = $("alvo").style.top = "";
  enquadra($("artEle").parentElement, current.mira || miraDe(current.id), $("alvo"));
}
const miraDe = id => { const c = guia.champs && Object.values(guia.champs).find(x => x.id === id); return c && c.mira || (id === guia.campeao.id ? guia.mira : null); };
new ResizeObserver(() => enquadraTudo()).observe($("artEle").parentElement);

/* ---------- Formato simples (planilha do Akshan) ---------- */
const ICON = [[/^ignite$/i, "Ignite"], [/^tp$/i, "TP"], [/^exhaust$/i, "Exhaust"], [/^cleanse$/i, "Cleanse"]];
function opt(raw) {
  const rush = /rush/i.test(raw);
  const word = raw.replace(/rush/i, "").replace(/!+/g, "").trim();
  const hit = ICON.find(([re]) => re.test(word));
  let label = rush ? word.charAt(0) + word.slice(1).toLowerCase() : word;
  if (L === "en" && guia.traducao) label = guia.traducao.celulas[label] || label;
  const icon = hit ? `<img src="${guia.icones[hit[1]]}" alt="" width="36" height="36">` : '<span class="soquete" aria-hidden="true"></span>';
  return `<div class="opt${hit && hit[2] ? " " + hit[2] : ""}"${hit && hit[3] ? ` title="${esc((L === "en" && hit[4]) || hit[3])}"` : ""}>${icon}<span>${esc(label)}</span>${rush ? '<span class="rush">rush</span>' : ""}</div>`;
}
// Ícones da célula como estão na planilha (icones_planilha.json). Se o texto mudou depois da
// última leitura das imagens, ou a célula não tem imagem, usa as peças de cada palavra.
function pecasDe(c, campo, val) {
  const p = guia.icones_planilha && guia.icones_planilha[c.nome] && guia.icones_planilha[c.nome][campo];
  if (p && p.texto === val && p.pecas.length) return p.pecas;
  // Célula sem imagem na planilha: vale a escolha feita à mão (meta.json > pecas_manuais), se o texto bate.
  const m = guia.pecas_manuais && guia.pecas_manuais[c.nome] && guia.pecas_manuais[c.nome][campo];
  if (m && m.texto === val) return m.pecas;
  const chaves = val.replace(/rush/i, "").replace(/!+/g, "").split(/\s*[\/,]\s*/)
    .flatMap(w => (guia.texto_pecas || {})[w.trim().toLowerCase()] || []);
  return [...new Set(chaves)];
}
function celula(c, campo, val) {
  const rush = /rush/i.test(val);
  let texto = /^tanto faz$/i.test(val) ? `<span class="livre">${t("tantoFaz")}</span>` : "";
  if (!texto) {
    const limpo = val.replace(/rush/i, "").replace(/!+/g, "").trim();
    const partes = limpo.split(/\s*\/\s*/).map(w => (rush ? w.charAt(0) + w.slice(1).toLowerCase() : w))
      .map(w => (L === "en" && guia.traducao && guia.traducao.celulas[w]) || w);
    texto = `<span>${esc(partes.join(" / "))}</span>${rush ? '<span class="rush">rush</span>' : ""}`;
  }
  const icones = pecasDe(c, campo, val).map(k => guia.pecas[k]).filter(Boolean).map(p => {
    const nome = esc((L === "en" && p.nome_en) || p.nome);
    return `<img src="${p.icone}" alt="${nome}" title="${nome}" width="36" height="36"${p.runa ? ' class="runa"' : ""}>`;
  }).join("");
  return `<div class="celula">${icones ? `<span class="icones">${icones}</span>` : ""}${texto}</div>`;
}
function slot(label, val, c, campo) {
  let body;
  if (!val) body = `<span class="livre">${t("semAnot")}</span>`;
  else if (campo) body = celula(c, campo, val);
  else if (/^tanto faz$/i.test(val)) body = `<span class="livre">${t("tantoFaz")}</span>`;
  else body = val.split(/\s*\/\s*/).map(opt).join("");
  return `<div class="slot"><dt>${label}</dt><dd>${body}</dd></div>`;
}
const KW = /(?<![\wÀ-ÿ])(lvl ?\d+|press|skirmish|roam(?:ing)?|gank|stat check|outscale|free kill|free lane|100 0|side ?lane|late ?game|early)(?![\wÀ-ÿ])/gi;
const marca = line => esc(line).replace(KW, m => `<span class="kw">${m}</span>`);
// No modo EN usa a tradução da linha; se o autor editou e ainda não tem tradução, mostra o original.
function linhaNaLingua(l) {
  if (L !== "en" || !guia.traducao) return marca(l);
  const en = guia.traducao.linhas[l];
  return en ? marca(en) : `<span lang="pt-BR">${marca(l)}</span>`;
}

/* ---------- Formato completo (runas, itens, dificuldade e seções) ---------- */
const TITULOS = { "Enemy Cooldowns": "Cooldowns do inimigo", "Early Game": "Early game", "How to trade": "Como trocar", "What to watch out for": "Cuidado com", "Tips": "Dicas", "Mini Rant": "Desabafo" };
const KW_EN = /\b(level \d+|lvl \d+|nível \d+)\b/gi;
const marcaEn = t => esc(t).replace(KW_EN, m => `<span class="kw">${m}</span>`);
// Guias escritos em inglês têm uma camada em português (src/guias/<guia>/traducao_pt.json, de scripts/traducao_pt.py):
// no modo PT vale a frase traduzida; frase nova da planilha que ainda não tem tradução aparece como está.
const tr = x => (L !== "en" && x && guia.traducao_pt && guia.traducao_pt.textos[x]) || x;
// Só o texto que continua em inglês no modo PT (guia sem a camada) leva lang="en".
const langOrig = () => (L !== "en" && !guia.traducao_pt ? ' lang="en"' : "");
// Item ou runa com ícone: no modo PT, o nome do cliente em português (o "rush" da planilha continua).
const nomePeca = p => {
  const pt = L !== "en" && p.icone && guia.traducao_pt && guia.traducao_pt.nomes[p.icone];
  return pt ? pt + (/\brush\b/i.test(p.nome) ? " (rush)" : "") : tr(p.nome);
};
const notaTexto = t => { if (guia.escala === 10) return t; const m = t.match(/^(\d)(?:\s*\/\s*(\d))?\s*(.*)$/); return m ? `${m[1]}${m[2] ? "–" + m[2] : ""}/5${m[3] ? " " + m[3] : ""}` : t; };
const pips = n => `<span class="pips" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<i${i <= n ? ' class="on"' : ""}></i>`).join("")}</span>`;
const peca = (p, runa) => `<span class="peca${runa ? " runa" : ""}">${p.icone ? `<img src="${p.icone}" alt="" width="32" height="32">` : '<span class="soquete" aria-hidden="true"></span>'}<span>${esc(nomePeca(p))}</span></span>`;

// Abas pequenas (condições da build, opções de runas, seções do "Como jogar"): uma à mostra por vez.
// O site lembra a última escolhida de cada grupo ao trocar de matchup (por rótulo, quando ele existir na outra).
const abaLembrada = {};
function abas(grupo, rotulos, paineis) {
  if (paineis.length < 2) return paineis.join("");
  const i0 = Math.max(0, rotulos.indexOf(abaLembrada[grupo]));
  return `<div class="com-abas" data-grupo="${grupo}"><div class="abas-mini" role="tablist">${rotulos.map((r, i) =>
    `<button type="button" role="tab" data-aba="${i}" aria-selected="${i === i0}" tabindex="${i === i0 ? 0 : -1}">${esc(r)}</button>`).join("")}</div>
    ${paineis.map((p, i) => `<div class="aba-painel" role="tabpanel" data-painel="${i}"${i === i0 ? "" : " hidden"}>${p}</div>`).join("")}</div>`;
}
document.addEventListener("click", e => {
  const b = e.target.closest(".com-abas > .abas-mini [data-aba]");
  if (b) {
    const caixa = b.closest(".com-abas");
    caixa.querySelectorAll(":scope > .abas-mini [data-aba]").forEach(x => { x.setAttribute("aria-selected", x === b); x.tabIndex = x === b ? 0 : -1; });
    caixa.querySelectorAll(":scope > .aba-painel").forEach(pn => { pn.hidden = pn.dataset.painel !== b.dataset.aba; });
    abaLembrada[caixa.dataset.grupo] = b.textContent;
    toca("chip");
    return;
  }
  // Toque num item com motivo mostra/esconde o motivo (no mouse ele já aparece ao passar por cima).
  const li = e.target.closest(".build li.tem-motivo");
  if (li) li.classList.toggle("aberto");
});
// Teclado nas abas: ← → trocam de aba (Home/End vão para a primeira/última), como nas abas do sistema.
document.addEventListener("keydown", e => {
  const b = e.target.closest && e.target.closest(".abas-mini [data-aba]");
  if (!b || e.altKey || e.ctrlKey || e.metaKey) return;
  const todas = [...b.parentElement.querySelectorAll("[data-aba]")], i = todas.indexOf(b);
  const j = { ArrowRight: (i + 1) % todas.length, ArrowLeft: (i - 1 + todas.length) % todas.length, Home: 0, End: todas.length - 1 }[e.key];
  if (j == null) return;
  e.preventDefault();
  todas[j].focus();
  todas[j].click();
});

function linhaItem(l, motivoExtra) {
  if (l.tipo === "sep") return '<li class="sep" aria-hidden="true"></li>';
  if (l.tipo === "rotulo") return `<li class="sub">${esc(tr(l.texto))}</li>`;
  if (l.tipo === "nota") return `<li class="nota">${esc(tr(l.texto))}</li>`;
  const passos = l.passos.map(alts => alts.map(p => peca(p)).join(`<span class="ou">${t("ou")}</span>`)).join(SETA_PASSO);
  const motivo = [l.motivo, motivoExtra].filter(Boolean).map(tr).join(" ");
  // O motivo fica guardado: aparece passando o mouse ou tocando no item (o "i" avisa que tem).
  return motivo ? `<li class="tem-motivo" tabindex="0" title="${esc(motivo)}"><div class="pecas">${passos}<span class="porque" aria-hidden="true">i</span></div><p class="motivo">${esc(motivo)}</p></li>`
    : `<li><div class="pecas">${passos}</div></li>`;
}
// Uma nota entre parênteses logo depois de um item sem motivo vira o motivo dele.
function linhasItens(linhas) {
  const out = [];
  linhas.forEach((l, i) => {
    const prox = linhas[i + 1];
    if (l.tipo === "nota" && i > 0 && linhas[i - 1].tipo === "item" && !linhas[i - 1].motivo && /^\(/.test(l.texto)) return;
    const extra = l.tipo === "item" && !l.motivo && prox && prox.tipo === "nota" && /^\(/.test(prox.texto) ? prox.texto : "";
    out.push(linhaItem(l, extra));
  });
  return out.join("");
}

const rotuloRuna = r => ({ Principal: t("principal"), "Secundária": t("secundaria"), Fragmentos: t("fragmentos") })[r] || r;
function setupCompleto(c) {
  // Mais de uma página de runas: "Opção 1 / Opção 2" em vez de uma embaixo da outra.
  const runas = abas("runas", c.runas.map((_, i) => t("opcao") + " " + (i + 1)), c.runas.map(bloco => bloco.map(l => l.rotulo === "Fragmentos"
    ? `<div class="linha-runa"><span class="rot">${esc(rotuloRuna(l.rotulo))}</span><p class="frag">${l.pecas.map(p => `<span class="frag-peca">${p.icone ? `<img src="${p.icone}" alt="" width="26" height="26">` : ""}${esc(nomePeca(p))}</span>`).join("")}</p></div>`
    : `<div class="linha-runa"><span class="rot">${esc(rotuloRuna(l.rotulo))}</span><div class="pecas">${l.pecas.map(p => peca(p, true)).join("")}</div></div>`).join("")));
  // Builds condicionais ("If Aatrox rushes Hex Drinker" / "If he doesn't"): uma aba por condição.
  const conds = c.itens.map((g, i) => (g.rotulo && g.rotulo !== "Items vs." ? tr(g.rotulo).replace(/:\s*$/, "") : i ? t("outraBuild") : "Build"));
  const listas = c.itens.map(g => `<ol${langOrig()}>${linhasItens(g.linhas)}</ol>`);
  const itens = c.itens.length > 1 ? `<div${langOrig()}>${abas("itens", conds, listas)}</div>`
    : listas.map((ol, i) => `<div class="grupo">${conds[i] !== "Build" ? `<p class="cond"${langOrig()}>${esc(conds[i])}</p>` : ""}${ol}</div>`).join("");
  // A captura da planilha só aparece quando a página não tem os fragmentos com ícone.
  const imagensRunas = c.runas.some(op => op.some(l => l.rotulo === "Fragmentos")) ? "" : (c.imagens_runas || []).map(i => `<img class="runa-original" src="${esc(i.src)}" alt="${esc(tr(i.alt || t("runasPlanilha")))}" width="${i.largura}" height="${i.altura}" loading="lazy">`).join("");
  const feiticos = c.feiticos_texto ? `<div class="feiticos-guia"><h3>${t("feitico")}</h3><div class="pecas">${(c.feiticos || []).map(p => peca(p)).join("")}</div><p>${esc(tr(c.feiticos_texto))}</p></div>` : "";
  const dif = [["early", "Early"], ["mid", "Mid"], ["late", "Late"], ["overall", "Geral"]]
    .filter(([k]) => k === "overall" || c.dificuldade[k] != null)
    .map(([k, r]) => `<div><dt>${k === "overall" ? t("geral") : r}</dt><dd aria-label="${c.dificuldade[k] ? t("srDif", k === "overall" ? c.dificuldade.valor ?? c.dificuldade[k] : c.dificuldade[k], guia.escala || 5).replace(/^, /, "") : t("semAnot")}">${pips(c.dificuldade[k])}<b>${k === "overall" && c.dificuldade.texto ? esc(notaTexto(tr(c.dificuldade.texto))) : (c.dificuldade[k] ?? "–") + "/5"}</b></dd></div>`).join("");
  return `<div class="setup-completo">
    <section class="bloco"><h3>${t("runas")}</h3>${runas || `<p class="livre">${t("semAnot")}</p>`}${imagensRunas}${feiticos}</section>
    <section class="bloco build"><h3>${t("itens")}</h3>${itens || `<p class="livre">${t("semAnot")}</p>`}</section>
    <section class="bloco dif"><h3>${t("dificuldade")}</h3><dl>${dif}</dl></section>
  </div>`;
}

function blocoTexto(b) {
  if (b.tipo === "tabela") return `<table class="cds"><tbody>${b.linhas.map(([k, v]) => `<tr><th scope="row">${esc(tr(k))}</th><td>${esc(tr(v))}</td></tr>`).join("")}</tbody></table>`;
  if (b.tipo === "lista") return `<ul>${b.itens.map(x => `<li>${marcaEn(tr(x))}</li>`).join("")}</ul>`;
  return `<p>${marcaEn(tr(b.texto))}</p>`;
}
// "Como jogar": resumo e cada seção numa aba, em vez de um texto enorme.
function notasCompleto(c) {
  const titulo = s => (L === "en" ? s.titulo : TITULOS[s.titulo] || tr(s.titulo)) || t("comoJogar");
  const secoes = c.secoes.filter(s => s.titulo !== "Enemy Cooldowns");
  const rotulos = [...(c.tldr.length ? [t("resumo")] : []), ...secoes.map(titulo)];
  const paineis = [
    ...(c.tldr.length ? [`<section class="resumo"><ul>${c.tldr.map(x => `<li>${esc(tr(x))}</li>`).join("")}</ul></section>`] : []),
    ...secoes.map(s => `<section class="secao">${s.blocos.map(blocoTexto).join("")}</section>`),
  ];
  return `<div class="secoes"${langOrig()}>${abas("jogar", rotulos, paineis)}</div>`;
}

// A planilha quebra a linha no meio da frase para caber na célula: junta essas quebras e mantém
// os parágrafos (linha em branco) e as listas ("- ", "1.", "->" no começo).
function fluxo(txt) {
  return (txt || "").split("\n").map(l => l.trim()).reduce((acc, l, i, ls) => {
    if (!i) return l;
    const ant = ls[i - 1];
    const quebra = !l || !ant || /^([-•*]|\d+[.)]|\[|->)/.test(l);
    return acc + (quebra ? "\n" : " ") + l;
  }, "");
}
// Texto da célula com os links dela no lugar (o texto do link aparece no meio da frase).
function comLinks(c) {
  if (!c) return "";
  let h = esc(fluxo(tr(c.texto)));
  (c.links || []).forEach(l => {
    const texto = tr(l.texto || "");
    const a = `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(texto || l.url)}</a>`;
    const alvo = esc(texto);
    h = alvo && h.includes(alvo) ? h.replace(alvo, a) : h + (h ? " " : "") + a;
  });
  return h;
}

function renderPaginas() {
  const ps = guia.paginas || [];
  $("paginas").hidden = !ps.length;
  raiz.classList.toggle("em-pagina", !!paginaAtual);
  document.title = paginaAtual ? `${guia.campeao.nome} · ${t(NOME_PAGINA[paginaAtual] || paginaAtual)}` : `${guia.campeao.nome} vs ${current.nome}`;
  $("pagina").hidden = !paginaAtual;
  if (!ps.length) { raiz.style.setProperty("--abas", "0px"); return; }
  const abas = [{ id: "" }, ...ps];
  $("paginasLista").innerHTML = abas.map(p => `<li><button type="button" data-pagina="${p.id}" aria-current="${p.id === paginaAtual ? "page" : "false"}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true">${ICONE_PAGINA[p.id || "matchups"] || ICONE_PAGINA.sobre}</svg>${esc(t(p.id ? NOME_PAGINA[p.id] || p.id : "pgMatchups"))}</button></li>`).join("");
  raiz.style.setProperty("--abas", $("paginas").offsetHeight + "px");  // a coluna 3D desconta essa altura
  const ativa = $("paginasLista").querySelector('[aria-current="page"]');
  if (ativa) { const ul = $("paginasLista"); ul.scrollLeft = ativa.offsetLeft - (ul.clientWidth - ativa.offsetWidth) / 2; }
  if (!paginaAtual) return;
  const pg = ps.find(p => p.id === paginaAtual);
  $("pagina").innerHTML = `<h2>${esc(t(NOME_PAGINA[pg.id] || pg.id))}</h2><p class="lead">${esc(guia.autor)} · ${esc(t(L !== "en" && guia.traducao_pt ? "pgTraduzido" : "pgOriginal"))}</p>` + pg.blocos.map(b => (BLOCOS[b.tipo] || (() => ""))(b)).join("")
    + `<footer class="rodape">${$("rodape").innerHTML}</footer>`;
}
function mostraPagina(id) {
  paginaAtual = (guia.paginas || []).some(p => p.id === id) ? id : "";
  renderPaginas();
  marcaHash();
  scrollTo({ top: 0 });
}
$("paginasLista").addEventListener("click", e => {
  const b = e.target.closest("[data-pagina]");
  if (!b || b.dataset.pagina === paginaAtual) return;
  toca("chip");
  mostraPagina(b.dataset.pagina);
});
$("pagina").addEventListener("click", e => {
  const est = e.target.closest(".estagios [data-est]");
  if (est) {
    const card = est.closest(".item-card");
    card.querySelectorAll(".estagios button").forEach(b => b.setAttribute("aria-pressed", b === est));
    card.querySelectorAll(".est-texto").forEach(d => { d.hidden = d.dataset.est !== est.dataset.est; });
    toca("chip");
    return;
  }
  const mais = e.target.closest("[data-mais]");
  if (mais) {
    const p = mais.previousElementSibling, abrir = p.classList.contains("curto");
    p.classList.toggle("curto", !abrir);
    mais.textContent = t(abrir ? "lerMenos" : "lerMais");
  }
});

/* ---------- Cooldowns do inimigo, num painel do card dele ----------
   Vem da seção "Enemy Cooldowns" da planilha quando o autor escreveu; nos outros guias, dos valores base do jogo (Data Dragon). */
const habilidades = {};  // ícones e nomes das habilidades, por campeão e língua (Data Dragon)
function carregaHabilidades(id) {
  const k = id + L;
  if (!habilidades[k]) habilidades[k] = fetch(`${DD}${VER}/data/${L === "en" ? "en_US" : "pt_BR"}/champion/${id}.json`).then(r => r.json()).then(j => {
    const c = j.data[id];
    const h = { P: { nome: c.passive.name, icone: `${DD}${VER}/img/passive/${c.passive.image.full}` } };
    "QWER".split("").forEach((l, i) => { const s = c.spells[i]; if (s) h[l] = { nome: s.name, cd: s.cooldownBurn, icone: `${DD}${VER}/img/spell/${s.image.full}` }; });
    return h;
  }).catch(() => ({}));
  return habilidades[k];
}
const secaoCds = c => (c.secoes || []).find(s => s.titulo === "Enemy Cooldowns");
// "Q (Poke tool)" → letra Q + "Poke tool"; "Mounted Q (Bear Trap)" → Q + "Mounted · Bear Trap"; "Ult" → R.
function lerChaveCd(k) {
  const m = k.match(/^(?:(\w+)\s+)?(Passive|Ult|[QWER])\b\s*(.*)$/i);
  if (!m || (m[1] && !/^(mounted|dismounted)$/i.test(m[1]))) return null;
  const letra = /^passive$/i.test(m[2]) ? "P" : /^ult$/i.test(m[2]) ? "R" : m[2].toUpperCase();
  const desc = m[3].replace(/^\(\s*/, "").replace(/\s*\)?;?\s*$/, "").replace(/;$/, "");
  return { letra, desc: [m[1], desc].filter(Boolean).join(" · ") };
}
// A letra sai da chave original; no modo PT, a descrição vem da chave traduzida ("Q montado (armadilha de urso)").
function descNaLingua(k, desc) {
  const kt = tr(k);
  if (kt === k) return desc;
  const m = kt.match(/^(?:Passiva|Passive|Ult|[QWER])\b\s*(montado|desmontado)?\s*\(?\s*(.*?)\s*\)?;?\s*$/i);
  return m ? [m[1], m[2]].filter(Boolean).join(" · ") : desc;
}
function linhaCd([k, v], hab, nomeJogo) {
  const ch = lerChaveCd(k);
  if (ch) ch.desc = descNaLingua(k, ch.desc);
  // Sem descrição do autor, mostra o nome da habilidade no jogo.
  if (ch && (nomeJogo || !ch.desc) && hab[ch.letra]) ch.desc = nomeJogo || hab[ch.letra].nome;
  v = tr(v);
  if (!ch) return v ? `<li class="nota"><strong>${esc(tr(k))}:</strong> ${esc(v)}</li>` : `<li class="forma">${esc(tr(k).replace(/^-\s*/, ""))}</li>`;
  const h = hab[ch.letra];
  const icone = h ? `<span class="hab" title="${esc(h.nome)}"><img src="${h.icone}" alt="" width="40" height="40"><b>${ch.letra}</b></span>` : `<span class="hab so-letra"><b>${ch.letra}</b></span>`;
  const m = v.match(/^(.*?)\s*(\(.*\))\s*$/);
  const tempo = m && m[1] ? m[1] : v, obs = m && m[1] ? m[2] : "";
  const rotulo = ch.letra === "P" ? t("passiva") : ch.letra;
  // Descrição com inicial maiúscula, como o nome da habilidade no jogo ("correntes" → "Correntes").
  const desc = ch.desc.charAt(0).toUpperCase() + ch.desc.slice(1);
  return `<li>${icone}<span class="nome"><strong>${esc(rotulo)}</strong>${esc(desc)}</span><span class="tempo">${esc(tempo).replace(/\s*\/\s*/g, "<i>/</i>")}</span>${obs ? `<p class="obs">${esc(obs)}</p>` : ""}</li>`;
}
// Sem a seção na planilha: Q W E R com o nome da habilidade e o cooldown base de cada nível.
const linhasJogo = hab => "QWER".split("").filter(l => hab[l]).map(l => linhaCd([l, hab[l].cd || ""], hab, hab[l].nome)).join("")
  + (hab.Q ? `<li class="nota">${esc(t("cdsBase"))}</li>` : "");
async function mostraCds() {
  const c = current, sec = secaoCds(c), p = $("cdsPainel");
  const linhas = hab => !sec ? linhasJogo(hab) : sec.blocos.map(b => b.tipo === "tabela" ? b.linhas.map(l => linhaCd(l, hab)).join("") : `<li class="${/^-\s/.test(b.texto) ? "forma" : "nota"}">${esc(tr(b.texto).replace(/^-\s*/, ""))}</li>`).join("");
  const topo = `<div class="cds-topo"><h3 id="cdsTit">${esc(t("cdsDe").replace("{c}", c.nome))}</h3><button type="button" id="cdsFecha" aria-label="${esc(t("fechar"))}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>`;
  const ul = hab => `<ul${sec ? langOrig() : ""}>${linhas(hab)}</ul>`;
  p.innerHTML = topo + ul({});
  const hab = await carregaHabilidades(c.id);
  if (current === c && !p.hidden) p.innerHTML = topo + ul(hab);
}
function abreCds(abrir) {
  $("cdsPainel").hidden = !abrir;
  $("cdBtn").setAttribute("aria-expanded", abrir);
  if (abrir) { toca("abre"); mostraCds(); }
}
$("cdBtn").addEventListener("click", () => abreCds($("cdsPainel").hidden));
$("cdsPainel").addEventListener("click", e => { if (e.target.closest("#cdsFecha")) { abreCds(false); $("cdBtn").focus(); } });
document.addEventListener("click", e => { if (!$("cdsPainel").hidden && !e.target.closest("#cdsPainel, #cdBtn")) abreCds(false); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("cdsPainel").hidden) { abreCds(false); $("cdBtn").focus(); } });

/* ---------- Detalhe do matchup ---------- */
function renderDetalhe(animar) {
  const c = current, eu = guia.campeao;
  $("artEle").innerHTML = `<img src="${cena(c.id)}" alt="${t("arteDe")}${esc(c.nome)}" fetchpriority="high">`;
  enquadraTudo();
  $("eleNome").textContent = c.nome;
  $("eleNome").classList.toggle("longo", c.nome.length > 9);
  $("eleTitulo").textContent = tituloDe(c);
  const alvo = $("alvo");
  if (animar !== false && !semMovimento()) { alvo.classList.remove("travando"); void alvo.getBoundingClientRect(); alvo.classList.add("travando"); }
  $("titulo").textContent = `${eu.nome}${t("contra")}${c.nome}`;
  const g = $("guia");
  if (guia.formato === "simples") {
    g.className = "guia dif";
    g.style.setProperty("--dif", c.dif ? `var(--dif-${c.dif})` : "transparent");
    g.innerHTML = c.dif ? `<i></i>${rotuloDif(c.dif)}` : "";
  } else {
    g.className = "guia";
    g.innerHTML = c.dificuldade.overall ? `${pips(c.dificuldade.overall)}${t("dificuldade")} ${c.dificuldade.texto ? esc(notaTexto(tr(c.dificuldade.texto)).replace(/\s*\(.*$/, "")) : c.dificuldade.overall + "/5"}` : "";
  }
  $("travarNome").textContent = t("travarContra") + c.nome;
  // Se o painel de cooldowns estiver aberto, acompanha a troca de matchup.
  $("cdBtn").hidden = false;
  if (!$("cdsPainel").hidden) mostraCds();
  if (guia.formato === "simples") {
    $("carga").innerHTML = `<dl class="carga">${slot(t("runa"), c.runa, c, "runa") + slot(t("secundaria"), c.sec, c, "sec") + slot(t("feitico"), c.spell) + slot(t("bota"), c.bota, c, "bota") + slot(t("build"), c.build, c, "build")}</dl>`;
    $("linhas").innerHTML = `<ol class="lembretes"${L === "en" ? ' lang="en"' : ""}>${c.linhas.map(l => `<li><span>${linhaNaLingua(l)}</span></li>`).join("")}</ol>`;
  } else {
    $("carga").innerHTML = setupCompleto(c);
    $("linhas").innerHTML = notasCompleto(c);
  }
  atualizaVizinhos();
  lista.querySelectorAll(".pick").forEach(b => { const eh = b.dataset.id === c.slug; b.setAttribute("aria-current", eh); b.tabIndex = eh ? 0 : -1; });
  if (!lista.querySelector('.pick[tabindex="0"]') && lista.firstElementChild) lista.firstElementChild.tabIndex = 0;
  document.title = `${eu.nome} vs ${c.nome}`;
}

function atualizaVizinhos() {
  const [p, n] = vizinhos([-1, 1]);
  $("ant").innerHTML = `${SETA_E}<img src="${sq(p.id)}" alt="" width="24" height="24"><span class="lbl">${esc(p.nome)}</span>`;
  $("ant").setAttribute("aria-label", t("anterior") + p.nome);
  $("prox").innerHTML = `<span class="lbl">${esc(n.nome)}</span><img src="${sq(n.id)}" alt="" width="24" height="24">${SETA_D}`;
  $("prox").setAttribute("aria-label", t("proximo") + n.nome);
  $("miraAnt").setAttribute("aria-label", t("anterior") + p.nome);
  $("miraProx").setAttribute("aria-label", t("proximo") + n.nome);
  const adianta = () => [p, n].forEach(x => { const im = new Image(); im.src = cena(x.id); });
  if (document.readyState === "complete") adianta(); else addEventListener("load", adianta, { once: true });
}

// Rola só a lista (não a página) até o rosto escolhido.
function rolaNaLista(tile) {
  const r = tile.getBoundingClientRect(), c = lista.getBoundingClientRect();
  const dx = r.left < c.left + 8 ? r.left - c.left - 16 : r.right > c.right - 8 ? r.right - c.right + 16 : 0;
  const dy = r.top < c.top + 8 ? r.top - c.top - 16 : r.bottom > c.bottom - 30 ? r.bottom - c.bottom + 44 : 0;
  if (dx || dy) lista.scrollBy({ left: dx, top: dy, behavior: semMovimento() ? "auto" : "smooth" });
}
const anuncia = t => { $("anuncio").textContent = t; };

function select(c) {
  if (!c || c === current) return;
  current = c;
  renderDetalhe();
  marcaHash();
  const tile = lista.querySelector(`[data-id="${c.slug}"]`);
  if (tile) rolaNaLista(tile);
  anuncia(`${guia.campeao.nome}${t("contra")}${c.nome}`);
}

// Travar o pick: as duas artes se encontram no meio e a página desce até o setup.
let fechaTrava, travadas = 0;
function travar() {
  toca("travar");
  // Fala de escolha na língua do site (a em inglês vem do cliente em en_US, pelo CommunityDragon).
  setTimeout(() => toca("vo", `sons/vo/${L === "en" ? "en/" : ""}${guia.campeao.id}.ogg`), 180);
  const t = $("trava");
  // Só rola se o setup não estiver à vista (no celular, por exemplo).
  const desce = () => { const st = $("st").parentElement; if (st.getBoundingClientRect().top > innerHeight * .6) st.scrollIntoView({ behavior: semMovimento() ? "auto" : "smooth", block: "start" }); };
  if (semMovimento()) { desce(); return; }
  t.innerHTML = `<figure class="eu"><img src="${artePropria()}" alt=""><figcaption>${esc(guia.campeao.nome)}</figcaption></figure>
    <figure class="ele"><img src="${arte(current.id)}" alt=""><figcaption>${esc(current.nome)}</figcaption></figure><span class="vs">VS</span>`;
  t.hidden = false; t.classList.remove("on"); void t.offsetWidth; t.classList.add("on");
  const fecha = () => { clearTimeout(fechaTrava); t.hidden = true; t.classList.remove("on"); t.onclick = null; desce(); };
  fechaTrava = setTimeout(fecha, travadas++ ? 950 : 1500);
  t.onclick = fecha;
}

/* ---------- Seleção de guia: a escolha do campeão, no layout da seleção de campeões do cliente do LoL ----------
   Aparece na primeira visita (sem guia salvo nem link de guia) e quando se toca no campeão do topo.
   Um toque marca o campeão (o seu slot, a splash no fundo e os inimigos mais difíceis mudam); Confirmar (ou dois toques) abre o guia;
   tocar num inimigo trava o campeão e já abre aquela matchup. */
// Ícones de posição do cliente (CommunityDragon, rcp-fe-lol-static-assets/svg/position-*.svg).
const ICONE_POS = {
  top: '<path opacity=".45" fill="currentColor" fill-rule="evenodd" d="M21,14H14v7h7V14Zm5-3V26L11.014,26l-4,4H30V7.016Z"/><polygon fill="currentColor" points="4 4 4.003 28.045 9 23 9 9 23 9 28.045 4.003 4 4"/>',
  jungle: '<path fill="currentColor" fill-rule="evenodd" d="M25,3c-2.128,3.3-5.147,6.851-6.966,11.469A42.373,42.373,0,0,1,20,20a27.7,27.7,0,0,1,1-3C21,12.023,22.856,8.277,25,3ZM13,20c-1.488-4.487-4.76-6.966-9-9,3.868,3.136,4.422,7.52,5,12l3.743,3.312C14.215,27.917,16.527,30.451,17,31c4.555-9.445-3.366-20.8-8-28C11.67,9.573,13.717,13.342,13,20Zm8,5a15.271,15.271,0,0,1,0,2l4-4c0.578-4.48,1.132-8.864,5-12C24.712,13.537,22.134,18.854,21,25Z"/>',
  mid: '<path opacity=".45" fill="currentColor" fill-rule="evenodd" d="M30,12.968l-4.008,4L26,26H17l-4,4H30ZM16.979,8L21,4H4V20.977L8,17,8,8h8.981Z"/><polygon fill="currentColor" points="25 4 4 25 4 30 9 30 30 9 30 4 25 4"/>',
  bot: '<path opacity=".45" fill="currentColor" fill-rule="evenodd" d="M13,20h7V13H13v7ZM4,4V26.984l3.955-4L8,8,22.986,8l4-4H4Z"/><polygon fill="currentColor" points="29.997 5.955 25 11 25 25 11 25 5.955 29.997 30 30 29.997 5.955"/>',
  sup: '<path fill="currentColor" fill-rule="evenodd" d="M26,13c3.535,0,8-4,8-4H23l-3,3,2,7,5-2-3-4h2ZM22,5L20.827,3H13.062L12,5l5,6Zm-5,9-1-1L13,28l4,3,4-3L18,13ZM11,9H0s4.465,4,8,4h2L7,17l5,2,2-7Z"/>',
};
const iconePos = pos => `<svg viewBox="0 0 34 34" aria-hidden="true">${ICONE_POS[pos]}</svg>`;
const POS_DA_ROTA = { top: "top", jungle: "jungle", jg: "jungle", mid: "mid", adc: "bot", bot: "bot", sup: "sup", support: "sup" };
const posDe = g => POS_DA_ROTA[(g.rota || "").toLowerCase()] || "";
const posicoesDe = g => (g.rotas || [g.rota]).map(r => POS_DA_ROTA[(r || "").toLowerCase()]).filter(Boolean);
let selMarcado = null, selPos = "";
function guiasDaSelecao() {
  const busca = normal($("selBusca").value.trim());
  return GUIAS.filter(g => (!selPos || posicoesDe(g).includes(selPos)) && (!busca || normal(g.campeao.nome).includes(busca)))
    .sort((a, b) => a.campeao.nome.localeCompare(b.campeao.nome));
}
function renderGradeSelecao() {
  const gs = guiasDaSelecao();
  $("selGrade").innerHTML = gs.map(g => `<li><button type="button" class="sel-tile" data-guia="${g.id}" aria-pressed="${g.id === selMarcado}"
    aria-label="${esc(`${g.campeao.nome}${g.rota ? ", " + (g.rotas || [g.rota]).join(" / ") : ""}`)}"><img src="${sq(g.campeao.id)}" alt="" width="86" height="86"><span aria-hidden="true">${esc(g.campeao.nome)}</span></button></li>`).join("");
  const vazio = !gs.length;
  $("selVazio").hidden = !vazio;
  $("selVazio").textContent = !vazio ? "" : selPos && !$("selBusca").value.trim() ? t("selSemPos").replace("{p}", t("pos_" + selPos)) : t("selVazio");
}
// As cinco matchups mais difíceis do guia (a cor da dificuldade é a da planilha).
function inimigosDificeis(g) {
  if (!g.lista) prepara(g);
  const peso = c => (c.dif ? DIFS.length - DIFS.indexOf(c.dif) : 0);
  return g.lista.filter(c => c.dif).sort((a, b) => peso(b) - peso(a) || (b.dificuldade?.valor || 0) - (a.dificuldade?.valor || 0) || a.nome.localeCompare(b.nome)).slice(0, 5);
}
function renderVoce() {
  const g = GUIAS.find(x => x.id === selMarcado);
  $("selVoce").innerHTML = g
    ? `<div class="sel-linha"><span class="sel-ret"><img src="${sq(g.campeao.id)}" alt=""></span><span class="sel-linha-txt"><small>${t("voce")}</small><b${g.campeao.nome.length > 9 ? ' class="longo"' : ""}>${esc(g.campeao.nome)}</b>
        ${posDe(g) ? `<span class="sel-pos">${posicoesDe(g).map(pos => iconePos(pos) + esc(t("pos_" + pos))).join(" / ")}</span>` : ""}</span></div>
      <p class="sel-meta"><span class="sel-titulo">${esc(tituloDe(g.campeao))}</span>${t("notasDo")}<strong>${esc(g.autor)}</strong> · ${g.matchups.length}${t("matchups")}</p>`
    : `<div class="sel-linha vago"><span class="sel-ret"><svg width="30" height="30" viewBox="0 0 34 34" aria-hidden="true"><path d="M17 5l12 12-12 12L5 17z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
        <span class="sel-linha-txt"><small>${t("voce")}</small><b>${t("selEscolhendo")}</b></span></div>`;
  $("selInimigos").innerHTML = g
    ? inimigosDificeis(g).map(c => `<li><button type="button" class="sel-inimigo" data-slug="${c.slug}" aria-label="${esc(t("selAbrirMatchup").replace("{c}", g.campeao.nome).replace("{e}", c.nome))}">
        <span><b>${esc(c.nome)}</b><small><i style="--cor: var(--difc-${c.dif})"></i>${esc(rotuloDif(c.dif))}</small></span><img src="${sq(c.id)}" alt="" width="50" height="50"></button></li>`).join("")
    : Array.from({ length: 5 }, () => `<li><div class="sel-inimigo vago" aria-hidden="true"><span class="sel-vago-ret"></span></div></li>`).join("");
  $("selIniNota").textContent = t(g ? "selInimigosNota" : "selInimigosVazio");
  const b = $("selTravar");
  b.disabled = !g;
  $("selTravarTxt").textContent = t(g ? "selTravar" : "selEscolha");
  b.setAttribute("aria-label", g ? t("selTravarDe").replace("{c}", g.campeao.nome) : t("selEscolha"));
}
function renderSelecao() {
  $("selPosicoes").innerHTML = Object.keys(ICONE_POS).map(pos => `<button type="button" class="sel-pos-btn" data-pos="${pos}" aria-pressed="${selPos === pos}"
    aria-label="${esc(t("pos_" + pos))}" title="${esc(t("pos_" + pos))}">${iconePos(pos)}</button>`).join("");
  renderGradeSelecao();
  renderVoce();
}
// A splash do campeão marcado cobre a tela, como no cliente.
function fundoSelecao(id) {
  const caixa = $("selFundo");
  if (!id) { caixa.innerHTML = ""; return; }
  const escolhido = GUIAS.find(g => g.id === id);
  caixa.style.setProperty("--foco-sel", `${escolhido.mira ? escolhido.mira[0] : 50}% 20%`);
  const src = cena(escolhido.campeao.id);
  let img = caixa.querySelector("img");
  if (img && img.getAttribute("src") === src) return;
  if (!img || semMovimento()) { caixa.innerHTML = `<img src="${src}" alt="">`; return; }
  img.classList.add("trocando");
  setTimeout(() => { img.src = src; img.onload = () => img.classList.remove("trocando"); }, 160);
}
function marcaSelecao(id, som) {
  if (!id) return;
  if (som && id !== selMarcado) toca("grade");
  selMarcado = id;
  $("selGrade").querySelectorAll(".sel-tile").forEach(b => b.setAttribute("aria-pressed", b.dataset.guia === id));
  renderVoce();
  fundoSelecao(id);
}
let fechaSelecao;
// Travar: o som e a fala de escolha do campeão; com um inimigo, abre direto aquela matchup.
function travaSelecao(inimigo) {
  const s = $("selecao"), g = GUIAS.find(x => x.id === selMarcado);
  if (!g || s.classList.contains("travando")) return;
  toca("travar");
  setTimeout(() => toca("vo", `sons/vo/${L === "en" ? "en/" : ""}${g.campeao.id}.ogg`), 180);
  s.classList.add("travando");
  $("selTravar").disabled = true;
  const vai = () => {
    s.classList.remove("travando");
    abreSelecao(false, false, g.id);
    if (inimigo) location.hash = `#${g.id}/${inimigo}`;
    else if (g.id !== guia.id) { escolheGuia(g.id); atualiza3d(); }
    scrollTo({ top: 0 });
    $("trocar").focus();
  };
  if (semMovimento()) vai(); else fechaSelecao = setTimeout(vai, 750);
}
function abreSelecao(abrir, primeira, travado) {
  const s = $("selecao");
  if (abrir === !s.hidden) return;
  // Enquanto ela está aberta, só o topo (língua, som, tema) e a própria tela recebem foco.
  [...document.body.children].forEach(el => { if (el !== s && !el.matches("header.bar, script, .pular")) el.inert = abrir; });
  document.body.classList.toggle("sem-rolar", abrir);
  document.body.classList.toggle("selecionando", abrir);
  $("trocar").setAttribute("aria-expanded", abrir);
  if (abrir) {
    s.classList.toggle("primeira", !!primeira);
    // Na primeira visita só fica salvo o guia escolhido (quem sair sem escolher vê a tela de novo).
    if (primeira) try { localStorage.removeItem("guia"); } catch (e) {}
    selMarcado = primeira ? null : guia.id;
    selPos = "";
    $("selBusca").value = "";
    renderSelecao();
    fundoSelecao(selMarcado);
    s.hidden = false;
    s.scrollTop = 0;
    if (!primeira) toca("abre");
    const b = s.querySelector('.sel-tile[aria-pressed="true"]') || s.querySelector(".sel-tile");
    if (b) b.focus({ preventScroll: true });
  } else {
    clearTimeout(fechaSelecao);
    s.hidden = true;
    s.classList.remove("travando");
    try { localStorage.setItem("guia", travado || guia.id); } catch (e) {}
  }
}
$("trocar").addEventListener("click", () => abreSelecao($("selecao").hidden));
$("selFecha").addEventListener("click", () => { toca("fecha"); abreSelecao(false); $("trocar").focus(); });
$("selGrade").addEventListener("click", e => { const b = e.target.closest(".sel-tile"); if (b) marcaSelecao(b.dataset.guia, true); });
$("selGrade").addEventListener("dblclick", e => { const b = e.target.closest(".sel-tile"); if (b) { marcaSelecao(b.dataset.guia); travaSelecao(); } });
$("selInimigos").addEventListener("click", e => { const b = e.target.closest(".sel-inimigo[data-slug]"); if (b) travaSelecao(b.dataset.slug); });
let ultimoHoverSel = 0;
$("selecao").addEventListener("pointerover", e => {
  const b = e.target.closest(".sel-tile, .sel-inimigo[data-slug]");
  if (!b || e.pointerType !== "mouse" || b.contains(e.relatedTarget) || performance.now() - ultimoHoverSel < 70) return;
  ultimoHoverSel = performance.now();
  toca("passa");
});
// Setas andam entre os retratos, como na grade de matchups.
$("selGrade").addEventListener("keydown", e => {
  const tiles = [...$("selGrade").querySelectorAll(".sel-tile")], i = tiles.indexOf(document.activeElement);
  const j = { ArrowRight: i + 1, ArrowDown: i + 1, ArrowLeft: i - 1, ArrowUp: i - 1, Home: 0, End: tiles.length - 1 }[e.key];
  if (i < 0 || j == null) return;
  e.preventDefault();
  tiles[(j + tiles.length) % tiles.length].focus();
});
$("selPosicoes").addEventListener("click", e => {
  const b = e.target.closest("[data-pos]");
  if (!b) return;
  toca("chip");
  selPos = selPos === b.dataset.pos ? "" : b.dataset.pos;
  $("selPosicoes").querySelectorAll("[data-pos]").forEach(x => x.setAttribute("aria-pressed", x.dataset.pos === selPos));
  renderGradeSelecao();
});
$("selBusca").addEventListener("input", renderGradeSelecao);
$("selBusca").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const g = guiasDaSelecao()[0];
  if (g) { marcaSelecao(g.id, true); $("selTravar").focus(); }
});
$("selTravar").addEventListener("click", () => travaSelecao());

/* ---------- Tema ---------- */
function marcaTema() {
  $("tema").setAttribute("aria-label", t(raiz.dataset.tema === "claro" ? "temaEsc" : "temaCla"));
}
$("tema").addEventListener("click", () => {
  toca("clique");
  const claro = raiz.dataset.tema !== "claro";
  if (claro) raiz.dataset.tema = "claro"; else delete raiz.dataset.tema;
  try { localStorage.setItem("tema", claro ? "claro" : "escuro"); } catch (e) {}
  marcaTema();
});
marcaTema();
$("som").addEventListener("click", () => {
  somLigado = !somLigado;
  try { localStorage.setItem("som", somLigado ? "ligado" : "desligado"); } catch (e) {}
  if (!somLigado) paraSons3d();
  marcaSom();
  toca("clique");
});
marcaSom();
$("lingua").addEventListener("click", () => {
  L = L === "en" ? "pt" : "en";
  try { localStorage.setItem("lingua", L); } catch (e) {}
  toca("clique");
  aplicaTextos();
  marcaSom();
  marcaTema();
  guia.lista = null;
  const slugAtual = current.slug;
  prepara(guia);
  current = guia.lista.find(c => c.slug === slugAtual) || guia.lista[0];
  renderGuia();
  renderLista();
  renderDetalhe(false);
  renderPaginas();
  atualiza3d();
  if (!$("selecao").hidden) renderSelecao();
});

/* ---------- Eventos ---------- */
lista.addEventListener("click", e => {
  const b = e.target.closest(".pick");
  if (b) { toca("grade"); select(guia.lista.find(c => c.slug === b.dataset.id)); }
});
// Hover na lista só com mouse, como no cliente.
lista.addEventListener("pointerover", e => {
  if (e.pointerType !== "mouse") return;
  const b = e.target.closest(".pick");
  if (b && !b.contains(e.relatedTarget)) toca("passa");
});
let avisoBusca;
q.addEventListener("input", () => {
  renderLista();
  if (shown.length === 1) select(shown[0]);
  clearTimeout(avisoBusca);
  avisoBusca = setTimeout(() => anuncia(shown.length ? t("nCampeoes", shown.length) : t("nenhum")), 700);
});
$("filtros").addEventListener("click", e => {
  const b = e.target.closest(".chip");
  if (!b) return;
  const f = b.dataset.f;
  ativos.has(f) ? ativos.delete(f) : ativos.add(f);
  toca("chip");
  b.setAttribute("aria-pressed", ativos.has(f));
  renderLista();
});
$("limpar").addEventListener("click", () => {
  q.value = ""; ativos.clear();
  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", "false"));
  renderLista();
  q.focus();
});
lista.addEventListener("keydown", e => {
  const b = e.target.closest(".pick");
  if (!b || e.altKey || e.ctrlKey || e.metaKey) return;
  const picks = [...lista.querySelectorAll(".pick")], i = picks.indexOf(b);
  const cols = picks.filter(x => x.offsetTop === picks[0].offsetTop).length || 1;
  const destino = { ArrowRight: i + 1, ArrowLeft: i - 1, ArrowDown: i + cols, ArrowUp: i - cols, Home: 0, End: picks.length - 1 }[e.key];
  if (destino === undefined) return;
  e.preventDefault();
  e.stopPropagation();
  const alvo = picks[Math.max(0, Math.min(picks.length - 1, destino))];
  picks.forEach(x => { x.tabIndex = x === alvo ? 0 : -1; });
  alvo.focus({ preventScroll: true });
  rolaNaLista(alvo);
});

document.addEventListener("keydown", e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (!$("trava").hidden) { if (e.key === "Escape" || e.key === "Enter") { e.preventDefault(); $("trava").onclick(); } return; }
  if (!$("selecao").hidden) {
    if (e.key === "Escape") { toca("fecha"); abreSelecao(false); $("trocar").focus(); }
    if (e.key === "/" && document.activeElement !== $("selBusca")) { e.preventDefault(); $("selBusca").focus(); }
    return;
  }
  if (paginaAtual) return;  // atalhos de matchup só na página de matchups
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); return; }
  if (document.activeElement === q) {
    if (e.key === "Enter" && shown[0]) { toca("grade"); select(shown[0]); q.blur(); }
    if (e.key === "Escape") { q.value = ""; renderLista(); q.blur(); }
    return;
  }
  if (e.target.closest && e.target.closest("input, textarea, select, .lista, [role=tablist]")) return;
  if (e.key === "ArrowRight") { toca("avanca"); select(vizinhos([1])[0]); }
  if (e.key === "ArrowLeft") { toca("volta"); select(vizinhos([-1])[0]); }
  // Cima/baixo andam uma linha da grade (na faixa de uma linha só, um campeão).
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    const picks = [...lista.querySelectorAll(".pick")];
    if (!picks.length) return;
    e.preventDefault();
    const linha = picks.filter(x => x.offsetTop === picks[0].offsetTop).length;
    const cols = linha < picks.length ? linha : 1, desce = e.key === "ArrowDown";
    const i = Math.max(0, shown.indexOf(current)), n = i + (desce ? cols : -cols);
    // Na borda da grade fica onde está; na faixa dá a volta, como os lados.
    const c = n >= 0 && n < shown.length ? shown[n] : cols === 1 ? vizinhos([desce ? 1 : -1])[0] : null;
    if (!c) return;
    toca(desce ? "avanca" : "volta");
    select(c);
  }
});

function abreSkins(abrir) {
  const m = $("skinMenu");
  if (abrir) {
    const atual = skinAtual();
    const ch = chromaAtual();
    m.innerHTML = SKINS.map(k => {
      const linha = `<button type="button" data-skin="${k.id}" aria-pressed="${k === atual}"><img src="${tileSkin(guia.campeao.id, k.num)}" alt="" width="40" height="40">${esc((L === "en" && k.nome_en) || k.nome)}</button>`;
      // Chromas de todas as skins à vista: um clique na bolinha já troca skin + chroma e fecha.
      const cs = CHROMAS[k.id] || [];
      if (!cs.length) return linha;
      const skinNome = (L === "en" && k.nome_en) || k.nome;
      return linha + `<div class="skin-chromas" role="group" aria-label="${esc(t("chromas") + " · " + skinNome)}">${cs.map(c => {
        const nome = esc((L === "en" && c.nome_en) || c.nome);
        return `<button type="button" data-chroma="${c.num}" data-mae="${k.id}" aria-pressed="${k === atual && ch === c}" aria-label="${esc(skinNome)} · ${nome}" title="${nome}" style="--c1: ${c.cores[0] || "#888"}; --c2: ${c.cores[1] || c.cores[0] || "#888"}"></button>`;
      }).join("")}</div>`;
    }).join("");
  }
  m.hidden = !abrir;
  if (abrir) {
    // Logo abaixo do botão, alinhado à direita dele, sem sair da tela; se não couber, rola por dentro.
    const b = $("skinBtn").getBoundingClientRect(), largura = m.offsetWidth;
    const topo = b.bottom + 6;
    m.style.top = topo + "px";
    m.style.left = Math.max(12, Math.min(b.right - largura, innerWidth - largura - 12)) + "px";
    m.style.maxHeight = Math.max(160, innerHeight - topo - 12) + "px";
  }
  const jaAberto = abreSkins.aberto === abrir;
  abreSkins.aberto = abrir;
  $("skinBtn").setAttribute("aria-expanded", abrir);
  if (!jaAberto) toca(abrir ? "abre" : "fecha");

}

const FALAS_SKIN = { pt: 38, en: 38 };

// Só fala quando a pessoa para de trocar (0,6 s depois da última troca), e corta a fala anterior:
// passar várias skins rápido não empilha vozes.
function falaSkin() {
  clearTimeout(esperaFala);
  if (falaTocando) { falaTocando.pause(); falaTocando = null; }
  esperaFala = setTimeout(() => {
    if (!somLigado) return;

    let i;
    do { i = Math.floor(Math.random() * n); } while (i === ultimaFala && n > 1);
    ultimaFala = i;

    falaTocando.volume = VOLUME.vo;
    falaTocando.play().catch(() => {});
  }, 600);
}

/* ---------- Ao vivo: quem do "Acompanhe" está em live na Twitch (decapi.me responde sem chave) ---------- */
async function marcaAoVivo() {
  const links = [...document.querySelectorAll("#acompanhe .canal")];
  if (!links.length) return;
  await Promise.all(links.map(async a => {
    const login = new URL(a.href).pathname.split("/")[1];
    try {
      const r = await fetch(`https://decapi.me/twitch/uptime/${encodeURIComponent(login)}`, { cache: "no-store" });
      const txt = r.ok ? await r.text() : "";
      // Em live a resposta é o tempo no ar ("1 hour, 5 minutes"); fora, "... is offline".
      const vivo = /\d+\s+(second|minute|hour|day)/i.test(txt) && !/offline/i.test(txt);
      a.classList.toggle("ao-vivo", vivo);
      a.querySelector("small").textContent = vivo ? t("aoVivo") : "Twitch";
      a.closest("li").style.order = vivo ? -1 : "";
    } catch (e) {}
  }));
}

    if (atraso) sons3d.push(setTimeout(vai, parseFloat(atraso) * 1000)); else vai();
  });
}
let estado3d = "";  // "" ainda não tentou, "carregando", "pronto" ou "falhou"
let ligado3d = true;
try { ligado3d = localStorage.getItem("akshan3d") !== "0"; } catch (e) {}

function atualiza3d() {
  const pode = location.protocol !== "file:" && TELA_3D.matches && guia && CONF_3D[guia.id] && (estado3d !== "falhou" || guia3d !== guia.id);
  const nome = guia ? guia.campeao.nome : "";
  $("abre3d").hidden = !(pode && !ligado3d);
  $("abre3d").textContent = `${nome} 3D`;
  $("abre3d").setAttribute("aria-label", t("mostra3d").replace("{c}", nome));
  $("fecha3d").setAttribute("aria-label", t("esconde3d").replace("{c}", nome));
  $("fecha3d").title = t("esconde3d").replace("{c}", nome);
  $("carrega3d").textContent = t("carrega3d").replace("{c}", nome);
  $("akshan3d").setAttribute("aria-label", `${nome} 3D`);
  document.documentElement.classList.toggle("com-3d", !!(pode && ligado3d));
  if (!(pode && ligado3d)) { paraSons3d(); return; }
  // Trocou de guia: desmonta o modelo do outro campeão e carrega o deste.
  if (estado3d && guia3d !== guia.id) {
    geracao3d++;
    if (desmonta3d) { desmonta3d(); desmonta3d = null; }
    estado3d = "";
  }
  if (!estado3d) iniciaAkshan3d();
}
function liga3d(sim) {
  ligado3d = sim;
  if (!sim) paraSons3d();
  try { localStorage.setItem("akshan3d", sim ? "1" : "0"); } catch (e) {}
  toca(sim ? "abre" : "fecha");
  atualiza3d();
  (sim ? $("fecha3d") : $("abre3d")).focus({ preventScroll: true });
}
$("fecha3d").addEventListener("click", () => liga3d(false));
$("abre3d").addEventListener("click", () => liga3d(true));

let geracao3d = 0, desmonta3d = null, chroma3d = null;
// Troca de skin com o 3D aberto: desmonta a cena atual e carrega o modelo da skin nova.
function recarrega3d() {
  if (!estado3d || estado3d === "falhou") return;
  geracao3d++;
  if (desmonta3d) { desmonta3d(); desmonta3d = null; }
  estado3d = "";
  atualiza3d();
}
async function iniciaAkshan3d() {
  estado3d = "carregando";
  guia3d = guia.id;
  const cf = conf3d = CONF_3D[guia.id];
  const geracao = ++geracao3d;
  const box = $("akshan3d"), canvas = $("cena3d");
  box.classList.remove("pronto");
  try {
    const [THREE, { GLTFLoader }, bytes] = await Promise.all([
      import("three"), import("three/addons/loaders/GLTFLoader.js"),
      fetch(cf.modelo()).then(r => { if (!r.ok) throw new Error("modelo " + r.status); return r.arrayBuffer(); }),
    ]);
    const gltf = await new GLTFLoader().parseAsync(bytes, "");
    if (geracao !== geracao3d) return;  // trocaram de skin enquanto baixava
    const fim = new AbortController(), ouve = { signal: fim.signal };
    const r = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    r.setClearColor(0x000000, 0);
    r.outputColorSpace = THREE.SRGBColorSpace;
    const cena = new THREE.Scene(), cam = new THREE.PerspectiveCamera(26, 1, 10, 4000);
    cena.add(new THREE.HemisphereLight(cf.luz[0], cf.luz[1], 1.1));
    const luz = new THREE.DirectionalLight(cf.luz[2], 2.2); luz.position.set(200, 400, 300); cena.add(luz);
    const contorno = new THREE.DirectionalLight(cf.luz[3], 3); contorno.position.set(-300, 250, -400); cena.add(contorno);
    const m = gltf.scene;
    // O jogo dá luz própria à textura (selfIllumination 0.7): emissivo com o mesmo mapa.
    m.traverse(o => { if (o.isMesh) { const mt = o.material; mt.emissive = new THREE.Color(0xffffff); mt.emissiveMap = mt.map; mt.emissiveIntensity = cf.emissivo; o.frustumCulled = false; } });
    // Chroma: troca o mapa de cor dos materiais (nome do material = chave da textura) e guarda o original.
    const mats = new Map(), carregador = new THREE.TextureLoader().setCrossOrigin("anonymous");
    m.traverse(o => { if (o.isMesh && !mats.has(o.material.name)) mats.set(o.material.name, { mt: [], orig: o.material.map }); if (o.isMesh) mats.get(o.material.name).mt.push(o.material); });
    const aplicaMapa = (chave, mapa) => (mats.get(chave) || { mt: [] }).mt.forEach(mt => { mt.map = mapa; mt.emissiveMap = mapa; mt.needsUpdate = true; });
    chroma3d = () => {
      const ch = guia3d === "akshan" ? chromaAtual() : null;  // chromas só do Akshan
      mats.forEach((v, chave) => aplicaMapa(chave, v.orig));
      if (!ch) return;
      Object.entries(ch.texturas).forEach(([chave, url]) => {
        if (!mats.has(chave)) return;
        carregador.load(url, tx => {
          if (chromaAtual() !== ch) { tx.dispose(); return; }  // trocaram de novo enquanto baixava
          const orig = mats.get(chave).orig;
          tx.flipY = orig.flipY; tx.colorSpace = orig.colorSpace; tx.wrapS = orig.wrapS; tx.wrapT = orig.wrapT;
          aplicaMapa(chave, tx);
        });
      });
    };
    chroma3d();
    m.rotation.y = cf.giro ?? -.35;  // de leve virado para o conteúdo, à esquerda
    // Partes que aparecem e somem durante um clipe (guitarra do Mordekaiser na dança): eventos do jogo,
    // guardados no .glb por scripts/modelo3d (nós "parte:Nome" e gltf.scene.userData.eventos).
    const partes = [], eventos = gltf.scene.userData.eventos || {};
    m.traverse(o => { if (o.userData && o.userData.parte) { partes.push({ obj: o, nome: o.userData.parte.toLowerCase(), inicial: !!o.userData.inicial }); o.visible = !!o.userData.inicial; } });
    cena.add(m);
    // Caixa do modelo: a da pose de montagem (Akshan) ou a da pose de idle, para quem guarda partes longe
    // do corpo na montagem (os tentáculos da Illaoi ficam metros para trás).
    const caixa = (() => {
      // Só o que está à mostra (a guitarra escondida não conta).
      const caixaVisivel = precisa => { const b = new THREE.Box3(); m.updateMatrixWorld(true); m.traverse(o => { if (o.isMesh && o.visible) b.expandByObject(o, precisa); }); return b; };
      if (!cf.caixaPose) return caixaVisivel(false);
      const mx = new THREE.AnimationMixer(m), ini = gltf.animations.find(a => a.name === "idle");
      if (ini) { mx.clipAction(ini).play(); mx.update(.01); }
      const b = caixaVisivel(true);
      b.min.y = Math.max(b.min.y, 0);  // o que passa do chão (tentáculo) não conta
      mx.stopAllAction(); mx.uncacheRoot(m);
      return b;
    })();
    const centro = caixa.getCenter(new THREE.Vector3()), tam = caixa.getSize(new THREE.Vector3()), alt = tam.y;
    // Brilho dourado no chão, embaixo dos pés (círculo com degradê, desenhado num canvas 2D).
    const tela = document.createElement("canvas"); tela.width = tela.height = 128;
    const g2 = tela.getContext("2d"), grad = g2.createRadialGradient(64, 64, 0, 64, 64, 64);
    grad.addColorStop(0, `rgba(${cf.brilho},.55)`); grad.addColorStop(1, `rgba(${cf.brilho},0)`);
    g2.fillStyle = grad; g2.fillRect(0, 0, 128, 128);
    const chao = new THREE.Mesh(new THREE.PlaneGeometry(alt * .75, alt * .75),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(tela), transparent: true, depthWrite: false }));
    chao.rotation.x = -Math.PI / 2; chao.position.set(centro.x, caixa.min.y + 1, centro.z);
    cena.add(chao);
    // Folga para os chutes da dança e o braço levantado da piada.
    const enquadra = () => {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (!w || !h) return;
      r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(w, h, false);
      cam.aspect = w / h;
      const tg = Math.tan(THREE.MathUtils.degToRad(cam.fov / 2));
      // Cabe a altura (com folga para as emotes) e também a largura (a maça do Mordekaiser é comprida).
      const dist = Math.max((alt * 1.25 / 2) / tg / Math.min(1, cam.aspect / .55), (tam.x * 1.1 / 2) / tg / cam.aspect);
      cam.position.set(centro.x, centro.y + alt * .04, centro.z + dist); cam.lookAt(centro.x, centro.y + alt * .04, centro.z);
      cam.updateProjectionMatrix();
    };
    const ro = new ResizeObserver(enquadra); ro.observe(canvas);
    enquadra();

    const mixer = new THREE.AnimationMixer(m), clipe = n => gltf.animations.find(a => a.name === n);
    const acao = (n, vezes) => { const a = mixer.clipAction(clipe(n)); a.setLoop(THREE.LoopRepeat, vezes || Infinity); a.clampWhenFinished = true; return a; };
    const idle = acao("idle");
    const parado = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let atual = idle, fila = [], emote = null, ultima = "", voltas = 0;
    const tocaClipe = a => { a.reset().play(); if (atual !== a) a.crossFadeFrom(atual, .25, false); atual = a; tocaSons3d((cf.clipe ? cf.clipe() : {})[a.getClip().name]); };
    const marcaBotoes = () => $("anim3d").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", b.dataset.anim === emote));
    const proximo = () => {
      if (fila.length) { const [n, v] = fila.shift(); tocaClipe(acao(n, v)); return; }
      emote = null; marcaBotoes(); paraRepeticoes3d(); tocaClipe(idle);
    };
    const anima = nome => { paraSons3d(); emote = nome; fila = cf.seq[nome].slice(); marcaBotoes(); proximo(); };
    mixer.addEventListener("finished", proximo);
    // De tempos em tempos o idle troca pela variação.
    mixer.addEventListener("loop", e => {
      if (e.action !== idle) { tocaSons3d((cf.volta ? cf.volta() : {})[e.action.getClip().name]); return; }
      if (emote || parado) return;
      if (++voltas % 3 === 0 && clipe("idle_var")) { emote = "var"; fila = [["idle_var", 1]]; proximo(); }
    });
    if (parado) idle.paused = true;  // com "reduzir movimento" o idle fica parado; os botões ainda funcionam

    $("anim3d").innerHTML = Object.keys(cf.seq).map(n => n.length === 1
      ? `<button type="button" class="tecla" data-anim="${n}" aria-pressed="false">${n.toUpperCase()}</button>`
      : `<button type="button" data-anim="${n}" data-t="a_${n}" aria-pressed="false">${t("a_" + n)}</button>`).join("");
    $("anim3d").addEventListener("click", e => { const b = e.target.closest("[data-anim]"); if (b) anima(b.dataset.anim); }, ouve);

    // Arrastar gira; clique sem arrastar faz uma emote sorteada.
    let arrasto = null;
    canvas.addEventListener("pointerdown", e => { arrasto = { x: e.clientX, girou: false }; canvas.setPointerCapture(e.pointerId); }, ouve);
    canvas.addEventListener("pointermove", e => {
      if (!arrasto) return;
      const dx = e.clientX - arrasto.x;
      if (!arrasto.girou && Math.abs(dx) < 4) return;
      arrasto.girou = true; canvas.classList.add("girando");
      m.rotation.y += dx * .012; arrasto.x = e.clientX;
    }, ouve);
    const solta = () => {
      if (arrasto && !arrasto.girou) {
        const op = EMOTES_3D.filter(n => n !== ultima);
        anima(ultima = op[Math.floor(Math.random() * op.length)]);
      }
      arrasto = null; canvas.classList.remove("girando");
    };
    canvas.addEventListener("pointerup", solta, ouve);
    canvas.addEventListener("pointercancel", () => { arrasto = null; canvas.classList.remove("girando"); }, ouve);

    idle.play();
    const relogio = new THREE.Clock();
    let visivel = true;
    const io = new IntersectionObserver(([e]) => { visivel = e.isIntersecting; }); io.observe(box);
    const quadro = () => {
      if (fim.signal.aborted) return;
      const dt = relogio.getDelta();
      if (!document.hidden && visivel && box.offsetParent) {
        mixer.update(Math.min(dt, .1));
        if (partes.length) {
          const evs = eventos[atual.getClip().name] || [], tm = atual.time;
          partes.forEach(pt => {
            let v = pt.inicial;
            evs.forEach(e => { if (tm >= e.ini && (e.fim == null || tm < e.fim)) { if (e.mostra.some(n => n.toLowerCase() === pt.nome)) v = true; if (e.esconde.some(n => n.toLowerCase() === pt.nome)) v = false; } });
            pt.obj.visible = v;
          });
        }
        r.render(cena, cam);
      }
      requestAnimationFrame(quadro);
    };
    mixer.update(0);
    quadro();
    desmonta3d = () => {
      chroma3d = null;
      fim.abort(); ro.disconnect(); io.disconnect(); paraSons3d(); mixer.stopAllAction();
      cena.traverse(o => { if (o.isMesh) { o.geometry.dispose(); [].concat(o.material).forEach(mt => { mt.map && mt.map.dispose(); mt.dispose(); }); } });
      r.dispose();
    };
    box.classList.add("pronto");
    estado3d = "pronto";
  } catch (e) {
    console.warn("3D não carregou:", e);
    estado3d = "falhou";
    atualiza3d();
  }
}
