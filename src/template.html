* { box-sizing: border-box; }
[hidden] { display: none !important; }
/* A página nunca rola para o lado: o clip corta sobras de meio pixel sem virar contêiner de rolagem (o sticky continua). */
html { scrollbar-color: var(--linha-forte) var(--fundo); overflow-x: clip; }
body { margin: 0; color: var(--texto); font: 400 16px/1.6 var(--corpo); -webkit-font-smoothing: antialiased; background: var(--fundo); }
/* A luz vem de cima, numa camada própria atrás de tudo. */
body::after { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(1100px 520px at 50% -120px, var(--luz), transparent 70%); }
::selection { background: var(--destaque); color: var(--tinta-botao); }
input { caret-color: var(--acento); }
button { font: inherit; color: inherit; }
img { display: block; }
img.falhou { visibility: hidden; }
a { color: var(--acento-vivo); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--acento-vivo); outline-offset: 3px; }
/* Link de pular, visível só com o foco do teclado. */
.pular { position: absolute; z-index: 40; left: 16px; top: -80px; padding: 10px 16px; border-radius: 8px; background: var(--painel); border: 1px solid var(--acento-vivo); color: var(--texto); font-weight: 700; text-decoration: none; }
.pular:focus { top: 10px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

/* Barra e troca de guia */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fundo); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: color-mix(in oklab, var(--fundo) 90%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--linha); }
.bar-in { height: var(--barra); max-width: 1320px; margin: 0 auto; padding: 0 var(--borda); display: flex; align-items: center; gap: 16px; }
.guias { position: relative; min-width: 0; }
.trocar { display: flex; align-items: center; gap: 12px; min-height: 48px; max-width: 100%; padding: 4px 12px 4px 4px; border-radius: 999px; border: 1px solid transparent; background: none; cursor: pointer; text-align: left; }
.trocar:hover, .trocar[aria-expanded="true"] { border-color: var(--linha-forte); background: var(--painel); }
.trocar img { width: 38px; height: 38px; flex: none; border-radius: 50%; box-shadow: 0 0 0 2px var(--acento); }
.trocar .txt { display: grid; min-width: 0; line-height: 1.15; }
.trocar b { font: 700 20px/1.1 var(--titulo); letter-spacing: .04em; color: var(--acento-vivo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trocar .txt span { font-size: 13px; color: var(--texto-baixo); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trocar svg { flex: none; color: var(--acento); transition: transform .2s; }
.trocar[aria-expanded="true"] svg { transform: rotate(180deg); }
/* Seleção de guia: o layout da seleção de campeões do cliente (seu time | grade | inimigos, Confirmar embaixo) e as cores dele,
   azul-escuro com dourado hextech, iguais em todos os guias e nos dois temas (pedido do dono). A splash do campeão marcado cobre a tela. */
.selecao { --hx-preto: #010a13; --hx-azul: #0a1428; --hx-azul-2: #091428; --hx-ouro-1: #f0e6d2; --hx-ouro-2: #cdbe91; --hx-ouro-3: #c8aa6e;
  --hx-ouro-5: #785a28; --hx-cinza-1: #a09b8c; --hx-cinza-3: #3c3c41; --hx-ciano: #0ac8b9;
  position: fixed; inset: var(--barra) 0 0; z-index: 25; overflow-y: auto; overscroll-behavior: contain; background: var(--hx-preto); color: var(--hx-ouro-1); color-scheme: dark; }
/* O topo compartilha a arte e a paleta da seleção enquanto ela está aberta. */
body.selecionando .bar {
  --fundo: #010a13; --painel: #0a1428; --linha: #3c3c41; --linha-forte: #785a28;
  --acento: #c8aa6e; --acento-vivo: #f0e6d2; --texto: #f0e6d2; --texto-baixo: #a09b8c;
  z-index: 30; background: transparent; border-bottom-color: transparent;
  backdrop-filter: none; -webkit-backdrop-filter: none; color-scheme: dark;
}
body.selecionando::before { background: #010a13; }
body.selecionando .trocar[aria-expanded="true"] { background: rgba(1, 10, 19, .35); border-color: transparent; }
body.selecionando .bar .acoes button { background: rgba(1, 10, 19, .45); }
body.selecionando .selecao { inset-block-start: 0; padding-top: calc(var(--barra) + env(safe-area-inset-top, 0px)); }
body.selecionando .sel-fundo { inset: 0; }
.selecao ::selection { background: var(--hx-ouro-5); color: var(--hx-ouro-1); }
.sel-fundo { position: fixed; inset: var(--barra) 0 0; overflow: hidden; pointer-events: none; }
.sel-fundo img { width: 100%; height: 100%; object-fit: cover; object-position: var(--foco-sel, 50% 20%); opacity: .72; transition: opacity .45s cubic-bezier(.16, 1, .3, 1), transform 1.2s cubic-bezier(.16, 1, .3, 1); }
.sel-fundo img.trocando { opacity: 0; }
.selecao.travando .sel-fundo img { opacity: .95; transform: scale(1.03); }
.sel-fundo::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(90deg, rgba(1, 10, 19, .94), rgba(1, 10, 19, .45) 26%, rgba(1, 10, 19, .45) 74%, rgba(1, 10, 19, .94)),
              linear-gradient(rgba(1, 10, 19, .7), transparent 22%, transparent 62%, rgba(1, 10, 19, .96)); }
.sel-palco { position: relative; display: grid; grid-template-columns: minmax(210px, 260px) minmax(0, 1fr) minmax(210px, 260px); grid-template-rows: auto 1fr auto;
  grid-template-areas: "cabeca cabeca cabeca" "time centro inimigos" "acao acao acao"; gap: 22px 28px; max-width: 1320px; min-height: calc(100dvh - var(--barra));
  margin: 0 auto; padding: 26px var(--borda) 0; }
.sel-cabeca { grid-area: cabeca; display: grid; justify-items: center; gap: 12px; }
.selecao h2 { margin: 0; font: 700 clamp(24px, 2.8vw, 34px)/1.1 var(--titulo); letter-spacing: .08em; text-transform: uppercase; color: var(--hx-ouro-1); text-align: center; text-wrap: balance;
  text-shadow: 0 2px 12px rgba(1, 10, 19, .8); }
/* A linha do timer do cliente, parada: ouro que some nas pontas com o losango da casa no meio. */
.sel-barra { position: relative; width: min(640px, 100%); height: 2px; background: linear-gradient(90deg, transparent, var(--hx-ouro-5) 18%, var(--hx-ouro-3) 50%, var(--hx-ouro-5) 82%, transparent); }
.sel-barra i { position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; transform: translate(-50%, -50%) rotate(45deg); background: var(--hx-preto); border: 1.5px solid var(--hx-ouro-3); }
.sel-time h3, .sel-inimigos h3 { margin: 0 0 12px; font: 700 12px var(--corpo); letter-spacing: .16em; text-transform: uppercase; color: var(--hx-cinza-1); }
.sel-inimigos h3 { text-align: right; }
/* Seu time: o seu slot, com o retrato redondo no anel dourado e a faixa clara de quem está escolhendo. */
.sel-time { grid-area: time; align-self: start; }
.sel-linha { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: 4px; border: 1px solid rgba(200, 170, 110, .35);
  background: linear-gradient(90deg, rgba(200, 170, 110, .2), rgba(10, 20, 40, .55)); }
.sel-linha.vago { border-color: var(--hx-cinza-3); background: rgba(10, 20, 40, .55); }
.sel-ret { flex: none; display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; overflow: hidden; background: var(--hx-azul);
  box-shadow: 0 0 0 2px var(--hx-preto), 0 0 0 4px var(--hx-ouro-3), 0 8px 20px rgba(0, 0, 0, .5); color: var(--hx-ouro-5); }
.sel-ret img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.12); }
.sel-linha.vago .sel-ret { box-shadow: 0 0 0 2px var(--hx-preto), 0 0 0 3px var(--hx-cinza-3); }
.sel-linha-txt { display: grid; gap: 3px; min-width: 0; }
.sel-linha-txt small { font: 700 11px var(--corpo); letter-spacing: .16em; text-transform: uppercase; color: var(--hx-ouro-3); }
.sel-linha-txt b { font: 700 20px/1.1 var(--titulo); letter-spacing: .04em; text-transform: uppercase; color: var(--hx-ouro-1); }
.sel-linha-txt b.longo { font-size: 16px; letter-spacing: .02em; }
.sel-linha-txt .sel-pos { display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--corpo); color: var(--hx-cinza-1); }
.sel-linha-txt .sel-pos svg { width: 18px; height: 18px; color: var(--hx-ouro-3); }
.sel-linha.vago .sel-linha-txt b { font: 600 15px var(--corpo); letter-spacing: 0; text-transform: none; color: var(--hx-cinza-1); }
.sel-meta { margin: 14px 2px 0; font-size: 14px; line-height: 1.6; color: var(--hx-cinza-1); }
.sel-meta strong { color: var(--hx-ouro-2); font-weight: 700; }
.sel-meta .sel-titulo { display: block; color: var(--hx-ouro-2); font-style: italic; }
.selecao.travando .sel-linha:not(.vago) .sel-ret { animation: sel-trava .75s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes sel-trava { 45% { transform: scale(1.08); filter: brightness(1.3); box-shadow: 0 0 0 2px var(--hx-preto), 0 0 0 5px var(--hx-ouro-1), 0 8px 20px rgba(0, 0, 0, .5); } }
/* Grade: posições e busca em cima, retratos quadrados com o nome embaixo. */
.sel-centro { grid-area: centro; align-self: stretch; min-width: 0; min-height: 300px; padding: 14px 18px 20px; border: 1px solid rgba(120, 90, 40, .9);
  background: linear-gradient(rgba(1, 10, 19, .82), rgba(1, 10, 19, .72)); box-shadow: inset 0 0 0 1px rgba(1, 10, 19, .8); }
.sel-ferramentas { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 14px; margin-bottom: 18px;
  border-bottom: 1px solid rgba(120, 90, 40, .55); }
.sel-posicoes { display: flex; gap: 2px; }
.sel-pos-btn { display: grid; place-items: center; width: 44px; height: 44px; padding: 0; border: 1px solid transparent; border-radius: 2px; background: none; color: var(--hx-cinza-1); cursor: pointer; }
.sel-pos-btn svg { width: 26px; height: 26px; }
.sel-pos-btn:hover { color: var(--hx-ouro-1); }
.sel-pos-btn[aria-pressed="true"] { color: var(--hx-ouro-3); border-color: var(--hx-ouro-5); background: rgba(200, 170, 110, .12); }
.sel-busca { flex: 0 1 240px; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border: 1px solid var(--hx-cinza-3); background: var(--hx-preto); color: var(--hx-cinza-1); }
.sel-busca:focus-within { border-color: var(--hx-ouro-3); color: var(--hx-ouro-3); }
.sel-busca input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--hx-ouro-1); font: 15px var(--corpo); caret-color: var(--hx-ouro-3); }
.sel-busca input::placeholder { color: var(--hx-cinza-1); }
.sel-grade { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, 86px); gap: 16px 12px; }
.sel-tile { display: grid; gap: 6px; width: 100%; padding: 0; border: 0; background: none; color: var(--hx-cinza-1); cursor: pointer; text-align: center; }
.sel-tile img { display: block; width: 86px; height: 86px; border: 1px solid var(--hx-cinza-3); background: var(--hx-azul); transition: border-color .15s, filter .15s; }
.sel-tile span { font: 600 13px/1.2 var(--corpo); overflow-wrap: anywhere; }
.sel-tile:hover img { border-color: var(--hx-ouro-2); filter: brightness(1.15); }
.sel-tile:hover span { color: var(--hx-ouro-1); }
.sel-tile[aria-pressed="true"] img { border: 2px solid var(--hx-ouro-3); box-shadow: 0 0 0 1px var(--hx-preto), 0 6px 16px rgba(0, 0, 0, .6); }
.sel-tile[aria-pressed="true"] span { color: var(--hx-ouro-1); font-weight: 700; }
.sel-tile:focus-visible { outline: 0; }
.sel-tile:focus-visible img { outline: 2px solid var(--hx-ciano); outline-offset: 3px; }
.sel-vazio { margin: 10px 0 4px; font-size: 15px; color: var(--hx-cinza-1); }
/* Inimigos: as cinco matchups mais difíceis do guia marcado, espelhadas como o time inimigo; tocar trava e abre a matchup. */
.sel-inimigos { grid-area: inimigos; align-self: start; }
.sel-inimigos ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.sel-inimigo { display: flex; align-items: center; justify-content: flex-end; gap: 12px; width: 100%; min-height: 64px; padding: 6px 8px 6px 12px; border: 1px solid transparent; border-radius: 4px;
  background: rgba(10, 20, 40, .55); color: var(--hx-ouro-1); cursor: pointer; text-align: right; }
.sel-inimigo:hover { border-color: rgba(200, 170, 110, .45); background: linear-gradient(270deg, rgba(200, 170, 110, .16), rgba(10, 20, 40, .55)); }
.sel-inimigo:focus-visible { outline: 2px solid var(--hx-ciano); outline-offset: 2px; }
.sel-inimigo img { flex: none; width: 50px; height: 50px; border-radius: 50%; box-shadow: 0 0 0 2px var(--hx-preto), 0 0 0 3px var(--hx-ouro-5); }
.sel-inimigo b { display: block; font: 700 15px/1.2 var(--titulo); letter-spacing: .04em; text-transform: uppercase; }
.sel-inimigo small { display: inline-flex; align-items: center; gap: 6px; font: 600 12.5px var(--corpo); color: var(--hx-cinza-1); }
.sel-inimigo small i { width: 9px; height: 9px; border-radius: 50%; background: var(--cor); }
.sel-inimigo.vago { cursor: default; background: rgba(10, 20, 40, .4); }
.sel-inimigo.vago span.sel-vago-ret { flex: none; width: 50px; height: 50px; border-radius: 50%; border: 1px dashed var(--hx-cinza-3); }
.sel-ini-nota { margin: 10px 2px 0; font-size: 13px; line-height: 1.5; text-align: right; color: var(--hx-cinza-1); }
/* Confirmar: o botão de travar do cliente, moldura dourada em degradê, fundo azul-escuro e as pontas em seta da casa. */
.sel-acao { grid-area: acao; position: sticky; bottom: 0; z-index: 2; display: grid; justify-items: center; gap: 10px; padding: 16px 0 max(20px, env(safe-area-inset-bottom, 0px));
  background: linear-gradient(transparent, rgba(1, 10, 19, .92) 45%); }
.sel-travar { position: relative; display: grid; place-items: center; min-width: 260px; height: 54px; padding: 0 44px; border: 0; background: none; cursor: pointer;
  color: var(--hx-ouro-2); font: 700 19px/1 var(--titulo); letter-spacing: .14em; text-transform: uppercase; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .55)); transition: color .15s; }
.sel-travar::before, .sel-travar::after { content: ""; position: absolute; }
.sel-travar::before { inset: 0; background: linear-gradient(var(--hx-ouro-3), var(--hx-ouro-5)); clip-path: polygon(20px 0, calc(100% - 20px) 0, 100% 50%, calc(100% - 20px) 100%, 20px 100%, 0 50%); }
.sel-travar::after { inset: 2px; background: linear-gradient(#1e2328, var(--hx-azul)); clip-path: polygon(19px 0, calc(100% - 19px) 0, 100% 50%, calc(100% - 19px) 100%, 19px 100%, 0 50%); transition: background .2s; }
.sel-travar span { position: relative; z-index: 1; }
.sel-travar:hover:not(:disabled) { color: var(--hx-ouro-1); }
.sel-travar:hover:not(:disabled)::after { background: linear-gradient(#2a3036, #10233f); }
.sel-travar:active:not(:disabled) { transform: scale(.97); }
.sel-travar:focus-visible { outline: 2px solid var(--hx-ciano); outline-offset: 4px; border-radius: 4px; }
.sel-travar:disabled { cursor: not-allowed; color: #5b5a56; filter: none; font-size: 16px; letter-spacing: .1em; }
.sel-travar:disabled::before { background: var(--hx-cinza-3); }
.sel-travar:disabled::after { background: var(--hx-preto); }
.selecao.travando .sel-travar { color: var(--hx-ouro-1); }
.selecao.travando .sel-travar::after { animation: sel-clarao .75s cubic-bezier(.16, 1, .3, 1); }
@keyframes sel-clarao { 40% { background: linear-gradient(#5a4a2a, #1e2a3e); } }
.sel-dica { max-width: 460px; margin: 0; font-size: 13.5px; line-height: 1.5; text-align: center; color: var(--hx-cinza-1); }
.selecao:not(.primeira) .sel-dica { display: none; }
.sel-fecha { position: fixed; top: calc(var(--barra) + 14px); right: 16px; z-index: 3; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%;
  border: 1px solid var(--hx-ouro-5); background: var(--hx-preto); color: var(--hx-ouro-2); cursor: pointer; }
.sel-fecha:hover { border-color: var(--hx-ouro-3); color: var(--hx-ouro-1); }
.sel-fecha:focus-visible { outline: 2px solid var(--hx-ciano); outline-offset: 3px; }
.selecao.primeira .sel-fecha { display: none; }
body.sem-rolar { overflow: hidden; }
@media (max-width: 999px) {
  .sel-palco { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto auto auto 1fr; grid-template-areas: "cabeca" "time" "centro" "inimigos" "acao"; gap: 16px; padding-top: 20px; }
  .selecao h2 { font-size: 22px; padding: 0 44px; }
  .sel-ret { width: 60px; height: 60px; }
  .sel-linha-txt b { font-size: 19px; }
  .sel-meta { margin-top: 10px; font-size: 13px; }
  .sel-centro { min-height: 0; padding: 12px 12px 16px; }
  .sel-ferramentas { gap: 10px; padding-bottom: 12px; margin-bottom: 14px; }
  .sel-busca { flex: 1 1 100%; height: 44px; }
  .sel-posicoes { width: 100%; justify-content: space-between; }
  .sel-grade { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 14px 10px; }
  .sel-tile img { width: 100%; height: auto; aspect-ratio: 1; }
  .sel-tile span { font-size: 12px; }
  .sel-inimigos h3, .sel-ini-nota { text-align: left; }
  .sel-inimigos ul { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
  .sel-inimigos li { flex: 0 0 auto; }
  .sel-inimigo { flex-direction: column-reverse; justify-content: flex-start; gap: 6px; width: 86px; min-height: 0; padding: 10px 4px; text-align: center; }
  .sel-inimigo b { font-size: 12px; }
  .sel-inimigo small { font-size: 11px; justify-content: center; }
  .sel-travar { min-width: min(100%, 320px); }
  .sel-dica { display: none; }  /* na barra fixa do celular ela cobriria os inimigos */
}
@media (prefers-reduced-motion: reduce) {
  .sel-fundo img, .sel-tile img, .sel-travar, .sel-travar::after { transition: none; }
  .selecao.travando .sel-ret, .selecao.travando .sel-travar::after { animation: none; }
  .selecao.travando .sel-fundo img { transform: none; }
}
.dica { margin: 6px 10px 4px; padding-top: 8px; border-top: 1px solid var(--linha); font-size: 13px; color: var(--texto-baixo); }
.acoes { margin-left: auto; display: flex; gap: 8px; }
.tema, .som, .lingua { width: 44px; height: 44px; flex: none; display: grid; place-items: center; cursor: pointer; border-radius: 50%; border: 1px solid var(--linha-forte); background: transparent; color: var(--acento-vivo); }
.tema:hover, .som:hover, .lingua:hover { background: var(--painel-alto); }
.lingua { font: 700 13px var(--corpo); letter-spacing: .04em; }
.trocar:disabled { cursor: default; }
.trocar:disabled:hover { border-color: transparent; background: none; }
.trocar:disabled svg { display: none; }
.som .mudo { display: none; }
.som[aria-pressed="false"] .ligado { display: none; }
.som[aria-pressed="false"] .mudo { display: block; }
.tema .sol { display: none; }
:root[data-tema="claro"] .tema .sol { display: block; }
:root[data-tema="claro"] .tema .lua { display: none; }

/* Palco: a lista fixa à esquerda e o matchup inteiro à direita, sem precisar rolar. */
.palco {
  max-width: 1320px; margin: 0 auto; padding: 20px var(--borda) 64px;
  display: grid; gap: 24px; grid-template-columns: 440px minmax(0, 1fr); align-items: start;
}
.detalhe { min-width: 0; display: grid; gap: 16px; }
/* Páginas do guia (as outras abas da planilha): barra de abas embaixo do topo e o conteúdo no lugar das matchups. */
.paginas { max-width: 1320px; margin: 0 auto; padding: 14px var(--borda) 0; }
.paginas[hidden] { display: none; }
.paginas ul { position: relative; list-style: none; margin: 0; padding: 0 0 2px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.paginas ul::-webkit-scrollbar { display: none; }
.paginas button { flex: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linha); background: var(--painel); color: var(--texto-baixo); font: 700 14px var(--corpo); cursor: pointer; }
.paginas button:hover { color: var(--texto); border-color: var(--linha-forte); }
.paginas button[aria-current="page"] { color: var(--acento-vivo); border-color: var(--acento-vivo); background: var(--painel-alto); }
.paginas button svg { color: currentColor; }
:root.em-pagina .palco { display: none; }
.pagina { max-width: 1320px; margin: 0 auto; padding: 20px var(--borda) 64px; display: grid; gap: 20px; }
.pagina[hidden] { display: none; }
.pagina { grid-template-columns: minmax(0, 1fr); }
.pagina > .rodape { grid-column: auto; grid-row: auto; margin-top: 12px; }
.pagina > h2 { margin: 4px 0 0; font: 800 clamp(24px, 3vw, 34px)/1.1 var(--titulo); letter-spacing: .03em; color: var(--acento-vivo); }
.pagina .lead { margin: -8px 0 0; font-size: 15px; color: var(--texto-baixo); }
.pg-bloco { min-width: 0; padding: 20px 22px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
.pg-bloco > h3, .pg-grupo > h3 { overflow-wrap: anywhere; margin: 0 0 12px; font: 700 15px var(--titulo); letter-spacing: .12em; text-transform: uppercase; color: var(--acento-vivo); }
.pg-bloco p { margin: 0; font-size: 16px; line-height: 1.6; white-space: pre-line; overflow-wrap: anywhere; }
.pg-bloco a, .pg-card a, .pg-tabela a { color: var(--acento-vivo); text-underline-offset: 3px; overflow-wrap: anywhere; }
.pg-bloco.aviso { background: none; border-style: dashed; }
.pg-bloco.aviso p { color: var(--texto-baixo); font-size: 15px; }
.pg-lista { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.pg-lista li { font-size: 16px; line-height: 1.5; }
.pg-patch { display: grid; gap: 14px; }
.pg-patch .versao { display: inline-block; margin-left: 8px; padding: 2px 10px; border-radius: 999px; background: var(--painel-alto); border: 1px solid var(--linha-forte); font: 700 13px var(--corpo); color: var(--texto); vertical-align: 2px; letter-spacing: 0; text-transform: none; }
.pg-patch dl { margin: 0; display: grid; gap: 10px; }
.pg-patch dt { font-weight: 700; font-size: 16px; }
.pg-patch dd { margin: 2px 0 0; font-size: 15px; line-height: 1.5; color: var(--texto-baixo); }
.pg-duas { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: start; }
.pg-grupo { display: grid; gap: 12px; }
.pg-grupo > h3 { margin: 8px 0 0; }
.pg-cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); align-items: start; }
.pg-card { min-width: 0; padding: 14px 16px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
.pg-card .topo { display: flex; align-items: center; gap: 12px; }
.pg-card .topo img { width: 44px; height: 44px; flex: none; border-radius: 8px; box-shadow: 0 0 0 1px var(--linha-forte); }
.pg-card .topo.runa img { border-radius: 50%; box-shadow: none; background: #0b0b0b; }
.pg-card .topo b { font-size: 17px; line-height: 1.25; }
.pg-card .texto { margin: 10px 0 0; font-size: 15px; line-height: 1.55; white-space: pre-line; color: var(--texto); }
.pg-card .texto.curto { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; }
.pg-card .mais { margin-top: 6px; min-height: 36px; padding: 0; border: 0; background: none; color: var(--acento-vivo); font: 700 14px var(--corpo); cursor: pointer; }
.pg-card.sem-texto { padding: 10px 14px; background: none; }
.pg-card.sem-texto .topo img { width: 34px; height: 34px; }
.pg-card.sem-texto .topo b { font-size: 15px; color: var(--texto-baixo); font-weight: 600; }
/* Itens: um cartão por item, com o momento da build (1º, 2º, 3º, 4º+) em abas */
.estagios { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 12px 0 0; }
.estagios button { display: flex; align-items: center; justify-content: center; gap: 5px; min-width: 0; min-height: 36px; padding: 0 6px; white-space: nowrap; border-radius: 999px; border: 1px solid var(--linha-forte); background: none; color: var(--texto); font: 700 13px var(--corpo); cursor: pointer; }
.estagios button.viavel::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--acento-vivo); }
.estagios button[aria-pressed="true"] { background: var(--painel-alto); border-color: var(--acento-vivo); color: var(--acento-vivo); }
.estagios button:disabled { opacity: .35; cursor: default; border-style: dashed; }
.estagios img { width: 20px; height: 20px; border-radius: 4px; }
.legenda-estagios { margin: 0; font-size: 14px; color: var(--texto-baixo); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.legenda-estagios i { width: 8px; height: 8px; border-radius: 50%; background: var(--acento-vivo); }
/* Runas: uma seção por árvore, uma linha por nível */
.arvore > h3 { display: flex; align-items: center; gap: 10px; }
.arvore > h3 img { width: 28px; height: 28px; }
.nivel { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); align-items: start; }
.nivel + .nivel { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--linha); }
/* Setups alternativos */
.setup-alt dl { margin: 12px 0 0; display: grid; gap: 10px; }
.setup-alt dt { font: 700 12px var(--corpo); letter-spacing: .1em; text-transform: uppercase; color: var(--texto-baixo); }
.setup-alt dd { margin: 2px 0 0; font-size: 15px; line-height: 1.5; white-space: pre-line; }
/* Tabelas (criadores): rolam por dentro no celular, a página não */
.pg-tabela { overflow-x: auto; }
.pg-tabela table { width: 100%; border-collapse: collapse; font-size: 15px; }
.pg-tabela th, .pg-tabela td { padding: 9px 14px 9px 0; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; white-space: nowrap; }
.pg-tabela th { font: 700 12px var(--corpo); letter-spacing: .08em; text-transform: uppercase; color: var(--texto-baixo); }
.pg-tabela td.vazio { color: var(--texto-baixo); }
.pecas-soltas { grid-template-columns: repeat(auto-fill, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.pecas-soltas .pg-card { padding: 10px 12px; }
.pg-imagens { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.pg-imagens img { width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--linha); }
.pg-imagens figure { margin: 0; display: grid; gap: 8px; align-content: start; }
.pg-imagens figcaption { font: 700 13px var(--corpo); letter-spacing: .1em; text-transform: uppercase; color: var(--texto-baixo); }
/* Seção da planilha: blocos seguidos sem caixa dentro de caixa; ícones pequenos (runas citadas no texto) em fila no tamanho original. */
.pg-secao.pg-bloco > * + * { margin-top: 12px; }
.pg-secao h4 { margin: 20px 0 0; font: 700 13px var(--corpo); letter-spacing: .12em; text-transform: uppercase; color: var(--acento); }
.pg-secao > .pg-bloco, .pg-secao > .pg-grupo { padding: 0; border: 0; background: none; }
/* Imagens grandes da planilha (barras de poder, capturas) no tamanho de leitura, sem esticar a seção inteira. */
.pg-secao .pg-imagens { grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), max-content)); }
.pg-secao .pg-imagens img { width: auto; max-width: 100%; max-height: 340px; }
.pg-imagens.pg-icones { display: flex; flex-wrap: wrap; gap: 8px; }
.pg-imagens.pg-icones img { width: auto; border: 0; }
.pg-marcas li { position: relative; padding-left: 20px; }
.pg-marcas li::before { content: ""; position: absolute; left: 3px; top: .62em; width: 7px; height: 7px; transform: rotate(45deg); background: var(--destaque); }
/* Aviso do autor sobre a planilha (ex.: "não está em dia"): o mesmo tracejado dos avisos das páginas, sem faixa colorida de lado. */
.aviso-fonte { max-width: 1288px; margin: 12px auto; padding: 10px 16px; border-radius: 8px; border: 1px dashed var(--linha-forte); background: var(--painel); color: var(--texto-baixo); font-size: 14px; }
.runa-original { max-width: 100%; width: auto; max-height: 160px; height: auto; display: block; margin: 10px 0; border-radius: 6px; }
.build li.nota { white-space: pre-line; }
.feiticos-guia { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--linha); }
.feiticos-guia p { white-space: pre-line; color: var(--texto-baixo); font-size: 14px; }
@media (max-width: 600px) { .aviso-fonte { margin: 10px var(--borda); } }
.pessoas { grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.pessoa .topo { flex-wrap: wrap; gap: 6px 10px; }
.pessoa .topo b { margin-right: auto; }
.selo-meta { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--linha-forte); font-size: 12px; font-weight: 700; color: var(--texto-baixo); white-space: nowrap; }
.pessoa-links { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.pessoa-links a { display: flex; align-items: center; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--linha-forte); background: var(--painel-alto); color: var(--texto); font-size: 13px; font-weight: 700; text-decoration: none; }
.pessoa-links a:hover { border-color: var(--acento-vivo); color: var(--acento-vivo); }
.pessoa-links .so-texto { width: 100%; font-size: 14px; color: var(--texto); }
.pessoa-links .so-texto span { color: var(--texto-baixo); }
/* Campeão 3D (Akshan, Mordekaiser, Illaoi): só em tela larga, numa terceira coluna à direita, sobre o fundo do próprio site. */
.akshan3d { display: none; }
@media (min-width: 1720px) {
  :root.com-3d .bar-in { max-width: 1760px; }
  :root.com-3d .palco { max-width: 1760px; grid-template-columns: 440px minmax(0, 1fr) 380px; }
  :root.com-3d .akshan3d {
    display: grid; grid-template-rows: minmax(0, 1fr) auto; gap: 12px;
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barra) + 16px);
    /* Desconta a barra de páginas do guia (Matchups, Sobre, Itens...), quando ela aparece. */
    height: calc(100vh - var(--barra) - 48px - var(--abas, 0px)); min-height: 560px;
  }
}
.akshan3d canvas { display: block; width: 100%; height: 100%; min-height: 0; cursor: grab; touch-action: none; opacity: 0; transition: opacity .8s ease; }
.akshan3d canvas.girando { cursor: grabbing; }
.akshan3d.pronto canvas, .akshan3d.pronto .anim3d { opacity: 1; }
.carrega3d { position: absolute; left: 0; right: 0; top: 45%; margin: 0; text-align: center; font: 600 13px var(--corpo); letter-spacing: .08em; color: var(--texto-baixo); animation: pulsa3d 1.4s ease-in-out infinite alternate; }
.akshan3d.pronto .carrega3d { display: none; }
@keyframes pulsa3d { from { opacity: .35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .carrega3d { animation: none; } }
.anim3d { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; opacity: 0; transition: opacity .8s ease; }
.anim3d button { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--linha-forte); background: var(--painel); color: var(--texto); font: 700 13px var(--corpo); cursor: pointer; }
.anim3d button.tecla { min-width: 36px; padding: 0; font-family: var(--titulo); }
.anim3d button:hover { background: var(--painel-alto); }
.anim3d button[aria-pressed="true"] { border-color: var(--acento-vivo); color: var(--acento-vivo); }
/* Esconder fica no canto da caixa; escondido, sobra uma alça na borda direita da tela para trazer de volta. */
.fecha3d { position: absolute; top: 0; right: 0; z-index: 2; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid var(--linha-forte); background: var(--painel); color: var(--texto-baixo); cursor: pointer; opacity: 0; transition: opacity .8s ease; }
.akshan3d.pronto .fecha3d { opacity: 1; }
.fecha3d:hover { color: var(--texto); background: var(--painel-alto); }
.abre3d { position: fixed; right: 0; top: 50%; z-index: 5; transform: translateY(-50%); display: flex; align-items: center; gap: 8px; padding: 16px 9px; border: 1px solid var(--linha-forte); border-right: 0; border-radius: 10px 0 0 10px; background: var(--painel); color: var(--acento-vivo); font: 700 13px var(--titulo); letter-spacing: .14em; writing-mode: vertical-rl; cursor: pointer; }
.abre3d:hover { background: var(--painel-alto); }
.abre3d[hidden] { display: none; }
.duelo { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { position: relative; overflow: hidden; height: 240px; border-radius: 10px; background: var(--painel); border: 1px solid var(--linha-forte); box-shadow: var(--sombra); }
.card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
#artEle, #artVoce { position: absolute; inset: 0; }
#trocarImg { display: contents; }
.card::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to top, rgba(8, 8, 6, .9) 0%, rgba(8, 8, 6, .5) 34%, transparent 62%); }
.card .selo { position: absolute; z-index: 2; top: 12px; left: 12px; padding: 3px 10px; border-radius: 4px; font: 700 12px/1.4 var(--titulo); letter-spacing: .12em; text-transform: uppercase; background: var(--destaque-arte); color: #111; }
.skin-btn { position: absolute; z-index: 3; top: 10px; right: 10px; display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(10, 10, 14, .62); color: var(--branco-arte, #f6f3ea); font: 700 12px var(--corpo); letter-spacing: .04em; cursor: pointer; backdrop-filter: blur(4px); }
.skin-btn[hidden] { display: none; }
/* Setas de trocar skin, como na seleção de campeões do jogo; a da direita fica longe do círculo VS. */
.skin-seta { position: absolute; z-index: 3; top: 50%; width: 44px; height: 56px; margin-top: -28px; display: grid; place-items: center; padding: 0; border: 0; background: none; color: var(--destaque-arte); cursor: pointer; filter: drop-shadow(0 1px 3px rgba(0, 0, 0, .85)); opacity: .85; transition: opacity .15s, transform .15s; }
.skin-seta[hidden] { display: none; }
.skin-seta:hover { opacity: 1; }
.skin-seta.ant { left: 4px; }
.skin-seta.ant svg { transform: scaleX(-1); }
.skin-seta.prox { right: 40px; }
.skin-seta.ant:active { transform: translateX(-2px); }
.skin-seta.prox:active { transform: translateX(2px); }
@media (max-width: 900px) { .skin-seta { width: 32px; } .skin-seta svg { width: 16px; height: 28px; } .skin-seta.prox { right: 26px; } }
/* Chromas: bolinhas com as cores do chroma, embaixo da skin escolhida no menu. */
.skin-chromas { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 6px 8px 54px; }
.skin-menu .skin-chromas button { width: 26px; min-height: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid var(--linha-forte); background: linear-gradient(135deg, var(--c1) 50%, var(--c2) 50%); }
.skin-menu .skin-chromas button[aria-pressed="true"] { border-color: var(--acento-vivo); box-shadow: 0 0 0 2px var(--painel), 0 0 0 4px var(--acento-vivo); }
.skin-menu .skin-chromas button.base { background: var(--painel-alto); display: grid; place-items: center; color: var(--texto-baixo); font: 700 11px var(--corpo); }
/* Toque: área de 44px sem mudar o desenho. */
.skin-menu .skin-chromas button { position: relative; }
.skin-menu .skin-chromas button::after { content: ""; position: absolute; inset: -9px; }
@media (max-width: 900px) { .skin-btn { width: 32px; padding: 0; justify-content: center; } .skin-btn span { display: none; } }
.skin-btn:hover { border-color: var(--destaque-arte); }
.skin-btn svg { color: var(--destaque-arte); }
/* Toque: a área do botão cresce até 44px sem mudar o desenho. */
.skin-btn::after { content: ""; position: absolute; inset: -6px; }
/* O menu fica preso à tela (fixed), não ao card: o card corta o que passa da borda dele. A posição vem do JS. */
.skin-menu { position: fixed; z-index: 30; display: grid; align-content: start; gap: 4px; width: min(240px, calc(100vw - 24px)); overflow-y: auto; overscroll-behavior: contain; padding: 6px; border-radius: 12px; border: 1px solid var(--linha-forte); background: var(--painel); box-shadow: var(--sombra); }
.skin-menu[hidden] { display: none; }
.skin-menu button { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 4px 10px 4px 4px; border-radius: 8px; border: 0; background: none; color: var(--texto); font: 600 14px var(--corpo); text-align: left; cursor: pointer; }
.skin-menu button:hover, .skin-menu button[aria-pressed="true"] { background: var(--painel-alto); }
.skin-menu button[aria-pressed="true"] { color: var(--acento-vivo); }
.skin-menu img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid var(--linha-forte); }
.card.inimigo .selo { left: auto; right: 12px; background: #f6f3ea; color: #111; }
/* Cooldowns do inimigo: botão no card dele, painel logo abaixo dos cards (rola junto com a página) */
.cd-btn { position: absolute; z-index: 3; top: 10px; left: 10px; display: flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px 0 9px; border-radius: 999px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(10, 10, 14, .62); color: #f6f3ea; font: 700 12px var(--corpo); letter-spacing: .04em; cursor: pointer; backdrop-filter: blur(4px); }
.cd-btn[hidden] { display: none; }
.cd-btn::after { content: ""; position: absolute; inset: -6px; }
.cd-btn:hover, .cd-btn[aria-expanded="true"] { border-color: var(--destaque-arte); }
.cd-btn svg { flex: none; color: var(--destaque-arte); }
.cds-painel { position: absolute; z-index: 20; top: calc(100% + 8px); right: 0; width: min(420px, 100%); max-height: min(70vh, 560px); overflow-y: auto; overscroll-behavior: contain; padding: 0 14px 8px; border-radius: 12px; border: 1px solid var(--linha-forte); background: var(--painel); box-shadow: var(--sombra); }
.cds-painel[hidden] { display: none; }
.cds-topo { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; margin: 0 -14px; padding: 8px 6px 8px 14px; background: var(--painel); border-bottom: 1px solid var(--linha); }
.cds-topo h3 { flex: 1; margin: 0; font: 700 14px var(--titulo); letter-spacing: .1em; text-transform: uppercase; color: var(--acento-vivo); }
.cds-topo button { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 0; background: none; color: var(--texto-baixo); cursor: pointer; }
.cds-topo button:hover { color: var(--texto); background: var(--painel-alto); }
.cds-painel ul { list-style: none; margin: 0; padding: 0; }
.cds-painel li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--linha); }
.cds-painel li:last-child { border-bottom: 0; }
.cds-painel .hab { position: relative; grid-row: span 2; width: 40px; height: 40px; border-radius: 8px; overflow: hidden; background: var(--painel-alto); box-shadow: inset 0 0 0 1px var(--linha-forte); }
.cds-painel .hab img { display: block; width: 100%; height: 100%; }
.cds-painel .hab b { position: absolute; right: 0; bottom: 0; min-width: 16px; padding: 0 3px; border-radius: 4px 0 0 0; background: rgba(8, 8, 6, .85); color: #f6f3ea; font: 800 11px/16px var(--corpo); text-align: center; }
.cds-painel .hab.so-letra { display: grid; place-items: center; }
.cds-painel .hab.so-letra b { position: static; background: none; color: var(--acento-vivo); font-size: 16px; }
.cds-painel .nome { min-width: 0; font-size: 13px; line-height: 1.3; color: var(--texto-baixo); }
.cds-painel .nome strong { margin-right: 6px; font-size: 14px; color: var(--texto); }
.cds-painel .tempo { font: 700 16px/1.3 var(--corpo); color: var(--texto); font-variant-numeric: tabular-nums; }
.cds-painel .tempo i { font-style: normal; font-weight: 400; color: var(--texto-baixo); padding: 0 3px; }
.cds-painel .obs { grid-column: 2; margin: 2px 0 0; font-size: 13px; line-height: 1.4; color: var(--texto-baixo); font-style: italic; }
.cds-painel li.forma { display: block; padding: 12px 0 2px; border-bottom: 0; font: 700 12px var(--corpo); letter-spacing: .08em; text-transform: uppercase; color: var(--acento-vivo); }
.cds-painel li.nota { display: block; font-size: 14px; line-height: 1.45; color: var(--texto-baixo); }
@media (max-width: 520px) { .cd-btn .lbl { display: none; } .cd-btn { padding: 0 8px; } }
.card .quem { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 0 16px 14px; color: #f6f3ea; }
.card.inimigo .quem { text-align: right; }
.quem .t { margin: 4px 0 0; font-size: 14px; line-height: 1.3; color: #e4ddcf; }
.quem .n { margin: 0; font: 800 clamp(24px, 2.3vw, 32px)/1.05 var(--titulo); letter-spacing: .02em; color: var(--sobre-arte); overflow-wrap: break-word; text-wrap: balance; }
.quem .n.longo { font-size: clamp(19px, 1.8vw, 25px); letter-spacing: 0; }
.quem .guia { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 14px; color: #e4ddcf; }
.quem .guia.sim { color: var(--destaque-arte); }
.quem .guia > i { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
.quem .guia.dif { font-weight: 700; color: #f6f3ea; }
.quem .guia.dif > i { width: 11px; height: 11px; background: var(--dif); box-shadow: 0 0 0 2px rgba(0, 0, 0, .45); }
.quem .guia.sim > i { background: currentColor; }
.quem .guia .pips i { background: rgba(255, 255, 255, .25); }
.quem .guia .pips i.on { background: var(--destaque-arte); }

/* Botão de travar: o VS entre as duas artes */
.travar {
  position: absolute; z-index: 3; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 66px; height: 66px; padding: 0; border: 3px solid var(--fundo); border-radius: 50%; cursor: pointer;
  display: grid; place-items: center; font: 800 21px/1 var(--titulo); letter-spacing: .04em; color: #111;
  background: linear-gradient(180deg, var(--botao-1), var(--botao-2)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), 0 6px 18px rgba(0, 0, 0, .45);
}
.travar:hover { filter: brightness(1.08); }
.travar:active { transform: translate(-50%, -50%) scale(.95); }

/* Lista de inimigos */
.anel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barra) + 16px); min-width: 0; padding: 18px 20px 22px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
.anel h2 { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 0 0 14px; font: 700 22px/1.2 var(--titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-vivo); text-align: center; }
.anel h2 svg { flex: none; color: var(--acento); }
.busca { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 8px; background: var(--fundo); border: 1px solid var(--linha-forte); color: var(--texto-baixo); }
.busca:focus-within { border-color: var(--acento-vivo); color: var(--acento-vivo); }
.busca input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; color: var(--texto); font: 16px var(--corpo); }
.busca input::placeholder { color: var(--texto-baixo); }
.busca .conta { font: 700 13px var(--corpo); color: var(--acento); font-variant-numeric: tabular-nums; white-space: nowrap; }
.filtros { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 400px; margin: 12px auto 4px; }
.chip {
  min-height: 44px; padding: 0 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;
  background: transparent; border: 1px solid var(--linha-forte); color: var(--texto); font: 600 14px var(--corpo);
}
.chip img { width: 20px; height: 20px; border-radius: 4px; }
.chip .cor-dif { width: 11px; height: 11px; border-radius: 50%; background: var(--dif); box-shadow: 0 0 0 1.5px rgba(0, 0, 0, .35); }
.chip:hover { border-color: var(--acento-vivo); }
.chip[aria-pressed="true"] { background: var(--destaque); border-color: var(--destaque); color: var(--tinta-botao); }
.roda { position: relative; width: min(100%, 400px); aspect-ratio: 1; margin: 12px auto 0; border-radius: 50%; }
/* Mira da Punição (R do Akshan), como no jogo: losango que trava no alvo, círculo por dentro e setas laterais apontando para o centro. */
.mira { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.mira .aro { fill: none; stroke: var(--acento); stroke-width: 1.5px; }
.mira .aro.fino { stroke-width: 1px; opacity: .45; }
.mira .setas { fill: var(--acento-vivo); }
.alvo { position: absolute; z-index: 1; left: 50%; top: 50%; height: 70%; aspect-ratio: 1; transform: translate(-50%, -50%); overflow: visible; pointer-events: none; filter: drop-shadow(0 0 4px var(--mira-brilho, rgba(255, 214, 120, .75))) drop-shadow(0 1px 3px rgba(0, 0, 0, .6)); }
.alvo .losango { fill: none; stroke: var(--mira, #ffe39a); stroke-width: 3.5px; }
.alvo .aro-alvo { fill: none; stroke: #fff4d6; stroke-width: 1px; opacity: .6; }
.alvo .setas-alvo { fill: #fff4d6; opacity: .85; }
.alvo.travando { animation: trava-alvo .5s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes trava-alvo { from { opacity: 0; transform: translate(-50%, -50%) scale(1.35); } }
:root:not([data-guia="akshan"]) .alvo, :root:not([data-guia="akshan"]) .seta-mira { display: none; }
/* As setas da mira do Akshan são anterior/próximo de verdade. */
.seta-mira { position: absolute; z-index: 2; top: 50%; width: 44px; height: 44px; margin-top: -22px; display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; color: var(--acento-vivo); }
.seta-mira.esq { left: -16px; }
.seta-mira.dir { right: -16px; }
.seta-mira:hover { color: var(--destaque); }
.seta-mira svg { width: 15px; height: 24px; }
.lista {
  position: absolute; inset: 12% 12% 7%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--acento) transparent;
  -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent);
  display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 9px; align-content: start; padding: 12px 12px 28px;
}
.pick { position: relative; aspect-ratio: 1; padding: 0; border: 1px solid var(--linha-forte); border-radius: 6px; cursor: pointer; background: var(--painel-alto); }
.pick img { width: 100%; height: 100%; border-radius: 5px; object-fit: cover; }
.pick:has(img.falhou)::after { content: attr(data-ini); position: absolute; inset: 0; display: grid; place-items: center; font: 700 20px var(--titulo); color: var(--texto-baixo); }
/* Dificuldade da matchup = a cor da célula do campeão na planilha do Peteruso. */
:root {
  --difc-muito_facil: #22d3ee; --difc-facil: #34a853; --difc-medio: #fbbc04; --difc-dificil: #e06666; --difc-muito_dificil: #c0281c;
  --dif-muito_facil: var(--difc-muito_facil); --dif-facil: var(--difc-facil); --dif-medio: var(--difc-medio); --dif-dificil: var(--difc-dificil); --dif-muito_dificil: var(--difc-muito_dificil);
}
:root[data-tema="claro"] { --dif-muito_facil: #0e7490; --dif-facil: #15803d; --dif-medio: #b45309; --dif-dificil: #dc2626; --dif-muito_dificil: #7f1d1d; }
.pick.tem-dif { border: 2px solid var(--dif); }
.pick .nivel { position: absolute; z-index: 1; right: 2px; bottom: 2px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 4px; background: rgba(5, 8, 6, .82); color: #f2f6f3; font: 700 11px/17px var(--corpo); text-align: center; }
.pick:hover { border-color: var(--acento-vivo); }
.pick.so-nota { opacity: .5; }
.pick.so-nota:hover, .pick.so-nota:focus-visible { opacity: 1; }
.pick[aria-current="true"] { border: 2px solid var(--destaque); box-shadow: 0 0 0 2px var(--painel), 0 0 0 4px var(--acento); }
.pick.tem-dif[aria-current="true"] { border-color: var(--dif); }
:root[data-guia="akshan"] .pick[aria-current="true"] { box-shadow: none; }
:root[data-guia="akshan"] .pick[aria-current="true"]::before { content: ""; position: absolute; z-index: 2; inset: -6px; border: 2px solid var(--destaque); transform: rotate(45deg) scale(.78); pointer-events: none; }
.pick:focus-visible { outline-offset: 2px; }
.ver-tier { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; margin: 12px auto 0; padding: 0 16px; border-radius: 999px; border: 1px solid var(--linha-forte); background: var(--painel-alto); color: var(--texto); font: 700 13px var(--corpo); cursor: pointer; }
.ver-tier[hidden] { display: none; }
.ver-tier:hover { border-color: var(--acento-vivo); }
.ver-tier svg { color: var(--acento-vivo); }
.tier { width: min(980px, calc(100vw - 32px)); max-height: calc(100vh - 48px); padding: 0; border-radius: 14px; border: 1px solid var(--linha-forte); background: var(--fundo); color: var(--texto); box-shadow: var(--sombra); }
.tier::backdrop { background: rgba(0, 0, 0, .7); }
.tier-topo { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 12px; padding: 16px 20px; background: var(--fundo); border-bottom: 1px solid var(--linha); }
.tier-topo h2 { margin: 0; font: 700 18px var(--titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-vivo); }
.tier-fecha { margin-left: auto; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border-radius: 50%; border: 1px solid var(--linha-forte); background: var(--painel); color: var(--texto); cursor: pointer; }
.tier-corpo { display: grid; gap: 10px; padding: 16px 20px 20px; }
.tier-linha { display: grid; grid-template-columns: 150px minmax(0, 1fr); border-radius: 10px; overflow: hidden; border: 1px solid var(--linha); background: var(--painel); }
.tier-rot { display: flex; align-items: center; justify-content: center; padding: 10px; text-align: center; font: 800 15px var(--titulo); letter-spacing: .06em; text-transform: uppercase; color: var(--dif-txt); background: var(--dif-fundo); }
.tier-campeoes { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; }
.tier-campeoes button { display: grid; justify-items: center; gap: 4px; width: 64px; padding: 0; border: 0; background: none; color: var(--texto); font: 600 11px/1.2 var(--corpo); cursor: pointer; }
.tier-campeoes img { width: 52px; height: 52px; border-radius: 6px; border: 2px solid var(--dif); background: var(--painel-alto); }
.tier-campeoes button:hover img, .tier-campeoes button:focus-visible img { outline: 2px solid var(--destaque); outline-offset: 2px; }
.tier-campeoes button span { max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (max-width: 900px) {
  .tier { width: 100vw; max-width: none; height: 100dvh; max-height: none; margin: 0; border-radius: 0; border: 0; }
  .tier-linha { grid-template-columns: minmax(0, 1fr); }
  .tier-rot { justify-content: flex-start; gap: 8px; padding: 8px 12px; }
  .tier-campeoes { gap: 6px; }
}
.legenda { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--texto-baixo); }
.legenda kbd { padding: 1px 6px; border-radius: 4px; border: 1px solid var(--linha-forte); font: 600 12px var(--corpo); color: var(--texto); }
@media (hover: none) { .legenda .atalhos { display: none; } }
.vazio { position: absolute; inset: 30% 18%; margin: 0; display: grid; place-content: center; gap: 8px; text-align: center; font-size: 15px; color: var(--texto-baixo); }
.vazio button { min-height: 44px; border: 0; background: none; cursor: pointer; color: var(--acento-vivo); font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }

/* Setup */
.setup { scroll-margin-top: calc(var(--barra) + 16px); margin: 0; padding: 16px 20px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
/* Título do setup com o botão "Importar no LoL" (só aparece dentro do app de PC). */
.setup-topo { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 12px; margin: 0 0 12px; }
.setup-topo h2 { margin: 0 !important; }
.importar-lol { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--acento-vivo); background: none; color: var(--acento-vivo); font: 700 13px var(--corpo); cursor: pointer; }
.importar-lol:hover:not(:disabled) { background: var(--acento-vivo); color: var(--fundo); }
.importar-lol:disabled { opacity: .6; cursor: progress; }
.aviso-app { position: fixed; left: 50%; bottom: 24px; z-index: 60; transform: translateX(-50%); max-width: min(92vw, 420px); margin: 0; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--acento-vivo); background: var(--painel-alto); color: var(--texto); font: 600 14px var(--corpo); box-shadow: 0 8px 24px rgba(0, 0, 0, .45); text-align: center; }
.setup h2 { margin: 0 0 12px; font: 700 16px var(--titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-vivo); }
.carga { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px 24px; margin: 0; }
.slot { min-width: 0; }
.slot dt, .bloco h3 { margin: 0 0 10px; font: 600 12px var(--corpo); letter-spacing: .14em; text-transform: uppercase; color: var(--texto-baixo); }
.slot dd { margin: 0; display: grid; gap: 10px; }
.opt, .peca { display: inline-flex; align-items: center; gap: 10px; min-width: 0; font-weight: 700; font-size: 16px; line-height: 1.2; color: var(--texto); }
.opt { display: flex; }
.opt img, .peca img { width: 36px; height: 36px; flex: none; border-radius: 6px; border: 1px solid var(--linha-forte); background: var(--painel-alto); }
.peca img { width: 32px; height: 32px; }
.opt.runa img, .peca.runa img { border-radius: 50%; background: #15130f; }
.opt span, .peca span { min-width: 0; overflow-wrap: anywhere; }
.soquete { width: 36px; height: 36px; flex: none; display: grid; place-items: center; border-radius: 6px; border: 1px solid var(--linha-forte); background: var(--painel-alto); }
.peca .soquete { width: 32px; height: 32px; }
.soquete::before { content: ""; width: 12px; height: 2px; border-radius: 1px; background: var(--acento); opacity: .7; }
.celula { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; min-width: 0; font-weight: 700; font-size: 16px; line-height: 1.2; color: var(--texto); }
.celula .icones { display: flex; gap: 6px; flex: none; }
.celula img { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--linha-forte); background: var(--painel-alto); }
.celula img.runa { border-radius: 50%; background: #15130f; }
.celula > span { min-width: 0; overflow-wrap: anywhere; }
.celula .livre { font-weight: 400; }
/* Desktop: ícones em cima e o texto da célula embaixo, como na planilha. */
.slot .celula, .slot .opt { flex-direction: column; align-items: flex-start; gap: 8px; }
.celula .rush, .opt .rush { font: 700 11px/1 var(--titulo); letter-spacing: .1em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--destaque); color: var(--tinta-botao); }
.livre { display: flex; align-items: center; min-height: 36px; font-style: italic; color: var(--texto-baixo); }
/* Setup completo: runas, itens com condições e dificuldade */
.setup-completo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); grid-template-rows: auto 1fr; gap: 20px 32px; align-items: start; }
.setup-completo .build { grid-column: 2; grid-row: 1 / span 2; }
.bloco { min-width: 0; }
.linha-runa + .linha-runa { margin-top: 12px; }
.linha-runa .rot { display: block; margin-bottom: 6px; font-size: 13px; color: var(--texto-baixo); }
.pecas { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.pecas .seta { flex: none; color: var(--acento); }
.ou { font-size: 13px; font-style: italic; color: var(--texto-baixo); }
.ou-bloco { margin: 14px 0 10px; font-size: 13px; font-style: italic; color: var(--texto-baixo); }
.frag { margin: 0; display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 15px; font-weight: 600; }
/* Fragmentos com o ícone do jogo, num círculo escuro como no cliente. */
.frag-peca { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.frag-peca img { width: 26px; height: 26px; flex: none; padding: 3px; border-radius: 50%; border: 1px solid var(--linha-forte); background: #15130f; }
.build .grupo + .grupo { margin-top: 18px; }
.build .cond { margin: 0 0 10px; font-weight: 700; font-size: 15px; color: var(--acento-vivo); }
.build details.grupo summary { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; list-style: none; font-weight: 700; font-size: 15px; color: var(--acento-vivo); }
.build details.grupo summary::-webkit-details-marker { display: none; }
.build details.grupo summary::before { content: ""; flex: none; width: 8px; height: 8px; border-right: 2px solid var(--acento); border-bottom: 2px solid var(--acento); transform: rotate(-45deg); }
.build details.grupo[open] summary::before { transform: rotate(45deg); }
.build details.grupo[open] summary { margin-bottom: 8px; }
.build ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.build .motivo { margin: 4px 0 0; font-size: 14px; color: var(--texto-baixo); }
/* Motivo do item guardado: "i" ao lado, aparece passando o mouse, com foco ou tocando. */
.build li.tem-motivo { cursor: help; border-radius: 8px; outline-offset: 4px; }
.build li.tem-motivo .motivo { display: none; }
.build li.tem-motivo:hover .motivo, .build li.tem-motivo:focus-visible .motivo, .build li.tem-motivo.aberto .motivo { display: block; }
.build .porque { display: grid; place-items: center; flex: none; width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--linha-forte); font: italic 700 11px/1 Georgia, serif; color: var(--texto-baixo); }
.build li.tem-motivo:hover .porque, .build li.tem-motivo.aberto .porque { border-color: var(--acento-vivo); color: var(--acento-vivo); }
/* Abas pequenas */
.abas-mini { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.abas-mini button { min-height: 36px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--linha-forte); background: none; color: var(--texto-baixo); font: 700 13px/1.3 var(--corpo); text-align: left; cursor: pointer; }
.abas-mini button:hover { color: var(--texto); }
.abas-mini button[aria-selected="true"] { color: var(--acento-vivo); border-color: var(--acento-vivo); background: var(--painel-alto); }
.secoes .abas-mini button { font-family: var(--titulo); font-size: 14px; letter-spacing: .04em; }
.build .nota { font-size: 14px; font-style: italic; color: var(--texto-baixo); }
.build .sub { margin-top: 4px; font-size: 14px; font-weight: 700; }
.build .sep { height: 1px; background: var(--linha); }
.dif dl { margin: 0; display: grid; gap: 10px; }
.dif dl div { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dif dt { font-size: 14px; color: var(--texto-baixo); }
.dif dd { margin: 0; display: flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; }
.dif dd b { font-size: 15px; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 10px; height: 10px; border-radius: 2px; background: var(--painel-alto); box-shadow: inset 0 0 0 1px var(--linha-forte); }
.pips i.on { background: var(--destaque); box-shadow: none; }

/* Guia */
.notas, .rodape { min-width: 0; }
.navega { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
.navega h2 { margin: 0; white-space: nowrap; font: 700 23px/1.2 var(--titulo); letter-spacing: .06em; color: var(--acento-vivo); }
.navega div { display: flex; gap: 8px; }
.navega button { min-height: 44px; padding: 0 14px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 8px; border: 1px solid var(--linha-forte); background: var(--painel); color: var(--texto); font-weight: 600; font-size: 15px; }
.navega button:hover { border-color: var(--acento-vivo); }
.navega img { width: 24px; height: 24px; border-radius: 4px; }
.navega .copiar svg { color: var(--acento-vivo); flex: none; }
.navega .copiar.ok { border-color: var(--acento-vivo); color: var(--acento-vivo); }
.lembretes { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: n; }
.lembretes li { display: grid; grid-template-columns: 44px minmax(0, 1fr); align-items: start; padding: 12px 16px; border-radius: 10px; background: var(--painel); border: 1px solid var(--linha); font-size: 17px; line-height: 1.6; counter-increment: n; }
.lembretes li::before { content: counter(n); width: 30px; height: 30px; margin-top: 1px; display: grid; place-items: center; border-radius: 50%; background: var(--destaque); color: var(--tinta-botao); font: 800 15px/1 var(--titulo); }
.kw { font-weight: 700; color: var(--texto); text-decoration: underline; text-decoration-color: var(--destaque); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.resumo { padding: 16px 20px; border-radius: 10px; background: var(--painel); border: 1px solid var(--linha); }
.resumo h3 { margin: 0 0 8px; font: 700 13px var(--corpo); letter-spacing: .14em; text-transform: uppercase; color: var(--texto-baixo); }
.secao + .secao { margin-top: 34px; }
.secao h3 { margin: 0 0 12px; font: 700 21px/1.25 var(--titulo); letter-spacing: .04em; color: var(--acento-vivo); }
.secao p { margin: 0 0 14px; font-size: 17px; line-height: 1.7; }
.secoes ul { margin: 0 0 14px; padding: 0; list-style: none; display: grid; gap: 10px; }
.secoes li { position: relative; padding-left: 22px; font-size: 17px; line-height: 1.7; }
.secoes li::before { content: ""; position: absolute; left: 4px; top: .7em; width: 7px; height: 7px; transform: rotate(45deg); background: var(--destaque); }
.cds { width: 100%; max-width: 560px; border-collapse: collapse; font-size: 15px; }
.cds th, .cds td { padding: 9px 12px 9px 0; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
.cds th { font-weight: 700; color: var(--texto); white-space: nowrap; }
.cds td { color: var(--texto-baixo); font-variant-numeric: tabular-nums; }
.rodape { display: block; font-size: 14px; color: var(--texto-baixo); }
/* Fim da página: quem acompanhar (embaixo da lista) e as notas da fonte (embaixo do matchup), mais afastados. */
@media (min-width: 901px) {
  /* A lista e o card dos monos grudam juntos, só dentro da primeira linha (sticky numa grade prende à grade inteira).
     Se não couberem na altura da tela, rolam por dentro. */
  .col-lista { grid-column: 1; grid-row: 1; align-self: stretch; min-width: 0; }
  .gruda { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barra) + 16px); display: grid; gap: 16px;
    max-height: calc(100vh - var(--barra) - 32px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
  .gruda::-webkit-scrollbar { display: none; }
  .gruda .anel { position: static; }
  .detalhe { grid-column: 2; grid-row: 1; }
  .rodape { grid-column: 2; grid-row: 2; align-self: end; }
  :root.com-3d .akshan3d { grid-column: 3; grid-row: 1 / span 2; }
  /* A sobra de altura da coluna 3D vai para a linha de baixo: a de cima fica do tamanho do conteúdo. */
  :root.com-3d .palco { grid-template-rows: auto 1fr; }
}
.acompanhe { padding: 14px 16px 12px; border-radius: 12px; background: var(--painel); border: 1px solid var(--linha); }
.acompanhe h2 { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 0 0 10px; font: 700 14px var(--titulo); letter-spacing: .14em; text-transform: uppercase; color: var(--acento-vivo); }
.acompanhe ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.acompanhe .canal { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--linha); background: var(--painel-alto); color: var(--texto); text-decoration: none; }
.acompanhe .canal:hover { border-color: var(--acento-vivo); }
.acompanhe .canal svg { flex: none; color: var(--acento-vivo); }

.acompanhe .canal > span { min-width: 0; }
.acompanhe .canal small { display: block; font-size: 12px; line-height: 1.3; color: var(--texto-baixo); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acompanhe .canal .ir { margin-left: auto; flex: none; font-size: 16px; font-weight: 700; color: var(--acento-vivo); }
.acompanhe li { display: flex; }
.acompanhe .canal { flex: 1; min-width: 0; }
/* OP.GG ao lado do card da live (só de quem tem): colado nele, mesma altura. */

.acompanhe li:has(.opgg) .canal .ir { display: none; }  /* a seta não cabe junto do OP.GG */
.acompanhe .opgg { display: grid; place-items: center; flex: none; width: 48px; border-radius: 0 10px 10px 0; border: 1px solid var(--linha); border-left: 0; background: var(--painel-alto); color: var(--acento-vivo); font: 800 10px var(--corpo); letter-spacing: .02em; text-decoration: none; }
.acompanhe .opgg:hover { border-color: var(--acento-vivo); background: var(--painel); }
.acompanhe .canal.ao-vivo { border-color: #e5484d; box-shadow: 0 0 0 1px #e5484d inset; }

@keyframes pulsa-vivo { from { opacity: .35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .acompanhe .canal.ao-vivo small::before { animation: none; } }
.acompanhe .dev { margin: 10px 0 0; text-align: center; font-size: 13px; color: var(--texto-baixo); }
.acompanhe .dev b { color: var(--texto); }
/* App da seleção de campeões: só no desktop (é um programa para Windows). O botão abre a explicação. */

.acompanhe .baixa-app button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px dashed var(--linha-forte); background: none; color: var(--texto); font: 700 13px var(--corpo); cursor: pointer; }
.acompanhe .baixa-app button:hover { border-style: solid; border-color: var(--acento-vivo); }
.acompanhe .baixa-app svg { color: var(--acento-vivo); flex: none; }
.wip { display: inline-block; margin-left: 8px; padding: 1px 7px; border-radius: 999px; background: var(--destaque); color: var(--tinta-botao); font: 800 10px/1.6 var(--corpo); letter-spacing: .08em; vertical-align: 2px; }
.app-info .aviso-wip { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; border: 1px dashed var(--destaque); font-size: 14px; color: var(--texto); }
@media (min-width: 901px) { .acompanhe .baixa-app { display: block; } }
.app-info { width: min(620px, calc(100vw - 32px)); }
.app-corpo { display: grid; gap: 16px; padding: 18px 22px 22px; font-size: 15px; line-height: 1.6; }
.app-corpo p { margin: 0; }
.app-corpo .lead { font-size: 16px; color: var(--texto); }
.app-corpo ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: passo; }
.app-corpo ol li { position: relative; padding-left: 40px; counter-increment: passo; }
.app-corpo ol li::before { content: counter(passo); position: absolute; left: 0; top: -1px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; background: var(--destaque); color: var(--tinta-botao); font: 700 14px var(--titulo); }
.app-corpo .nota { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--linha); background: var(--painel); font-size: 14px; color: var(--texto-baixo); }
.app-corpo .nota b { color: var(--texto); }
.app-corpo .opcional { text-align: center; font-size: 14px; color: var(--texto-baixo); }
.app-corpo .baixar { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; border-radius: 999px; background: var(--destaque); color: var(--tinta-botao); font: 700 15px var(--corpo); text-decoration: none; }
.app-corpo .baixar:hover { filter: brightness(1.08); }
.app-corpo .baixar small { font-weight: 600; opacity: .75; }
.rodape p { margin: 0; }
.rodape a { display: inline-block; padding: 10px 0; margin: -10px 0; }
.estado-planilha:not(:empty) { margin-top: 6px; font-size: 13px; }

/* Pick travado: as duas artes frente a frente, como a tela de carregamento */
.trava { position: fixed; inset: 0; z-index: 30; display: grid; grid-template-columns: 1fr 1fr; align-items: center; justify-items: center; gap: 4vw; padding: 6vh 6vw; background: rgba(6, 6, 4, .9); cursor: pointer; }
.trava::before { content: ""; position: absolute; left: 50%; top: 50%; width: 60vmin; height: 60vmin; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, var(--brilho), var(--brilho-2) 40%, transparent 70%); pointer-events: none; }
.trava figure { position: relative; margin: 0; width: min(100%, 34vh); aspect-ratio: 308 / 560; border-radius: 10px; overflow: hidden; border: 2px solid var(--botao-2); box-shadow: 0 18px 50px rgba(0, 0, 0, .6); }
.trava img { width: 100%; height: 100%; object-fit: cover; }
.trava figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 10px 12px; text-align: center; font: 800 clamp(18px, 3vh, 28px)/1.1 var(--titulo); color: var(--sobre-arte); background: linear-gradient(transparent, rgba(8, 8, 6, .9)); }
.trava .vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 800 clamp(28px, 6vh, 56px)/1 var(--titulo); color: #fff8e8; letter-spacing: .08em; }
.trava.on .eu { animation: entra-e .7s cubic-bezier(.16, 1, .3, 1) both; }
.trava.on .ele { animation: entra-d .7s cubic-bezier(.16, 1, .3, 1) both; }
.trava.on .vs, .trava.on::before { animation: brilha .9s .25s cubic-bezier(.16, 1, .3, 1) both; }
@keyframes entra-e { from { transform: translateX(-30vw); opacity: 0; } }
@keyframes entra-d { from { transform: translateX(30vw); opacity: 0; } }
@keyframes brilha { from { opacity: 0; transform: translate(-50%, -50%) scale(.6); } }

@media (max-width: 1100px) {
  .palco { grid-template-columns: 340px minmax(0, 1fr); }
  .anel { padding: 16px 14px 18px; }
  .anel h2 { font-size: 17px; letter-spacing: .1em; gap: 10px; }
  .carga { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .setup-completo { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; }
  .setup-completo .build { grid-column: auto; grid-row: auto; }
}
@media (max-width: 900px) {
  :root { --barra: 60px; }
  .palco { padding: 12px var(--borda) 48px; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .anel { position: static; padding: 12px 12px 4px; }
  .anel h2 { font-size: 16px; margin-bottom: 10px; }
  /* No celular a lista e o card dos monos voltam a ser itens soltos: o card fica no fim, depois do matchup. */
  .col-lista, .gruda { display: contents; }
  .detalhe { order: 1; }
  .acompanhe { order: 2; }
  .rodape { order: 3; }
  .filtros { flex-wrap: nowrap; justify-content: flex-start; overflow-x: auto; scrollbar-width: none; max-width: none; margin: 8px -12px 0; padding: 4px 12px; }
  .filtros::-webkit-scrollbar, .lista::-webkit-scrollbar { display: none; }
  .chip { flex: none; }
  /* No celular a lista vira uma faixa de rostos que rola para o lado. */
  .roda { width: auto; aspect-ratio: auto; margin: 4px -12px 0; border-radius: 0; }
  .mira { display: none; }
  .lista { position: static; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; scroll-snap-type: x proximity; padding: 12px 12px 14px; -webkit-mask-image: none; mask-image: none; }
  .pick { flex: none; width: 56px; scroll-snap-align: start; }
  .vazio { position: static; inset: auto; padding: 8px 0 14px; }
  .card { height: 168px; }
  .seta-mira { display: none; }
  .quem .guia { white-space: nowrap; font-size: 12.5px; }
  .quem .guia .pips i { width: 8px; height: 8px; }
  .setup-completo .dif { order: -1; }
  .alvo { height: 50%; }
  .quem .n { font-size: 20px; }
  .quem .n.longo { font-size: 16px; }
  .travar { width: 54px; height: 54px; font-size: 17px; }
  .quem .t { font-size: 13px; }
  .card .quem { padding: 0 10px 12px; }
  /* No celular cada item do setup vira uma linha: rótulo à esquerda, ícones à direita. */
  .carga { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .slot { display: grid; grid-template-columns: 92px minmax(0, 1fr); align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--linha); }
  .slot:first-child { border-top: 0; padding-top: 0; }
  .slot dt { margin: 0; }
  .slot dd { display: flex; flex-wrap: wrap; gap: 8px 14px; }
  .opt { font-size: 15px; }
  .opt img, .opt .soquete, .celula img { width: 32px; height: 32px; }
  .celula { font-size: 15px; }
  .slot .celula, .slot .opt { flex-direction: row; align-items: center; gap: 8px 12px; }
  .setup { padding: 16px; }
  .setup-completo { grid-template-columns: minmax(0, 1fr); }
  .navega h2 { font-size: 20px; }
  .lembretes li { font-size: 16px; grid-template-columns: 38px minmax(0, 1fr); padding: 12px 14px; }
  .secao p, .secoes li { font-size: 16.5px; }
}
@media (max-width: 520px) {
  .trocar b { font-size: 18px; }

}
@media (prefers-reduced-motion: reduce) {
  .trava.on .eu, .trava.on .ele, .trava.on .vs, .trava.on::before { animation: none; }

}

<script>
const GUIAS = /*GUIAS*/;

const DD = "https://ddragon.leagueoflegends.com/cdn/", VER = "/*VER_DD*/";  // src/versao_dd.txt
const arte = id => `${DD}img/champion/loading/${id}_0.jpg`;
const sq = id => `${DD}${VER}/img/champion/${id}.png`;
const cena = id => `${DD}img/champion/centered/${id}_0.jpg`;
// Skins do Akshan com paleta própria (num = número da skin no Data Dragon).
// Cada skin tem o modelo 3D (modelo/akshan-<id>.glb) e os efeitos sonoros (sons/akshan3d/<id>/) dela; a voz é a do Akshan.
// "sons": variações de efeito que mudam em relação ao padrão (a Velho Oeste tem 2 tiros, não 3).
// "revisar": paleta esperando o dono aprovar; fica fora do seletor até lá.
const SKINS = [
  { id: "", num: 0, nome: "Padrão", nome_en: "Default" },
